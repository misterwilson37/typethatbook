     ⚠️⚠️ THIS HEADER READ v3.7.0 WHILE ARCADE_PAGE_VERSION READ 3.13.0 — TWELVE
     ROUNDS OF DRIFT, AND THE SECOND TIME THIS FILE HAS DONE IT. Round 98 found

     ⚠️⚠️ v3.0.0 FIXES A SHIPPED REGRESSION. v2.0.0 offered only runs with their

     Jake, 2026-09-08: *"Can you wire the kid facing one to lessons so that they

     That's the real test - kids who are typing actively doing the final lesson

     v1.0.0 was a forwarder to tools/game-lab.html. ⚠️ THAT WAS THE WRONG PAGE TO

     and shield count, so a student sets their own difficulty and the comparison
     is worthless. The lab stays exactly as it is — it is a bench and still the

     ⚠️⚠️ THIS PAGE IS STILL A MEASUREMENT, NOT THE WIRING. It writes NOTHING:

     file the app links to imports them — and when the real wiring lands it goes
     through finishStep()/recordRunOutcome(), never through here.

     ═══ WHY ONLY SOME RUNS ARE OFFERED, WHICH IS THE WHOLE DESIGN ═══

     ⚠️ ONLY RUNS THAT CARRY A SPEED GATE APPEAR. run-grade.js's gatesForRun()
     returns `minWPM: null` for DRILL_TYPES (key_pattern, key_pattern_auto,
     key_random) — speed on random letter groups measures nothing, which is why
     learn.js grades those on accuracy alone. A drill has no WPM to line up
     WITH, so offering one would invite exactly the comparison the lesson engine
     deliberately refuses to make.

     ⭐ AND THAT FILTER SOLVES A SECOND PROBLEM FOR FREE. learn.js's
     buildSequence() is not exported and cannot be imported from a standalone
     page; two drill types (key_pattern_auto, key_random) GENERATE A FRESH
     RANDOM SEQUENCE EVERY CALL, which is why learn.js bakes the characters into
     each run rather than regenerating them. But the three types that DO carry a
     speed gate — word_list, sentence_list, passage — are all deterministic
     `.split('')` of text stored on the lesson document. So this page reproduces
     those sequences exactly, with no refactor of learn.js and no second copy of
     a random generator that could drift.
     ⚠️ DO NOT "IMPROVE" THIS BY ADDING THE DRILL TYPES. That needs
     buildSequence() lifted into a shared module — a real seam change — and it
     would hand the student a sequence they never actually typed.

     ⚠️ RUN NUMBERS COME FROM run-grade.js's runPlan(), NOT FROM COUNTING THE
     RUNS THIS PAGE OFFERS. The student sees "Run 4 of 6" meaning the same run 4
     learn.js means, so the comparison is against the right thing. runPlan()
     chunks with shapeSequence(), whose output has the same length and the same
     space positions as buildSequence() for these three types — identical
     `.split('')` of the same joined text — so chunk boundaries agree exactly.
     THAT AGREEMENT IS LOAD-BEARING; tests/arcade-lesson-test.mjs asserts it
     rather than trusting this comment.

     ═══ READS ═══

     ⚠️ TWO getDocs ON LOAD AND NOTHING PER LAUNCH: `lessons` and this student's
     `lessonProgress` — exactly what learn.js already pays to draw its map.
     Picking another lesson or replaying costs zero.
     ⚠️ DO NOT ADD A typing_logs QUERY to show a stored WPM. Per-run WPM lives
     only there, it is a query per launch, and the GATE is the yardstick that
     makes the comparison meaningful anyway. -->

<style>
    :root {
        color-scheme: dark;
        --bg: #06090f; --panel: #0b1018; --rule: #1d2735;
        --ink: #cfe0ea; --ink-dim: #8aa2b4; --ink-ghost: #5f7387;
        --accent: #bfe9ff; --accent-line: #2b6c8a; --accent-fill: #164055;
        --good: #8fe8c8; --warn: #ffd27d; --bad: #ff8f8f;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
        font-family: "Courier Prime", ui-monospace, monospace;
    }
    /* ⚠️⚠️ 760 → 1320 (Round 94). THE OLD CAP WAS COSTING MORE THAN THE PANELS
       DO: at 760 the keyboard board hits KEY_MAX_W and each flank is ~124px,
       too narrow for four buttons — which is exactly why the control bar spilled
       onto the keys. Widening gives the panels their space AND leaves the play
       canvas ~816px, wider than the 724 it had before. */
    .wrap { max-width: 1320px; margin: 0 auto; padding: 22px 18px 40px; }

    /* ⚠️⚠️ THREE SIBLING COLUMNS, EACH WITH ITS OWN CANVAS — NOT ONE WIDE CANVAS
       WITH AN INSET PLAYFIELD. game-deadline.js's lane positions and dome radii
       are computed from the play canvas's own `W`, and the dome radius IS the
       coverage test that gives the city six lives instead of three. Round 91
       shrank that radius for looks, silently ended the three-deep overlap, and
       it looked completely fine. An inset rect would put every one of those
       numbers in play; siblings put none of them in play. */
    /* ⚠️⚠️ `stretch`, NOT `start` (Round 100). With `start` each flank card was
       only as tall as its own fixed-height canvas, which is why Round 99's
       taller canvases did not fix *"big chunks of empty space don't fit the
       vibe"*: measured against #stage's 78vh, the left column still had 236px
       of bare card at a 900px viewport and 470px at 1200px. Stretching makes
       the cards track the stage, and the canvases inside them flex. */
    .stage-grid {
        display: grid;
        grid-template-columns: 200px minmax(724px, 1fr) 240px;
        gap: 14px;
        align-items: stretch;
    }
    /* ⚠️ THE CARDS ARE THE CONSOLE, THE STAGE IS THE WINDOW (Round 99). Jake:
       *"We're looking out a window on the field of battle, and the space on
       either side is the console itself."* So the flanks read as housing —
       inset, slightly lighter than the void, with a lit top edge — and the
       stage keeps the plain dark frame of something you look THROUGH. */
    .side-card {
        background: linear-gradient(180deg, #0d141d 0%, #0a1017 100%);
        border: 1px solid var(--rule);
        border-top: 1px solid rgba(120,170,220,0.28);
        border-radius: 10px; padding: 12px;
        /* ⚠️⚠️ min-height:200px → 0, AND overflow HIDDEN (Round 100b). A grid
           row is as tall as its TALLEST item's min-content, so every floor
           inside a flank card was competing with #stage for the row height —
           which is how Jake's screen ended up with a radar taller than the play
           frame. The stage owns the row now; the flanks fit inside it. */
        min-height: 0; overflow: hidden;
        display: flex; flex-direction: column;
        box-shadow: inset 0 1px 0 rgba(143,232,200,0.06);
    }
    /* The canvas no longer reserves a bottom margin it does not need — the
       control bar supplies its own rule and padding (game-chrome.js v1.4.0). */
    #controls-col .panel-canvas { margin-bottom: 4px; }

    /* ⚠️⚠️ THE CANVASES FLEX, WITH FLOORS (Round 100). fitCanvas() sizes the
       drawing buffer from getBoundingClientRect(), so a canvas taking its
       height from its own content resolves to ZERO on the first frame and the
       panel renders blank until something triggers a resize. The basis here is
       the card, which is the grid row, which is #stage's 78vh — all definite —
       and the min-height is what makes that safe to reason about rather than
       merely true today. */
    /* ⚠️ THE FLOORS ARE LOW ON PURPOSE. They exist only so fitCanvas() never
       measures a zero-height box on the first frame; they are NOT a target size.
       Every one of them competes with #stage for the grid row height, so a
       generous floor is the thing that made the page too tall. ⭐ On a real
       screen these canvases are whatever the stage leaves them, which is what
       Jake asked for: *"I'm hopeful that the radar can just resize its height to
       whatever the screen is."* */
    #radar-canvas { flex: 1 1 auto; min-height: 200px; margin-bottom: 8px; }
    /* ⚠️ THE THREAT BOARD IS THE ONE FIXED-HEIGHT ELEMENT ON THE FLANK, on
       purpose: it needs three legible rows and no more, so every spare pixel in
       the column goes to the radar above it. */
    #threat-canvas { flex: 0 0 auto; height: 104px; margin-bottom: 0; }
    /* ⚠️⚠️ AND IT IS REMOVED ENTIRELY WHEN NOTHING IS DRAWING INTO IT. Jake,
       2026-09-10, on an Escape Key run: *"There's also dead space below the
       incoming monsters row."* ⭐ THAT DEAD SPACE WAS THIS CANVAS: only Deadline
       is handed a threatCanvas, so on the other two games a 104px box sat below
       the radar being 104px of nothing — a fixed height reserving room for a
       panel that was never going to arrive.
       ⚠️ `display: none`, NOT A ZERO HEIGHT. fitCanvas() measures
       getBoundingClientRect(), and a 0px canvas is a live element whose draw
       calls all resolve to nothing — which is a blank panel that costs frames
       rather than an absent one. Removing it from layout also hands its height
       to #radar-canvas's flex, which is what gives the wave queue room for a
       fifth creature. See showThreatBoard(). */
    #radar-col.no-threat #threat-canvas { display: none; }
    #gauge-canvas { flex: 1 1 auto; min-height: 260px; max-height: 420px; }
    /* ⭐ AND THE LEFTOVER HEIGHT IN THE RIGHT COLUMN GOES TO THE BUTTONS, which
       is the better use of it: these are the only way off this page for a
       student on an iPad with no keyboard attached. ⚠️ CAPPED — four controls
       sharing 400px would be 100px tall each and read as a mistake. */
    #controls-col .gc-bar-card { flex: 1 1 auto; }
    #controls-col .gc-bar-card .gc-btn { flex: 1 1 auto; max-height: 68px; }
    /* ⚠️ AND THE STACK MAY NOT SET THE ROW HEIGHT EITHER. Without min-height:0 a
       flex container contributes its children's floors to the row, which is
       half of why the console card outgrew the stage. */
    #controls-col .gc-bar-card { min-height: 0; }
    .build-wrap { position: relative; text-align: right; margin-bottom: 8px; }
    .build-foot {
        background: none; border: 1px solid var(--rule); color: var(--ink-ghost);
        font: inherit; font-size: .7rem; border-radius: 999px; padding: 3px 12px;
        cursor: pointer;
    }
    .build-foot:hover { color: var(--accent); border-color: var(--accent-line); }
    .build-panel {
        display: none; position: absolute; right: 0; top: 26px; z-index: 5;
        background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
        padding: 10px 12px; min-width: 240px; text-align: left; font-size: .72rem;
    }
    /* Hover for a mouse, click for a touch device — both, deliberately. */
    .build-wrap:hover .build-panel, .build-panel.open { display: block; }
    .build-row { display: flex; justify-content: space-between; gap: 18px; padding: 2px 0; }
    .build-row span { color: var(--ink-dim); }
    .build-row b { color: var(--good); font-weight: 700; }
    .build-note { margin-top: 8px; color: var(--ink-ghost); font-size: .66rem; line-height: 1.4; }
    .panel-canvas { display: block; width: 100%; margin-bottom: 12px; }
    .side-card h2 {
        font-size: .68rem; letter-spacing: 1px; color: var(--ink-ghost);
        margin: 0 0 10px; font-weight: 400;
    }
    /* ⚠️ FOLD ORDER IS JAKE'S RULING: radar stays, controls drop below the
       frame. ⚠️ AND THE PLAY COLUMN NEVER GOES BELOW 724px AT ANY BREAKPOINT —
       that is the constraint to test, not the panel widths. */
    @media (max-width: 1150px) {
        .stage-grid { grid-template-columns: 200px minmax(724px, 1fr); }
        #controls-col { grid-column: 1 / -1; min-height: 0; }
        #controls-col .gc-bar-card { flex-direction: row; flex-wrap: wrap; }
        #controls-col .gc-bar-card .gc-btn { width: auto; }
    }
    @media (max-width: 820px) {
        .stage-grid { grid-template-columns: minmax(0, 1fr); }
        #radar-col { display: none; }
    }
    /* ⚠️ Round 115: the h1 and .beta rules went with the #game-title block
       they styled. Nothing else on this page is an h1 or a .beta. */
    .note { font-size: .8rem; color: var(--ink-dim); line-height: 1.55; margin: 12px 0 18px; }
    .panel {
        background: var(--panel); border: 1px solid var(--rule);
        border-radius: 10px; padding: 16px; margin-bottom: 14px;
    }
    label { display: block; font-size: .72rem; color: var(--ink-dim);
            letter-spacing: 1px; margin-bottom: 5px; }
    select, button {
        font: inherit; border-radius: 6px; padding: 8px 12px;
        background: #111a26; color: var(--ink); border: 1px solid #26343f;
    }
    select { width: 100%; font-size: .88rem; }
    select:disabled { opacity: .45; }
    .row { margin-bottom: 12px; }
    button.play {
        background: var(--accent-fill); color: var(--accent);
        border-color: var(--accent-line); cursor: pointer; padding: 10px 26px;
    }
    button.play:hover:not(:disabled) { background: #1d5470; }
    button.play:disabled { opacity: .4; cursor: default; }
    .gates { display: flex; gap: 18px; flex-wrap: wrap; font-size: .82rem;
             color: var(--ink-dim); margin: 10px 0 14px; }
    .gates b { color: var(--warn); font-weight: 700; }
    #stageWrap { display: none; }
    #stage { position: relative; width: 100%; height: 78vh; min-height: 420px;
             border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
    #verdict { font-size: .85rem; line-height: 1.6; }
    #verdict .big { font-size: 1.5rem; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; margin-top: 10px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
    th { color: var(--ink-ghost); font-weight: 400; font-size: .72rem; letter-spacing: 1px; }
    .met { color: var(--good); }
    .miss { color: var(--bad); }
    .err { color: var(--bad); font-size: .82rem; }

    /* ═══════════════════════════════════════════════════════════════════════
       THE ARCADE FLOOR. Round 114 (Carriage).
       ═══════════════════════════════════════════════════════════════════════
       Jake, 2026-09-10: *"make the Arcade landing page prettier so that I can
       launch it for the class tomorrow. It doesn't need to be as wide as the
       whole thing, and they should be able to click on the three games like
       they're looking at an arcade... with daily and weekly minutes at the top,
       along with the other standards of the website, but with an arcade-y feel.
       Do your best to transition from the other site to the game."*

       ⚠️ THE LANDING PAGE IS NARROWER THAN THE STAGE ON PURPOSE. `.wrap` stays
       1320px because game-deadline.js derives its lane positions and dome radii
       from the play canvas's own W and 816px is the width every gate was tuned
       against — see .stage-grid. So the CABINETS get their own narrower cap
       instead, and nothing about the playfield moves. */
    .floor { max-width: 900px; margin: 0 auto; }

    /* ⭐ THE MARQUEE IS THE HANDOFF FROM SCHOOL TO ARCADE, which is the bit Jake
       asked for by name. Same two clocks as the lesson HUD, same words, so a
       student crossing over recognises where their minutes went. */
    .marquee {
        display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
        border: 1px solid var(--rule); border-radius: 12px;
        border-top: 1px solid rgba(120,170,220,0.28);
        background: linear-gradient(180deg, #0d141d 0%, #0a1017 100%);
        padding: 14px 18px; margin-bottom: 18px;
        box-shadow: inset 0 1px 0 rgba(143,232,200,0.06);
    }
    .marquee .mq-title {
        font-size: 1.15rem; letter-spacing: 4px; color: var(--warn);
        text-shadow: 0 0 14px rgba(255,210,125,0.35); margin-right: auto;
    }
    .mq-clock { font-size: .72rem; letter-spacing: 1px; color: var(--ink-ghost); }
    .mq-clock b {
        display: block; font-size: 1.15rem; letter-spacing: 2px;
        color: var(--accent); font-weight: 400;
    }
    /* ⭐ Round 115 — WHO IS PLAYING. Same shape as the two clocks so all three
       sit on one baseline; ellipsised because a school email is long and a
       marquee that wraps is not a marquee. */
    .mq-player b {
        max-width: 240px; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; color: var(--ink);
    }
    .mq-home { font-size: .74rem; color: var(--ink-dim); text-decoration: none; }
    .mq-home:hover { color: var(--accent); }

    /* ⚠️ THREE CABINETS, AND THE GRID FOLDS RATHER THAN SQUASHING. A cabinet
       narrower than ~240px stops reading as a cabinet and starts reading as a
       button with a picture on it. */
    .cabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 780px) { .cabs { grid-template-columns: 1fr; } }

    /* ⭐ A CABINET IS A <button>, NOT A DIV WITH A CLICK HANDLER. Jake's students
       are on iPads and Chromebooks; a real button is focusable, works on Enter
       and Space, and is announced as pressable. ⚠️ DO NOT "TIDY" THIS INTO A DIV. */
    .cab {
        appearance: none; text-align: left; cursor: pointer; color: var(--ink);
        font: inherit; padding: 0; overflow: hidden;
        border: 1px solid var(--rule); border-radius: 14px;
        border-top: 1px solid rgba(120,170,220,0.28);
        background: linear-gradient(180deg, #101823 0%, #080d14 100%);
        box-shadow: inset 0 1px 0 rgba(143,232,200,0.06);
        display: flex; flex-direction: column;
        transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .cab:hover, .cab:focus-visible {
        transform: translateY(-3px);
        border-color: var(--accent-line);
        box-shadow: 0 10px 26px rgba(0,0,0,0.5), inset 0 1px 0 rgba(191,233,255,0.18);
        outline: none;
    }
    .cab:active { transform: translateY(0); }
    /* The screen: a dark glass panel with the game's own colour behind it. */
    .cab-screen {
        height: 132px; position: relative;
        display: flex; align-items: center; justify-content: center;
        border-bottom: 1px solid var(--rule);
        background: radial-gradient(120% 90% at 50% 20%, var(--glow) 0%, #05080d 70%);
    }
    .cab-screen svg { width: 100%; height: 100%; display: block; }
    /* ⚠️ SCANLINES ARE 3px AND VERY FAINT. Anything heavier reads as a broken
       screen rather than a CRT, and it sits over artwork a student must read. */
    .cab-screen::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(180deg,
            rgba(0,0,0,0.22) 0 1px, rgba(0,0,0,0) 1px 3px);
    }
    .cab-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
    .cab-name {
        font-size: 1rem; letter-spacing: 2px; color: var(--accent);
        display: flex; align-items: center; gap: 8px;
    }
    .cab-tag { font-size: .78rem; color: var(--ink-dim); line-height: 1.45; }
    .cab-insert {
        margin-top: 4px; font-size: .68rem; letter-spacing: 2px;
        color: var(--warn); opacity: .55;
    }
    /* ⭐ THE BLINK IS ON THE HOVERED CABINET ONLY. Three blinking labels at once
       is a fairground, not an arcade, and it makes the page hard to read. */
    .cab:hover .cab-insert, .cab:focus-visible .cab-insert {
        opacity: 1; animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: .25; } }
    .cab-flag {
        font-size: .6rem; letter-spacing: 1px; padding: 2px 7px; border-radius: 999px;
        border: 1px solid var(--warn); color: var(--warn);
    }

// summed and there is no subtract path. Folding arcade minutes into `school`

let ARCADE_SECONDS = 0;

let ARCADE_BASE = { seconds: 0, chars: 0, mistakes: 0 };

async function flushArcadeSeconds() {
    if (!ARCADE_UID || !ARCADE_SECONDS) return;
    const dateStr = localDateStr();
    const banked = ARCADE_SECONDS;

        const payload = dayLogPayloadFor('arcade', dateStr, {
            day: {},
            own: {
                seconds: ARCADE_BASE.seconds + banked,
                chars: ARCADE_BASE.chars,
                mistakes: ARCADE_BASE.mistakes,
            },
        });

        // present in typing_logs but absent from the ledger is planned as a skip
        // by readWeek(), and a skip reads as a zero.

                            uid: ARCADE_UID, date: dateStr });
        } catch (_) { /* noteDay swallows its own failures */ }

            uid: ARCADE_UID,
            email: (ARCADE_WHO && ARCADE_WHO.email) || '',
            displayName: (ARCADE_WHO && ARCADE_WHO.displayName) || 'Anonymous',
            classId: (ARCADE_WHO && ARCADE_WHO.classId) || '',
            schoolId: (ARCADE_WHO && ARCADE_WHO.schoolId) || '',
            date: dateStr,
            ...payload,
            lastUpdated: new Date(),
            // ⚠️ NO `source` TAG. It was dropped after the split cutover because
            // one string cannot describe a day that holds two modes — and this
            // page is the case that makes three.

    } catch (e) {
        // ⚠️ BANKED SECONDS ARE NOT DISCARDED ON FAILURE. They stay in
        // ARCADE_SECONDS and go in the next flush; a dropped write must cost a
        // student nothing.
        console.warn('[arcade] could not bank seconds:', e.message);
    }
}

function bankSecond() {
    ARCADE_SECONDS++;
    // ⚠️ FLUSHED ON A TIMER, NOT PER SECOND. One write a minute per playing
    // student is the budget this app is built around; a write per second is not.
    if (!flushTimer) {
        flushTimer = setInterval(flushArcadeSeconds, 60000);
    }
    // Reflected immediately so a tester can SEE the clock moving, which is the
    // whole reason Jake asked for this before the write exists.
    if (MINUTES) {
        MINUTES.dailySeconds++;
        MINUTES.weeklySeconds++;
        // ⚠️ THE MARQUEE TRACKS THE SAME COUNTER THE CONSOLE GAUGES DO. Without
        // this a student returns from a run to a marquee frozen at the value it
        // held when the page loaded — which is the "I typed for ten minutes and
        // nothing moved" complaint that four counting bugs died to prevent.
        // ⭐ NOT A SECOND RECORD: it re-reads liveMinutes(), the same getter.
        renderMarquee();
    }
}

const $ = id => document.getElementById(id);

function playableRunsOf(lesson) {
    const plan  = runPlan(lesson);          // full plan, drills included
    const steps = lesson.steps || [];
    const out = [];
    plan.forEach((entry, runIdx) => {
        if (!OFFERABLE.has(entry.type)) return;
        const step = steps[entry.stepIdx];
        if (!step) return;
        const seq = chunkSequence(sequenceForStep(step))[entry.chunkIdx];
        if (!seq || !seq.length) return;
        const gates = gatesForRun(entry, lesson.gates || {});
        // ⚠️⚠️ v3.0.0 — A DRILL IS NOW OFFERED, WITH THE LESSON'S OWN PACE AND A
        // LABEL SAYING SO. v2.0.0 refused any run with a null minWPM, which was
        // defensible reasoning and a broken product: units 1 and 2 are ENTIRELY
        // drills, so a real student on unit 2 opened the page and was told
        // nothing was unlocked. Jake, 2026-09-08: "If a kid can't test it, then
        // it's not worth anything."
        // The game still needs SOME pace to exist, so a drill borrows
        // `lesson.gates.minWPM` — every lesson carries one, including unit 1
        // (10 WPM). ⚠️ THAT IS A PACE, NOT A GRADE: School does not hold a drill
        // to a speed, and `speedGraded` carries that distinction to the UI so
        // nobody reads a drill result as a School comparison.
        const speedGraded = gates.minWPM != null;
        const wpm = speedGraded ? gates.minWPM : (lesson.gates || {}).minWPM;
        if (!(wpm > 0)) return;
        out.push({
            runIdx, speedGraded, runCount: plan.length, sequence: seq,
            // ⚠️ CARRIED SO SURVIVAL CAN FIND WHAT COMES *AFTER* THIS RUN. The
            // run already knows its own characters; survival needs to know where
            // in the lesson they sat. See survivalTargetsFor().
            stepIdx: entry.stepIdx, chunkIdx: entry.chunkIdx,
            gates: { minWPM: wpm, minAccuracy: gates.minAccuracy },
            label: entry.chunkCount > 1
                ? `${step.label || 'Step ' + (entry.stepIdx + 1)} (${entry.chunkIdx + 1}/${entry.chunkCount})`
                : (step.label || 'Step ' + (entry.stepIdx + 1)),
        });
    });
    return out;
}

/**
 * ═══════════════════════════════════════════════════════════════════════════
 * THE SURVIVAL POOL — what a student types after they have already won.
 * ═══════════════════════════════════════════════════════════════════════════
 *
 * Jake, 2026-09-09: *"they have to do 1, and then it is a survival mode for the
 * rest."* And on seeing v3.5.0 fall back to letter groups: *"It also fleshed out
 * with random characters rather than words. Once students have passages, they
 * should stay in passages. So passage 9 can loop back to passage 1, passage 2,
 * and so on."*
 *
 * ⚠️⚠️ THE FALLBACK WAS REACHED FAR MORE OFTEN THAN I EXPECTED, AND THAT IS THE
 * BUG HE SAW. v3.5.0 only looked at chunks AFTER the played run in the SAME step
 * — so playing the LAST chunk of a passage (which the picker used to default to)
 * found nothing and dropped straight to random groups. A student who has been
 * reading prose all year got `zxcv qwer` for their victory lap.
 *
 * ⭐ SO PROSE IS EXHAUSTED BEFORE ANY GENERATOR IS CONSIDERED: the rest of this
 * lesson first, then every other prose lesson in course order, wrapping right
 * back to unit 1's passages. The generator survives ONLY for a student who has
 * no prose at all — the early key units, where letter groups are what those
 * lessons drill anyway.
 *
 * ⚠️ NOTHING PAST THE LESSON THEY ARE ON. Same window arcadeKeySet() uses: a
 * later lesson's passage may lean on keys School has not taught them, and
 * meeting an unlearned key in a victory lap is exactly the "different subject"
 * failure the key set exists to prevent.
 *
 * ⚠️⚠️ THIS POOL IS APPENDED TO THE RUN'S OWN TARGETS AND `quotaChars` IS LEFT
 * ALONE, WHICH IS THE WHOLE TRICK. The director's quota was computed from the
 * run's characters, so the mission still ends exactly where the School run ends;
 * everything after it is spillover the pool happens to contain. ⭐ NOTHING IN
 * game-shell.js CHANGES FOR THIS: `nextTarget()` already wraps with
 * `_cursor % targets.length`, so the pool cannot run dry, and `cleared()`
 * already feeds the pressure ramp from targets cleared past the quota.
 */
// ⚠️ A CEILING ON THE POOL, NOT ON THE PLAY. The pool wraps, so this only decides
// how long it takes to come round again. Every prose lesson in the course is a
// few thousand words and there is no reason to build the whole array to survive
// four minutes.
const SURVIVAL_POOL_MAX = 1200;

/** The prose steps of one lesson, as words, in order. */
function proseTargetsOf(lesson, skip) {
    const out = [];
    ((lesson && lesson.steps) || []).forEach((step, si) => {
        // ⚠️ PROSE ONLY. A word_list is not a passage and a drill is not either;
        // "stay in passages" means the sentences and passages the student has
        // actually been reading.
        if (step.type !== 'passage' && step.type !== 'sentence_list') return;
        chunkSequence(sequenceForStep(step)).forEach((seq, ci) => {
            // ⚠️ STRICTLY AFTER THE RUN THEY PLAYED, in the lesson they played.
            // Including its own chunk would have the student re-typing the graded
            // text as their first survival words, which reads as the game
            // glitching rather than as a reward.
            if (skip && si === skip.stepIdx && ci <= skip.chunkIdx) return;
            out.push(...targetsFromSequence(seq));
        });
    });
    return out;
}

function survivalTargetsFor(lesson, r) {
    const out = [];
    // 1 — the rest of the lesson they are on.
    if (r.stepIdx != null) out.push(...proseTargetsOf(lesson, r));
    // 2 — then every other prose lesson, in course order, wrapping to unit 1.
    //     ⚠️ THE STUDENT'S OWN LESSON IS THE WINDOW'S EDGE; see the header.
    const here = PLAYABLE.findIndex(p => p.lesson === lesson);
    const upTo = here >= 0 ? here : PLAYABLE.length - 1;
    for (let i = 0; i <= upTo && out.length < SURVIVAL_POOL_MAX; i++) {
        const l = PLAYABLE[i] && PLAYABLE[i].lesson;
        if (!l || l === lesson) continue;
        out.push(...proseTargetsOf(l, null));
    }
    if (out.length) return out.slice(0, SURVIVAL_POOL_MAX);
    // 3 — and only then the generator, for a student with no prose behind them.
    //     ⚠️ 200 GROUPS IS THE SAME COUNT arcadeConfig() USES. The pool wraps, so
    //     it is "long enough not to feel like a loop", not a limit on play.
    return makeArcadeTargets(arcadeKeySet(LESSONS, PROGRESS), 200, ARCADE_GROUP_SIZE);
}

// ⚠️⚠️ v3.0.0 — FOR LESSONS WHOSE EVERY RUN IS GENERATED. key_pattern_auto and
// key_random build their characters in learn.js at run time from the lesson's
// key sets; the text is not on the document and those generators are not
// importable from a standalone page. Lessons 5-10 of the course are entirely
// these, so without this a student in unit 2 still sees an empty list.
//
// ⚠️ THIS DOES NOT CLAIM TO REPRODUCE THE DRILL. It builds practice groups from
// the lesson's OWN keys — the same letters, not the same sequence — and the UI
// labels it "key practice" rather than a run number, because calling it "Run 2"
// would invite a comparison against a School run whose characters were
// different. Drills are accuracy-graded anyway, so no speed comparison is lost.
function keyPracticeFor(lesson) {
    const keys = (lesson.availableKeys && lesson.availableKeys.length)
        ? lesson.availableKeys
        : (lesson.newKeys || []);
    if (!keys.length) return null;
    const wpm = (lesson.gates || {}).minWPM;
    if (!(wpm > 0)) return null;
    // Deterministic from the lesson id, so a student replaying gets the same
    // practice and can actually compare two attempts at it.
    let seed = 0;
    for (const ch of String(lesson.id)) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296);
    const groups = [];
    for (let i = 0; i < 24; i++) {
        let g = '';
        for (let j = 0; j < 3; j++) g += keys[Math.floor(rnd() * keys.length)];
        groups.push(g);
    }
    return {
        runIdx: -1, speedGraded: false, runCount: 0, synthesized: true,
        sequence: groups.join(' ').split(''),
        gates: { minWPM: wpm, minAccuracy: (lesson.gates || {}).minAccuracy || 90 },
        label: 'key practice \u2014 ' + keys.join(' '),
    };
}

// ⚠️ "ACCESSED" MEANS A PROGRESS RECORD EXISTS, plus the first lesson and the one
// after their last pass. NOT "passed" — Jake asked for any lesson they have
// ACCESSED, and a student mid-way through a unit should be able to play it.

function fillLessons() {
    const sel = $('lesson');
    sel.innerHTML = '';
    PLAYABLE.forEach((p, i) => {
        const o = document.createElement('option');
        o.value = String(i);
        const done = PROGRESS[p.lesson.id] && PROGRESS[p.lesson.id].passed ? ' \u2713' : '';
        o.textContent = (p.lesson.title || p.lesson.id) + done;
        sel.appendChild(o);
    });
    sel.disabled = !PLAYABLE.length;
    // ⚠️ DEFAULTS TO THE FURTHEST LESSON OPEN TO THEM, not the first. Jake's
    // case is a student who has just finished a lesson and wants to compare it.
    sel.value = String(Math.max(0, PLAYABLE.length - 1));
    fillRuns();
}

function fillRuns() {
    const p = PLAYABLE[Number($('lesson').value) || 0];
    const sel = $('run');
    sel.innerHTML = '';
    if (!p) { sel.disabled = true; return; }
    p.runs.forEach((r, i) => {
        const o = document.createElement('option');
        o.value = String(i);
        // ⚠️ A SYNTHESIZED ENTRY MUST NOT WEAR A RUN NUMBER — see keyPracticeFor.
        o.textContent = r.synthesized
            ? r.label
            : `Run ${r.runIdx + 1} of ${r.runCount} \u2014 ${r.label}` +
              (r.speedGraded ? '' : '  (drill \u2014 accuracy only in School)');
        sel.appendChild(o);
    });
    // ⚠️⚠️ DEFAULTS TO RUN 1, AND THIS REVERSES AN EARLIER RULING ON PURPOSE.
    // v3.0.0 defaulted to the LAST offerable run, reasoning that *"doing the
    // final lesson and then playing deadline"* was the case and the final run
    // should not take three clicks. ⭐ SURVIVAL MODE SUPERSEDED THAT REASON
    // ENTIRELY: run 1 now flows into the whole rest of the lesson, so the last
    // run is no longer the interesting one — it is the SHORTEST one, and it
    // starts mid-sentence.
    // Jake, 2026-09-09: *"the dropdowns should default to run 1 for the
    // graduation passages in the beta menu to reflect what it will eventually
    // be."* ⚠️ AND IT REFLECTS THE END STATE: one gate per lesson, entered at the
    // top of the text, survived from there.
    sel.value = '0';
    sel.disabled = false;
    fillSpeeds();
    showGates();
}

function currentRun() {
    const p = PLAYABLE[Number($('lesson').value) || 0];
    return p ? (p.runs[Number($('run').value) || 0] || null) : null;
}

/** The lesson the picker is on. ⚠️ Same index as currentRun(), or they disagree. */
function currentLesson() {
    const p = PLAYABLE[Number($('lesson').value) || 0];
    return p ? p.lesson : null;
}

// ⚠️⚠️ v3.0.0 — THE SPEED DROPDOWN. Jake, 2026-09-08: "I have no idea what the
// gates are for the lessons. A drop down of the possibilities would be helpful
// so that we can judge it based on the actual things."
//
// The list is BUILT FROM THE CORPUS, not typed in: every distinct minWPM any
// lesson actually uses, plus this run's own. A hardcoded 10/15/20/25 would go
// stale the moment a lesson is re-gated, and would then be quietly lying about
// what "the actual things" are.
// ⚠️ IT DEFAULTS TO THIS RUN'S OWN GATE EVERY TIME THE RUN CHANGES, so the
// honest comparison is what you get without touching anything; changing it is a
// deliberate act for judging pacing, and the result panel says when you did.
function allGateWPMs() {
    const set = new Set();
    for (const L of LESSONS) {
        const g = (L.gates || {}).minWPM;
        if (g > 0) set.add(g);
        for (const r of (PLAYABLE.find(p => p.lesson.id === L.id) || {}).runs || []) {
            if (r.gates.minWPM > 0) set.add(r.gates.minWPM);
        }
    }
    return [...set].sort((a, b) => a - b);
}

function fillSpeeds() {
    const r = currentRun();
    const sel = $('speed');
    sel.innerHTML = '';
    if (!r) { sel.disabled = true; return; }
    const own = r.gates.minWPM;
    for (const w of allGateWPMs()) {
        const o = document.createElement('option');
        o.value = String(w);
        o.textContent = w + ' WPM' + (w === own ? '  \u2014 this run\u2019s target' : '');
        sel.appendChild(o);
    }
    sel.value = String(own);
    sel.disabled = false;
}

// ═════════════════════════════════════════════════════════════════════════════
// ⚠️⚠️ TWO KINDS OF GAME ON ONE PAGE, AND THE DIFFERENCE IS NOT COSMETIC
// ═════════════════════════════════════════════════════════════════════════════
//
// Jake's ruling, 2026-09-09: *"Shatter and Escape Key are just games. They're
// not quizzes. Kids can choose to play them or not... They're graded on time,
// and time spent typing is time spent well."*
//
// ⭐ SO FREE PLAY HAS NO RUN, NO GATES AND NO COMPARISON TABLE. The whole point
// of this page for Deadline is putting a game result beside the SAME gate the
// typed run is graded against; showing that table for a game that is not
// measuring anything would invent a verdict out of nothing. ⚠️ THE ONLY THING
// FREE PLAY PRODUCES IS BANKED TIME, and bankSecond() already carries it.
//
// ⚠️ THE FLAG IS `assessed` FROM THE REGISTRY, NOT A LIST OF IDS HERE. A second
// list would be the copy that disagrees the first time a game's status changes.
function currentGame() { return GAMES[$('game').value] || GAMES.deadline; }

/**
 * ⚠️⚠️ DEADLINE JOINS FREE PLAY WHEN THE STUDENT PICKS THE WHOLE WORD POOL.
 * Jake, 2026-09-10: *"Deadline can't pick the pool of words."*
 *
 * ⭐ `assessed` DECIDES WHETHER A GAME *CAN* BE GRADED, NOT WHETHER THIS RUN IS.
 * Gating the WORDS row on it meant Deadline could only ever be played against a
 * lesson run — which is right for the graded path and wrong for the arcade, and
 * the arcade is most of what this page is used for.
 * ⚠️ A LESSON-SCOPED DEADLINE RUN IS STILL THE GRADED ONE and still gets the
 * comparison table. Only `full` opts out, and it opts out of the grade too —
 * there is no gate to compare a whole-library pool against.
 */
function isFreePlay() {
    return !currentGame().assessed || chosenScope() === 'full';
}

function fillGames() {
    const sel = $('game');
    sel.innerHTML = '';
    // ⚠️ builtGames() IS NOT USED HERE ON PURPOSE — it filters on `unbuilt`, and
    // every game in GAME_ORDER is built as of Round 103. Reading the flag keeps
    // that true automatically if a fourth is ever registered ahead of its view.
    for (const id of GAME_ORDER) {
        const g = GAMES[id];
        if (!g || g.unbuilt) continue;
        const o = document.createElement('option');
        o.value = id;
        // ⚠️⚠️ NO "— just for fun" SUFFIX. Jake, 2026-09-10: *"take 'Play for
        // fun!' or whatever it is off of Escape Key. On this panel, they're all
        // for fun."* ⭐ HE IS RIGHT AND IT WAS ACTIVELY MISLEADING: `assessed` is
        // a capability flag meaning "this game CAN carry a grade", and nothing on
        // this page carries one — the standing note under the frame says so. So
        // the suffix marked two of three games as the unserious ones while the
        // third was equally unsaved, which invites a student to read Deadline as
        // the real one and the others as filler.
        // ⚠️ DO NOT DERIVE A LABEL FROM `assessed` HERE AGAIN. When the wiring
        // into learn.js lands, the thing that changes is whether a run is graded
        // — a per-RUN fact that isFreePlay() already computes — not a permanent
        // property of a title in a dropdown.
        o.textContent = titleOf(id);
        sel.appendChild(o);
    }
    sel.value = 'deadline';
}

/**
 * Show or hide the run picker for the selected game.
 *
 * ⚠️ HIDDEN, NOT DISABLED. A greyed-out LESSON row beside Shatter still tells a
 * twelve-year-old that Shatter is somehow about a lesson they have not chosen.
 */
function applyGameMode() {
    const free = isFreePlay();
    for (const id of ['row-lesson', 'row-run', 'row-speed']) {
        $(id).style.display = free ? 'none' : '';
    }
    // ⚠️⚠️ THE LEVEL ROW DISAPPEARS WHEN THE STUDENT PICKS THE FULL POOL, ON ANY
    // GAME. Jake, 2026-09-09: *"If we pick word pool, the drop down for lessons
    // should go away on any game."* ⭐ AND HE IS RIGHT FOR A REASON WORTH WRITING
    // DOWN: at `full` the level decides nothing about the words, so a lesson
    // picker sitting there is a control that looks like it does something and
    // does not. ⚠️ THE LEVEL STILL SETS THE PACE at `full` — the gate comes from
    // `arcadeTargetWPM()` either way — so this hides a control that is still
    // partly live, which is the one cost of the rule and is worth it.
    const fullPool = chosenScope() === 'full';
    $('row-level').style.display = (free && !fullPool) ? '' : 'none';
    // ⚠️ THE WORDS ROW IS ALWAYS VISIBLE NOW — it is the control that DECIDES
    // whether this is free play, so hiding it when free play is off would make
    // the state unreachable from the state it hides in.
    $('row-scope').style.display = '';
    $('row-freespeed').style.display = fullPool ? '' : 'none';
    // ⚠️ HERE RATHER THAN ON THE GAME DROPDOWN'S OWN LISTENER. The blurb depends
    // on isFreePlay(), which the SCOPE row can change without the game changing,
    // so hanging this off `change` on #game would leave a stale paragraph every
    // time a student switched Deadline to the full pool.
    applyPageChrome();
    if (free) showFreeGates(); else showGates();
}

/**
 * ⚠️⚠️ THE ONE PLACE THAT SAYS WHAT THIS PAGE KEEPS. Both gate panels call it.
 *
 * The old copy under the frame claimed nothing was saved at all; the free-play
 * panel claimed time was banked. Both were shown at once and only one was true.
 * ⭐ THE HONEST ANSWER IS SPLIT, AND SAYING IT ONCE IS THE ONLY WAY IT STAYS
 * SPLIT: the seconds are written to `typing_logs` exactly as School's are, and
 * the score and grade are written nowhere yet.
 *
 * ⚠️ WHEN THE learn.js WIRING LANDS, THIS FUNCTION IS THE THING TO EDIT, and it
 * must stay the only thing — a grade that starts counting while a second panel
 * still says it does not is the failure this consolidation exists to prevent.
 */
function savedNote() {
    return '<span><i>Your time counts toward your day and your week, exactly ' +
           'like School. Your score and grade are not saved yet.</i></span>';
}

/**
 * Point the browser tab at the chosen game.
 *
 * ⚠️ Round 115: this used to write a title and a per-game blurb under the
 * frame as well. Both elements are gone (Jake: "gratuitous"); the tab title is
 * the only chrome left, and it still comes from titleOf() so a rename stays one
 * line in game-names.js.
 */
function applyPageChrome() {
    const g = currentGame();
    // ⚠️ Round 115: THE TAB TITLE IS ALL THAT IS LEFT. The #game-title and

    // throw on a null and take applyGameMode() down with it.
    document.title = 'Arcade \u2014 ' + titleOf(g.id) + ' \u2014 TypeThatBook';
}
