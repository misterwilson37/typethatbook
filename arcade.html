        '<path d="M148 66h40l-6 20h-38z"/></g>' +
        '<g stroke="#ffd27d" stroke-width="1.5" opacity=".8">' +
        '<path d="M104 24v26M140 62v26M90 62v26"/></g>' +
        '<g font-family="monospace" font-size="10" fill="#8aa2b4">' +
        '<text x="60" y="112">break it up</text></g>' +
        '</svg>',
};

/** The glow behind each cabinet screen — the game's own accent. */
const CAB_GLOW = { deadline: '#123049', escape: '#1a2c3f', shatter: '#2a2437' };

/**
 * ⚠️ A CABINET MAY CARRY A HONEST WARNING, AND SHATTER HAS ONE. Jake,
 * 2026-09-10: *"Shatter needs more work than you and I have rope for."* ⭐ SO IT
 * STAYS PLAYABLE AND SAYS SO. Hiding it would contradict its own registry entry
 * (game-names.js spent eleven rounds flagged `unbuilt` and unreachable, which is
 * the mistake in the other direction); shipping it silently would let a class
 * find the rough edges before the teacher does.
 */
const CAB_FLAG = { shatter: 'ROUGH EDGES' };

/**
 * Paint the arcade floor.
 *
 * ⚠️ DERIVED FROM GAME_ORDER AND THE `unbuilt` FLAG, exactly like fillGames().
 * Two lists of which games exist is the Rule 9 break that hid Shatter for eleven
 * rounds; this reads the same registry the dropdown does.
 */
function renderCabinets() {
    const host = $('cabs');
    host.innerHTML = '';
    for (const id of GAME_ORDER) {
        const g = GAMES[id];
        if (!g || g.unbuilt) continue;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'cab';
        b.style.setProperty('--glow', CAB_GLOW[id] || '#16202c');
        // ⚠️ THE ACCESSIBLE NAME IS THE TITLE ALONE. The tagline is read from the
        // body text; putting it in the label too makes a screen reader say the
        // whole sentence twice before the child can press anything.
        b.setAttribute('aria-label', 'Play ' + titleOf(id));
        b.innerHTML =
            '<div class="cab-screen">' + (CAB_ART[id] || '') + '</div>' +
            '<div class="cab-body">' +
                '<div class="cab-name">' + titleOf(id) +
                    (CAB_FLAG[id] ? '<span class="cab-flag">' + CAB_FLAG[id] + '</span>' : '') +
                '</div>' +
                '<div class="cab-tag">' + (g.tagline || '') + '</div>' +
                '<div class="cab-insert">PRESS TO PLAY</div>' +
            '</div>';
        b.addEventListener('click', () => chooseCabinet(id));
        host.appendChild(b);
    }
}

/**
 * A cabinet was pressed: set the game and show the options for it.
 *
 * ⚠️⚠️ IT SETS $('game').value AND THEN CALLS applyGameMode(). It does NOT
 * reimplement what that function does. currentGame(), playFree() and
 * playDeadline() all read the select, so the select stays the single record of
 * which game is chosen and the cabinets are merely an input to it.
 */
function chooseCabinet(id) {
    $('game').value = id;
    $('floor').style.display = 'none';
    $('picker').style.display = 'block';
    // ⚠️ THE SAME FUNCTION THE DROPDOWN'S `change` LISTENER CALLS. If this ever
    // diverges, the two ways into the panel configure it differently.
    applyGameMode();
    const play = $('play');
    if (play) play.focus({ preventScroll: true });
}

/** Back to the floor. ⚠️ Nothing is reset — a student who changes their mind
 *  about the game has not changed their mind about their level. */
function showFloor() {
    $('picker').style.display = 'none';
    $('result').style.display = 'none';
    $('floor').style.display = 'block';
}

/**
 * The two clocks in the marquee.
 *
 * ⚠️⚠️ READ FROM liveMinutes(), THE SAME GETTER THE CONSOLE GAUGES USE. A second
 * formatter here would be a second answer to "how long have I typed today", and
 * Rule 11 is explicit that both readers must come from one record.
 * ⚠️ AND IT SHOWS AN EM DASH, NOT 0:00, BEFORE MINUTES LOADS. A confident zero on
 * a student who has typed all week is worse than an obvious blank.
 */
function renderPlayer(user) {
    const el = $('mq-who');
    if (!el) return;
    // ⚠️ displayName FIRST, email as fallback — the same order index.html and
    // the School header use, so a student reads the same name on every page.
    el.textContent = (user && !user.isAnonymous)
        ? (user.displayName || user.email || 'signed in')
        : 'not signed in';
    el.title = (user && user.email) || '';
}

function renderMarquee() {
    const m = liveMinutes();
    $('mq-today').textContent = m ? m.todayClock : '\u2014';
    $('mq-week').textContent = m ? m.weekClock : '\u2014';
}

function showFreeGates() {
    const g = currentGame();
    const { keys, wpm, pool } = describeLevel();
    // ⚠️ THE LETTERS ARE SHOWN, NOT COUNTED. "12 keys" is a number a student has
    // to trust; `a s d f j k l ; e i r u` is a thing they can check against their
    // own hands, and it is the whole content of the level choice they just made.
    const full = chosenScope() === 'full';
    const shown = keys.slice().sort().join(' ');
    // ⚠️ WHAT THE POOL ACTUALLY IS, SAID PLAINLY, AND NEITHER PHRASED AS BETTER.
    // For the early units letter groups ARE the correct answer and will be for
    // months; and `full` is not a reward for progress, it is a different choice.
    const poolLine = pool.source === 'morphemes'
        ? 'real words that break into their pieces \u2014 <b>un</b>+<b>usual</b>+<b>ly</b>'
        : pool.source === 'words'
            ? 'real words from the library, getting longer as you go'
            : 'letter groups built from these letters';
    $('gates').innerHTML =
        `<span>${g.tagline}</span>` +
        // ⚠️ THE LETTERS ROW IS MEANINGLESS AT `full` AND IS DROPPED RATHER THAN
        // SHOWN STALE. A list of this level's letters beside a pool that ignores
        // them is a panel contradicting itself.
        (full ? '<span>letters <b>all of them</b></span>'
              : `<span>letters <b>${shown || '\u2014'}</b></span>`) +
        `<span>starting speed <b>${wpm} WPM</b></span>` +
        `<span>${poolLine}</span>` +
        // ⚠️ THIS SENTENCE IS NO LONGER SPELLED HERE. It was one of the two
        // disagreeing copies; savedNote() is the only writer now.
        savedNote();
    $('play').disabled = false;
}

/**
 * The config for a free-play run.
 *
 * ⚠️⚠️ arcadeConfig() DECIDES THE SPEED, NOT THIS PAGE. It targets the minWPM
 * gate of the furthest lesson the student has reached, which is Jake's 4c
 * ruling, and it reads that from the same window arcadeKeySet() uses so the
 * arcade's letters and its speed come from one place. ⚠️ DO NOT PASS bestWPM —
 * game-shell.js is explicit that it may only be supplied by a caller that
 * ALREADY holds the leaderboard document, and this page does not.
 */
/**
 * ⚠️⚠️ THE PANEL WANTS `todayClock` / `weekClock`; `MINUTES` HOLDS
 * `dailySeconds` / `weeklySeconds`. Passing the raw object was why Jake saw no
 * daily or weekly row at all — `drawGauges()` reads two field names this page has
 * never used, found both undefined, and correctly drew nothing. ⭐ NO ERROR, NO
 * WARNING, JUST AN ABSENT PANEL SECTION: the failure mode of an object contract
 * that nothing checks.
 *
 * ⚠️ AND IT IS A FUNCTION SO THE CLOCKS CLIMB. bankSecond() already increments
 * MINUTES live; a snapshot taken at mount would have been frozen at the value it
 * had when the student pressed play, which is the other half of what he saw.
 */
function clockStr(sec) {
    const s = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`
             : `${m}:${String(s % 60).padStart(2, '0')}`;
}

function liveMinutes() {
    if (!MINUTES) return null;
    return {
        todayClock: clockStr(MINUTES.dailySeconds),
        weekClock: clockStr(MINUTES.weeklySeconds),
    };
}

/** ⚠️ READ ONCE. A flag that could change mid-session would let the two
 *  instances diverge inside one page load, which is the thing it exists to stop. */
const LAB = new URLSearchParams(location.search).get('lab') === '1';

function fillLab() {
    if (!LAB) return;
    $('row-lab').style.display = '';
    const sel = $('labGate');
    if (sel.options.length) return;
    const o0 = document.createElement('option');
    o0.value = ''; o0.textContent = 'use the game\u2019s own gate';
    sel.appendChild(o0);
    for (const w of [5, 10, 15, 20, 25, 30, 40, 50, 60, 75, 100]) {
        const o = document.createElement('option');
        o.value = String(w); o.textContent = w + ' WPM gate';
        sel.appendChild(o);
    }
}

/** ⚠️ RETURNS 0 WHEN UNSET OR WHEN THE FLAG IS OFF, which every caller already
 *  treats as "no override" — so the student's path runs identical code. */
function labGate() {
    if (!LAB) return 0;
    const v = parseInt($('labGate').value, 10);
    return Number.isFinite(v) ? v : 0;
}

function chosenScope() { return $('scope').value === 'full' ? 'full' : 'level'; }

// ⚠️ UP TO 100. The lesson gates run 10–35; a student on the full word pool has
// said they are past that, and capping them at a lesson's pace would make the
// pool choice pointless for exactly the students it exists for.
const FREE_SPEEDS = [10, 15, 20, 25, 30, 40, 50, 60, 75, 100];

function fillFreeSpeeds() {
    const sel = $('freespeed');
    if (sel.options.length) return;
    for (const w of FREE_SPEEDS) {
        const o = document.createElement('option');
        o.value = String(w);
        o.textContent = w + ' WPM';
        sel.appendChild(o);
    }
    sel.value = '20';
}

function chosenFreeWPM() {
    const v = parseInt($('freespeed').value, 10);
    return Number.isFinite(v) ? v : 20;
}

function chosenLevelIdx() {
    const v = parseInt($('level').value, 10);
    return Number.isFinite(v) && v >= 0 ? v : null;
}

/**
 * ⚠️ THE LEVEL LIST IS EVERY LESSON, NOT ONLY THE PLAYABLE ONES. `PLAYABLE`
 * filters to steps that carry a speed gate and deterministic text, which is
 * exactly right for Deadline and irrelevant here — free play needs a key set and
 * a pace, and every lesson has both. ⭐ IT ALSO MEANS A STUDENT CAN DELIBERATELY
 * PLAY AN EASIER LEVEL, which is the point of letting them choose.
 *
 * ⚠️ DEFAULTS TO WHERE THEY ACTUALLY ARE. arcadeWindow() with no index is the
 * furthest lesson passed plus the one they are on — the same answer the arcade
 * gave before there was a picker, so the default costs a returning student
 * nothing.
 */
function fillLevels() {
    const sel = $('level');
    sel.innerHTML = '';
    LESSONS.forEach((l, i) => {
        const o = document.createElement('option');
        o.value = String(i);
        o.textContent = (l.title || l.id || ('Lesson ' + (i + 1)));
        sel.appendChild(o);
    });
    const here = arcadeWindow(LESSONS, PROGRESS);
    sel.value = String(here >= 0 ? here : 0);
    sel.disabled = !LESSONS.length;
}

function freePlayConfig() {
    // ⚠️ ONE levelIdx, AND arcadeConfig() HANDS IT TO BOTH THE KEY SET AND THE
    // GATE. game-shell.js's arcadeWindow() is the single answerer — two windows
    // over one list would draw the letters from one lesson and the speed from
    // another.
    // ⚠️ AT `full` THE SPEED IS THE STUDENT'S, NOT THE LEVEL'S. `targetWPM` wins
    // over arcadeTargetWPM() inside arcadeConfig(), which is exactly the seam it
    // documents for a caller that already knows the pace it wants.
    const cfg = arcadeConfig({
        lessons: LESSONS, progress: PROGRESS, levelIdx: chosenLevelIdx(),
        // ⚠️ THE LAB OVERRIDE IS APPLIED AT THE SAME SEAM the student's own speed
        // choice uses, not by a second path — so a bug reproduced under ?lab=1 is
        // a bug in the code the student runs.
        targetWPM: labGate() || (chosenScope() === 'full' ? chosenFreeWPM() : 0),
    });
    // ⚠️⚠️ THE TARGETS ARE REPLACED; THE GATE IS NOT. Scope decides WHAT you
    // type, the level decides HOW FAST it arrives — and a student who opens the
    // pool up has said nothing about wanting a harder pace. ⚠️ Conflating the
    // two would mean a beginner who wanted to see real words got a speed they
    // never asked for, which is the shape of the hole this whole change closes.
    const pool = arcadePool({
        game: currentGame().id,
        scope: chosenScope(),
        keySet: arcadeKeySet(LESSONS, PROGRESS, chosenLevelIdx()),
        round: 1,
    });
    if (pool.targets.length) cfg.targets = pool.targets;
    return cfg;
}

/** What the chosen level actually produces, in words a twelve-year-old can read. */
function describeLevel() {
    const idx = chosenLevelIdx();
    const keys = arcadeKeySet(LESSONS, PROGRESS, idx);
    const wpm = chosenScope() === 'full' ? chosenFreeWPM()
        : arcadeTargetWPM({ lessons: LESSONS, progress: PROGRESS, levelIdx: idx });
    const pool = arcadePool({
        game: currentGame().id, scope: chosenScope(), keySet: keys, round: 1,
    });
    return { keys, wpm, pool };
}

function chosenWPM() {
    const v = parseInt($('speed').value, 10);
    return v > 0 ? v : (currentRun() || { gates: {} }).gates.minWPM;
}

function showGates() {
    const r = currentRun();
    const p = PLAYABLE[Number($('lesson').value) || 0];
    if (!r) { $('gates').innerHTML = ''; $('play').disabled = true; return; }
    const grades = (PROGRESS[p.lesson.id] && PROGRESS[p.lesson.id].runGrades) || {};
    const best = grades[String(r.runIdx)];
    const wpm = chosenWPM();
    const altered = wpm !== r.gates.minWPM;
    $('gates').innerHTML =
        `<span>${r.speedGraded ? 'speed target' : 'pace'} <b>${wpm} WPM</b>` +
        (altered ? ` <i>(this run\u2019s own is ${r.gates.minWPM})</i>` : '') + `</span>` +
        (r.speedGraded ? '' : '<span><i>School grades this drill on accuracy only</i></span>') +
        `<span>accuracy target <b>${r.gates.minAccuracy}%</b></span>` +
        `<span>${r.sequence.length} characters</span>` +
        (best ? `<span>your best typed grade <b>${best}</b></span>` : '') +
        // ⚠️ THE LESSON PATH NEVER CARRIED THIS AT ALL. Its only statement about
        // saving was the paragraph under the frame, which is read after play and
        // said something false. A student playing a graded lesson run is the one
        // most likely to assume the result counts, so this is the panel that
        // needed it most and was the panel without it.
        savedNote();
    $('play').disabled = false;
}

/**
 * Show or collapse the threat board, which only Deadline draws into.
 *
 * ⚠️⚠️ CALLED FROM BOTH LAUNCH PATHS, AND THE ARGUMENT IS DERIVED FROM THE SAME
 * TEST THAT DECIDES WHETHER threatCanvas IS PASSED. A page that handed the canvas
 * to Deadline and revealed it on a rule of its own would have two answers to
 * "does this game have a threat board", and they would disagree the first time a
 * fourth game arrives. ⭐ ONE QUESTION, ASKED ONCE: `id === 'deadline'`.
 *
 * ⚠️ THE ELEMENT IS NEVER REMOVED FROM THE DOM, ONLY FROM LAYOUT. $('threat-canvas')
 * is read at mount time on the next launch, and a removed node would hand the
 * view a detached canvas that draws perfectly into nothing.
 */
function showThreatBoard(on) {
    $('radar-col').classList.toggle('no-threat', !on);
}

/**
 * The panel elements, read fresh at each launch.
 *
 * ⚠️ A FUNCTION, NOT A CONSTANT. #stageWrap is `display:none` until a game
 * mounts, and the elements are replaced by nothing but are re-read by
 * game-chrome.js's stale-bar sweep; capturing them at module load also ran
 * before the DOM existed for the build panel's sake.
 * ⚠️ `minutes` IS A GETTER, NOT A SNAPSHOT — bankSecond() increments MINUTES
 * live, and a value captured at mount would be frozen at press-play.
 */
function PANEL_ELS() {
    return {
        barHost: $('controls-col'),
        gauge: $('gauge-canvas'),
        left: $('radar-canvas'),
        threat: $('threat-canvas'),
        minutes: liveMinutes,
    };
}

function play() {
    if (isFreePlay()) { playFree(); return; }
    const r = currentRun();
    if (!r) return;
    // ⚠️ THE SAME missionConfigFromRun() THE REAL WIRING WILL CALL, given the
    // same run shape learn.js's buildRunList() produces. If this page and the
    // eventual wiring disagreed about difficulty they would not be comparable,
    // so this must never hand-build a config.
    // ⚠️ THE CHOSEN SPEED REPLACES ONLY minWPM. Everything else about difficulty
    // still comes from missionConfigFromRun(), so a run played at its own gate is
    // byte-identical to what v2.0.0 launched and remains comparable to School.
    const gates = { minWPM: chosenWPM(), minAccuracy: r.gates.minAccuracy };
    const cfg = missionConfigFromRun({ sequence: r.sequence }, gates, null);
    // ⚠️⚠️ THE SURVIVAL POOL IS APPENDED *AFTER* missionConfigFromRun() HAS SET
    // quotaChars, AND THE ORDER IS THE POINT. That function computes the quota
    // from the targets it is given, so appending first would move the finish
    // line to the end of the survival words and the student would never pass.
    // Appending after leaves the mission exactly the size of the School run.
    const survivalPool = survivalTargetsFor(currentLesson(), r);
    if (survivalPool.length) {
        cfg.targets = cfg.targets.concat(survivalPool);
        // ⚠️⚠️ AND THE RAMP MUST NOT PLATEAU. Jake, 2026-09-09: *"survival mode
        // has to get HARDER... The student will lose because it gets too hard,
        // not because s/he gets tired."* PRESSURE_CEILING is reached 75 targets
        // past the quota and then holds — on a 10 WPM lesson that is a fixed 25
        // WPM of demand, which a strong student holds until the bell.
        // ⚠️ THIS RAISES THE CEILING ONLY; IT DOES NOT TOUCH THE GRADED RUN. The
        // ramp does not begin until the quota is met, so the mission a student is
        // judged on is played at exactly the gate either way.
        // ⚠️ DERIVED FROM THIS RUN'S OWN GATE, because pressure is a MULTIPLE of
        // that gate and the wall Jake asked for is an absolute 100 WPM. A flat
        // multiplier would put the wall at 60 WPM on one lesson and 150 on
        // another, for no reason a student could see.
        cfg.pressureCeiling = survivalCeilingFor(gates.minWPM);
    }
    lastPlayedWPM = gates.minWPM;
    // ⚠️ THIS PATH IS ALWAYS DEADLINE — isFreePlay() sent everything else away at
    // the top — so the board is always shown here. Stated rather than assumed,
    // because the previous line of defence for that was a comment.
    showThreatBoard(usesThreatBoard('deadline'));
    $('picker').style.display = 'none';
    $('result').style.display = 'none';
    $('stageWrap').style.display = 'block';
    if (handle) { handle.destroy(); handle = null; }
    handle = mountDeadline($('stage'), {
        config: cfg,
        // ⚠️ THE BUTTONS LIVE IN THE RIGHT CARD NOW, not over the canvas.
        // game-chrome.js keeps its floating fallback for hosts without one.
        // ⚠️⚠️ THE SAME ONE FUNCTION THE FREE-PLAY PATH USES. These four options
        // used to be spelled out separately in both places — two records of one
        // wiring decision, and the free-play copy was the one missing a game.
        // Rule 9: the copy that can go wrong is the second one.
        ...panelOptionsFor('deadline', PANEL_ELS()),
        // ⚠️⚠️ OPT-IN, AND ONLY THIS PAGE OPTS IN. learn.js and the lab mount the
        // same view; a run that stopped ending when its quota was met would hang
        // the lesson flow on both. See game-deadline.js's `survival` note.
        survival: survivalPool.length > 0,
        // ⚠️ `minutes` NOW ARRIVES VIA panelOptionsFor() ABOVE, as a GETTER
        // rather than the object — see game-deadline.js's minuteLines(). It is
        // not repeated here, or the two paths would disagree about it the next
        // time one of them changed.
        // ⚠️⚠️ ONE TICK PER GRADED SECOND. The date is stamped HERE, at the
        // moment of the tick, so a game running through midnight splits across
        // two days exactly as a lesson does — the view never learns what a date
        // is. See game-deadline.js's onSecond note.
        onSecond: () => bankSecond(),
        onQuit: () => { flushArcadeSeconds(); finish(null, r); },
        onEnd:  rep => { flushArcadeSeconds(); finish(rep, r); },
    });
    $('stage').scrollIntoView({ block: 'nearest' });
}

/**
 * Mount an ungraded run — Shatter, Escape Key, or Deadline against the whole
 * word pool.
 *
 * ⚠️⚠️ THIS COMMENT USED TO READ *"Mount Shatter or Escape Key. NO `survival`, NO
 * `barHost`, NO SIDE CANVASES."* — and every clause of it was false by Round 108,
 * which is most of why the missing Deadline panels survived so long. The title
 * was false the moment Round 112 let Deadline take the full pool; the `barHost`
 * and side-canvas claims were false the moment Escape Key v2.0.0 and Shatter
 * v1.2.0 accepted them, two rounds earlier. ⭐ A DOC COMMENT DESCRIBING A
 * CONTRACT THAT NO LONGER HOLDS IS WORSE THAN NO COMMENT: it is the thing a
 * reader checks INSTEAD of the code, so it does not merely fail to help, it
 * actively answers the question wrongly. Round 82's HANDOFF flagged the same
 * shape in game-escape.js v1.0.0 and it happened again here.
 *
 * ⚠️ `survival` REMAINS DEADLINE-AND-LESSON-ONLY, and that clause is still true:
 * survival extends a run past a QUOTA, and a full-pool run has no quota to pass.
 * See game-deadline.js's `survival` note.
 */
function playFree() {
    const g = currentGame();
    const mountGame = g.id === 'shatter' ? mountShatter
        : g.id === 'escape' ? mountEscape
        : mountDeadline;
    lastPlayedWPM = null;
    showThreatBoard(usesThreatBoard(g.id));
    $('picker').style.display = 'none';
    $('result').style.display = 'none';
    $('stageWrap').style.display = 'block';
    if (handle) { handle.destroy(); handle = null; }
    const cfg = freePlayConfig();
    handle = mountGame($('stage'), {
        config: cfg,
        // ⚠️⚠️ ESCAPE KEY ONLY, AND game-shatter.js DOES NOT ACCEPT IT. Shatter's
        // rocks come from the director's target pool and its own split ladder;
        // handing it a per-round provider would be this page asserting a
        // contract that view does not have. ⚠️ A silently-ignored option is
        // worse than an absent one — game-escape.js v1.1.0's header says so.
        // ⭐ THE PROVIDER IS BUILT FROM THE SAME KEY SET arcadeConfig() USED, so
        // the words and the pace come from one level and cannot disagree.
        // ⚠️⚠️ THE PANELS ARE PASSED TO ESCAPE KEY AND NOT TO SHATTER. Escape
        // Key v2.0.0 accepts a preview canvas, a gauge canvas, a bar host and a
        // minutes getter; game-shatter.js accepts NONE of them and says so in its
        // header. A silently-ignored option is worse than an absent one.
        // ⚠️ THE PREVIEW PANEL REUSES #radar-canvas, THE ELEMENT, NOT THE RADAR.
        // Deadline's radar answers "where"; this one deliberately refuses to —
        // see drawWavePreview()'s header. Same box on the page, different job.
        // ⭐ SHATTER'S PANELS MIRROR THE OTHER TWO. Its left panel is a radar over
        // a warp meter rather than a wave preview — different content, same box.
        //
        // ═══════════════════════════════════════════════════════════════════
        // ⚠️⚠️ DEADLINE GOT NO PANELS ON THIS PATH AT ALL, FOR ELEVEN ROUNDS.
        // ═══════════════════════════════════════════════════════════════════
        // Jake, 2026-09-10, on a free-play Deadline run: *"there are no active
        // consoles on deadline."* ⭐ THE PANELS WERE NEVER MISSING — they are
        // drawRadar(), drawThreatBoard() and drawGauges(), they have 141
        // assertions behind them, and playDeadline() has passed all four
        // options since Round 94. THIS function listed a spread for `shatter`
        // and a spread for `escape` and nothing for `deadline`, so the view
        // received no canvases, correctly drew no panels, and game-chrome.js
        // correctly fell back to its floating button bar over the sky.
        // ⚠️ NOTHING REPORTED A FAULT, because an absent option is a legal
        // option: every panel in all three views is absent-safe by design, for
        // learn.js's benefit. ⭐ THE FAILURE MODE OF AN ABSENT-SAFE CONTRACT IS
        // A BLANK PANEL AND A GREEN SUITE, which is this repo's oldest shape.
        //
        // ⭐⭐ AND THE WIRING IS NOT SPELLED HERE AT ALL ANY MORE. It is
        // panelOptionsFor() in game-names.js — a pure function over the registry
        // — because the first harness written to pin this bug FAILED ITS OWN
        // MUTATION TEST. The options were an object literal inside this file,
        // which imports firebase-config.js, so nothing could import them and the
        // only available check was a regex counting `gaugeCanvas:` in the
        // source. Reinstating the exact shipped bug kept that count at one and
        // the suite stayed green. ⚠️ A REGEX CANNOT SEE CONTROL FLOW, and which
        // games receive a console is nothing but control flow.
        // ⚠️ SO THIS LINE IS LOAD-BEARING FOR THE TEST, NOT ONLY FOR THE PAGE.
        // Inlining these options again would restore an untestable literal.
        ...panelOptionsFor(g.id, PANEL_ELS()),
        ...(g.id === 'escape'
            ? { poolFor: poolProviderFor(
                    arcadeKeySet(LESSONS, PROGRESS, chosenLevelIdx()),
                    Math.random, chosenScope()) }
            : {}),
        // ⚠️⚠️ THE WHOLE REASON THIS PATH EXISTS. `countsTime: true` in the
        // registry is a promise, and for twenty rounds Escape Key had no way to
        // keep it because its view emitted no seconds at all. The date is
        // stamped HERE, at the moment of the tick, so a run through midnight
        // splits across two day documents exactly as a lesson does.
        onSecond: () => bankSecond(),
        onQuit: () => { flushArcadeSeconds(); finishFree(null); },
        onEnd:  rep => { flushArcadeSeconds(); finishFree(rep); },
    });
    $('stage').scrollIntoView({ block: 'nearest' });
}

/**
 * ⚠️⚠️ NO COMPARISON TABLE AND NO VERDICT. There is no gate to have met, so
 * every line here is a description of what happened rather than a judgement of
 * it. ⭐ THE TIME IS FIRST, because time is the only thing this run produced that
 * the app kept, and Jake's ruling is that time spent typing is time spent well.
 */
function finishFree(rep) {
    if (handle) { handle.destroy(); handle = null; }
    $('stageWrap').style.display = 'none';
    $('result').style.display = 'block';
    $('compare').innerHTML = '';
    if (!rep) {
        $('verdict').innerHTML =
            '<span class="big">Stopped</span><br>Whatever you typed still counts toward your day.';
        return;
    }
    const mins = Math.floor(rep.seconds / 60);
    const secs = Math.round(rep.seconds % 60);
    $('verdict').innerHTML =
        `<span class="big">${mins}:${String(secs).padStart(2, '0')} typing</span><br>` +
        `${rep.wpm} WPM &middot; ${rep.acc}% accurate &middot; ` +
        `${rep.targetsCleared} cleared &middot; score ${rep.score}<br>` +
        '<span class="met">That time is banked toward your day and your week.</span>';
    console.log('[arcade] free-play report', rep);
}

function finish(rep, r) {
    if (handle) { handle.destroy(); handle = null; }
    $('stageWrap').style.display = 'none';
    $('result').style.display = 'block';
    if (!rep) {
        $('verdict').innerHTML = '<span class="big">Stopped</span><br>No result \u2014 nothing was saved.';
        $('compare').innerHTML = '';
        return;
    }
    // ⚠️⚠️ THE GRADED RUN IS `rep.pass`, NOT `rep`, AND EVERY FIGURE ON THIS PANEL
    // MUST COME OFF IT. `rep` is the whole session including survival, so a
    // student who passed at 34 WPM and then survived four minutes at 60% would
    // be shown — and eventually GRADED — on the survival numbers. WPM and
    // accuracy are ratios over the session and do not decompose, which is why
    // the view freezes a copy at the moment of the pass rather than subtracting
    // afterwards. See game-deadline.js's snapshot note.
    const graded = rep.pass || rep;
    const playedWPM = lastPlayedWPM != null ? lastPlayedWPM : r.gates.minWPM;
    const metWPM = graded.wpm >= playedWPM;
    const metAcc = graded.acc >= r.gates.minAccuracy;
    const sv = rep.survival;
    // ⚠️⚠️ A SURVIVOR WHO DIES IS TOLD THEY PASSED, FIRST. The session ends the
    // way every loss ends — city gone — so leading with anything else would tell
    // a child who had already earned the lesson that they had failed it.
    $('verdict').innerHTML =
        `<span class="big">${graded.wpm} WPM &middot; ${graded.acc}%</span><br>` +
        (metWPM && metAcc
            ? 'You cleared both targets for this run.'
            : 'You did not clear ' + (!metWPM && !metAcc ? 'either target'
                : !metWPM ? 'the speed target' : 'the accuracy target') + ' this time.') +
        (sv && sv.cleared
            // ⚠️ NO WPM OR ACCURACY ON THIS LINE, EVER. Those belong to the
            // graded run alone; a second pair here is two answers to one
            // question, which is the whole thing the freeze exists to prevent.
            ? `<br><span class="met">Then you survived ${Math.round(sv.seconds)}s longer, ` +
              `cleared ${sv.cleared} more words and scored ${sv.score}.</span>`
            : '');
    // ⚠️ THE COMPARISON TABLE IS THE POINT OF THE PAGE — the game result beside
    // the SAME gate the typed run is graded against, so nobody has to do
    // arithmetic to put the two side by side.
    $('compare').innerHTML =
        '<tr><th></th><th>this game</th><th>this run\u2019s target</th></tr>' +
        `<tr><td>speed</td><td class="${metWPM ? 'met' : 'miss'}">${graded.wpm} WPM</td>` +
            `<td>${playedWPM} WPM${playedWPM !== r.gates.minWPM
                ? ' (run\u2019s own: ' + r.gates.minWPM + ')' : ''}</td></tr>` +
        `<tr><td>accuracy</td><td class="${metAcc ? 'met' : 'miss'}">${graded.acc}%</td>` +
            `<td>${r.gates.minAccuracy}%</td></tr>` +
        `<tr><td>characters</td><td>${graded.chars != null ? graded.chars : '\u2014'}</td>` +
            `<td>${r.sequence.length}</td></tr>` +
        `<tr><td>seconds</td><td>${graded.seconds != null ? Math.round(graded.seconds) : '\u2014'}</td><td>\u2014</td></tr>`;
    console.log('[arcade] report', rep);
}

/**
 * Load today's and this week's typing seconds.
 *
 * ⚠️⚠️ THIS COSTS READS AND THEY ARE ACCOUNTED FOR HERE ON PURPOSE. The user
 * document, the class document and settings/goals resolve the WEEK ANCHOR —
 * class → school default → Saturday, the same ladder game.js and learn.js walk —
 * and readWeek() then reads the week's day documents, most of which daylog.js
 * serves from its closed-day localStorage cache on any load after the first.
 * ⚠️ IT MUST BE THE CLASS'S OWN ANCHOR. Hardcoding Saturday here would print a
 * weekly total that disagrees with the one the same child sees in School, for
 * every class that chose a different week — and a number that disagrees with
 * itself across two pages is worse than no number.
 * ⚠️ FAILURE IS SILENT AND TOTAL: any error leaves MINUTES null and the game
 * simply omits the lines. Nothing here may block a student from playing.
 */
async function loadMinutes(user) {
    if (!user || user.isAnonymous) return;
    try {
        let weekStartDay = 6, classId = '';
        const uSnap = await withTimeout(getDoc(doc(db, 'users', user.uid)), 'your account');
        // ⚠️ BOUND TO A PLAIN IDENTIFIER, and reconcile() is handed THAT.
        // mirror-heal-test.mjs B3 rejects an inline `uSnap.data()` in the
        // argument list on purpose: an expression there is where a second
        // getDoc() gets smuggled in, turning a free repair into a per-load read.
        const userDoc = uSnap.exists() ? uSnap.data() : null;
        if (userDoc) classId = userDoc.classId || '';
        let resolved = false;
        if (classId) {
            const cSnap = await getDoc(doc(db, 'classes', classId));
            if (cSnap.exists()) {
                const cd = cSnap.data();
                if (Number.isInteger(cd.weekStartDay) && cd.weekStartDay >= 0 && cd.weekStartDay <= 6) {
                    weekStartDay = cd.weekStartDay; resolved = true;
                }
            }
        }
        if (!resolved) {
            const gSnap = await getDoc(doc(db, 'settings', 'goals'));
            if (gSnap.exists()) {
                const gd = gSnap.data();
                if (Number.isInteger(gd.weekStartDay) && gd.weekStartDay >= 0 && gd.weekStartDay <= 6) {
                    weekStartDay = gd.weekStartDay;
                }
            }
        }
        // ⚠️ HANDED THE DOCUMENT THIS FUNCTION ALREADY READ, never a fresh
        // getDoc() — the repair must stay free. uSnap is read above for classId.
        if (userDoc) {
            try { reconcile(user.uid, userDoc); } catch (_) {}
        }
        const wk = await readWeek({
            db, doc, getDoc, uid: user.uid,
            dateStr: localDateStr(), weekStartDay,
        });
        // ⚠️ GATED ON ok EXACTLY AS daylog.js's OWN COMMENT DEMANDS. A partial
        // week reads as zeroes, and showing a student a wrongly-low weekly total
        // is worse than showing none.
        if (wk && wk.ok) {
            ARCADE_UID = user.uid;
            ARCADE_WHO = {
                email: user.email || '',
                displayName: user.displayName || '',
                classId: (userDoc && userDoc.classId) || '',
                schoolId: (userDoc && userDoc.schoolId) || '',
            };
            if (wk.todaySources && wk.todaySources.arcade) {
                ARCADE_BASE = Object.assign(ARCADE_BASE, wk.todaySources.arcade);
            }
            MINUTES = {
                dailySeconds: (wk.today && wk.today.seconds) || 0,
                weeklySeconds: (wk.week && wk.week.seconds) || 0,
            };
        }
    } catch (e) {
        console.warn('[arcade] minutes unavailable:', e.message);
    }
}

// ⚠️⚠️ A HUNG READ IS NOT A REJECTED READ, AND THE DIFFERENCE IS A FOREVER
// SPINNER. Found by loading this page where Firestore was unreachable: getDocs()
// did not throw, it simply never settled, so the catch below never ran and the
// student sat on "Loading your lessons…" with no way to tell whether the page
// was broken or slow. A child on a classroom Chromebook that has dropped its
// wifi hits exactly that. 12 seconds is long enough for a genuinely slow
// morning-of-first-period cold start and short enough that nobody is left
// guessing.
// ⚠️ THIS TIMEOUT IS COSMETIC ONLY — it never cancels the underlying read (the
// SDK has no cancel) and never retries. It exists so the page can SAY something.
const LOAD_TIMEOUT_MS = 12000;
function withTimeout(promise, what) {
    return Promise.race([
        promise,
        new Promise((_, rej) =>
            setTimeout(() => rej(new Error('timed out reading ' + what)), LOAD_TIMEOUT_MS)),
    ]);
}

async function load(user) {
    // ⭐ Round 115 — the name costs no read, so it goes up before any read does.
    renderPlayer(user);
    try {
        const lessonSnap = await withTimeout(getDocs(collection(db, 'lessons')), 'lessons');
        LESSONS = lessonSnap.docs
            .map(d => Object.assign({ id: d.id }, d.data()))
            .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

        if (user && !user.isAnonymous) {
            const pSnap = await withTimeout(
                getDocs(collection(db, 'users', user.uid, 'lessonProgress')), 'your progress');
            pSnap.forEach(d => { PROGRESS[d.id] = d.data(); });
        }

        // ⚠️⚠️ v3.0.0 — EVERY LESSON IS LISTED. NO LOCK, NO GATING.
        // v2.0.0 filtered by hasReached() AND required a speed-gated run, and
        // the two together meant a real student on unit 2 was told nothing was
        // unlocked: units 1-2 are entirely drills, so they had no qualifying run
        // at ALL, and the lessons that did have one were ahead of him.
        // Jake, 2026-09-08: "Perhaps just a dropdown of the lessons? ... If a kid
        // can't test it, then it's not worth anything." He is right, and the
        // gating was never protecting anything — this page saves nothing, teaches
        // nothing and grades nothing, so there is no reason a child may not
        // practise a lesson ahead of the one they are on. hasReached() is gone.
        PLAYABLE = LESSONS.map((lesson, idx) => {
            const runs = playableRunsOf(lesson);
            if (!runs.length) {
                const kp = keyPracticeFor(lesson);
                if (kp) runs.push(kp);
            }
            return { lesson, idx, runs };
        }).filter(p => p.runs.length);

        $('loading').style.display = 'none';
        // ⚠️⚠️ AN EMPTY PLAYABLE LIST NO LONGER CLOSES THE WHOLE PAGE, AND THAT
        // WAS A REAL HOLE THE MOMENT A SECOND KIND OF GAME ARRIVED. Deadline
        // needs a lesson run with a speed target; Shatter and Escape Key need
        // NOTHING — arcadeConfig() falls back to a 15 WPM home-row set for a
        // student who has passed nothing. Returning here hid the two games that
        // require no progress from precisely the students with none, which is
        // backwards: they are the ones who most need a reason to type.
        // ⚠️ A SIGNED-OUT USER STILL STOPS, because bankSecond() has nowhere to
        // put the time and a game whose only product is unbankable is a game
        // that does nothing.
        if (!user) {
            $('err').style.display = 'block';
            $('err').textContent = 'Sign in on the School page first, then come back.';
            return;
        }
        $('pickerBody').style.display = 'block';
        fillGames();
        // ⚠️ AFTER fillGames(), NOT BEFORE. The cabinets and the dropdown are
        // built from the same registry, and a cabinet click sets the select's
        // value — so the options have to exist for that assignment to stick.
        renderCabinets();
        renderMarquee();
        fillLevels();
        fillFreeSpeeds();
        fillLab();
        if (!PLAYABLE.length) {
            // ⚠️ THE ASSESSED GAME IS REMOVED FROM THE PICKER, NOT LEFT TO FAIL
            // ON PLAY. currentRun() would return null and play() would return
            // silently, which reads as a dead button.
            for (const opt of Array.from($('game').options)) {
                if (GAMES[opt.value] && GAMES[opt.value].assessed) opt.remove();
            }
            $('game').value = $('game').options.length ? $('game').options[0].value : '';
            $('err').style.display = 'block';
            $('err').textContent = 'Finish a lesson in School to unlock '
                + titleOf('deadline') + ' \u2014 the games below are open to you now.';
        } else {
            fillLessons();
        }
        applyGameMode();
        // ⚠️ NOT AWAITED. The minutes are decoration on a strip the student has
        // not reached yet; making the lesson picker wait on a week read would
        // trade the thing they came for against a number in a corner.
        // ⚠️⚠️ Round 115 — AND IT PAINTS WHEN IT LANDS. renderMarquee() above
        // runs while MINUTES is still null, and until this line nothing called
        // it again until bankSecond() — so the clocks read as dashes on the
        // floor, which is the one screen they exist for. `finally`, because a
        // failed read must still leave the dashes painted rather than stale.
        loadMinutes(user).finally(renderMarquee);
    } catch (e) {
        $('loading').style.display = 'none';
        $('err').style.display = 'block';
        $('err').textContent = 'Could not load lessons: ' + e.message;
    }
}

$('game').addEventListener('change', applyGameMode);
$('level').addEventListener('change', showFreeGates);
// ⚠️ SCOPE CHANGES WHICH ROWS EXIST, not just what they say, so it re-runs the
// whole mode switch rather than only the blurb.
$('scope').addEventListener('change', applyGameMode);
$('freespeed').addEventListener('change', showFreeGates);
$('lesson').addEventListener('change', fillRuns);
$('run').addEventListener('change', () => { fillSpeeds(); showGates(); });
$('speed').addEventListener('change', showGates);
$('play').addEventListener('click', play);
// ⚠️ pagehide, NOT beforeunload — this file's siblings record that beforeunload
// does not fire reliably on Chromebooks, which is every machine this runs on.
window.addEventListener('pagehide', () => { flushArcadeSeconds(); });
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushArcadeSeconds();
});

$('cab-back').addEventListener('click', showFloor);

// ⚠️⚠️ "PLAY AGAIN" GOES BACK TO THE ARCADE FLOOR, NOT TO THE OPTIONS PANEL.
// Jake, 2026-09-10, on the whole point of the landing page: *"Do your best to
// transition from the other site to the game."* ⭐ THE FLOOR IS WHERE A STUDENT
// DECIDES WHAT TO DO NEXT — dropping them back on a form with a level dropdown
// is where the old page lost them, and after a run is exactly when a child is
// most likely to want a different cabinet.
// ⚠️ NOTHING IS RESET on the way out: their level and word pool survive, so
// pressing the same cabinet again is one more click and not a re-setup.
$('again').addEventListener('click', () => {
    $('result').style.display = 'none';
    showFloor();
});

// ⚠️ WAITS FOR AUTH RATHER THAN READING IMMEDIATELY. Lessons are world-readable
// (firestore.rules: `match /lessons/{lessonId} { allow read: if true }`), but
// lessonProgress is not — firing that read before auth resolves gets a
// permission error for a student who IS signed in.
//
// ⚠️⚠️ BUT AUTH ITSELF CAN HANG, AND THAT WAS THE ACTUAL FOREVER-SPINNER. Found
// by loading this page with the network unreachable: onAuthStateChanged fired
// NEITHER its callback NOR its error handler, so load() was never called and the
// getDocs timeouts below could not help — they guard a read that had not been
// started. A classroom Chromebook that has dropped its wifi lands exactly here.
//
// So: whichever comes first wins, and `started` makes that idempotent. Falling
// through as signed-out is the right degrade — lessons are world-readable, so
// the student still gets a lesson list and a playable game; they lose only the
// "your best typed grade" line, which is a nicety, not the feature.
let started = false;
const begin = user => { if (started) return; started = true; load(user); };
const AUTH_TIMEOUT_MS = 6000;
setTimeout(() => begin(null), AUTH_TIMEOUT_MS);
onAuthStateChanged(auth, user => begin(user), () => begin(null));
</script>
</body>
