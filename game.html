<!DOCTYPE html>
<html lang="en">
<head>
    <!-- game.html v1.1.0 — versioned the same way style.css is: a comment near
         the top, parsed by versions.js. Bump when this file's markup changes.
         v1.1.0: gave the back link id="hud-back-link" so style.css can pin it
         against shrinking without a fragile positional selector — needed for
         the #hud-time long-form ellipsis fix (see style.css v3.5.5). -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeThatBook v3.5.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="adventure.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
    
    <div id="hud">
        <div class="hud-section left">
            <a id="hud-back-link" href="index.html" style="color:#999; text-decoration:none; margin-right:12px; font-size:13px;" title="Back to Library">← Library</a>
            <button id="trophy-btn" class="hidden" style="background:none; border:none; color:#FFD700; font-size:1.1em; cursor:pointer; margin-right:10px; padding:0;" title="Leaderboard">🏆</button>
            <!-- ⚠️ ONE SLOT, ONE MEANING. (v3.9.0) This used to be three elements
                 whose combined meaning changed with the session-length setting:
                 sprint seconds, or day seconds, or sprint seconds again labelled
                 "Active". hud.js builds the whole string now and learn.html has
                 the identical element, so the two pages cannot drift. Do not
                 re-add a second number here. -->
            <span id="hud-time" style="font-family:'Courier Prime',monospace;">Daily 0:00</span>
        </div>
    
        <div class="hud-section center">
            WPM: <span id="wpm-display">0</span> | Acc: <span id="acc-display">100%</span> | <span id="streak-display" class="streak-cold">🔥 0</span>
        </div>
    
        <div class="hud-section right" id="auth-container">
            <span id="hud-week" style="font-family:'Courier Prime',monospace; font-size:13px; color:#aaa; margin-right:12px;"></span>
            <div id="user-info" class="hidden">
                <span id="user-name">Guest</span>
                <button id="logout-btn" class="text-btn">(Logout)</button>
            </div>
            <button id="login-btn" class="action-btn">Sign In</button>
        </div>
    </div>

    <div id="caps-warning" class="hidden">⚠ CAPS LOCK IS ON</div>

    <div id="game-container">
        <canvas id="adventure-canvas" class="hidden"></canvas>
        <div id="chapter-progress-bar">
            <div id="chapter-progress-fill"></div>
            <div id="chapter-progress-marker"></div>
            <div id="chapter-progress-label"></div>
        </div>
        <div id="book-progress-bar">
            <div id="book-progress-track"></div>
            <div id="book-progress-label"></div>
        </div>
        <div id="text-stream">Loading book...</div>
        <div id="image-panel"><img id="story-img" src="" alt="Story illustration"></div>
    </div>

    <div id="book-info-bar"></div>

    <div id="virtual-keyboard"></div>

    <div id="modal" class="hidden">
        <div id="modal-title-bar">
            <span id="modal-title"></span>
        </div>
        <div id="modal-body"></div>
        <div id="modal-footer">
            <button id="action-btn" class="modal-btn">Action</button>
        </div>
    </div>

    <!-- ⚠️ TWO PARTS, ONE ELEMENT. (v1.0.0) #footer-primary is always visible —
         this page's own html/js/css triad, the three files most likely to
         explain what a student is actually seeing. #footer-full is the rest of
         the deployed build, shown on hover (or tap-to-pin on touch); see
         updateVersionBanner() in game.js for why it's fetched lazily rather
         than at load. -->
    <footer id="version-footer" tabindex="0">
        <span id="footer-primary">loading…</span>
        <div id="footer-full" class="build-list"></div>
    </footer>

    <script type="module" src="game.js"></script>
</body>
</html>
