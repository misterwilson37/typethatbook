<!DOCTYPE html>
<html lang="en">
<head>
    <!-- game.html v1.2.0 — versioned the same way style.css is: a comment near
         the top, parsed by versions.js. Bump when this file's markup changes.
         v1.2.0: loads update-gate.js from its OWN script tag, below. It is a
         separate module graph on purpose — a 404 on that file cannot stop the
         typing page from booting, and adding it required no edit to game.js.
         See update-gate.js's header for how to trigger a building-wide reload.
         v1.1.0: gave the back link id="hud-back-link" so style.css can pin it
         against shrinking without a fragile positional selector — needed for
         the #hud-time long-form ellipsis fix (see style.css v3.5.5). -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeThatBook v3.5.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="adventure.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
    
    <div id="hud">
        <div class="hud-section left">
            <a id="hud-back-link" href="index.html" style="color:#999; text-decoration:none; margin-right:12px; font-size:13px;" title="Back to Library">← Library</a>
            <button id="trophy-btn" class="hidden" style="background:none; border:none; color:#FFD700; font-size:1.1em; cursor:pointer; margin-right:10px; padding:0;" title="Leaderboard">🏆</button>
            <!-- ⚠️ TWO ROWS, ONE MEANING EACH. (v1.2.0) #hud-time is the GRADED
                 number and it is the lead row on every surface — learn.html has
                 the identical pair of ids in the identical position so the two
                 pages cannot drift. Do not put a second number in #hud-time and
                 do not move Daily to the sub row; hud.js's return block explains
                 why at length, and tests/hud-lead-test.mjs fails if you do. -->
            <span class="hud-stack">
                <span id="hud-time" class="hud-lead" style="font-family:'Courier Prime',monospace;">Daily 0:00</span>
                <span id="hud-context" class="hud-sub"></span>
            </span>
        </div>

        <div class="hud-section center">
            <!-- The LIVE cluster: everything here resets constantly. The sprint
                 is a live quantity, not a time quantity — see hud.js. -->
            <span class="hud-stack hud-stack-center">
                <span id="hud-sprint" class="hud-lead" style="font-family:'Courier Prime',monospace;"></span>
                <span class="hud-live">WPM: <span id="wpm-display">0</span> | Acc: <span id="acc-display">100%</span> | <span id="streak-display" class="streak-cold">🔥 0</span></span>
            </span>
        </div>

        <div class="hud-section right" id="auth-container">
            <div id="user-info" class="hidden">
                <span class="hud-stack hud-stack-right">
                    <span id="user-name" class="hud-lead">Guest</span>
                    <span id="hud-week" class="hud-sub" style="font-family:'Courier Prime',monospace;"></span>
                </span>
                <!-- ⚠️ A RECEIPT, NOT A SAVE BUTTON. receipt.js's header has the
                     rules. NEVER relabel this "Save": the moment a child
                     believes unpressed means unsaved, the one who packs up at
                     the bell loses minutes and a grade depends on a ritual.
                     ⚠️ tabindex="-1" — ROADMAP item 8's ruling. A focusable control
                     reachable by Tab from a typing view eats keystrokes the
                     child should have been credited for. Mouse only.
                     ⚠️ INSIDE #user-info ON PURPOSE, so it is hidden for guests —
                     there is no week to read and nothing to flush for them.
                     ⚠️ NOT THE ONLY WAY OUT: the back link and (Logout) stay. -->
                <button id="done-btn" type="button" class="done-btn" tabindex="-1"
                        title="Save and see your week">I'm done</button>
                <button id="logout-btn" class="text-btn">(Logout)</button>
            </div>
            <button id="login-btn" class="action-btn">Sign In</button>
        </div>
    </div>

    <div id="caps-warning" class="hidden">⚠ CAPS LOCK IS ON</div>

    <div id="game-container">
        <canvas id="adventure-canvas" class="hidden"></canvas>
        <div id="chapter-progress-bar">
            <div id="chapter-progress-fill"></div>
            <div id="chapter-progress-marker"></div>
            <div id="chapter-progress-label"></div>
        </div>
        <div id="book-progress-bar">
            <div id="book-progress-track"></div>
            <div id="book-progress-label"></div>
        </div>
        <div id="text-stream">Loading book...</div>
        <div id="image-panel"><img id="story-img" src="" alt="Story illustration"></div>
    </div>

    <div id="book-info-bar"></div>

    <div id="virtual-keyboard"></div>

    <div id="modal" class="hidden">
        <div id="modal-title-bar">
            <span id="modal-title"></span>
        </div>
        <div id="modal-body"></div>
        <div id="modal-footer">
            <button id="action-btn" class="modal-btn">Action</button>
        </div>
    </div>

    <!-- ⚠️ TWO PARTS, ONE ELEMENT. (v1.0.0) #footer-primary is always visible —
         this page's own html/js/css triad, the three files most likely to
         explain what a student is actually seeing. #footer-full is the rest of
         the deployed build, shown on hover (or tap-to-pin on touch); see
         updateVersionBanner() in game.js for why it's fetched lazily rather
         than at load. -->
    <footer id="version-footer" tabindex="0">
        <span id="footer-primary">loading…</span>
        <div id="footer-full" class="build-list"></div>
    </footer>

    <script type="module" src="game.js"></script>

    <!-- ⚠️ SEPARATE TAG, NOT AN IMPORT INSIDE game.js. Its own module graph, so
         if this file is missing or fails, the typing page still runs. -->
    <script type="module" src="update-gate.js"></script>
</body>
</html>
