<!DOCTYPE html>
<html lang="en">
<head>
    <!-- learn2.html v0.1.0-staging — A STAGING FORK OF learn.html, NOT THE
         PRODUCTION PAGE. See HANDOFF-learn2.md before touching this or
         learn2.js. Round 102 (name TBD by whichever instance next opens this).

         ⚠️⚠️ WHY A FORK, NOT A FLAG IN learn.js: Deadline's keystrokes never
         touch learn.js's drillPos/learnLastInputTime, so the graded-time gate
         four counting bugs died to make singular (tests/open-unit-test.mjs
         Part E, brace-matched against `../learn.js` by hardcoded filename)
         cannot see them without a second increment site living IN learn.js —
         which is exactly what that harness exists to catch. Forking to a new
         file the harness has never heard of was Jake's call, 2026-09-09, over
         the alternative of touching the harness or the production file.
         ⚠️⚠️ THIS MEANS learn2.js CARRIES ITS OWN FULL COPY OF THE GRADING/TIME
         ENGINE. That is deliberately, temporarily, a Rule 9 exception — same
         role tools/game-lab.html and (until wired) arcade.html already played:
         real and playable, NOT the page every student is on. Deliberately
         ABSENT from versions.js, same as the arcade was while inert. It must
         be reconciled — promoted over learn.html, or folded back in behind a
         flag — before it is the page a whole roster uses. Read HANDOFF-learn2.md
         before doing either.

         Otherwise byte-for-byte learn.html v1.2.0's own markup and header;
         see that file for the pre-existing history this fork inherited. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeThatBook — School (learn2 staging)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════════════
           ⚠️⚠️ THE GAME STEP IS THE ARCADE'S LAYOUT NOW. Round 114 (Carriage).
           ═══════════════════════════════════════════════════════════════════
           Jake, 2026-09-10, on a live lesson: *"the game is a mess due to the
           layout that's there... this is very definitely nigh impossible for
           students."*

           ⭐ HE WAS RIGHT AND IT WAS NOT A DIFFICULTY PROBLEM, IT WAS AN ASPECT
           RATIO. The old rule below was `width: 100%` of an uncapped body, which
           on his screen measured ~2380x521 — a 4.6:1 strip. arcade.html's stage
           is ~816x581, or 1.4:1, because `.wrap` caps at 1320px and two side
           columns take 440px of it. ⚠️ SO WORDS WERE SPREAD ACROSS 2.9x THE
           HORIZONTAL DISTANCE A STUDENT SCANS IN THE ARCADE, in a strip less
           than half as tall — and every one of Deadline's lane positions, dome
           radii and spawn spreads is computed from the play canvas's own `W`.
           The game was tuned against 816px and handed 2380.

           ⚠️ THE OLD COMMENT CLAIMED THIS WAS "close to arcade.html's #stage
           (78vh, 420px floor)" AND IT WAS TRUE ABOUT THE HEIGHT ONLY. Matching
           one dimension of a two-dimensional playfield is not matching it, and
           the height was never the part that mattered.

           ⭐ Jake's ruling, Option C of four: constrained stage PLUS the panels,
           keeping a slim lesson HUD. So this is arcade.html's `.stage-grid`,
           values copied rather than reinvented — see the ⚠️ notes in that file
           for why each number is what it is, especially the 724px play-column
           floor and the `stretch`/`min-height: 0` pair.
           ⚠️ THESE MUST TRACK arcade.html. If the two pages lay Deadline out
           differently then a lesson run and an arcade run are not the same
           difficulty, and the whole "type the same run in School and see whether
           the numbers line up" comparison is void. */

        /* ⚠️ THE ARCADE'S TOKENS, DEFINED LOCALLY. style.css carries NONE of
           these — checked, all six absent — so referencing them bare would have
           silently resolved to nothing and produced unstyled cards. Scoped to
           the game wrap so no lesson chrome inherits them. */
        #game-wrap {
            --panel: #0b1018; --rule: #1d2735;
            --ink: #cfe0ea; --ink-dim: #8aa2b4; --ink-ghost: #5f7387;
            --accent: #bfe9ff; --accent-line: #2b6c8a; --accent-fill: #164055;
            --good: #8fe8c8; --warn: #ffd27d; --bad: #ff8f8f;
            max-width: 1320px; margin: 0 auto; padding: 0 18px 12px;
            font-family: "Courier Prime", ui-monospace, monospace;
        }
        #game-wrap.hidden { display: none; }
        #game-wrap .stage-grid {
            display: grid;
            grid-template-columns: 200px minmax(724px, 1fr) 240px;
            gap: 14px;
            align-items: stretch;
        }
        #game-wrap .side-card {
            background: linear-gradient(180deg, #0d141d 0%, #0a1017 100%);
            border: 1px solid var(--rule);
            border-top: 1px solid rgba(120,170,220,0.28);
            border-radius: 10px; padding: 12px;
            min-height: 0; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: inset 0 1px 0 rgba(143,232,200,0.06);
        }
        #game-wrap .side-card h2 {
            font-size: .68rem; letter-spacing: 1px; color: var(--ink-ghost);
            margin: 0 0 10px; font-weight: 400;
        }
        #game-wrap .panel-canvas { display: block; width: 100%; margin-bottom: 12px; }
        #game-mount { position: relative; width: 100%; height: 78vh; min-height: 420px; }
        #game-mount.hidden { display: none; }
        #game-wrap #radar-canvas { flex: 1 1 auto; min-height: 200px; margin-bottom: 8px; }
        #game-wrap #threat-canvas { flex: 0 0 auto; height: 104px; margin-bottom: 0; }
        /* ⚠️ SAME COLLAPSE RULE AS arcade.html: only Deadline draws a threat
           board, and an unpainted 104px canvas is 104px of dead space. Deadline
           is the ONLY game a lesson ever mounts, so this never fires today —
           it is here so the two pages cannot drift. */
        #game-wrap #radar-col.no-threat #threat-canvas { display: none; }
        #game-wrap #gauge-canvas { flex: 1 1 auto; min-height: 260px; max-height: 420px; }
        #game-wrap #controls-col .panel-canvas { margin-bottom: 4px; }
        #game-wrap #controls-col .gc-bar-card { flex: 1 1 auto; min-height: 0; }
        #game-wrap #controls-col .gc-bar-card .gc-btn { flex: 1 1 auto; max-height: 68px; }
        /* ⚠️ FOLD ORDER IS JAKE'S RULING (arcade.html): the radar stays, the
           controls drop below the frame, and THE PLAY COLUMN NEVER GOES BELOW
           724px at any breakpoint. That is the constraint to test. */
        @media (max-width: 1150px) {
            #game-wrap .stage-grid { grid-template-columns: 200px minmax(724px, 1fr); }
            #game-wrap #controls-col { grid-column: 1 / -1; min-height: 0; }
            #game-wrap #controls-col .gc-bar-card { flex-direction: row; flex-wrap: wrap; }
            #game-wrap #controls-col .gc-bar-card .gc-btn { width: auto; }
        }
        @media (max-width: 820px) {
            #game-wrap .stage-grid { grid-template-columns: minmax(0, 1fr); }
            #game-wrap #radar-col { display: none; }
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-section left">
            <a id="back-btn" href="index.html" style="color:#999; text-decoration:none; margin-right:12px; font-size:13px;">← Home</a>
            <!-- ⚠️ IDENTICAL TO game.html's SLOT, ON PURPOSE. Same ids, same
                 positions, same strings from hud.js. A student moving between
                 School and Library should not have to relearn the top bar.
                 #hud-context carries the lesson name here and the book/chapter
                 in Library — same slot, same role: context for the number above
                 it, never a number of its own. -->
            <span class="hud-stack">
                <span id="hud-time" class="hud-lead" style="font-family:'Courier Prime',monospace;">Daily 0:00</span>
                <span id="hud-context" class="hud-sub"><span id="hud-lesson-label"></span></span>
            </span>
        </div>
        <div class="hud-section center">
            <span class="hud-stack hud-stack-center">
                <!-- School gates on WPM and accuracy, not time, so #hud-sprint
                     stays empty here and the live row centres itself. It exists
                     so the two pages keep identical markup. -->
                <span id="hud-sprint" class="hud-lead" style="font-family:'Courier Prime',monospace;"></span>
                <span class="hud-live">WPM: <span id="wpm-display">—</span> | Acc: <span id="acc-display">—</span></span>
            </span>
        </div>
        <div class="hud-section right" id="auth-container">
            <div id="user-info" class="hidden">
                <span class="hud-stack hud-stack-right">
                    <span id="user-name" class="hud-lead"></span>
                    <span id="hud-week" class="hud-sub" style="font-family:'Courier Prime',monospace;"></span>
                </span>
                <!-- ⚠️ A RECEIPT, NOT A SAVE BUTTON. receipt.js's header has the
                     rules. NEVER relabel this "Save": the moment a child
                     believes unpressed means unsaved, the one who packs up at
                     the bell loses minutes and a grade depends on a ritual.
                     ⚠️ tabindex="-1" — ROADMAP item 8's ruling. A focusable control
                     reachable by Tab from a typing view eats keystrokes the
                     child should have been credited for. Mouse only.
                     ⚠️ INSIDE #user-info ON PURPOSE, so it is hidden for guests —
                     there is no week to read and nothing to flush for them.
                     ⚠️ NOT THE ONLY WAY OUT: the back link and (Logout) stay. -->
                <button id="done-btn" type="button" class="done-btn" tabindex="-1"
                        title="Save and see your week">I'm done</button>
                <button id="logout-btn" class="text-btn">(Logout)</button>
            </div>
            <button id="login-btn" class="action-btn">Sign In</button>
        </div>
    </div>

    <div id="caps-warning" class="hidden">⚠ CAPS LOCK IS ON</div>

    <div id="learn-container">

        <!-- MAP VIEW -->
        <div id="map-view">
            <div id="map-header" style="text-align:center; padding: 8px 0 12px;">
                <div style="font-size:1.2rem; font-weight:bold; color:#eee; font-family:'Courier Prime',monospace;">School</div>
                <div id="map-time-today" style="display:none; font-size:0.8rem; color:#888; margin-top:2px;"></div>
                <div id="map-progress-summary" style="font-size:0.8rem; color:#666; margin-top:2px;"></div>
            </div>
            <button id="map-continue-btn" style="display:none; width:100%; max-width:500px; margin:0 auto 16px; display:block; padding:13px; background:var(--carolina-blue); color:white; border:none; border-radius:6px; font-size:0.95rem; font-weight:bold; font-family:'Courier Prime',monospace; cursor:pointer; letter-spacing:0.5px;">▶ Continue Lessons</button>
            <div id="lesson-map"></div>
            <a id="graduate-link" href="index.html" class="map-graduate-btn hidden">📚 Graduate to the Library →</a>
        </div>

        <!-- DRILL VIEW -->
        <div id="drill-view" class="hidden">

            <!-- Intro panel -->
            <div id="intro-panel">
                <div class="intro-card">
                    <div class="intro-new-keys" id="intro-keys"></div>
                    <div class="intro-title" id="intro-title"></div>
                    <div class="intro-text"  id="intro-text"></div>
                    <div id="intro-keyboard-wrap">
                        <div id="intro-keyboard"></div>
                    </div>
                    <!-- ⚠️ THE RUN PICKER LIVES ON THE INTRO PANEL AND NOWHERE
                         ELSE, AND THAT PLACEMENT IS A RULING, NOT A LAYOUT
                         CHOICE. ROADMAP item 8: a focusable control reachable
                         by Tab from a TYPING view eats keystrokes the child
                         should have been credited for — which is why the font
                         picker went to the map and why #done-btn carries
                         tabindex="-1". The intro panel is not a typing view, so
                         buttons here are free. DO NOT MOVE THIS INTO
                         #active-drill. -->
                    <div id="intro-run-picker"></div>
                    <button class="intro-start-btn" id="intro-start-btn">Start Lesson →</button>
                </div>
            </div>

            <!-- Active drill -->
            <div id="active-drill" class="hidden">
                <div id="step-progress-bar"></div>
                <div id="step-label"></div>
                <div id="anchor-hint" style="display:none; text-align:center; font-size:0.78rem; color:#888; padding:4px 16px; font-family:'Courier Prime',monospace;"></div>
                <div id="space-hint"  style="visibility:hidden; text-align:center; font-size:0.78rem; color:#888; padding:2px 16px; font-family:'Courier Prime',monospace;">👍 Press the space bar with either thumb</div>
                <div id="drill-text-area">
                    <div id="drill-text"></div>
                </div>

                <!-- Keyboard or modal fills the bottom slot -->
                <div id="drill-keyboard-wrap">
                    <div id="virtual-keyboard" tabindex="0"></div>
                </div>
                <div id="drill-modal" class="hidden">
                    <div class="dm-title" id="dm-title"></div>
                    <div class="dm-stars" id="dm-stars"></div>
                    <div class="dm-stats" id="dm-stats"></div>
                    <div class="dm-msg"   id="dm-msg"></div>
                    <div class="dm-remediation" id="dm-remediation"></div>
                    <div class="dm-btns"  id="dm-btns"></div>
                </div>

                <!-- ⚠️ STATIC MARKUP, JS ONLY TOGGLES .hidden — same convention
                     as every other view in this file. learn2.js's beginGameStep()
                     mounts Deadline here for a lesson's final run; beginStep()'s
                     typed path never touches this element.
                     ⚠️⚠️ THE THREE COLUMNS ARE arcade.html's, ID FOR ID, because
                     learn2.js hands them to panelOptionsFor() — THE SAME function
                     arcade.html calls. Rename an id here and the panel goes blank
                     with no error, which is exactly the defect Jake reported on
                     the arcade earlier the same day. See game-names.js.
                     ⚠️ AND THEY ARE THREE SIBLING COLUMNS, NOT ONE WIDE CANVAS
                     WITH AN INSET PLAYFIELD. game-deadline.js computes lane
                     positions and dome radii from the play canvas's own `W`, and
                     the dome radius IS the coverage test that gives the city six
                     lives instead of three. An inset rect puts all of that in
                     play; siblings put none of it in play. -->
                <div id="game-wrap" class="hidden">
                    <div class="stage-grid">
                        <div class="side-card" id="radar-col">
                            <h2>RADAR</h2>
                            <canvas id="radar-canvas" class="panel-canvas"></canvas>
                            <canvas id="threat-canvas" class="panel-canvas"></canvas>
                        </div>
                        <div id="game-mount"></div>
                        <div class="side-card" id="controls-col">
                            <h2>CONSOLE</h2>
                            <canvas id="gauge-canvas" class="panel-canvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>

        </div><!-- /drill-view -->

    </div><!-- /learn-container -->

    <!-- ⚠️ SAME STRUCTURE AS game.html, ON PURPOSE. (v1.0.0) #footer-primary is
         always visible — this page's own html/js/css triad. #footer-full is
         the rest of the deployed build, shown on hover or tap-to-pin. See
         renderVersionFooter() in learn.js. -->
    <footer id="version-footer" tabindex="0">
        <span id="footer-primary">loading…</span>
        <div id="footer-full" class="build-list"></div>
    </footer>

    <script type="module" src="learn2.js"></script>

    <!-- ⚠️ SEPARATE TAG, NOT AN IMPORT INSIDE learn2.js. Its own module graph, so
         if this file is missing or fails, the lesson page still runs. -->
    <script type="module" src="update-gate.js"></script>
</body>
</html>
