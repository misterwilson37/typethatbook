<!doctype html>
<meta charset="utf-8">
<title>Shatter — stained glass preview</title>
<style>
  body { margin:0; background:#04060e; color:#9fb6d8;
         font:14px "Courier Prime", monospace; }
  header { padding:14px 18px; border-bottom:1px solid rgba(70,90,130,.4); }
  h1 { margin:0 0 4px; font-size:16px; color:#cfe6ff; }
  p { margin:0; opacity:.75; }
  canvas { display:block; width:100%; height:70vh; }
  .row { padding:10px 18px; display:flex; gap:18px; flex-wrap:wrap; }
  label { display:flex; gap:6px; align-items:center; }
</style>
<header>
  <h1>Shatter — stained glass preview</h1>
  <p>Real <code>game-sprites.js</code>, no game loop. Drag the slider to type.
     This file is a viewer; it ships nothing.</p>
</header>
<div class="row">
  <label>typed <input id="typed" type="range" min="0" max="1" step="0.02" value="0.45"></label>
  <label>tumble <input id="tumble" type="checkbox" checked></label>
  <label>seed <input id="seed" type="range" min="1" max="60" step="1" value="7"></label>
</div>
<canvas id="c"></canvas>
<script type="module">
import { paneCut, drawPane, drawPrism } from './game-sprites.js';
import { fingerColorOf, fingerPalette } from './game-draw.js';

const WORDS = ['unusually', 'sunlight', 'carefully', 'remarking', 'un', 'usual', 'ly'];
const FAN = fingerPalette();
const c = document.getElementById('c'), x = c.getContext('2d');
let cuts = [];

function seeded(n){let s=n>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

function build() {
  const r = seeded(+document.getElementById('seed').value);
  cuts = WORDS.map(w => paneCut(r, w.length));
}
function frame(t) {
  const dpr = devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w*dpr; c.height = h*dpr;
  x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle = '#04060e'; x.fillRect(0,0,w,h);
  const g = x.createRadialGradient(w/2,h/2,20,w/2,h/2,Math.min(w,h)*0.6);
  g.addColorStop(0,'rgba(96,132,205,0.20)'); g.addColorStop(1,'rgba(4,6,14,0)');
  x.fillStyle = g; x.fillRect(0,0,w,h);

  const frac = +document.getElementById('typed').value;
  const tum = document.getElementById('tumble').checked;
  const size = 18;
  WORDS.forEach((word,i) => {
    const cols = Math.min(4, WORDS.length);
    const cw = w/cols, ch = h/Math.ceil(WORDS.length/cols);
    const px = cw*(i%cols)+cw/2, py = ch*Math.floor(i/cols)+ch/2;
    const rr = Math.max(size*1.35, word.length*size*0.40);
    drawPane(x, px, py, rr, cuts[i], {
      text: word, typed: Math.round(frac*word.length), total: word.length,
      size, colors: Array.from(word, ch2 => fingerColorOf(ch2,'#9fb6d8')),
      rim: i===1 ? '#ffd700' : (i===3 ? '#ff5566' : fingerColorOf(word[0],'#cfe6ff')),
      glow: i===3 ? '#ff5566' : (i===1 ? '#ffd700' : null),
      lineWidth: i===1 ? 2.6 : 1.8, locked: i===1,
      crack: i===3 ? 0.8 : 0, piece: i>3,
      base: i>3 ? 'rgba(16,11,28,0.82)' : 'rgba(6,10,20,0.86)',
      tSec: t/1000, tumble: tum,
    });
  });
  drawPrism(x, w/2, h-46, 22, -Math.PI/2, { fan: FAN, flare: 0 });
  requestAnimationFrame(frame);
}
for (const id of ['seed']) document.getElementById(id).addEventListener('input', build);
build(); requestAnimationFrame(frame);
</script>
