<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeThatBook Reports</title>  <!-- version appended at runtime from REPORTS_VERSION -->
    <style>
        body { background: #111; color: #eee; font-family: 'Courier New', monospace; padding: 20px; margin: 0; }
        .container { max-width: 960px; margin: 0 auto; padding-bottom: 40px; }

        a { color: #888; text-decoration: none; border-bottom: 1px dotted #888; }
        a:hover { color: #fff; }

        .status-bar { padding: 15px; margin-bottom: 20px; background: #222; border-left: 4px solid #555; font-size: 0.9rem; }

        .hidden { display: none !important; }

        /* --- DATE CONTROLS --- */
        .controls {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label {
            color: #888; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .control-group input[type="date"] {
            background: #222; border: 1px solid #444; color: #fff;
            padding: 10px 12px; font-family: inherit; font-size: 0.9rem;
        }
        .control-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
        }

        button {
            padding: 10px 20px; background: #0047AB; color: white;
            border: none; font-family: inherit; font-weight: bold;
            text-transform: uppercase; font-size: 0.8rem;
            cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #4B9CD3; }
        button:disabled { background: #555; cursor: not-allowed; }

        button.secondary { background: #333; border: 1px solid #555; }
        button.secondary:hover { background: #555; }

        .quick-btns { display: flex; gap: 8px; align-items: flex-end; }
        .quick-btn {
            padding: 10px 14px; background: #222; border: 1px solid #444;
            color: #aaa; font-size: 0.75rem;
        }
        .quick-btn:hover { background: #333; color: #fff; border-color: #4B9CD3; }

        /* --- TABLE --- */
        .results-info {
            color: #666; font-size: 0.8rem; margin-bottom: 10px;
        }

        table {
            width: 100%; border-collapse: collapse;
            background: #1a1a1a; margin-bottom: 20px;
        }
        th {
            background: #222; color: #4B9CD3;
            padding: 12px 15px; text-align: left;
            font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 1px; border-bottom: 2px solid #333;
            cursor: pointer; user-select: none;
        }
        th:hover { color: #fff; }
        th .sort-arrow { font-size: 0.6rem; margin-left: 4px; opacity: 0.5; }
        th.sorted .sort-arrow { opacity: 1; }

        td {
            padding: 10px 15px; border-bottom: 1px solid #222;
            font-size: 0.85rem;
        }
        tr:hover td { background: #222; }

        .time-cell { font-weight: bold; color: #4B9CD3; }
        .wpm-cell { color: #aaa; }

        .empty-msg {
            text-align: center; color: #555; padding: 40px;
            font-size: 0.9rem;
        }

        /* --- EXPORT --- */
        .export-bar {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .total-line { color: #888; font-size: 0.85rem; }
        .total-line strong { color: #4B9CD3; }

        /* --- LOGIN --- */
        #login-section { text-align: center; padding: 60px 0; }
        #login-section p { color: #888; margin-bottom: 15px; }

        footer {
            position: fixed; bottom: 5px; right: 10px;
            font-size: 0.7em; color: #666;
            background: rgba(255,255,255,0.8);
            padding: 2px 5px; border-radius: 3px; z-index: 101;
        }

        /* --- GOALS PANEL --- */
        .goals-panel {
            background: #1a1a1a; border: 1px solid #333;
            padding: 20px; margin-bottom: 20px;
        }
        .goals-row {
            display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;
        }
        .goal-card {
            background: #222; border: 1px solid #333; border-radius: 6px;
            padding: 15px 20px; flex: 1; min-width: 180px;
        }
        .goal-card label {
            color: #888; font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 1px; display: block; margin-bottom: 8px;
        }
        .goal-icon { font-size: 1.5rem; margin-bottom: 6px; }
        .goal-input-row { display: flex; align-items: center; gap: 8px; }
        .goal-input-row input[type="number"] {
            background: #111; border: 1px solid #444; color: #fff;
            padding: 8px 10px; font-family: inherit; font-size: 1.1rem;
            width: 80px; text-align: center; border-radius: 4px;
        }
        .goal-input-row input:focus { border-color: #4B9CD3; outline: none; }
        .goal-unit { color: #666; font-size: 0.8rem; }
        .goal-hint { color: #555; font-size: 0.65rem; margin-top: 6px; font-style: italic; }
        .goal-status {
            margin-top: 10px; font-size: 0.8rem; min-height: 1.2em;
        }
        .goal-status.ok { color: #22c55e; }
        .goal-status.err { color: #ff3333; }

        /* --- EDIT UI --- */
        .details-row-btn {
            background: transparent; border: 1px solid #555; color: #aaa;
            padding: 3px 10px; font-size: 0.7rem; cursor: pointer;
            font-family: inherit; border-radius: 3px;
        }
        .details-row-btn:hover { border-color: #4B9CD3; color: #4B9CD3; }
        .detail-row td { padding: 0 !important; background: #111; }
        .detail-row.hidden { display: none; }
        .daily-logs { padding: 10px 15px; }
        .daily-log-entry {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 0; border-bottom: 1px solid #222;
            font-size: 0.8rem;
        }
        .daily-log-entry:last-child { border-bottom: none; }
        .log-date { color: #888; width: 90px; flex-shrink: 0; }
        .log-seconds-input {
            background: #1a1a1a; border: 1px solid #444; color: #fff;
            padding: 4px 6px; width: 60px; text-align: center;
            font-family: inherit; font-size: 0.8rem; border-radius: 3px;
        }
        .log-seconds-input:focus { border-color: #4B9CD3; outline: none; }
        .log-chars { color: #666; font-size: 0.75rem; }
        .save-log-btn {
            background: #333; border: 1px solid #555; color: #aaa;
            padding: 3px 10px; font-size: 0.7rem; cursor: pointer;
            font-family: inherit; border-radius: 3px;
        }
        .save-log-btn:hover { border-color: #22c55e; color: #22c55e; }
        .recalc-btn {
            background: transparent; border: 1px solid #555; color: #aaa;
            padding: 3px 8px; font-size: 0.8rem; cursor: pointer;
            font-family: inherit; border-radius: 3px; line-height: 1;
        }
        .recalc-btn:hover { border-color: #4B9CD3; color: #4B9CD3; }
        .recalc-btn:disabled { opacity: 0.4; cursor: default; }
        .delete-session-btn {
            background: transparent; border: 1px solid transparent; color: #666;
            padding: 2px 6px; font-size: 0.75rem; cursor: pointer;
            font-family: inherit; border-radius: 3px; margin-left: auto;
        }
        .delete-session-btn:hover { border-color: #ff3333; color: #ff3333; }
        .log-save-status { font-size: 0.75rem; min-width: 60px; }
        .expand-sessions { cursor: pointer; user-select: none; }
        .expand-sessions:hover { color: #4B9CD3; }
        .sessions-container { padding: 4px 0 8px 20px; }
        .sessions-container.hidden { display: none; }
        .session-entry {
            display: flex; align-items: center; gap: 12px;
            padding: 4px 8px; font-size: 0.75rem; color: #aaa;
            border-left: 2px solid #333;
        }
        .session-entry.suspicious { border-left-color: #ff6b6b; background: rgba(255,50,50,0.05); }
        .session-time { color: #888; width: 70px; flex-shrink: 0; }
        .session-stat { width: 65px; text-align: right; }
        .session-book { color: #555; font-style: italic; font-size: 0.7rem; }
        .flag-icon { font-size: 0.85rem; }
    .uid-chip { font-family: monospace; font-size: 0.68rem; opacity: 0.55; margin-left: 8px;
                cursor: pointer; border: 1px solid #444; padding: 0 4px; border-radius: 3px; }
    .uid-chip:hover { opacity: 1; }
    .sprint-list { margin: 2px 0 8px 26px; border-left: 2px solid #333; padding-left: 8px; }
    .sprint-row { display: flex; gap: 10px; align-items: center; font-size: 0.72rem;
                  color: #aaa; padding: 1px 0; }
    .sprint-row.suspicious { color: #ffb300; }
    .sprint-idx { opacity: 0.5; min-width: 18px; }
    .session-src { font-size: 0.7rem; opacity: 0.7; border: 1px solid #444; padding: 0 4px; }
    #audit-weeks-btn { margin-left: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px;">
        <h1>REPORTS</h1>
        <div style="display:flex; gap:20px;">
            <a href="admin.html">Admin Panel</a>
            <a href="index.html">Library</a>
        </div>
    </div>

    <div class="status-bar" id="status">Initializing...</div>

    <div id="login-section" class="hidden">
        <p>Admin login required to view reports.</p>
        <button id="login-btn">Log In with Google</button>
    </div>

    <div id="reports-section" class="hidden">
        <!-- GOALS MANAGEMENT -->
        <div class="goals-panel">
            <h2 style="font-size:1rem; color:#4B9CD3; margin-bottom:15px; letter-spacing:1px;">STUDENT GOALS</h2>
            <div class="goals-row">
                <div class="goal-card">
                    <div class="goal-icon">🎉</div>
                    <label>Daily Goal</label>
                    <div class="goal-input-row">
                        <input type="number" id="daily-goal" min="0" max="120" step="1" value="0" />
                        <span class="goal-unit">minutes</span>
                    </div>
                    <div class="goal-hint">Confetti when reached</div>
                </div>
                <div class="goal-card">
                    <div class="goal-icon">🎆</div>
                    <label>Weekly Goal (Sat–Fri)</label>
                    <div class="goal-input-row">
                        <input type="number" id="weekly-goal" min="0" max="600" step="5" value="0" />
                        <span class="goal-unit">minutes</span>
                    </div>
                    <div class="goal-hint">Fireworks when reached</div>
                </div>
                <button id="save-goals-btn">Save Goals</button>
            </div>
            <div class="goal-status" id="goal-status"></div>
        </div>

        <!-- SCOPE -->
        <div class="controls" id="scope-controls">
            <div class="control-group">
                <label>School</label>
                <select id="scope-school"></select>
            </div>
            <div class="control-group">
                <label>Class</label>
                <select id="scope-class"></select>
            </div>
            <div class="control-group" style="align-self:flex-end">
                <span id="scope-note" style="font-size:.8em;opacity:.7"></span>
            </div>
        </div>

        <!-- REPORTS -->
        <div class="controls">
            <div class="control-group">
                <label>Start Date</label>
                <input type="date" id="date-start">
            </div>
            <div class="control-group">
                <label>End Date</label>
                <input type="date" id="date-end">
            </div>
            <button id="generate-btn">Generate</button>
            <button id="audit-weeks-btn" title="Compare each student's stored week counter against the sum of their daily logs">Audit Week Counters</button>
            <div class="quick-btns">
                <button class="quick-btn" data-range="today">Today</button>
                <button class="quick-btn" data-range="this-week">This Week</button>
                <button class="quick-btn" data-range="last-week">Last Week</button>
            </div>
        </div>

        <div id="audit-panel" class="hidden" style="border:1px solid #555; padding:12px; margin-bottom:14px;"></div>

        <div id="results-container" class="hidden">
            <div class="export-bar">
                <div class="total-line" id="total-line"></div>
                <button class="secondary" id="export-btn">Export CSV</button>
            </div>
            <div class="results-info" id="results-info"></div>
            <table>
                <thead>
                    <tr>
                        <th data-col="name">Name <span class="sort-arrow">▲</span></th>
                        <th data-col="email">Email <span class="sort-arrow">▲</span></th>
                        <th data-col="seconds">Total Time <span class="sort-arrow">▲</span></th>
                        <th data-col="chars">Characters <span class="sort-arrow">▲</span></th>
                        <th data-col="wpm">Avg WPM <span class="sort-arrow">▲</span></th>
                        <th data-col="accuracy">Accuracy <span class="sort-arrow">▲</span></th>
                        <th data-col="days">Days Active <span class="sort-arrow">▲</span></th>
                        <th style="width:50px;"></th>
                    </tr>
                </thead>
                <tbody id="report-body"></tbody>
            </table>
        </div>

        <div id="empty-msg" class="empty-msg hidden">
            No typing data found for this date range.
        </div>
    </div>
</div>

<footer id="footer-version">Reports</footer>

<script type="module">
    import { db, auth } from "./firebase-config.js";

    // ─── Version ──────────────────────────────────────────────────────────────
    // v2.9.0 — This page carried its version hardcoded in TWO places, the
    // <title> and the <footer>, and was the last surface still doing so. That
    // is the exact arrangement index.html was in when its title said 3.0.0 and
    // its own footer said 2.3.1 — two copies of one number, updated by hand,
    // which is a discipline problem until it becomes a lie. Both are now
    // written from this constant, which is also what versions.js reads for the
    // build panel in index.html.
    const REPORTS_VERSION = "2.10.0";

    document.title = `TypeThatBook Reports v${REPORTS_VERSION}`;
    const _rfv = document.getElementById('footer-version');
    if (_rfv) _rfv.textContent = `Reports v${REPORTS_VERSION}`;

    import { collection, getDocs, query, where, doc, getDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // v2.5.0 — Multi-school support.
    //
    // Access now comes from Auth CUSTOM CLAIMS (role + schoolIds), set by the
    // setStaffRole Cloud Function and enforced by firestore.rules. The hardcoded
    // ADMIN_EMAILS list below is kept ONLY as a bootstrap fallback so nobody is
    // locked out before claims are assigned. Delete it once staff records exist.
    const BOOTSTRAP_EMAILS = [
        "jacob.wilson@sumnerk12.net",
        "jacob.v.wilson@gmail.com",
    ];

    const statusEl = document.getElementById('status');
    let reportData = [];
    let sortCol = 'seconds';
    let sortAsc = false;

    // Who's looking, and what are they allowed to see?
    let me = { uid: null, email: '', role: null, schoolIds: [], classIds: [], readScope: 'own_classes' };
    let schoolsById = {};     // schoolId -> { name }
    let classesById = {};     // classId  -> { name, schoolId }

    const isSuper = () => me.role === 'super_admin';

    // --- AUTH ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            // v2.6.0: the role comes from staff/{uid}, NOT Auth custom claims.
            // Claims need the Admin SDK → a Cloud Functions deploy → a command
            // line. A document read needs none of that, and a role change takes
            // effect immediately rather than on the next sign-in.
            me.uid = user.uid;
            me.email = user.email || '';

            // Claim a role pre-authorised by email, in case they came straight here
            // rather than via admin.html. Deliberately NOT done in game.js/learn.js:
            // that would add a read per student per session for something only staff
            // ever need.
            try {
                const lower = me.email.toLowerCase();
                if (lower) {
                    const pendSnap = await getDoc(doc(db, 'pendingStaffRoles', lower));
                    if (pendSnap.exists()) {
                        const p = pendSnap.data();
                        await setDoc(doc(db, 'staff', user.uid), {
                            email: lower, displayName: user.displayName || '',
                            role: p.role, schoolIds: p.schoolIds,
                            readScope: p.readScope, active: true,
                        }, { merge: true });
                        await deleteDoc(doc(db, 'pendingStaffRoles', lower));
                    }
                }
            } catch (e) { console.warn('Could not claim a pre-authorised role:', e); }

            try {
                const staffSnap = await getDoc(doc(db, 'staff', user.uid));
                if (staffSnap.exists() && staffSnap.data().active !== false) {
                    const sd = staffSnap.data();
                    me.role = sd.role || null;
                    me.schoolIds = Array.isArray(sd.schoolIds) ? sd.schoolIds : [];
                    me.readScope = sd.readScope || 'own_classes';
                }
            } catch (e) { console.warn('Could not read staff record:', e); }

            // Bootstrap: before any staff document exists.
            if (!me.role && BOOTSTRAP_EMAILS.includes(me.email)) {
                me.role = 'super_admin';
                me.readScope = 'building';
                statusEl.innerText = "Logged in as: " + me.email +
                    " — BOOTSTRAP MODE (no staff document yet; see SETUP-NO-CLI.md)";
                statusEl.style.borderColor = "#ffaa00";
            }

            if (!me.role) {
                statusEl.innerText = "Access Denied — this account has no staff role. " +
                    "Open the admin page to request access.";
                statusEl.style.borderColor = "#ff3333";
                document.getElementById('login-section').classList.remove('hidden');
                return;
            }

            // Which classes do they teach? Read from the classes themselves, so
            // there's no per-teacher list to keep in sync anywhere.
            try {
                const clsSnap = await getDocs(query(collection(db, 'classes'),
                    where('teacherUids', 'array-contains', user.uid)));
                me.classIds = clsSnap.docs.map(d => d.id);
            } catch (e) { console.warn('Could not read own classes:', e); }

            if (statusEl.style.borderColor !== "rgb(255, 170, 0)") {
                statusEl.innerText = `Logged in as: ${me.email} (${me.role})`;
                statusEl.style.borderColor = "#00ff41";
            }
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('reports-section').classList.remove('hidden');
            setDefaultDates();
            await loadScopeOptions();
            await loadGoals();
        } else {
            statusEl.innerText = "Not logged in.";
            statusEl.style.borderColor = "#ff3333";
            document.getElementById('login-section').classList.remove('hidden');
        }
    });

    document.getElementById('login-btn').onclick = async () => {
        try { await signInWithPopup(auth, new GoogleAuthProvider()); }
        catch (e) { alert(e.message); }
    };

    // --- SCOPE ---
    // Populate the school and class pickers from what this staff member is
    // allowed to see. A super_admin gets every school plus "All schools"; a
    // teacher gets only their own building(s), enforced again by firestore.rules.
    async function loadScopeOptions() {
        const schoolSel = document.getElementById('scope-school');
        const classSel  = document.getElementById('scope-class');
        try {
            const schoolSnap = await getDocs(collection(db, 'schools'));
            schoolSnap.forEach(d => { schoolsById[d.id] = d.data(); });

            const seesBuilding = isSuper() || me.role === 'building_admin' ||
                                 me.readScope === 'building';
            const visible = isSuper()
                ? Object.keys(schoolsById)
                : Object.keys(schoolsById).filter(id => me.schoolIds.includes(id));

            schoolSel.innerHTML = '';
            if (isSuper()) {
                schoolSel.innerHTML += '<option value="__all__">All schools</option>';
            }
            visible.forEach(id => {
                schoolSel.innerHTML += `<option value="${id}">${escapeHtml(schoolsById[id].name || id)}</option>`;
            });
            if (!visible.length && !isSuper()) {
                schoolSel.innerHTML = '<option value="">— no school assigned —</option>';
            }
            // Default a teacher to their first building rather than "all".
            if (!isSuper() && visible.length) schoolSel.value = visible[0];

            await loadClassOptions();
            schoolSel.addEventListener('change', loadClassOptions);
        } catch (e) {
            console.warn('Scope load failed:', e);
            document.getElementById('scope-note').textContent = 'Could not load schools.';
        }
    }

    async function loadClassOptions() {
        const schoolId = document.getElementById('scope-school').value;
        const classSel = document.getElementById('scope-class');
        classSel.innerHTML = '';
        try {
            const snap = await getDocs(collection(db, 'classes'));
            classesById = {};
            snap.forEach(d => { classesById[d.id] = d.data(); });

            // Classes in the selected building that this person may see.
            let ids = Object.keys(classesById).filter(id => {
                const c = classesById[id];
                if (schoolId !== '__all__' && (c.schoolId || '') !== schoolId) return false;
                if (isSuper()) return true;
                return me.schoolIds.includes(c.schoolId || '');
            });

            // Jake's requirement: default to MY classes, but able to widen.
            const mine = ids.filter(id => me.classIds.includes(id));
            if (mine.length) classSel.innerHTML += '<option value="__mine__">My classes</option>';
            // Only offer the building-wide option to people the rules will
            // actually allow it for — otherwise the query just errors.
            const seesBuilding = isSuper() || me.role === 'building_admin' ||
                                 me.readScope === 'building';
            if (seesBuilding) {
                classSel.innerHTML += '<option value="__all__">All classes in this school</option>';
            }
            if (!seesBuilding) ids = ids.filter(id => me.classIds.includes(id));
            ids.sort((a, b) => (classesById[a].period || 0) - (classesById[b].period || 0));
            ids.forEach(id => {
                const label = classesById[id].name || id;
                const tag = me.classIds.includes(id) ? ' ★' : '';
                classSel.innerHTML += `<option value="${id}">${escapeHtml(label)}${tag}</option>`;
            });
            classSel.value = mine.length ? '__mine__'
                           : (seesBuilding ? '__all__' : (ids[0] || ''));
            document.getElementById('scope-note').textContent =
                mine.length ? '★ = your class' : '';
        } catch (e) {
            console.warn('Class load failed:', e);
            classSel.innerHTML = '<option value="__all__">All classes</option>';
        }
    }

    // Build the tightest query the selected scope allows. This is the read-cost
    // fix as much as the permissions one: the old version queried typing_logs by
    // date range with no other filter, which at full enrollment is ~47,000
    // documents per report view.
    //
    // Needs two composite indexes on typing_logs:
    //   classId  ASC + date ASC
    //   schoolId ASC + date ASC
    // Firestore logs a one-click create link the first time each runs.
    function buildScopedQuery(logsRef, startDate, endDate) {
        const schoolId = document.getElementById('scope-school').value;
        const classId  = document.getElementById('scope-class').value;
        const dateRange = [where("date", ">=", startDate), where("date", "<=", endDate)];

        // A single named class is the cheapest possible query — one class-worth
        // of documents instead of a whole building's.
        if (classId && classId !== '__all__' && classId !== '__mine__') {
            return { queries: [query(logsRef, where("classId", "==", classId), ...dateRange)],
                     clientFilter: null,
                     label: `class “${classesById[classId]?.name || classId}”` };
        }

        // ⚠️ "My classes" USED TO BE BROKEN FOR THE DEFAULT TEACHER, and the
        // reason is worth understanding before anyone "simplifies" this back.
        //
        // It used to query the whole BUILDING on schoolId and narrow on the
        // client. That is fine for cost and completely wrong for security rules.
        // canReadActivity() in firestore.rules short-circuits to
        // teachesClass(d.classId) for anyone whose readScope isn't 'building' —
        // and rules are evaluated against every document the query returns, not
        // against the subset the client intends to keep. So a teacher with the
        // DEFAULT readScope of 'own_classes' got permission-denied on the one
        // scope option the UI defaults them to. Separately it would have blown
        // Firestore's ceiling of 20 get()/exists() calls per query.
        //
        // Rules are not filters. If the client intends to read only its own
        // classes, the QUERY has to say so. One equality query per class is a
        // handful of round-trips, hits the existing classId+date index, reads
        // strictly fewer documents than the building-wide version did, and every
        // document it returns is one the rules already agree the caller may see.
        //
        // Returns an ARRAY of queries; generateReport() unions the results and
        // de-duplicates by document id.
        if (classId === '__mine__') {
            const mine = (me.classIds || []).slice(0, 30);
            if (!mine.length) {
                return { queries: [], clientFilter: null,
                         label: 'your classes (none assigned)' };
            }
            return {
                queries: mine.map(cid =>
                    query(logsRef, where("classId", "==", cid), ...dateRange)),
                clientFilter: null,
                label: `your classes (${mine.length})`
            };
        }

        // Whole building.
        if (schoolId && schoolId !== '__all__') {
            return { queries: [query(logsRef, where("schoolId", "==", schoolId), ...dateRange)],
                     clientFilter: null,
                     label: `${schoolsById[schoolId]?.name || schoolId} (all classes)` };
        }

        // Every school. super_admin only, and the expensive one — this is the
        // query the whole scoping effort exists to avoid running by accident.
        return { queries: [query(logsRef, ...dateRange)], clientFilter: null, label: 'ALL SCHOOLS' };
    }

    // --- DATE HELPERS ---
    function getLastSaturday(from = new Date()) {
        const d = new Date(from);
        const day = d.getDay(); // 0=Sun
        const diff = (day + 1) % 7; // days since Saturday
        d.setDate(d.getDate() - diff);
        return d;
    }

    function getNextFriday(from = new Date()) {
        const sat = getLastSaturday(from);
        const fri = new Date(sat);
        fri.setDate(fri.getDate() + 6);
        return fri;
    }

    function toDateStr(d) {
        return d.toISOString().split('T')[0];
    }

    function setDefaultDates() {
        const sat = getLastSaturday();
        const fri = getNextFriday();
        document.getElementById('date-start').value = toDateStr(sat);
        document.getElementById('date-end').value = toDateStr(fri);
    }

    // --- QUICK DATE BUTTONS ---
    document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.onclick = () => {
            const range = btn.dataset.range;
            const today = new Date();
            if (range === 'today') {
                document.getElementById('date-start').value = toDateStr(today);
                document.getElementById('date-end').value = toDateStr(today);
            } else if (range === 'this-week') {
                document.getElementById('date-start').value = toDateStr(getLastSaturday());
                document.getElementById('date-end').value = toDateStr(getNextFriday());
            } else if (range === 'last-week') {
                const lastSat = getLastSaturday();
                lastSat.setDate(lastSat.getDate() - 7);
                const lastFri = new Date(lastSat);
                lastFri.setDate(lastFri.getDate() + 6);
                document.getElementById('date-start').value = toDateStr(lastSat);
                document.getElementById('date-end').value = toDateStr(lastFri);
            }
            generateReport();
        };
    });

    // --- GENERATE ---
    document.getElementById('generate-btn').onclick = generateReport;

    async function generateReport() {
        const startDate = document.getElementById('date-start').value;
        const endDate = document.getElementById('date-end').value;
        if (!startDate || !endDate) return alert("Pick both dates.");

        statusEl.innerText = "Querying...";
        document.getElementById('results-container').classList.add('hidden');
        document.getElementById('empty-msg').classList.add('hidden');

        try {
            const logsRef = collection(db, "typing_logs");
            const scoped = buildScopedQuery(logsRef, startDate, endDate);
            statusEl.innerText = `Querying ${scoped.label}...`;

            if (!scoped.queries.length) {
                statusEl.innerText = "No classes assigned to you yet — ask your " +
                    "building admin to add you to a class, or pick a different scope.";
                statusEl.style.borderColor = "#ffaa00";
                return;
            }

            // ⚠️ READ CEILING. Every query on this page used to be unbounded. A
            // building admin asking for a whole semester is roughly
            // 1,400 students x 90 days = ~126,000 document reads ON ONE CLICK —
            // two and a half times the entire daily free tier, out of Jake's
            // pocket, for a table no human can read anyway. And the browser
            // would sit frozen while it happened.
            //
            // The cap is deliberately a REFUSAL, not a truncation. A silently
            // truncated report is worse than no report: a teacher grades from
            // it and never learns it was incomplete. So we stop, say what
            // happened, and tell them how to narrow it.
            const MAX_REPORT_DOCS = 20000;

            let docs = [];
            const seen = new Set();
            try {
                // Sequential, not Promise.all: if the ceiling is going to be hit
                // we want to stop issuing reads, not fire them all and then
                // discover the total. Costing less on the failure path matters
                // more here than shaving a second off the success path.
                for (const q of scoped.queries) {
                    const snap = await getDocs(q);
                    snap.forEach(d => {
                        // De-duplicate: the "my classes" path issues one query
                        // per class, and while a typing_logs doc belongs to
                        // exactly one class today, a student reassigned
                        // mid-range could legitimately appear under two.
                        if (seen.has(d.id)) return;
                        seen.add(d.id);
                        docs.push(d);
                    });
                    if (docs.length > MAX_REPORT_DOCS) break;
                }
            } catch (e) {
                // Almost always a missing composite index while it builds.
                statusEl.innerText = "Query failed — see console. If this mentions " +
                    "an index, click the link it logs and try again once it's built.";
                statusEl.style.borderColor = "#ff3333";
                console.error("Scoped report query failed:", e);
                return;
            }

            if (docs.length > MAX_REPORT_DOCS) {
                statusEl.innerText =
                    `Too much data — ${scoped.label} over ${startDate} to ${endDate} ` +
                    `is more than ${MAX_REPORT_DOCS.toLocaleString()} daily records. ` +
                    `Narrow the date range or pick a single class. ` +
                    `(Stopping here on purpose: a partial report you can't tell is ` +
                    `partial is worse than none.)`;
                statusEl.style.borderColor = "#ffaa00";
                return;
            }

            // Aggregate by user
            const userMap = {};
            let skipped = 0;
            docs.forEach(d => {
                const data = d.data();
                if (scoped.clientFilter && !scoped.clientFilter(data)) { skipped++; return; }
                const uid = data.uid;
                if (!userMap[uid]) {
                    userMap[uid] = {
                        uid: uid,
                        name: data.displayName || "Unknown",
                        email: data.email || "",
                        seconds: 0,
                        chars: 0,
                        mistakes: 0,
                        days: new Set(),
                        dailyLogs: []
                    };
                }
                userMap[uid].seconds += (data.seconds || 0);
                userMap[uid].chars += (data.chars || 0);
                userMap[uid].mistakes += (data.mistakes || 0);
                userMap[uid].days.add(data.date);
                userMap[uid].dailyLogs.push({
                    docId: d.id,
                    date: data.date,
                    seconds: data.seconds || 0,
                    chars: data.chars || 0,
                    mistakes: data.mistakes || 0
                });
                if (data.displayName) userMap[uid].name = data.displayName;
                if (data.email) userMap[uid].email = data.email;
            });

            reportData = Object.values(userMap).map(u => ({
                uid: u.uid,
                name: u.name,
                email: u.email,
                seconds: u.seconds,
                chars: u.chars,
                mistakes: u.mistakes,
                days: u.days.size,
                dailyLogs: u.dailyLogs.sort((a, b) => a.date.localeCompare(b.date)),
                wpm: u.seconds > 0 ? Math.round((u.chars / 5) / (u.seconds / 60)) : 0,
                accuracy: (u.chars + u.mistakes) > 0 ? Math.round((u.chars / (u.chars + u.mistakes)) * 100) : 100
            }));

            if (reportData.length === 0) {
                document.getElementById('empty-msg').classList.remove('hidden');
                statusEl.innerText = "No data found.";
                return;
            }

            sortCol = 'seconds';
            sortAsc = false;
            renderTable();
            
            const totalSecs = reportData.reduce((s, r) => s + r.seconds, 0);
            document.getElementById('total-line').innerHTML = 
                `<strong>${reportData.length}</strong> students — <strong>${formatTime(totalSecs)}</strong> total typing time`;
            document.getElementById('results-info').textContent =
                `${scoped.label} · ${startDate} through ${endDate} — ` +
                `${docs.length - skipped} daily log entries` +
                (skipped ? ` (${docs.length} read, ${skipped} outside your classes)` : '') +
                ` \u00b7 ${scoped.queries.length} quer${scoped.queries.length === 1 ? 'y' : 'ies'}`;

            document.getElementById('results-container').classList.remove('hidden');
            statusEl.innerText = `Found ${reportData.length} students.`;
            statusEl.style.borderColor = "#00ff41";

        } catch (e) {
            console.error(e);
            statusEl.innerText = "Error: " + e.message;
            statusEl.style.borderColor = "#ff3333";
        }
    }


    // ═════════════════════════════════════════════════════════════════════════
    // WEEK-COUNTER AUDIT  (v2.10.0)
    // ═════════════════════════════════════════════════════════════════════════
    //
    // ⚠️ WHAT THIS FINDS, AND WHY IT CAN BE TRUSTED TO FIND IT.
    //
    // learn.js <= v2.5.3 and game.js <= v3.21.1 merged a student's stored totals
    // into their live ones ADDITIVELY on sign-in. For a genuine guest that was
    // right. For a student whose 24-hour auth session expired mid-period and who
    // signed back in, it added the server's copy to counters that had been seeded
    // FROM the server at page load, and the week doubled.
    //
    // The damage is asymmetric, and the asymmetry is what makes it detectable.
    // The merge had two branches:
    //
    //     if (data.lastDate  === today)     -> day counters
    //     if (data.weekStart === thisWeek)  -> week counters
    //
    // `stats/time_tracking` is only written on a FINAL flush, so on any morning
    // before the first one it still carries YESTERDAY's lastDate — and the day
    // branch is skipped while the week branch fires. So in the common case:
    //
    //     users/{uid}/stats/time_tracking.secondsWeek   is INFLATED
    //     typing_logs/{uid}_{date}.seconds              is CLEAN
    //
    // typing_logs is therefore an independent, uncorrupted record of the same
    // quantity, and the truth is simply its sum across the week. This is not an
    // estimate or a heuristic repair: the correct value is COMPUTED, not guessed.
    //
    // ⚠️ THE CONVERSE SKEW IS NORMAL AND IS NOT A DEFECT. `secondsWeek` LOWER
    // than the daily sum just means the stats document is stale — it lags by
    // design, since it is only read at page load. Only an EXCESS is reported.
    //
    // ⚠️ WHAT THIS CANNOT SEE. If the student had already triggered a final flush
    // earlier the same day, `lastDate` matched and the DAY counters doubled too —
    // which means the inflated value was written into typing_logs, and typing_logs
    // is the yardstick. Those days look self-consistent and this audit will pass
    // them. The per-run detail in the drill-down is the check for that case: a
    // day whose logged minutes exceed the sum of its session rollups by a wide
    // margin is the signature. Reported below as "unverifiable" rather than
    // silently omitted, because a clean bill of health this audit cannot actually
    // issue is worse than no audit.
    //
    // COST: one read per student in the current report (the daily logs are
    // already in memory from Generate). One write per student repaired. For a
    // class of thirty that is thirty reads — well inside a day's free tier.
    const TOLERANCE_SECONDS = 60;   // don't chase rounding or one stale flush

    function mondayOf(dateStr) {
        const d = new Date(dateStr + 'T12:00:00');
        const day = (d.getDay() + 6) % 7;          // Mon = 0
        d.setDate(d.getDate() - day);
        return d.getFullYear() + '-' +
               String(d.getMonth() + 1).padStart(2, '0') + '-' +
               String(d.getDate()).padStart(2, '0');
    }

    let auditFindings = [];

    async function auditWeekCounters() {
        const panel = document.getElementById('audit-panel');
        panel.classList.remove('hidden');
        if (!reportData.length) {
            panel.innerHTML = '<div style="color:#888;">Run Generate first — the audit reads the daily logs already on screen.</div>';
            return;
        }
        panel.innerHTML = '<div style="color:#888;">Auditing ' + reportData.length + ' students…</div>';
        auditFindings = [];
        let errors = 0;

        for (const r of reportData) {
            try {
                const snap = await getDoc(doc(db, 'users', r.uid, 'stats', 'time_tracking'));
                if (!snap.exists()) continue;
                const data = snap.data();
                const ws = data.weekStart || '';
                if (!ws) continue;

                // Only the days belonging to the week the stats doc describes.
                const inWeek = r.dailyLogs.filter(l => mondayOf(l.date) === ws);
                // ⚠️ If the report window does not COVER that week, the sum is a
                // partial and would produce a false positive. Skip rather than
                // accuse. Requires the window to include the Monday itself or an
                // earlier day, and the week to have at least one logged day.
                if (!inWeek.length) continue;
                const earliest = r.dailyLogs.map(l => l.date).sort()[0];
                if (earliest > ws) {
                    auditFindings.push({ r, status: 'partial', ws });
                    continue;
                }

                const sumSeconds = inWeek.reduce((a, l) => a + l.seconds, 0);
                const sumChars   = inWeek.reduce((a, l) => a + l.chars, 0);
                const sumMist    = inWeek.reduce((a, l) => a + l.mistakes, 0);
                const excess = (data.secondsWeek || 0) - sumSeconds;

                if (excess > TOLERANCE_SECONDS) {
                    auditFindings.push({
                        r, status: 'inflated', ws, excess,
                        stored: data.secondsWeek || 0,
                        correct: { secondsWeek: sumSeconds, charsWeek: sumChars, mistakesWeek: sumMist },
                        // A near-exact doubling is the signature of this specific
                        // defect. Anything else inflated is worth a look but may
                        // have another cause, so it is labelled differently.
                        doubled: sumSeconds > 0 &&
                                 Math.abs((data.secondsWeek || 0) - sumSeconds * 2) <= TOLERANCE_SECONDS
                    });
                }
            } catch (e) { errors++; console.warn('audit read failed for', r.uid, e); }
        }

        renderAuditPanel(errors);
    }

    function renderAuditPanel(errors) {
        const panel = document.getElementById('audit-panel');
        const bad = auditFindings.filter(f => f.status === 'inflated');
        const partial = auditFindings.filter(f => f.status === 'partial');

        let html = '<div style="font-weight:bold; margin-bottom:8px;">Week-counter audit</div>';
        if (!bad.length) {
            html += '<div style="color:#00ff41;">No inflated week counters found in this report window.</div>';
        } else {
            html += '<div style="color:#ffb300; margin-bottom:8px;">' + bad.length +
                    ' student(s) have a stored week total higher than the sum of their daily logs. ' +
                    'The daily logs are the uncorrupted record; the fix rewrites the week counter to match them.</div>';
            html += bad.map((f, i) => (
                '<div class="audit-row" style="margin:4px 0; font-size:0.8rem;">' +
                '<span style="display:inline-block;min-width:180px;">' + escapeHtml(f.r.name) + '</span>' +
                '<span class="uid-chip" data-uid="' + f.r.uid + '" title="' + f.r.uid + '">' + f.r.uid.slice(0, 8) + '</span>' +
                '<span style="margin-left:10px;">week of ' + f.ws + '</span>' +
                '<span style="margin-left:10px;">stored ' + formatTime(f.stored) +
                ' &rarr; correct ' + formatTime(f.correct.secondsWeek) + '</span>' +
                (f.doubled ? '<span style="margin-left:10px;color:#ff6666;">exactly doubled</span>' : '') +
                '<button class="audit-fix-btn" data-i="' + i + '" style="margin-left:10px;">Fix</button>' +
                '</div>'
            )).join('');
            html += '<button id="audit-fix-all" style="margin-top:10px;">Fix all ' + bad.length + '</button>';
        }
        if (partial.length) {
            html += '<div style="color:#888; margin-top:10px; font-size:0.78rem;">' + partial.length +
                    ' student(s) could not be checked: the report window does not cover the whole week their ' +
                    'counter describes, so the daily sum would be a partial and any excess meaningless. ' +
                    'Widen the date range to include that Monday and re-run.</div>';
        }
        if (errors) {
            html += '<div style="color:#ff6666; margin-top:6px;">' + errors + ' read(s) failed — see console.</div>';
        }
        panel.innerHTML = html;

        // ⚠️ BOUND AFTER THE LAST innerHTML WRITE. Binding above it silently
        // discards every listener in the container.
        panel.querySelectorAll('.audit-fix-btn').forEach(b => {
            b.onclick = () => repairWeekCounter(bad[parseInt(b.dataset.i, 10)], b);
        });
        const all = document.getElementById('audit-fix-all');
        if (all) all.onclick = async () => {
            all.disabled = true;
            for (const f of bad) await repairWeekCounter(f, null);
            all.textContent = 'Done — re-run the audit to confirm';
        };
    }

    async function repairWeekCounter(f, btn) {
        if (!f) return;
        if (btn) { btn.disabled = true; btn.textContent = '…'; }
        try {
            // ⚠️ merge:true, AND ONLY THE THREE WEEK FIELDS. The day counters and
            // lastDate are not ours to touch: this audit proves nothing about them
            // and a repair that rewrites what it has not verified is a second bug.
            await setDoc(doc(db, 'users', f.r.uid, 'stats', 'time_tracking'), {
                secondsWeek:  f.correct.secondsWeek,
                charsWeek:    f.correct.charsWeek,
                mistakesWeek: f.correct.mistakesWeek,
            }, { merge: true });
            if (btn) btn.textContent = '✓ fixed';
        } catch (e) {
            console.error('repair failed', f.r.uid, e);
            if (btn) { btn.textContent = 'failed'; btn.disabled = false; }
            alert('Repair failed for ' + f.r.name + ': ' + e.message);
        }
    }

    document.getElementById('audit-weeks-btn').onclick = auditWeekCounters;

    // Click any short-id chip to copy the full uid.
    document.addEventListener('click', (e) => {
        if (e.target.classList && e.target.classList.contains('uid-chip')) {
            const uid = e.target.dataset.uid || '';
            if (uid && navigator.clipboard) navigator.clipboard.writeText(uid).catch(() => {});
        }
    });

    // --- TABLE RENDERING ---
    function renderTable() {
        reportData.sort((a, b) => {
            let va = a[sortCol], vb = b[sortCol];
            if (typeof va === 'string') va = va.toLowerCase();
            if (typeof vb === 'string') vb = vb.toLowerCase();
            if (va < vb) return sortAsc ? -1 : 1;
            if (va > vb) return sortAsc ? 1 : -1;
            return 0;
        });

        const tbody = document.getElementById('report-body');
        tbody.innerHTML = reportData.map((r, idx) => `
            <tr class="summary-row" data-idx="${idx}">
                <td>${escapeHtml(r.name)}<span class="uid-chip" title="Student ID: ${r.uid} (click to copy)" data-uid="${r.uid}">${String(r.uid).slice(0,8)}</span></td>
                <td>${escapeHtml(r.email)}</td>
                <td class="time-cell">${formatTime(r.seconds)}</td>
                <td>${r.chars.toLocaleString()}</td>
                <td class="wpm-cell">${r.wpm}</td>
                <td>${r.accuracy}%</td>
                <td>${r.days}</td>
                <td><button class="details-row-btn" data-idx="${idx}">Details</button></td>
            </tr>
            <tr class="detail-row hidden" id="detail-${idx}">
                <td colspan="8">
                    <div class="daily-logs">
                        ${r.dailyLogs.map((log, li) => {
                            const mins = Math.floor(log.seconds / 60);
                            const secs = log.seconds % 60;
                            return `
                            <div class="daily-log-entry" data-idx="${idx}" data-li="${li}">
                                <span class="log-date expand-sessions" data-uid="${r.uid}" data-date="${log.date}" title="Click to view sessions">▶ ${log.date}</span>
                                <input type="number" class="log-min-input" value="${mins}" min="0" step="1" title="Minutes" style="width:45px;" />
                                <span class="goal-unit">m</span>
                                <input type="number" class="log-sec-input" value="${secs}" min="0" max="59" step="1" title="Seconds" style="width:45px;" />
                                <span class="goal-unit">s</span>
                                <span class="log-chars">${log.chars.toLocaleString()} chars</span>
                                <button class="save-log-btn" data-idx="${idx}" data-li="${li}">Save</button>
                                <button class="recalc-btn" data-idx="${idx}" data-li="${li}" data-uid="${r.uid}" data-date="${log.date}" title="Recalculate from sessions">⟳</button>
                                <span class="log-save-status" id="log-status-${idx}-${li}"></span>
                            </div>
                            <div class="sessions-container hidden" id="sessions-${r.uid}-${log.date}"></div>
                        `}).join('')}
                    </div>
                </td>
            </tr>
        `).join('');

        // Update sort indicators
        document.querySelectorAll('th').forEach(th => {
            th.classList.remove('sorted');
            const arrow = th.querySelector('.sort-arrow');
            if (arrow) arrow.textContent = '▲';
        });
        const activeTh = document.querySelector(`th[data-col="${sortCol}"]`);
        if (activeTh) {
            activeTh.classList.add('sorted');
            activeTh.querySelector('.sort-arrow').textContent = sortAsc ? '▲' : '▼';
        }
    }

    // Column header sort
    document.querySelectorAll('th[data-col]').forEach(th => {
        th.onclick = () => {
            const col = th.dataset.col;
            if (sortCol === col) sortAsc = !sortAsc;
            else { sortCol = col; sortAsc = (col === 'name' || col === 'email'); }
            renderTable();
        };
    });

    // Edit/Save delegation on table
    document.getElementById('report-body').addEventListener('click', async (e) => {
        // Toggle detail row
        if (e.target.classList.contains('details-row-btn')) {
            const idx = e.target.dataset.idx;
            const detailRow = document.getElementById(`detail-${idx}`);
            if (detailRow) {
                detailRow.classList.toggle('hidden');
                e.target.textContent = detailRow.classList.contains('hidden') ? 'Details' : '▾';
            }
            return;
        }

        // Expand sessions for a day
        if (e.target.classList.contains('expand-sessions')) {
            const uid = e.target.dataset.uid;
            const date = e.target.dataset.date;
            const container = document.getElementById(`sessions-${uid}-${date}`);
            if (!container) return;
            
            if (!container.classList.contains('hidden')) {
                container.classList.add('hidden');
                e.target.textContent = `▶ ${date}`;
                return;
            }
            
            e.target.textContent = `▼ ${date}`;
            container.classList.remove('hidden');
            container.innerHTML = '<div style="padding:8px; color:#888; font-size:0.75rem;">Loading sessions...</div>';
            
            try {
                const sessionsRef = collection(db, "typing_sessions");
                const q = query(sessionsRef, 
                    where("uid", "==", uid), 
                    where("date", "==", date)
                );
                const snap = await getDocs(q);
                
                if (snap.empty) {
                    container.innerHTML = '<div style="padding:8px; color:#666; font-size:0.75rem; font-style:italic;">No session data (sessions logged from v2.4.0+)</div>';
                    return;
                }
                
                // Collect and sort by timestamp
                const sessions = [];
                snap.forEach(d => sessions.push({ id: d.id, ...d.data() }));
                sessions.sort((a, b) => {
                    const ta = a.timestamp?.toDate ? a.timestamp.toDate().getTime() : 0;
                    const tb = b.timestamp?.toDate ? b.timestamp.toDate().getTime() : 0;
                    return ta - tb;
                });
                
                let totalWPM = 0, totalAcc = 0;
                sessions.forEach(s => { totalWPM += s.wpm || 0; totalAcc += s.accuracy || 0; });
                const avgWPM = Math.round(totalWPM / sessions.length);
                const avgAcc = Math.round(totalAcc / sessions.length);
                
                // ⚠️ THE PER-SPRINT DETAIL WAS ALWAYS HERE AND WAS NEVER SHOWN.
                //
                // Every rollup carries a `sprints[]` array — one entry per sprint
                // or per lesson run, each with its own seconds, chars, mistakes,
                // WPM, accuracy and an ISO timestamp. Until v2.10.0 this view
                // rendered only the rollup's TOTALS, which is the one thing that
                // cannot show a sudden jump in speed: averaging a cheated run in
                // with nine honest ones is exactly how it disappears. The data
                // cost nothing extra to store and costs nothing extra to read —
                // it is inside a document already being fetched.
                //
                // Per-sprint outlier detection uses the mean of the OTHER sprints
                // in the same rollup, not the mean including the sprint being
                // judged, so one very fast run cannot raise the bar it is being
                // measured against and hide itself.
                const allSprints = [];
                sessions.forEach(s => (s.sprints || []).forEach(sp => allSprints.push(sp)));
                const spWPMs = allSprints.map(sp => sp.wpm || 0);
                const spMean = spWPMs.length ? spWPMs.reduce((a, b) => a + b, 0) / spWPMs.length : 0;

                container.innerHTML = sessions.map(s => {
                    const time = s.timestamp?.toDate ? s.timestamp.toDate() : new Date(s.timestamp);
                    const timeStr = time.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
                    const suspicious = (s.wpm > avgWPM * 1.5 && avgWPM > 10) || (s.accuracy > avgAcc + 15 && avgAcc < 90);
                    const flag = suspicious ? '<span class="flag-icon" title="Unusual stats">🚩</span>' : '';
                    const src = s.source === 'school' ? 'School'
                              : s.source === 'library' ? 'Library' : '';
                    const sprints = Array.isArray(s.sprints) ? s.sprints : [];
                    const sprintRows = sprints.map((sp, i) => {
                        const spTime = sp.at ? new Date(sp.at) : null;
                        const spTimeStr = (spTime && !isNaN(spTime))
                            ? spTime.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
                            : '\u2014';
                        // Mean of the others, so a fast run can't inflate its own bar.
                        const others = spWPMs.length > 1
                            ? (spWPMs.reduce((a, b) => a + b, 0) - (sp.wpm || 0)) / (spWPMs.length - 1)
                            : spMean;
                        const spOdd = others > 10 && (sp.wpm || 0) > others * 1.6;
                        return `
                            <div class="sprint-row${spOdd ? ' suspicious' : ''}">
                                <span class="sprint-idx">${i + 1}</span>
                                <span class="session-time">${spTimeStr}</span>
                                <span class="session-stat">${formatTime(sp.seconds || 0)}</span>
                                <span class="session-stat">${sp.wpm || 0} WPM</span>
                                <span class="session-stat">${sp.accuracy != null ? sp.accuracy : '\u2014'}%</span>
                                <span class="session-stat">${(sp.chars || 0).toLocaleString()} ch</span>
                                <span class="session-book">${escapeHtml(sp.detail || '')}</span>
                                ${spOdd ? '<span class="flag-icon" title="Much faster than this student\u2019s other runs today">\uD83D\uDEA9</span>' : ''}
                            </div>`;
                    }).join('');
                    return `
                        <div class="session-entry${suspicious ? ' suspicious' : ''}" data-session-id="${s.id}">
                            <span class="session-time">${timeStr}</span>
                            <span class="session-stat">${formatTime(s.seconds)}</span>
                            <span class="session-stat">${s.wpm} WPM</span>
                            <span class="session-stat">${s.accuracy}%</span>
                            <span class="session-stat">${s.sprintCount || sprints.length} runs</span>
                            ${src ? `<span class="session-src">${src}</span>` : ''}
                            <span class="session-book">${escapeHtml((s.bookId || '').replace(/_/g, ' '))}</span>
                            ${flag}
                            <button class="delete-session-btn" data-session-id="${s.id}" title="Delete session">✕</button>
                        </div>
                        ${sprintRows ? `<div class="sprint-list">${sprintRows}</div>` : ''}
                    `;
                }).join('');
                
            } catch (err) {
                console.error("Sessions load error:", err);
                container.innerHTML = `<div style="padding:8px; color:#ff3333; font-size:0.75rem;">Error: ${err.message}</div>`;
            }
            return;
        }

        // Delete a session
        if (e.target.classList.contains('delete-session-btn')) {
            const sessionId = e.target.dataset.sessionId;
            if (!confirm("Delete this typing session?")) return;
            try {
                e.target.disabled = true;
                await deleteDoc(doc(db, "typing_sessions", sessionId));
                const row = e.target.closest('.session-entry');
                if (row) row.remove();
            } catch (err) {
                console.error("Delete session error:", err);
                alert("Delete failed: " + err.message);
                e.target.disabled = false;
            }
            return;
        }

        // Save individual daily log (min + sec inputs)
        if (e.target.classList.contains('save-log-btn')) {
            const idx = parseInt(e.target.dataset.idx);
            const li = parseInt(e.target.dataset.li);
            const r = reportData[idx];
            const log = r.dailyLogs[li];
            const entry = e.target.closest('.daily-log-entry');
            const minInput = entry.querySelector('.log-min-input');
            const secInput = entry.querySelector('.log-sec-input');
            const newMins = parseInt(minInput.value) || 0;
            const newSecs = Math.min(59, Math.max(0, parseInt(secInput.value) || 0));
            const newSeconds = (newMins * 60) + newSecs;
            const statusEl2 = document.getElementById(`log-status-${idx}-${li}`);

            try {
                e.target.disabled = true;
                statusEl2.textContent = 'Saving...';
                statusEl2.style.color = '#888';

                await updateDoc(doc(db, "typing_logs", log.docId), {
                    seconds: newSeconds,
                    lastUpdated: new Date()
                });

                const today = new Date().toISOString().split('T')[0];
                if (log.date === today) {
                    try {
                        await updateDoc(doc(db, "users", r.uid, "stats", "time_tracking"), { secondsToday: newSeconds });
                    } catch (statsErr) { console.warn("Could not update live stats:", statsErr); }
                }

                const oldSeconds = log.seconds;
                log.seconds = newSeconds;
                r.seconds = r.seconds - oldSeconds + newSeconds;
                r.wpm = r.seconds > 0 ? Math.round((r.chars / 5) / (r.seconds / 60)) : 0;
                updateSummaryRow(idx, r);

                statusEl2.textContent = '✓ Saved';
                statusEl2.style.color = '#22c55e';
                setTimeout(() => { statusEl2.textContent = ''; }, 2000);
            } catch (err) {
                console.error("Save error:", err);
                statusEl2.textContent = '✗ ' + err.message;
                statusEl2.style.color = '#ff3333';
            } finally {
                e.target.disabled = false;
            }
            return;
        }

        // Recalculate daily total from sessions
        if (e.target.classList.contains('recalc-btn')) {
            const idx = parseInt(e.target.dataset.idx);
            const li = parseInt(e.target.dataset.li);
            const uid = e.target.dataset.uid;
            const date = e.target.dataset.date;
            const r = reportData[idx];
            const log = r.dailyLogs[li];
            const statusEl2 = document.getElementById(`log-status-${idx}-${li}`);

            try {
                e.target.disabled = true;
                statusEl2.textContent = 'Recalculating...';
                statusEl2.style.color = '#888';

                const q = query(collection(db, "typing_sessions"), where("uid", "==", uid), where("date", "==", date));
                const snap = await getDocs(q);

                if (snap.empty) {
                    statusEl2.textContent = 'No sessions found';
                    statusEl2.style.color = '#ff6b6b';
                    e.target.disabled = false;
                    return;
                }

                let totalSec = 0, totalChars = 0, totalMistakes = 0;
                snap.forEach(d => {
                    const s = d.data();
                    totalSec += s.seconds || 0;
                    totalChars += s.chars || 0;
                    totalMistakes += s.mistakes || 0;
                });

                await updateDoc(doc(db, "typing_logs", log.docId), {
                    seconds: totalSec, chars: totalChars, mistakes: totalMistakes,
                    lastUpdated: new Date()
                });

                const today = new Date().toISOString().split('T')[0];
                if (log.date === today) {
                    try {
                        await updateDoc(doc(db, "users", uid, "stats", "time_tracking"), {
                            secondsToday: totalSec, charsToday: totalChars, mistakesToday: totalMistakes
                        });
                    } catch (e2) { console.warn("Live stats update skipped:", e2); }
                }

                const oldSeconds = log.seconds;
                log.seconds = totalSec;
                log.chars = totalChars;
                log.mistakes = totalMistakes;
                r.seconds = r.seconds - oldSeconds + totalSec;
                r.chars = r.dailyLogs.reduce((s, l) => s + l.chars, 0);
                r.mistakes = r.dailyLogs.reduce((s, l) => s + l.mistakes, 0);
                r.wpm = r.seconds > 0 ? Math.round((r.chars / 5) / (r.seconds / 60)) : 0;
                r.accuracy = (r.chars + r.mistakes) > 0 ? Math.round((r.chars / (r.chars + r.mistakes)) * 100) : 100;

                const entry = e.target.closest('.daily-log-entry');
                entry.querySelector('.log-min-input').value = Math.floor(totalSec / 60);
                entry.querySelector('.log-sec-input').value = totalSec % 60;
                entry.querySelector('.log-chars').textContent = totalChars.toLocaleString() + ' chars';
                updateSummaryRow(idx, r);

                statusEl2.textContent = `✓ ${formatTime(totalSec)} from ${snap.size} sessions`;
                statusEl2.style.color = '#22c55e';
                setTimeout(() => { statusEl2.textContent = ''; }, 3000);
            } catch (err) {
                console.error("Recalc error:", err);
                statusEl2.textContent = '✗ ' + err.message;
                statusEl2.style.color = '#ff3333';
            } finally {
                e.target.disabled = false;
            }
            return;
        }
    });

    function updateSummaryRow(idx, r) {
        const summaryRow = document.querySelector(`.summary-row[data-idx="${idx}"]`);
        if (summaryRow) {
            const cells = summaryRow.querySelectorAll('td');
            cells[2].textContent = formatTime(r.seconds);
            cells[4].textContent = r.wpm;
            cells[5].textContent = r.accuracy + '%';
        }
        const totalSecs = reportData.reduce((s, rr) => s + rr.seconds, 0);
        document.getElementById('total-line').innerHTML = 
            `<strong>${reportData.length}</strong> students — <strong>${formatTime(totalSecs)}</strong> total typing time`;
    }

    // --- CSV EXPORT ---
    document.getElementById('export-btn').onclick = () => {
        if (reportData.length === 0) return;
        const startDate = document.getElementById('date-start').value;
        const endDate = document.getElementById('date-end').value;
        
        const headers = ['Name', 'Email', 'Total Seconds', 'Total Time', 'Characters', 'Avg WPM', 'Accuracy %', 'Days Active'];
        const rows = reportData.map(r => [
            r.name,
            r.email,
            r.seconds,
            formatTime(r.seconds),
            r.chars,
            r.wpm,
            r.accuracy,
            r.days
        ]);

        let csv = headers.join(',') + '\n';
        rows.forEach(row => {
            csv += row.map(cell => {
                const str = String(cell);
                return str.includes(',') || str.includes('"') ? `"${str.replace(/"/g, '""')}"` : str;
            }).join(',') + '\n';
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `typethatbook_${startDate}_to_${endDate}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    };

    // --- UTILS ---
    function formatTime(secs) {
        if (!secs) return "0m 0s";
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        if (h > 0) return `${h}h ${m}m`;
        return `${m}m ${s}s`;
    }

    function escapeHtml(str) {
        const d = document.createElement('div');
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
    }
</script>
</body>
</html>
