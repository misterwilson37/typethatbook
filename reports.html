                    // Tiny runs — the 5-second floor, ROADMAP 7.
                    if (sprints.filter(sp => (sp.seconds || 0) > 0 && (sp.seconds || 0) < SCAN_SHORT_SECS)
                               .length >= SCAN_SHORT_RUNS) found.add('short');

                    // Speed jump — mean of the OTHERS, so a fast run cannot raise
                    // the bar it is measured against and hide itself. Same rule
                    // the sprint rows already use; kept identical on purpose.
                    const wpms = sprints.map(sp => sp.wpm || 0);
                    if (wpms.length > 1) {
                        const total = wpms.reduce((a, b) => a + b, 0);
                        for (const w of wpms) {
                            const others = (total - w) / (wpms.length - 1);
                            if (others > 10 && w > others * 1.6) { found.add('fast'); break; }
                        }
                    }

                    // ⚠️ REPEATED F — THE ONE JAKE ASKED FOR, AND THE ONE WITH A
                    // CAVEAT. Grades are not stored on a sprint; they are
                    // RECONSTRUCTED by gradeSprintsForDay(), which refuses rather
                    // than guesses when a lesson's runCount has drifted. A day it
                    // cannot grade produces NO flag — which reads identically to
                    // a clean day, and that is the one place this scan is weaker
                    // than it looks. Said in the legend, not hidden.
                    try {
                        const graded = await gradeSprintsForDay(sprints);
                        let streak = 0;
                        for (const sp of sprints) {
                            const g = graded.get(sprintIdentity(sp));
                            if (!g || !g.res || !g.res.ok) continue;
                            if (g.continuation) continue;   // a fragment did not earn its own grade
                            if (g.res.grade === 'F') { streak++; if (streak >= SCAN_FAIL_STREAK) { found.add('fail'); break; } }
                            else streak = 0;
                        }
                    } catch (err) {
                        console.warn('[scan] grading failed for ' + r.uid + ' ' + date, err);
                    }

                    scanFlags.set(r.uid + '|' + date, found);
                }
            } catch (err) {
                console.error('[scan] failed for ' + r.uid, err);
                failed++;
            }
            done++;
            setStatus(`Scanning… ${done} of ${nStudents} students, ${docs} session records read`);
        }

        scanRange = { students: nStudents, days: nDays, docs, failed };
        if (btn) btn.disabled = false;

        // ⚠️ REPAINT THE CELLS IN PLACE rather than re-rendering the table. A
        // full renderTable() would collapse every drill-down Jake has open, which
        // is precisely the thing this feature exists to save him from doing twice.
        document.querySelectorAll('.scan-cell').forEach(cell => {
            cell.innerHTML = scanCell(cell.dataset.uid, cell.dataset.date);
        });
        renderLegend();
        setStatus(
            `Scanned ${nStudents} student${nStudents === 1 ? '' : 's'}, ${docs} session records` +
            (failed ? ` — ${failed} could not be read` : ''),
            failed ? 'var(--warn)' : 'var(--accent)');
    }

    // ⚠️ ROADMAP 40 — A CONTROL THAT ONLY ANSWERS TO A MOUSE IS NOT A CONTROL.
    // The uid chip, the day-row expander and the grade/flag buttons are all
    // reachable by Tab now; Enter and Space must do what a click does, or the
    // focus ring leads a keyboard user to something that ignores them.
    // ⚠️ preventDefault() ON SPACE: its default action is to scroll the page,
    // which would fire the control AND jump the teacher away from the row.
    document.getElementById('report-body').addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const t = e.target;
        if (!(t instanceof HTMLElement)) return;
        if (t.matches('.uid-chip, .expand-sessions')) {
            e.preventDefault();
            t.click();
        }
    });

    document.getElementById('report-body').addEventListener('click', async (e) => {
        if (e.target.classList.contains('clear-mastery-btn')) {
            // ⚠️ clearMastery() manages its own disabled state because it
            // re-renders the panel on success, which replaces this button
            // entirely. The helper supplies the busy label and aria-busy and
            // restores whatever it finds — harmless when the node is gone.
            await withBusy(e.target, '\u2026', () =>
                clearMastery(e.target.dataset.uid, e.target.dataset.lesson, e.target));
            return;
        }

        // Toggle detail row
        if (e.target.classList.contains('details-row-btn')) {
            const idx = e.target.dataset.idx;
            const detailRow = document.getElementById(`detail-${idx}`);
            if (detailRow) {
                detailRow.classList.toggle('hidden');
                e.target.textContent = detailRow.classList.contains('hidden') ? 'Details' : '▾';
            }
            return;
        }

        // Expand sessions for a day
        if (e.target.classList.contains('expand-sessions')) {
            const uid = e.target.dataset.uid;
            const date = e.target.dataset.date;
            const container = document.getElementById(`sessions-${uid}-${date}`);
            if (!container) return;
            
            if (!container.classList.contains('hidden')) {
                container.classList.add('hidden');
                e.target.textContent = `▶ ${date}`;
                return;
            }
            
            e.target.textContent = `▼ ${date}`;
            container.classList.remove('hidden');
            container.innerHTML = '<div style="padding:8px; color:var(--ink-dimmer); font-size:0.75rem;">Loading sessions...</div>';
            
            try {
                const sessionsRef = collection(db, "typing_sessions");
                const q = query(sessionsRef, 
                    where("uid", "==", uid), 
                    where("date", "==", date)
                );
                const snap = await getDocs(q);
                
                if (snap.empty) {
                    container.innerHTML = '<div style="padding:8px; color:var(--ink-faint); font-size:0.75rem; font-style:italic;">No session data (sessions logged from v2.4.0+)</div>';
                    return;
                }
                
                // Collect and sort by timestamp
                const sessions = [];
                snap.forEach(d => sessions.push({ id: d.id, ...d.data() }));
                sessions.sort((a, b) => {
                    const ta = a.timestamp?.toDate ? a.timestamp.toDate().getTime() : 0;
                    const tb = b.timestamp?.toDate ? b.timestamp.toDate().getTime() : 0;
                    return ta - tb;
                });
                
                let totalWPM = 0, totalAcc = 0;
                sessions.forEach(s => { totalWPM += s.wpm || 0; totalAcc += s.accuracy || 0; });
                const avgWPM = Math.round(totalWPM / sessions.length);
                const avgAcc = Math.round(totalAcc / sessions.length);
                
                // ⚠️ THE PER-SPRINT DETAIL WAS ALWAYS HERE AND WAS NEVER SHOWN.
                //
                // Every rollup carries a `sprints[]` array — one entry per sprint
                // or per lesson run, each with its own seconds, chars, mistakes,
                // WPM, accuracy and an ISO timestamp. Until v2.10.0 this view
                // rendered only the rollup's TOTALS, which is the one thing that
                // cannot show a sudden jump in speed: averaging a cheated run in
                // with nine honest ones is exactly how it disappears. The data
                // cost nothing extra to store and costs nothing extra to read —
                // it is inside a document already being fetched.
                //
                // Per-sprint outlier detection uses the mean of the OTHER sprints
                // in the same rollup, not the mean including the sprint being
                // judged, so one very fast run cannot raise the bar it is being
                // measured against and hide itself.
                // ⚠️ MARK DUPLICATE ROLLUPS RATHER THAN HIDING THEM. (v2.13.2)
                // recalcDailyLog() ignores duplicates arithmetically, but this
                // view stays honest: Jake needs to SEE the extra document to
                // delete it, and a drill-down that silently collapsed them
                // would contradict the row count above it. See
                // sessionSignature() for what counts as a duplicate and
                // session-log.js v1.3.0 for the race that created them.
                const _seenSig = new Set();
                const _isDupe = new Map();
                sessions.forEach(s => {
                    const sig = sessionSignature(s, s.id);
                    _isDupe.set(s.id, _seenSig.has(sig));
                    _seenSig.add(sig);
                });

                const allSprints = [];
                sessions.forEach(s => (s.sprints || []).forEach(sp => allSprints.push(sp)));
                // ROADMAP 15 — grade the day's attempts once, then stamp each row.
                let _spGrades = new Map();
                try { _spGrades = await gradeSprintsForDay(allSprints); }
                catch (err) { console.warn('[grades] sprint grading failed', err); }
                const spWPMs = allSprints.map(sp => sp.wpm || 0);
                const spMean = spWPMs.length ? spWPMs.reduce((a, b) => a + b, 0) / spWPMs.length : 0;

                container.innerHTML = sessions.map(s => {
                    const time = s.timestamp?.toDate ? s.timestamp.toDate() : new Date(s.timestamp);
                    const timeStr = time.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
                    const suspicious = (s.wpm > avgWPM * 1.5 && avgWPM > 10) || (s.accuracy > avgAcc + 15 && avgAcc < 90);
                    const flag = suspicious ? '<span class="flag-icon" title="Unusual stats">🚩</span>' : '';
                    const src = s.source === 'school' ? 'School'
                              : s.source === 'library' ? 'Library' : '';
                    const sprints = Array.isArray(s.sprints) ? s.sprints : [];
                    const sprintRows = sprints.map((sp, i) => {
                        const spTime = sp.at ? new Date(sp.at) : null;
                        const spTimeStr = (spTime && !isNaN(spTime))
                            ? spTime.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
                            : '\u2014';
                        // Mean of the others, so a fast run can't inflate its own bar.
                        const others = spWPMs.length > 1
                            ? (spWPMs.reduce((a, b) => a + b, 0) - (sp.wpm || 0)) / (spWPMs.length - 1)
                            : spMean;
                        const spOdd = others > 10 && (sp.wpm || 0) > others * 1.6;
                        return `
                            <div class="sprint-row${spOdd ? ' suspicious' : ''}">
                                <span class="sprint-idx">${i + 1}</span>
                                <span class="session-time">${spTimeStr}</span>
                                <span class="session-stat">${formatTime(sp.seconds || 0)}</span>
                                <span class="session-stat">${sp.wpm || 0} WPM</span>
                                <span class="session-stat">${sp.accuracy != null ? sp.accuracy : '\u2014'}%</span>
                                <span class="session-stat">${(sp.chars || 0).toLocaleString()} ch</span>
                                <span class="session-book">${escapeHtml(sp.detail || '')}</span>
                                ${(() => {
                                    // ⚠️ THE GRADE OF THE ATTEMPT THIS SPRINT BELONGS TO, not of
                                    // this sprint. A continuation row shows its run's grade with a
                                    // "·" prefix, because the fragment did not earn one by itself.
                                    const g = _spGrades.get(sprintIdentity(sp));
                                    if (!g) return '';
                                    if (!g.res.ok) return `<span class="grade-pip" style="color:var(--ink-ghost);" title="Not graded: ${escapeHtml(g.res.detail || g.res.reason)}">—</span>`;
                                    const gr = g.res.grade;
                                    const colour = gr === FIRE_GRADE ? 'var(--grade-fire)'
                                                 : gr === 'A' ? 'var(--good)' : gr === 'B' ? 'var(--accent)'
                                                 : gr === 'C' ? 'var(--ink-dimmer)' : 'var(--grade-d)';
                                    const gates = g.res.gates || {};
                                    const goal = `needs ${gates.minAccuracy}%` +
                                                 (gates.minWPM == null ? ', speed not graded' : ` and ${gates.minWPM} WPM`);
                                    return `<span class="grade-pip${g.continuation ? ' grade-cont' : ''}" style="color:${colour};" ` +
                                           `title="Attempt ${g.seq} of ${g.of} at this run — ${goal}${g.continuation ? ' (this row is a continuation of that attempt)' : ''}">` +
                                           `${g.continuation ? '·' : ''}${escapeHtml(gr)}</span>`;
                                })()}
                                ${spOdd ? '<span class="flag-icon" title="Much faster than this student\u2019s other runs today">\uD83D\uDEA9</span>' : ''}
                                <button class="delete-run-btn" data-session-id="${s.id}" data-run-id="${escapeHtml(sprintIdentity(sp))}" title="Delete just this run">✕</button>
                            </div>`;
                    }).join('');
                    return `
                        <div class="session-entry${suspicious ? ' suspicious' : ''}" data-session-id="${s.id}">
                            <span class="session-time">${timeStr}</span>
                            <span class="session-stat">${formatTime(s.seconds)}</span>
                            <span class="session-stat">${s.wpm} WPM</span>
                            <span class="session-stat">${s.accuracy}%</span>
                            <span class="session-stat">${s.sprintCount || sprints.length} runs</span>
                            ${src ? `<span class="session-src">${src}</span>` : ''}
                            <span class="session-book">${escapeHtml((s.bookId || '').replace(/_/g, ' '))}</span>
                            ${flag}
                            ${_isDupe.get(s.id) ? '<span class="dupe-tag" title="Identical to an earlier rollup today — almost certainly written twice by the pre-v1.3.0 flush race. Not counted by the &#8635; recalculate button. Safe to delete.">\u29c9 duplicate</span>' : ''}
                            <button class="delete-session-btn" data-session-id="${s.id}" title="Delete session">✕</button>
                        </div>
                        ${sprintRows ? `<div class="sprint-list">${sprintRows}</div>` : ''}
                    `;
                }).join('');
                
            } catch (err) {
                console.error("Sessions load error:", err);
                container.innerHTML = `<div style="padding:8px; color:var(--bad); font-size:0.75rem;">Error: ${err.message}</div>`;
            }
            return;
        }

        // ═════════════════════════════════════════════════════════════════════
        // ROADMAP 32 — DELETE ONE RUN, NOT THE WHOLE SESSION
        // ═════════════════════════════════════════════════════════════════════
        //
        // Jake: *"as an admin, I can only delete full sessions, not individual
        // runs. I'd love to be able to delete individual runs."*
        //
        // ⚠️⚠️ A RUN IS NOT A DOCUMENT, AND THAT IS THE WHOLE DIFFICULTY. Runs
        // live as entries in a typing_sessions document's `sprints[]` array, so
        // removing one is an UPDATE to that document, not a delete.
        //
        // ✅ NO RULES CHANGE IS NEEDED, AND I CHECKED RATHER THAN ASSUMED.
        // firestore.rules v2.8.0 reads `allow update: if isSuper() || (owner
        // && …)`. Jake is super_admin — he has to be, because the whole-session
        // delete below is `allow delete: if isSuper()` and he uses it. So the
        // super branch already permits this write. ⚠️ The OWNER branch does not
        // and must not: it revalidates every create-time field, and a student
        // editing their own sprint list is the forgery this collection's
        // whitelist exists to stop.
        //
        // ⚠️⚠️ THE ROLLUP MUST BE RECOMPUTED IN THE SAME WRITE. `seconds`, `chars`,
        // `mistakes`, `wpm`, `accuracy` and `sprintCount` are stored on the parent
        // document and are summaries of the array. Removing a sprint without
        // rewriting them leaves the drill-down and the row above it disagreeing,
        // which is EXACTLY the divergence signature ROADMAP item 4's implausibility
        // flag exists to catch — manufactured by hand, by the tool meant to clean up.
        //
        // ⚠️ IDENTIFIED BY sprintIdentity(), NEVER BY ARRAY INDEX. An index is
        // stale the instant one is removed, and a second click would delete a
        // different run than the one under the cursor. The identity function is
        // the drill-down's own — the same one the grade map is keyed on.
        //
        // ⚠️⚠️ AND IT DOES NOT TOUCH MASTERY, WHICH IS ROADMAP 33 AND IS NOT FIXED
        // BY THIS BUTTON. runScores/runLocks live on the student's lessonProgress
        // record and no delete path reaches them. The confirm text says so out
        // loud, because a teacher who deletes a run and expects a child to be
        // unlocked will otherwise be quietly wrong.
        if (e.target.classList.contains('delete-run-btn')) {
            const sessionId = e.target.dataset.sessionId;
            const runId = e.target.dataset.runId;
            if (!sessionId || !runId) return;
            if (!await ttbConfirm(
                "Delete just this run?\n\n" +
                "The run is removed from its session and the session's totals are " +
                "recalculated, then the day's totals are recalculated from the sessions.\n\n" +
                "This does NOT clear mastery. If this run is why a student is locked " +
                "out of a lesson, deleting it will not unlock them — that is a " +
                "separate fix (roadmap item 33).",
                { title: 'Delete run', ok: 'Delete run', danger: true })) return;
            try {
                e.target.disabled = true;
                const ref = doc(db, "typing_sessions", sessionId);
                const snapDoc = await getDoc(ref);
                if (!snapDoc.exists()) { ttbNotice("That session no longer exists.", { bad: true, host: rowHost(e) }); return; }
                const data = snapDoc.data();
                const sprints = Array.isArray(data.sprints) ? data.sprints : [];

                // ⚠️ REMOVE EXACTLY ONE. Two runs can share an identity if they
                // are genuinely identical; splice at the first match rather than
                // filtering, or one click silently deletes both.
                const at = sprints.findIndex(sp => sprintIdentity(sp) === runId);
                if (at < 0) {
                    ttbNotice("Could not find that run — the session may have changed. Reopen the day and try again.", { bad: true, host: rowHost(e) });
                    return;
                }
                const kept = sprints.slice(0, at).concat(sprints.slice(at + 1));

                if (kept.length === 0) {
                    // ⚠️ AN EMPTY SESSION IS NOT A SESSION. Leaving a zero-run
                    // rollup behind would show as a 0-second row that the day
                    // recalculation ignores — a ghost the teacher cannot explain.
                    if (!await ttbConfirm("That was the only run in this session. Delete the whole session?",
                        { title: 'Delete session', ok: 'Delete session', danger: true })) return;
                    await deleteDoc(ref);
                } else {
                    const secs  = kept.reduce((a, sp) => a + (sp.seconds  || 0), 0);
                    const chars = kept.reduce((a, sp) => a + (sp.chars    || 0), 0);
                    const miss  = kept.reduce((a, sp) => a + (sp.mistakes || 0), 0);
                    // ⚠️ RECOMPUTED THE SAME WAY THE WRITER COMPUTES THEM: WPM from
                    // characters over time, accuracy from mistakes against
                    // keystrokes. Averaging the surviving sprints' own wpm values
                    // would weight a 5-second run equally with a 5-minute one.
                    await updateDoc(ref, {
                        sprints: kept,
                        sprintCount: kept.length,
                        seconds: secs,
                        chars: chars,
                        mistakes: miss,
                        wpm: secs > 0 ? Math.round((chars / 5) / (secs / 60)) : 0,
                        accuracy: (chars + miss) > 0 ? Math.round((chars / (chars + miss)) * 100) : 100,
                    });
                }

                // ⚠️ THE DAY DOCUMENT IS THE GRADED ONE AND NOTHING ELSE UPDATES
                // IT. Same call, same options, as the whole-session delete below.
                const cell = e.target.closest('.sprint-list')?.previousElementSibling;
                const container = e.target.closest('.sessions-container');
                const uid = container?.dataset.uid;
                const date = container?.dataset.date;
                const idx = container?.dataset.idx;
                const li = container?.dataset.li;
                if (uid && date && idx != null && li != null) {
                    const liEl = document.querySelector(`.daily-log-entry[data-idx="${idx}"][data-li="${li}"]`);
                    await recalcDailyLog(idx, li, uid, date, { allowZero: true, expectDrop: true });
                }

                // Reopen the day so the row reflects what just happened.
                const reopen = document.querySelector(`.expand-sessions[data-uid="${uid}"][data-date="${date}"]`);
                if (reopen) { reopen.click(); reopen.click(); }
            } catch (err) {
                console.error("Run delete error:", err);
                ttbNotice("Could not delete that run: " + err.message, { bad: true, host: rowHost(e) });
                e.target.disabled = false;
            }
            return;
        }

        // Delete a session
        if (e.target.classList.contains('delete-session-btn')) {
            const sessionId = e.target.dataset.sessionId;
            if (!await ttbConfirm("Delete this typing session?",
                { title: 'Delete session', ok: 'Delete', danger: true })) return;
            try {
                e.target.disabled = true;
                await deleteDoc(doc(db, "typing_sessions", sessionId));
                const row = e.target.closest('.session-entry');
                if (row) row.remove();

                // ⚠️ v2.13.0 — CONNECTING THE BUTTONS. Deleting the evidence used
                // to leave typing_logs telling the old, inflated story until
                // someone remembered to click ⟳ Recalculate by hand — Jake
                // flagged this exact gap. The day this session belonged to is
                // read straight off its own sessions-container's own data
                // attributes, so the recalc targets the right day automatically.
                // allowZero: true because we know for certain sessions existed
                // here a moment ago — an empty result now IS the corrected truth
                // for the day, not a lookup failure. See recalcDailyLog()'s own
                // comment for why the manual ⟳ button can't make that same
                // assumption.
                const container = e.target.closest('.sessions-container');
                if (container) {
                    const idx = parseInt(container.dataset.idx, 10);
                    const li  = parseInt(container.dataset.li, 10);
                    // expectDrop: true — a deletion is SUPPOSED to shrink the
                    // day, so the v2.23.0 drop guard would be asking the teacher
                    // to confirm the thing they just did.
                    await recalcDailyLog(idx, li, container.dataset.uid, container.dataset.date,
                                          { allowZero: true, expectDrop: true });
                }
            } catch (err) {
                console.error("Delete session error:", err);
                ttbNotice("Delete failed: " + err.message, { bad: true, host: rowHost(e) });
                e.target.disabled = false;
            }
            return;
        }

        // Save individual daily log (min + sec inputs)
        if (e.target.classList.contains('save-log-btn')) {
            const idx = parseInt(e.target.dataset.idx);
            const li = parseInt(e.target.dataset.li);
            const r = reportData[idx];
            const log = r.dailyLogs[li];
            const entry = e.target.closest('.daily-log-entry');
            const minInput = entry.querySelector('.log-min-input');
            const secInput = entry.querySelector('.log-sec-input');
            const newMins = parseInt(minInput.value) || 0;
            const newSecs = Math.min(59, Math.max(0, parseInt(secInput.value) || 0));
            const newSeconds = (newMins * 60) + newSecs;
            const statusEl2 = document.getElementById(`log-status-${idx}-${li}`);

            try {
                e.target.disabled = true;
                statusEl2.textContent = 'Saving...';
                statusEl2.style.color = 'var(--ink-dimmer)';

                // ⚠️ v2.13.0 — A MANUAL SAVE COLLAPSES THE DOC BACK TO THE LEGACY
                // FLAT SHAPE. Jake is asserting one definitive number for the
                // whole day; a split (secondsLibrary + secondsSchool) that still
                // added up to the OLD total would silently outrank this edit the
                // next time anyone reads the doc. chars/mistakes carry forward
                // unchanged (only seconds is the thing being overridden), so
                // nothing is lost.
                //
                // ⚠️ v2.24.0 — THIS PATH IS DELIBERATELY *NOT* DATE-GATED, unlike
                // recalcDailyLog() below, and the difference is worth stating
                // because it looks like an omission.
                //
                // ⟳ asserts "this day equals its sessions", which is a statement
                // about where the time CAME FROM, so it has to be filed per
                // source. This box asserts "this day was N minutes, because I
                // was in the room" — a statement about the TOTAL, with no claim
                // about which mode produced it. Writing N into the flat field
                // and clearing the splits says exactly that: after the cutover
                // readLogTotals() computes flat + splits, so the day reads as N,
                // and a student who types more later adds their own field on top
                // of the teacher's figure rather than replacing it.
                //
                // ⚠️ KNOWN AND ACCEPTED: a student tab left OPEN across this edit
                // still holds its own counter in memory and will flush it, so the
                // day becomes N plus that tab's total. That hazard predates the
                // cutover — the same open tab used to overwrite the correction
                // outright — and no client-side change removes it. Corrections
                // are made after the fact in practice.
                await updateDoc(doc(db, "typing_logs", log.docId), {
                    seconds: newSeconds,
                    chars: log.chars,
                    mistakes: log.mistakes,
                    secondsLibrary: deleteField(), charsLibrary: deleteField(), mistakesLibrary: deleteField(),
                    secondsSchool: deleteField(), charsSchool: deleteField(), mistakesSchool: deleteField(),
                    lastUpdated: new Date()
                });

                // ⚠️ v2.16.0 — NO MIRROR WRITE. This used to also poke
                // users/{uid}/stats/time_tracking so the student's HUD would
                // agree with the correction. The HUD reads THIS document now, so
                // the correction reaches the student by being written, full stop.
                // That is what one number buys.

                const oldSeconds = log.seconds;
                log.seconds = newSeconds;
                r.seconds = r.seconds - oldSeconds + newSeconds;
                r.wpm = r.seconds > 0 ? Math.round((r.chars / 5) / (r.seconds / 60)) : 0;
                updateSummaryRow(idx, r);

                statusEl2.textContent = '✓ Saved';
                statusEl2.style.color = 'var(--good)';
                setTimeout(() => { statusEl2.textContent = ''; }, 2000);
            } catch (err) {
                console.error("Save error:", err);
                statusEl2.textContent = '✗ ' + err.message;
                statusEl2.style.color = 'var(--bad)';
            } finally {
                e.target.disabled = false;
            }
            return;
        }

        // ROADMAP 15 — show a student's lesson grades
        if (e.target.classList.contains('grades-btn')) {
            const uid  = e.target.dataset.uid;
            const panel = document.getElementById(`grades-${uid}`);
            if (!panel) return;
            if (!panel.classList.contains('hidden')) { panel.classList.add('hidden'); return; }
            panel.classList.remove('hidden');
            e.target.disabled = true;
            try { await showGrades(uid, panel); }
            finally { e.target.disabled = false; }
            return;
        }

        // ROADMAP 15 — reconstruct lesson grades for one student-day
        if (e.target.classList.contains('regrade-btn')) {
            const uid  = e.target.dataset.uid;
            const date = e.target.dataset.date;
            const name = e.target.dataset.name || uid;
            // ⚠️ This one was already correct — disable with a finally. It goes
            // through the helper anyway so the busy LABEL and aria-busy are
            // consistent across all four, and so there is one place to change.
            await withBusy(e.target, '\u2026', () => reconstructGrades(uid, date, name));
            return;
        }

        // Recalculate daily total from sessions
        if (e.target.classList.contains('recalc-btn')) {
            const idx = parseInt(e.target.dataset.idx);
            const li = parseInt(e.target.dataset.li);
            const uid = e.target.dataset.uid;
            const date = e.target.dataset.date;
            // ⚠️⚠️ THIS IS THE ONE THAT WAS ACTUALLY BROKEN. It disabled itself and
            // re-enabled on the line after the await, with no finally — so a
            // throw inside recalcDailyLog() left the button permanently dead,
            // on a row that gives no clue that a page reload is the cure.
            await withBusy(e.target, '\u2026', () => recalcDailyLog(idx, li, uid, date));
            return;
        }
    });


    // ═════════════════════════════════════════════════════════════════════════
    // ROADMAP 15 — SHOW THE GRADES
    // ═════════════════════════════════════════════════════════════════════════
    //
    // Jake, on the first delivery: *"the grades don't actually show in the
    // report."* They did not. Round 41 shipped the field, the writer and the
    // reconstruction and gave the teacher nowhere to read any of it — the whole
    // point of the item was *"where I could have counted the number of flaming
    // A's"* and the counting surface was missing.
    //
    // ⚠️ A RECONSTRUCTED GRADE IS DRAWN DIFFERENTLY FROM AN EARNED ONE, and that
    // is not decoration. `runGradesFrom[k] === 'sessions'` means this button
    // derived it from session records rather than the engine grading the run
    // live; sprints before learn.js v2.36.0 may include a practice drill wearing
    // the lesson's label. A teacher looking at a fireball is entitled to know
    // which kind it is, so reconstructed pips are dimmed and underdotted, and
    // the legend says so in words.
    //
    // COST: one subcollection read per student, on demand, on click. Same shape
    // as the stuck scan — cheap when asked for, wasteful on a timer.
    // ⚠️ ONE FETCH PER PAGE, NOT PER EXPANSION. The lessons collection is ~80
    // documents and every grade computation needs it. A per-row read would turn
    // opening a drill-down into 80 billed reads.
    let _lessonDefs = null;
    async function lessonDefs() {
        if (_lessonDefs) return _lessonDefs;
        _lessonDefs = new Map();
        try {
            const snap = await getDocs(collection(db, 'lessons'));
            snap.forEach(d => { const l = d.data(); if (l && l.id) _lessonDefs.set(l.id, l); });
        } catch (err) {
            console.warn('[grades] lesson load failed', err);
        }
        return _lessonDefs;
    }

    // ═════════════════════════════════════════════════════════════════════════
    // ROADMAP 15 — THE GRADE ON EVERY SPRINT ROW
    // ═════════════════════════════════════════════════════════════════════════
    //
    // Jake: *"being able to see it on each row would be nice... to see if a kid
    // has gotten a D 20 times in a row — may be time to reassess where that kid
    // is."* That pattern is invisible in a best-grade column BY CONSTRUCTION: a
    // record holding "B" cannot tell you it was preceded by twenty D's.
    //
    // ⚠️⚠️ A GRADE BELONGS TO AN **ATTEMPT**, NOT A SPRINT, and that is why this
    // is computed here rather than per row. An interrupted run is several
    // sprints; each carries only its own partial numbers, and grading one alone
    // is exactly the invented grade that put a wrong D on a student's record.
    // So the whole day is merged into attempts ONCE, and every sprint is mapped
    // back to the attempt it belongs to. Continuation rows show the grade of the
    // run they are part of, marked so, rather than a grade of their own.
    //
    // ⚠️ RETURNS A MAP KEYED ON THE SPRINT'S OWN IDENTITY, not on its index — a
    // sprint appears in more than one rollup when rollups overlap (ROADMAP 24),
    // and both copies must resolve to the same attempt.
    async function gradeSprintsForDay(flatSprints) {
        const out = new Map();
        const defs = await lessonDefs();
        const attempts = mergeRunAttempts(flatSprints);

        // Which attempt does each sprint belong to? Re-derive with the same rule
        // mergeRunAttempts() uses, so the two cannot drift apart.
        const graded = new Map();   // "label\u0000runIdx\u0000at" -> {grade, seq, of}
        const perRun = new Map();
        for (const att of attempts) {
            const lesson = defs.get(att.label);
            const res = lesson ? gradeMergedRun(att, lesson, null) : { ok: false, reason: 'lesson not found' };
            const k = `${att.label}\u0000${att.runIdx}`;
            const list = perRun.get(k) || [];
            list.push({ at: att.at, res });
            perRun.set(k, list);
        }
        for (const [k, list] of perRun) {
            list.sort((a, b) => String(a.at).localeCompare(String(b.at)));
            list.forEach((e, i) => graded.set(`${k}\u0000${e.at}`, { res: e.res, seq: i + 1, of: list.length }));
        }

        // Walk the same chronological order and attach each sprint to its attempt.
        const rows = [];
        const seen = new Set();
        for (const sp of flatSprints) {
            const runIdx = runIndexFromDetailLocal(sp.detail);
            if (runIdx === null || sp.practice) continue;
            rows.push({ sp, runIdx });
        }
        rows.sort((a, b) => String(a.sp.at || '').localeCompare(String(b.sp.at || '')));
        const openAt = new Map();
        for (const { sp, runIdx } of rows) {
            const k = `${sp.label}\u0000${runIdx}`;
            if (sp.continuation !== true || !openAt.has(k)) openAt.set(k, sp.at || '');
            const g = graded.get(`${k}\u0000${openAt.get(k)}`);
            if (g) out.set(sprintIdentity(sp), { ...g, continuation: sp.continuation === true });
        }
        return out;
    }

    const sprintIdentity = (sp) =>
        [sp.at || '', sp.detail || '', sp.seconds || 0, sp.chars || 0].join('\u0000');
    const runIndexFromDetailLocal = (detail) => {
        const m = /^\s*run\s+(\d+)/i.exec(String(detail || ''));
        if (!m) return null;
        const n = parseInt(m[1], 10);
        return n >= 1 ? n - 1 : null;
    };

    // ═════════════════════════════════════════════════════════════════════════
    // ROADMAP 33 — CLEAR MASTERY FOR A LESSON
    // ═════════════════════════════════════════════════════════════════════════
    //
    // Jake: *"the poor kids who had me test mastery are now locked out of the
    // earliest lessons when they're not the ones who tested out."*
    //
    // ⚠️⚠️ WHY THIS IS A CONTROL AND NOT AN AUTOMATIC CONSEQUENCE OF DELETING A
    // RUN. Deleting a session removes EVIDENCE; mastery is not stored as
    // evidence. `runScores[k]` is a CUMULATIVE SUM — the module says so itself:
    // *"runScores is a SUM and cannot tell one A🔥 from two A's"* — and
    // `runGrades[k]` is best-ever-seen. Neither is a log, so neither can have one
    // entry removed. Subtracting `pointsForGrade()` on delete would be arithmetic
    // on a number that cannot be faithfully reversed, and it would be wrong
    // silently. ROADMAP 33 weighed three shapes and this is the third: explicit,
    // auditable, needs no reconstruction.
    //
    // ⚠️⚠️ IT CLEARS runScores AND runLocks TOGETHER, NEVER ONE ALONE. runLocks
    // stamps WHEN the threshold was crossed and feeds the reach-back clock.
    // Clearing the points and leaving the stamp would unlock the lesson while the
    // clock still says the child proved something that day.
    //
    // ⚠️⚠️ AND IT RE-DERIVES users/{uid}.lastLockDay ACROSS EVERY LESSON, which
    // is the part that is easy to miss and hard to see afterwards. lastLockDay is
    // GLOBAL — the reach-back window for the whole curriculum measures time since
    // the student last proved anything, anywhere. Clearing the lesson that
    // happened to set it would leave the stamp pointing at a crossing that no
    // longer exists, and reach-back would stay shut for every OTHER lesson.
    // Recomputed here as the maximum surviving runLocks value across the whole
    // subcollection — which is exactly what stampLastLockDay() would have left
    // behind had this lesson never been mastered.
    //
    // ⚠️ HISTORY IS KEPT. runGrades, runFires, runAttempts and runFailures are
    // NOT touched. The child still earned those grades and the report should
    // still show them; what is being undone is the GATE, not the record. A tool
    // that erased the evidence along with the consequence would make item 34's
    // three-strikes tracking impossible after any cleanup.
    //
    // ⚠️ REQUIRES firestore.rules v2.10.0. v2.7.0 opened lessonProgress to
    // BUILDING-scoped staff only, so an ordinary class teacher could read a
    // record and not write it. Without the deploy this button is denied and
    // looks like a button that does nothing.
    //
    // COST: the subcollection read the grades panel already made, plus one write
    // per lesson cleared and at most one write to the user document.

    // ⚠️ MIRRORS lesson-gate.js MASTERY_POINTS. Named with a _UI suffix because
    // it is a SECOND COPY and must not be mistaken for the authority: this page
    // imports no modules, the same Rule 9 acceptance as readLogTotals(). If the
    // threshold ever changes in lesson-gate.js it changes here, in the same
    // deploy, or this panel will describe a gate the app is not applying.
    const MASTERY_POINTS_UI = 4;

    // Which runs on this record are at or past the threshold.
    // ⚠️ THIS IS NOT runMastered(). That function answers "is run k in practice
    // mode", which is true when ANY LATER run is mastered — mastered runs form a
    // prefix. This one lists the runs that actually banked the points, because
    // that is what the teacher is being shown and what the button will clear.
    // Conflating the two would report every run of a lesson as mastered the
    // moment its last run was.
    function masteredRuns(rec) {
        const scores = (rec && rec.runScores) || {};
        return Object.keys(scores)
            .filter(k => Number(scores[k]) >= MASTERY_POINTS_UI)
            .map(Number)
            .sort((a, b) => a - b);
    }

    async function clearMastery(uid, lessonId, btn) {
        if (!await ttbConfirm(
            `Clear mastery for ${lessonId}?\n\n` +
            `Every run in this lesson goes back to being GRADED, so the student ` +
            `can earn credit in it again.\n\n` +
            `Grades, fireballs and attempt counts are KEPT — this undoes the lock, ` +
            `not the history.\n\n` +
            `The reach-back clock is recalculated from whatever mastery is left.`,
            { title: 'Clear mastery', ok: 'Clear mastery', danger: true })) return;
        if (btn) btn.disabled = true;
        try {
            const ref = doc(db, 'users', uid, 'lessonProgress', lessonId);

            // ⚠️ deleteField(), NOT `{}`. An empty map is a value: runScoreOf()
            // would read it, find no entry for the run, and fall through to
            // pointsForGrade(record.grade) — the LEGACY SEED path — which would
            // re-award points from the best-ever grade this button just declined
            // to trust. Removing the field entirely is what makes the seed the
            // intended fallback rather than a resurrection.
            await updateDoc(ref, {
                runScores: deleteField(),
                runLocks:  deleteField(),
            });

            // ─── re-derive the global clock ──────────────────────────────────
            // ⚠️ READ AFTER THE WRITE, not before. Deriving from the copy the
            // panel loaded would include the lesson we just cleared and put the
            // stamp straight back.
            let maxLock = null;
            try {
                const all = await getDocs(collection(db, 'users', uid, 'lessonProgress'));
                all.forEach(d => {
                    const locks = d.data().runLocks || {};
                    Object.values(locks).forEach(v => {
                        const n = Number(v);
                        if (Number.isFinite(n) && (maxLock === null || n > maxLock)) maxLock = n;
                    });
                });
            } catch (err) {
                // ⚠️ SAY SO RATHER THAN GUESS. A failed re-derivation leaves the
                // lesson unlocked and the clock stale — better than writing a
                // number we could not verify, but the teacher must know.
                console.warn('[mastery] could not re-derive lastLockDay', err);
                ttbNotice(`Mastery cleared for ${lessonId}, but the reach-back clock could not be ` +
                      `recalculated (${err.message}). The lesson is unlocked; tell whoever ` +
                      `maintains this so lastLockDay can be checked by hand.`);
                if (btn) { const p = btn.closest('.grades-panel'); if (p) await showGrades(uid, p); }
                return;
            }

            // ⚠️ null MEANS NO MASTERY ANYWHERE, and the field is REMOVED rather
            // than zeroed. lastLockDayOf() falls back to lastAdvanceDay and then
            // to null, and null is what "has never proved anything" is supposed
            // to look like. Writing 0 would be a real crossing on day zero.
            if (maxLock === null) {
                await updateDoc(doc(db, 'users', uid), { lastLockDay: deleteField() });
            } else {
                await updateDoc(doc(db, 'users', uid), { lastLockDay: maxLock });
            }

            const panel = btn ? btn.closest('.grades-panel') : null;
            if (panel) await showGrades(uid, panel);
        } catch (err) {
            console.error('[mastery] clear failed', err);
            ttbNotice(`Could not clear mastery: ${err.message}\n\n` +
                  `If this says "permission denied", firestore.rules v2.10.0 has not ` +
                  `been deployed yet — the rules file in the repo changes nothing until ` +
                  `it is pasted into the Firebase console.`);
            if (btn) btn.disabled = false;
        }
    }

    async function showGrades(uid, panel) {
        panel.innerHTML = '<span style="color:var(--ink-dimmer);">Loading grades…</span>';
        let snap;
        try {
            snap = await getDocs(collection(db, 'users', uid, 'lessonProgress'));
        } catch (err) {
            panel.innerHTML = `<span style="color:var(--bad);">Could not read grades: ${escapeHtml(err.message)}</span>`;
            return;
        }
        if (snap.empty) {
            panel.innerHTML = '<span style="color:var(--ink-faint); font-style:italic;">No lesson records.</span>';
            return;
        }

        const rows = [];
        let fireTotal = 0, reconTotal = 0;
        snap.forEach(d => {
            const r = d.data();
            const grades = r.runGrades || {};
            const from   = r.runGradesFrom || {};
            const fires  = r.runFires || {};
            const idxs = Object.keys(grades).map(Number).sort((a, b) => a - b);
            if (!idxs.length) {
                // ⚠️ A LESSON WITH NO PER-RUN GRADES IS STILL SHOWN, because the
                // absence is the interesting thing: it is either pre-Round-41
                // history or a lesson nobody has finished a run of. Rendering
                // only the populated ones would quietly hide the gap this
                // feature exists to close.
                rows.push({ id: d.id, legacy: r.grade || '', pips: '', fires: 0,
                            runCount: r.runCount || 0,
                            mastered: masteredRuns(r), locks: r.runLocks || {} });
                return;
            }
            const pips = idxs.map(i => {
                const g = grades[String(i)];
                const recon = from[String(i)] === 'sessions';
                if (recon) reconTotal++;
                const f = Number(fires[String(i)]) || 0;
                fireTotal += f;
                const colour = g === FIRE_GRADE ? 'var(--grade-fire)'
                             : g === 'A' ? 'var(--good)' : g === 'B' ? 'var(--accent)'
                             : g === 'C' ? 'var(--ink-dimmer)' : 'var(--grade-d)';
                return `<span class="grade-pip${recon ? ' grade-recon' : ''}" style="color:${colour};" ` +
                       `title="Run ${i + 1}${recon ? ' — reconstructed from session records' : ' — earned'}">` +
                       `${escapeHtml(g)}</span>`;
            }).join('');
            rows.push({ id: d.id, legacy: r.grade || '', pips,
                        fires: idxs.reduce((n, i) => n + (Number(fires[String(i)]) || 0), 0),
                        runCount: r.runCount || 0,
                        mastered: masteredRuns(r), locks: r.runLocks || {} });
        });

        rows.sort((a, b) => a.id.localeCompare(b.id));

        panel.innerHTML =
            '<table><thead><tr style="color:var(--accent);">' +
            ['Lesson', 'Best grade', 'Per run', 'A\uD83D\uDD25', 'Mastered', ''].map(h => `<th>${h}</th>`).join('') +
            '</tr></thead><tbody>' +
            rows.map(r =>
                '<tr>' +
                `<td style="color:var(--ink-dim);">${escapeHtml(r.id)}</td>` +
                `<td style="color:var(--ink-dimmer);">${escapeHtml(r.legacy || '—')}</td>` +
                `<td>${r.pips || '<span style="color:var(--ink-ghost);">not recorded</span>'}</td>` +
                `<td style="color:${r.fires ? 'var(--grade-fire)' : 'var(--ink-ghost)'};">${r.fires || '—'}</td>` +
                `<td>${r.mastered.length
                        ? `<span class="mastery-lock" title="Runs ${r.mastered.map(i => i + 1).join(', ')} are at or past the ${MASTERY_POINTS_UI}-point mastery threshold. Every run at or below the highest of these is in practice mode and pays nothing.">\u25a0 ${r.mastered.length}</span>`
                        : '<span style="color:var(--ink-ghost);">\u2014</span>'}</td>` +
                `<td>${r.mastered.length
                        ? `<button class="clear-mastery-btn" data-uid="${uid}" data-lesson="${escapeHtml(r.id)}" title="Clear mastery for this lesson \u2014 puts every run back to graded. Does not touch grades or history.">\u2298</button>`
                        : ''}</td>` +
                '</tr>').join('') +
            '</tbody></table>' +
            `<div style="color:var(--ink-faint); margin-top:6px;">` +
            `${fireTotal} fireball${fireTotal === 1 ? '' : 's'} across ${rows.length} lesson${rows.length === 1 ? '' : 's'}. ` +
            (reconTotal
                ? `<span class="grade-recon">Dimmed</span> = reconstructed from session records (${reconTotal}), not graded live. `
                : '') +
            `\u26a0\ufe0f Per-run grades are recorded from 2026-08-25 onward \u2014 "not recorded" means no data, not a zero.` +
            `</div>`;
    }


    // ═════════════════════════════════════════════════════════════════════════
    // ROADMAP 15 — RECONSTRUCT LESSON GRADES FROM typing_sessions
    // ═════════════════════════════════════════════════════════════════════════
    //
    // Jake: *"I wonder if we can clean up the 'didn't save score on run' issue
    // via a button that looks at the lesson in the report and figures out the
    // score based on lesson, speed, and accuracy."* This is that button.
    //
    // It exists because ROADMAP 14b lost run outcomes on "← Map" for a fortnight:
    // `stopLesson()` reloaded progress before the scheduled flush read it, so the
    // write succeeded and stored the RELOADED record. `typing_sessions` is a
    // SECOND, INDEPENDENT WITNESS to those runs — Nico's morning shows ten
    // sprints against a record holding four — and a grade is a pure function of
    // (lesson gates, wpm, accuracy), all of which are on the sprint.
    //
    // ⚠️⚠️ FOUR THINGS THIS MUST NOT DO, AND ALL FOUR ARE ENFORCED BELOW.
    //
    // 1. ⚠️ IT NEVER OVERWRITES A GRADE THE STUDENT ACTUALLY EARNED. Only runs
    //    with no stored grade are filled in. A reconstruction is evidence about
    //    a GAP; where the record already speaks it is the better witness,
    //    because it was written by the engine that graded the run live.
    //
    // 2. ⚠️⚠️ IT NEVER TOUCHES `passed`, `fireCount`, `runScores`, `runLocks` OR
    //    `grade`. Those fields ADVANCE A CHILD THROUGH THE CURRICULUM and gate
    //    what they are allowed to open. A reconstructed number is derived from a
    //    record; letting it unlock lessons would make a repair tool into a
    //    promotion tool, and a wrong one would be indistinguishable from real
    //    progress afterwards — §0.-14.C's failure direction exactly.
    //
    // 3. ⚠️ EVERY RECONSTRUCTED GRADE IS LABELLED. `runGradesFrom[k] = 'sessions'`
    //    so a reconstructed A🔥 can be told from an earned one FOREVER, by
    //    anything that reads the record later. This is the field that lets a
    //    future round undo this one.
    //
    // 4. ⚠️⚠️ IT REFUSES RATHER THAN GUESSES. gradeMergedRun() rejects a lesson
    //    whose `runCount` has drifted from the stored record's, because editing a
    //    lesson re-chunks it and shifts every run index — today's definition read
    //    against a two-week-old sprint can grade the wrong material silently.
    //
    // ⚠️ AND ONE THING IT CANNOT DO. Sprints written before learn.js v2.36.0
    // include "🎲 Practice missed keys" drills filed under the lesson's id as
    // "run N" — the defect Round 41 fixed — and nothing distinguishes them. Runs
    // reconstructed from before the fix may therefore include a random-letter
    // drill graded as lesson material. That is why nothing here advances a
    // student, and why the preview shows the count before you agree to it.
    //
    // COST: one typing_sessions query (already the drill-down's own query shape)
    // plus one lessonProgress read per lesson touched, and one write per lesson
    // changed. Writes are ~50× cheaper than reads here (item 18), so the shape is
    // "read the few lessons this day mentions", never the whole subcollection.
    async function reconstructGrades(uid, date, name) {
        const status = (msg, colour) => {
            const el = document.getElementById('regrade-status');
            if (el) { el.textContent = msg; el.style.color = colour || 'var(--ink-dimmer)'; }
            else console.log('[regrade] ' + msg);
        };

        // ─── 1. the day's sprints ────────────────────────────────────────────
        const snap = await getDocs(query(collection(db, "typing_sessions"),
                                         where("uid", "==", uid), where("date", "==", date)));
        if (snap.empty) { ttbNotice(`No session records for ${name} on ${date}.`); return; }

        // ⚠️ SCHOOL ONLY. A Library sprint has no lesson and no run index; its
        // `bookId` is a book. Grading one would invent a lesson that was never
        // opened.
        const flat = [];
        snap.forEach(d => {
            const s = d.data();
            if (s.source !== 'school') return;
            (Array.isArray(s.sprints) ? s.sprints : []).forEach(sp => flat.push(sp));
        });
        if (!flat.length) { ttbNotice(`No lesson runs for ${name} on ${date} — nothing to grade.`); return; }

        const skippedRemediation = flat.filter(sp => sp && sp.practice).length;

        // ⚠️⚠️ ATTEMPTS, NOT "RUNS". v1.0.0 of run-grade.js merged every sprint
        // sharing a run number into one union and graded that — so three honest
        // retries at run 1 plus an abandoned 32% tail became a single imaginary
        // run graded D. It also counted sprints twice when two rollups overlap.
        // mergeRunAttempts() splits on `continuation` and dedupes per sprint.
        const attempts = mergeRunAttempts(flat);
        if (!attempts.length) { ttbNotice(`No gradeable runs for ${name} on ${date}.`); return; }

        // ─── 2. the lessons those runs name ──────────────────────────────────
        const lessonIds = [...new Set(attempts.map(a => a.label).filter(Boolean))];
        const lessons = new Map();
        const allSnap = await getDocs(collection(db, 'lessons'));
        allSnap.forEach(d => { const l = d.data(); if (lessonIds.includes(l.id)) lessons.set(l.id, l); });

        // ─── 3. each student's record for those lessons ──────────────────────
        const records = new Map();
        for (const id of lessonIds) {
            const rs = await getDoc(doc(db, 'users', uid, 'lessonProgress', id));
            records.set(id, rs.exists() ? rs.data() : null);
        }

        // ─── 4. grade every attempt; keep the BEST per run ───────────────────
        //
        // ⚠️ BEST, NOT LAST, AND NOT THE UNION. A run typed three times is worth
        // the best of the three — which is what `grade` has always meant on this
        // record. Averaging the attempts together is the defect above.
        const byRun = new Map();     // "lessonId\u0000runIdx" -> { grade, fires }
        const refused = [];
        for (const att of attempts) {
            const lesson = lessons.get(att.label);
            const rec    = records.get(att.label);
            if (!lesson) { refused.push(`${att.label || '(no lesson id)'} run ${att.runIdx + 1} — lesson not found`); continue; }

            const res = gradeMergedRun(att, lesson, rec ? rec.runCount : null);
            if (!res.ok) { refused.push(`${att.label} run ${att.runIdx + 1} — ${res.detail || res.reason}`); continue; }

            const k = `${att.label}\u0000${att.runIdx}`;
            const cur = byRun.get(k) || { lessonId: att.label, runIdx: att.runIdx, grade: 'F', fires: 0, tries: 0 };
            cur.grade = betterGrade(res.grade, cur.grade) || res.grade;
            if (res.grade === FIRE_GRADE) cur.fires += 1;
            cur.tries += 1;
            byRun.set(k, cur);
        }

        // ─── 5. decide what to write ─────────────────────────────────────────
        //
        // ⚠️⚠️ RECONSTRUCTED ENTRIES ARE RECOMPUTED; EARNED ONES ARE NEVER TOUCHED.
        // `runGradesFrom[k] === 'sessions'` marks an entry THIS BUTTON wrote, and
        // that tag is what makes the tool self-healing: re-running it after a fix
        // corrects its own past output. v1.0.0 wrote wrong grades onto a real
        // student on 2026-08-24 and a skip-if-present rule would have left them
        // there forever. Anything without the tag was written live by the engine
        // that graded the run and is the better witness — it is left alone.
        const planned = new Map();
        const added = [], corrected = [], already = [];

        for (const [, v] of byRun) {
            const rec = records.get(v.lessonId);
            const key = String(v.runIdx);
            const existing = rec && rec.runGrades && rec.runGrades[key];
            const source   = rec && rec.runGradesFrom && rec.runGradesFrom[key];

            if (existing && source !== 'sessions') { already.push(`${v.lessonId} run ${v.runIdx + 1} (${existing})`); continue; }

            if (!planned.has(v.lessonId)) {
                planned.set(v.lessonId, {
                    runGrades:     Object.assign({}, (rec && rec.runGrades)     || {}),
                    runGradesFrom: Object.assign({}, (rec && rec.runGradesFrom) || {}),
                    runFires:      Object.assign({}, (rec && rec.runFires)      || {}),
                });
            }
            const p = planned.get(v.lessonId);
            // ⚠️ ASSIGNED, NOT ACCUMULATED. A recompute must converge on the same
            // answer however many times it runs; `+=` on runFires would climb by
            // one every press.
            p.runGrades[key]     = v.grade;
            p.runGradesFrom[key] = 'sessions';
            p.runFires[key]      = v.fires;

            const line = `${v.lessonId} run ${v.runIdx + 1} → ${v.grade}` +
                         (v.tries > 1 ? `  (best of ${v.tries} attempts)` : '');
            if (existing) corrected.push(`${line}   [was ${existing}]`);
            else          added.push(line);
        }

        // ─── 5b. THE PREVIEW IS THE CONFIRMATION ─────────────────────────────
        //
        // ⚠️ NO HARD-WRAPPED PROSE. A browser dialog wraps on its own width, so
        // baked-in newlines mid-sentence produce the ragged column Jake saw.
        // Newlines separate LINES here, never sentences.
        const writes = added.length + corrected.length;
        if (!writes) {
            ttbNotice(`${name} — ${date}\n\nNothing to reconstruct.\n\n` +
                  `Attempts found: ${attempts.length}\n` +
                  `Already graded (earned): ${already.length}\n` +
                  `Refused: ${refused.length}\n` +
                  (skippedRemediation ? `Practice drills skipped: ${skippedRemediation}\n` : '') +
                  (refused.length ? `\n${refused.slice(0, 8).join('\n')}` : ''));
            return;
        }

        const go = await ttbConfirm(
            `RECONSTRUCT GRADES — ${name}, ${date}\n\n` +
            (added.length ? `ADD ${added.length}:\n` + added.slice(0, 12).join('\n') + '\n\n' : '') +
            (corrected.length ? `CORRECT ${corrected.length} written by an earlier run of this button:\n` +
                                corrected.slice(0, 12).join('\n') + '\n\n' : '') +
            `Leaves alone: ${already.length} earned, ${refused.length} refused` +
            (skippedRemediation ? `, ${skippedRemediation} practice drills` : '') + '.\n\n' +
            `Writes runGrades/runFires only. Does NOT change passed, fireCount, runScores or the lesson grade, so nothing advances or unlocks.\n\n` +
            (refused.length ? `Refused:\n${refused.slice(0, 6).join('\n')}\n\n` : '') +
            `Proceed?`,
            { title: 'Reconstruct grades', ok: 'Reconstruct' });
        if (!go) return;

        // ─── 6. write ────────────────────────────────────────────────────────
        let wrote = 0, failedWrites = 0;
        for (const [lessonId, p] of planned) {
            try {
                await setDoc(doc(db, 'users', uid, 'lessonProgress', lessonId), {
                    runGrades: p.runGrades,
                    runGradesFrom: p.runGradesFrom,
                    runFires: p.runFires,
                    // ⚠️ A DATED MARK, so a later round can find every record this
                    // button touched without inferring it from the tags.
                    regradedAt: new Date().toISOString(),
                }, { merge: true });
                wrote++;
            } catch (err) {
                failedWrites++;
                console.warn('[regrade] write failed for ' + lessonId, err);
            }
        }

        ttbNotice(`${name} — ${date}\n\n` +
              `Wrote ${wrote} lesson record(s); ${writes} grade(s) ` +
              `(${added.length} added, ${corrected.length} corrected).` +
              (failedWrites ? `\n\n\u26a0\ufe0f ${failedWrites} write(s) FAILED — see the console.` : ''));
    }

    // ─────────────────────────────────────────────────────────────────────────
    // recalcDailyLog() — recompute one day's log from its remaining session
    // records. Shared by the manual ⟳ button and, as of v2.13.0, by session
    // deletion — see the delete-session-btn handler above for why that
    // connection exists.
    //
    // Writes the SOURCE-SPLIT fields (same shape as game.js/learn.js's live
    // flush — see readLogTotals() above), computed from each session record's
    // own `source` tag, and clears whichever legacy flat fields the document
    // still carries — this is also how an old, pre-split document gets
    // migrated to the new shape the first time anyone recalculates it.
    //
    // `allowZero`: the manual button's long-standing behavior is to refuse and
    // report "No sessions found" when a day has none — usually because the day
    // predates session logging (v2.4.0), where the day's total time is real,
    // just never broken into session records, and zeroing it would silently
    // destroy legitimate old data. The delete-cascade case is the opposite:
    // sessions definitely existed a moment ago — the one just deleted was one
    // of them — so an empty result now IS the corrected truth for that day,
    // not a failed lookup. Callers pass allowZero to accept that.
    // Split a day's session records by their own `source` tag. Pure — no
    // reads, no writes, no DOM — which is what makes it the one piece of
    // recalcDailyLog() a harness can test directly (source-split-test.mjs).
    // Anything not explicitly tagged 'school' folds into Library, the
    // original, untagged mode; every session game.js/learn.js write today
    // carries a tag (session-log.js requires it).
    // ⚠️⚠️ v2.32.0 — ROADMAP 24. SUMS **SPRINTS**, NOT DOCUMENTS, BECAUSE ONE
    // SPRINT CAN APPEAR IN TWO DOCUMENTS.
    //
    // MEASURED 2026-08-25: **12 of 51 student-days** carried at least one sprint
    // present in more than one rollup — 8 of 10 students sampled, across every
    // day from the 18th to the 25th. This is not a historical artefact; it is
    // still happening.
    //
    // ⚠️ sessionSignature() BELOW CANNOT SEE IT, AND IS NOT WRONG. It keys on the
    // whole sprint-timestamp LIST, so an 8:47 rollup of 7 sprints that CONTAINS
    // an 8:47 rollup of 5 is genuinely a different document. The duplication is
    // per SPRINT, so it has to be removed per SPRINT. Document-level dedupe stays
    // — it catches exact twins — and this is the layer beneath it.
    //
    // ⚠️⚠️ WHAT THIS PREVENTS: `⟳` recomputes a day from these totals and WRITES
    // THE RESULT to typing_logs. On 2026-08-24 it would have raised a real
    // student from 21m 40s to about 30m — a ~40% inflation of a graded number,
    // with no prompt, because the drop guard only ever asked about REDUCTIONS.
    //
    // ⚠️ A ROLLUP WITH NO `sprints` ARRAY (pre-v2.10.0) IS COUNTED WHOLE, from
    // its own totals. It cannot be deduped and must not be dropped: losing real
    // minutes to avoid double-counting them is the worse error.
    function splitSessionTotals(sessions) {
        let schoolSec = 0, schoolChars = 0, schoolMist = 0;
        let librarySec = 0, libraryChars = 0, libraryMist = 0;
        const seen = new Set();

        sessions.forEach(s => {
            const school = s.source === 'school';
            const sprints = Array.isArray(s.sprints) ? s.sprints : [];
            const stamped = sprints.filter(sp => sp && sp.at);

            if (!stamped.length) {
                // No per-sprint identity available — trust the document total.
                if (school) { schoolSec += s.seconds || 0; schoolChars += s.chars || 0; schoolMist += s.mistakes || 0; }
                else        { librarySec += s.seconds || 0; libraryChars += s.chars || 0; libraryMist += s.mistakes || 0; }
                return;
            }

            for (const sp of stamped) {
                const k = `${s.source || ''}\u0000${s.bookId || ''}\u0000${sp.at}\u0000${sp.detail || ''}`;
                if (seen.has(k)) continue;          // already counted from another rollup
                seen.add(k);
                if (school) { schoolSec += sp.seconds || 0; schoolChars += sp.chars || 0; schoolMist += sp.mistakes || 0; }
                else        { librarySec += sp.seconds || 0; libraryChars += sp.chars || 0; libraryMist += sp.mistakes || 0; }
            }
        });
        return { schoolSec, schoolChars, schoolMist, librarySec, libraryChars, libraryMist };
    }

    // ⚠️ DUPLICATE ROLLUPS EXIST IN THE DATABASE AND THIS FUNCTION MUST NOT
    // TRUST A RAW COUNT. (v2.13.2) session-log.js before v1.3.0 could write the
    // same queued sprint twice when a navigation fired two flushes at once —
    // Jake hit it on 2026-08-19 and got two identical Pinocchio sessions.
    // v1.3.0 stops NEW duplicates; the ones already written are still sitting
    // in typing_sessions, and this function is what the ⟳ button and the
    // automatic post-delete recalc both grade from. A duplicate here silently
    // inflates a day Jake is trying to CORRECT, which is the worst possible
    // place for it.
    //
    // The signature is the sprint timestamps, not the totals: two genuine
    // sessions can coincidentally share seconds and characters, but two
    // documents whose sprints carry the identical ISO instants are the same
    // recorded work written twice. Falls back to the document's own timestamp
    // when a rollup has no sprints array (pre-v2.10.0 records), and to the
    // document id — never dedupable, but never wrongly merged either.
    function sessionSignature(s, id) {
        const sprints = Array.isArray(s.sprints) ? s.sprints : [];
        const stamps = sprints.map(sp => sp && sp.at).filter(Boolean);
        if (!stamps.length) {
            const t = s.timestamp && s.timestamp.toDate ? s.timestamp.toDate().getTime() : null;
            return t === null ? 'id\u0000' + id : `t\u0000${s.source || ''}\u0000${s.bookId || ''}\u0000${t}`;
        }
        return `s\u0000${s.source || ''}\u0000${s.bookId || ''}\u0000${stamps.join(',')}`;
    }

    // ⚠️ v2.25.0 — THE `expect` OPTION IS GONE WITH THE BULK REBUILD. It held
    // the totals a preview had shown Jake, and refused to write anything else,
    // because the point of a preview is that the write is the thing previewed.
    // Its only caller was runRebuildAll(). Both surviving callers — the ⟳
    // button and the post-delete recalc — are a teacher acting on ONE day they
    // are looking at, with no preview to be stale against. Keeping a parameter
    // nothing passes means keeping a branch nothing exercises.
    //
    //   RETURN VALUE is an object, `{ ok, reason, ... }`, instead of a
    //     bare boolean. Both pre-existing callers (the ⟳ button and the
    //     post-delete cascade) ignore the return entirely, and an object is
    //     truthy, so nothing that read it as a boolean changes meaning.
    // ⚠️ v2.23.0 — THE DROP GUARD. A big down-move now has to be confirmed.
    //
    // This function rewrites a day's log to whatever the session records sum to,
    // and until v2.23.0 there was NO limit on how far down that could move it.
    // `allowZero` only ever blocked the EMPTY case. That is fine when the
    // sessions are complete and destructive when they are not — and they are
    // demonstrably not always complete: a real 2026-08-19 Library day reads
    // 12m 4s / 1,890 chars in the log against a single 3m 47s / 521-char
    // session rollup, and the log is the one that matches the student's actual
    // work. One click there would have written 3m 47s over eight minutes of
    // real typing, and the child's own screen would have changed with it,
    // because the HUD reads this same document.
    //
    // ⚠️ THE SESSION RECORD IS NOT A SUPERSET OF THE DAY COUNTER AND MUST NOT BE
    // TREATED AS ONE. Sprints below the 5-second floor never arrive, a sprint
    // that never closes is never pushed, and a failed upload leaves the counter
    // ahead of the record. `⟳` is only safe where the sessions happen to be
    // complete, and nothing in this page can tell you whether they are.
    //
    // A small correction — the 6-second, sub-1% kind — still applies silently.
    // Below DROP_GUARD_RATIO of the stored figure, the teacher is shown both
    // numbers and has to say yes.
    const DROP_GUARD_RATIO = 0.9;

    async function recalcDailyLog(idx, li, uid, date,
                                  { allowZero = false, expectDrop = false } = {}) {
        const r = reportData[idx];
        const log = r.dailyLogs[li];
        const statusEl2 = document.getElementById(`log-status-${idx}-${li}`);
        const entry = document.querySelector(`.daily-log-entry[data-idx="${idx}"][data-li="${li}"]`);

        if (statusEl2) { statusEl2.textContent = 'Recalculating...'; statusEl2.style.color = 'var(--ink-dimmer)'; }

        try {
            const q = query(collection(db, "typing_sessions"), where("uid", "==", uid), where("date", "==", date));
            const snap = await getDocs(q);

            if (snap.empty && !allowZero) {
                if (statusEl2) { statusEl2.textContent = 'No sessions found'; statusEl2.style.color = 'var(--bad)'; }
                return { ok: false, reason: 'no-sessions' };
            }

            const sessions = [];
            const seenSigs = new Set();
            let dupes = 0;
            snap.forEach(d => {
                const data = d.data();
                const sig = sessionSignature(data, d.id);
                if (seenSigs.has(sig)) { dupes++; return; }
                seenSigs.add(sig);
                sessions.push(data);
            });
            if (dupes) {
                console.warn(`[recalc] ignored ${dupes} duplicate session rollup(s) for ${uid} on ${date}` +
                             ` — see session-log.js v1.3.0. Delete them from the drill-down to tidy up.`);
            }
            const { schoolSec, schoolChars, schoolMist, librarySec, libraryChars, libraryMist } =
                splitSessionTotals(sessions);
            const totalSec = schoolSec + librarySec;
            const totalChars = schoolChars + libraryChars;
            const totalMistakes = schoolMist + libraryMist;

            // ⚠️ v2.23.0 — THE DROP GUARD. See the note above the function.
            //
            // `expectDrop` is passed by the delete-session path, where a
            // down-move is the WHOLE POINT: a rollup was just removed, so the
            // day is supposed to shrink. Every other caller gets the guard.
            const currentSec = log.seconds || 0;

            // ⚠️⚠️ v2.32.0 — ROADMAP 24. THE GUARD IS SYMMETRIC NOW.
            //
            // It only ever asked about REDUCTIONS. An INFLATION applied silently
            // — and inflation is the failure this data actually produces: with
            // duplicated sprints in a day, `⟳` on 2026-08-24 would have raised a
            // real student from 21m 40s to ~30m and said nothing.
            //
            // ⚠️ THE PER-SPRINT DEDUPE IN splitSessionTotals() SHOULD MAKE THIS
            // UNREACHABLE FOR THAT CAUSE. It is here because "should" is not a
            // guarantee, and because a graded number moving UP without a reason
            // deserves the same question as one moving down. If this fires,
            // something is producing minutes the dedupe cannot explain — SAY NO
            // AND TELL ME.
            if (!expectDrop && currentSec > 0 && totalSec > currentSec / DROP_GUARD_RATIO) {
                const gained = totalSec - currentSec;
                const pct = Math.round((totalSec / currentSec - 1) * 100);
                const okToRaise = await ttbConfirm(
                    `\u26a0\ufe0f This would INCREASE the stored day by ${pct}%.\n\n` +
                    `  stored now : ${formatTime(currentSec)}  (${log.chars || 0} chars)\n` +
                    `  sessions   : ${formatTime(totalSec)}  (${totalChars} chars)\n` +
                    `  difference : +${formatTime(gained)}\n\n` +
                    `The stored figure comes from the student's own live counter, ` +
                    `which is normally the MORE complete of the two. Session ` +
                    `records going higher is unusual and usually means the same ` +
                    `work was recorded twice.\n\n` +
                    `Unless you know why this day should grow, cancel and report it.\n\n` +
                    `Overwrite it anyway?`
                );
                if (!okToRaise) {
                    // ⚠️ SAME RETURN SHAPE AS THE DROP BRANCH. This function's
                    // callers read `{ ok, reason, got }`; a bare `return` would
                    // hand them undefined and the post-delete recalc would treat
                    // a declined inflation as a crash.
                    if (statusEl2) { statusEl2.textContent = 'kept the stored figure'; statusEl2.style.color = 'var(--ink-dimmer)'; }
                    return { ok: false, reason: 'raise-declined',
                             got: { seconds: totalSec, chars: totalChars, mistakes: totalMistakes } };
                }
                console.warn(`[recalc] ${uid} ${date} overwritten UP by ${gained}s ` +
                             `(${currentSec}s \u2192 ${totalSec}s) with confirmation.`);
            }

            if (!expectDrop && currentSec > 0 && totalSec < currentSec * DROP_GUARD_RATIO) {
                const lost = currentSec - totalSec;
                const pct  = Math.round((1 - totalSec / currentSec) * 100);
                const okToDrop = await ttbConfirm(
                    `This would REDUCE the stored day by ${pct}%.\n\n` +
                    `  stored now : ${formatTime(currentSec)}  (${log.chars || 0} chars)\n` +
                    `  sessions   : ${formatTime(totalSec)}  (${totalChars} chars)\n` +
                    `  difference : ${formatTime(lost)}\n\n` +
                    `The session records are not always complete — sprints under ` +
                    `five seconds are never written, a sprint that never closes ` +
                    `is never pushed, and a failed upload leaves the day counter ` +
                    `ahead of the record. If this student really did type ` +
                    `${formatTime(currentSec)}, the stored figure is the correct ` +
                    `one and this rewrite would destroy the difference.\n\n` +
                    `The student sees this same number on their own screen.\n\n` +
                    `Overwrite it anyway?`
                );
                if (!okToDrop) {
                    if (statusEl2) { statusEl2.textContent = 'kept the stored figure'; statusEl2.style.color = 'var(--ink-dimmer)'; }
                    return { ok: false, reason: 'drop-declined',
                             got: { seconds: totalSec, chars: totalChars, mistakes: totalMistakes } };
                }
                console.warn(`[recalc] ${uid} ${date} overwritten DOWN by ${lost}s ` +
                             `(${currentSec}s → ${totalSec}s) with confirmation.`);
            }

            // ═════════════════════════════════════════════════════════════════
            // ⚠️⚠️ v2.24.0 — THE WRITE IS DATE-GATED. WITHOUT THIS, ⟳ IS A
            // DATA-LOSS BUTTON ON EVERY DAY AFTER THE CUTOVER.
            // ═════════════════════════════════════════════════════════════════
            //
            // v2.14.0 wrote the flat triple and deleteField()'d the six split
            // fields, and that was right in a world where the split was reverted
            // and nothing wrote those fields: clearing them made ⟳ the reliable
            // cleanup for any day touched while the split was briefly live.
            //
            // ⚠️ THAT IS NOW BACKWARDS. On and after SOURCE_SPLIT_CUTOVER the
            // split fields are THE DAY — game.js v3.35.0 and learn.js v2.20.0
            // write nothing else — and readLogTotals() reads flat PLUS splits.
            // Unchanged, one click of ⟳ on a post-cutover day deletes both
            // per-source triples, writes the whole day into a field the student
            // pages have stopped maintaining, and leaves the document in a shape
            // the writers will then seed from as though it were empty.
            //
            // So: BEFORE the cutover, byte-for-byte what v2.23.0 did. AFTER it,
            // the day comes back as the two per-source triples, from
            // splitSessionTotals() — which already separates the sessions by
            // source, so this is the same arithmetic filed correctly instead of
            // flattened.
            //
            // ⚠️ AND THE FLAT TRIPLE IS DELETED ON THAT PATH, WHICH IS NOT AN
            // OVERSIGHT. ⟳ asserts "this day equals its session records", and
            // the session records cover the WHOLE day including any morning
            // written flat by a page that had not picked up the new build. A
            // frozen flat remainder left beside the new splits would be that
            // morning counted twice. Deleting it also makes the result correct
            // under BOTH branches of readLogTotals(), so a day rewritten here
            // reads the same even if the cutover date is ever misconfigured.
            //
            // ⚠️ THIS SHIPS IN THE SAME DEPLOY AS THE WRITERS, OR EARLIER. It is
