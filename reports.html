<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeThatBook Reports</title>  <!-- version appended at runtime from REPORTS_VERSION -->
    <style>
        body { background: #111; color: #eee; font-family: 'Courier New', monospace; padding: 20px; margin: 0; }
        .container { max-width: 960px; margin: 0 auto; padding-bottom: 40px; }

        a { color: #888; text-decoration: none; border-bottom: 1px dotted #888; }
        a:hover { color: #fff; }

        .status-bar { padding: 15px; margin-bottom: 20px; background: #222; border-left: 4px solid #555; font-size: 0.9rem; }

        .hidden { display: none !important; }

        /* --- DATE CONTROLS --- */
        .controls {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label {
            color: #888; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .control-group input[type="date"] {
            background: #222; border: 1px solid #444; color: #fff;
            padding: 10px 12px; font-family: inherit; font-size: 0.9rem;
        }
        .control-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
        }

        button {
            padding: 10px 20px; background: #0047AB; color: white;
            border: none; font-family: inherit; font-weight: bold;
            text-transform: uppercase; font-size: 0.8rem;
            cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #4B9CD3; }
        button:disabled { background: #555; cursor: not-allowed; }

        button.secondary { background: #333; border: 1px solid #555; }
        button.secondary:hover { background: #555; }

        .quick-btns { display: flex; gap: 8px; align-items: flex-end; }
        .quick-btn {
            padding: 10px 14px; background: #222; border: 1px solid #444;
            color: #aaa; font-size: 0.75rem;
        }
        .quick-btn:hover { background: #333; color: #fff; border-color: #4B9CD3; }

        /* --- TABLE --- */
        .results-info {
            color: #666; font-size: 0.8rem; margin-bottom: 10px;
        }

        table {
            width: 100%; border-collapse: collapse;
            background: #1a1a1a; margin-bottom: 20px;
        }
        th {
            background: #222; color: #4B9CD3;
            padding: 12px 15px; text-align: left;
            font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 1px; border-bottom: 2px solid #333;
            cursor: pointer; user-select: none;
        }
        th:hover { color: #fff; }
        th .sort-arrow { font-size: 0.6rem; margin-left: 4px; opacity: 0.5; }
        th.sorted .sort-arrow { opacity: 1; }

        td {
            padding: 10px 15px; border-bottom: 1px solid #222;
            font-size: 0.85rem;
        }
        tr:hover td { background: #222; }

        .time-cell { font-weight: bold; color: #4B9CD3; }
        .wpm-cell { color: #aaa; }

        .empty-msg {
            text-align: center; color: #555; padding: 40px;
            font-size: 0.9rem;
        }

        /* --- EXPORT --- */
        .export-bar {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .total-line { color: #888; font-size: 0.85rem; }
        .total-line strong { color: #4B9CD3; }

        /* --- LOGIN --- */
        #login-section { text-align: center; padding: 60px 0; }
        #login-section p { color: #888; margin-bottom: 15px; }

        footer {
            position: fixed; bottom: 5px; right: 10px;
            font-size: 0.7em; color: #666;
            background: rgba(255,255,255,0.8);
            padding: 2px 5px; border-radius: 3px; z-index: 101;
        }

        /* --- GOALS PANEL --- */
        .goals-panel {
            background: #1a1a1a; border: 1px solid #333;
            padding: 20px; margin-bottom: 20px;
        }
        .goals-row {
            display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;
        }
        .goal-card {
            background: #222; border: 1px solid #333; border-radius: 6px;
            padding: 15px 20px; flex: 1; min-width: 180px;
        }
        .goal-card label {
            color: #888; font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 1px; display: block; margin-bottom: 8px;
        }
        .goal-icon { font-size: 1.5rem; margin-bottom: 6px; }
        .goal-input-row { display: flex; align-items: center; gap: 8px; }
        .goal-input-row input[type="number"] {
            background: #111; border: 1px solid #444; color: #fff;
            padding: 8px 10px; font-family: inherit; font-size: 1.1rem;
            width: 80px; text-align: center; border-radius: 4px;
        }
        .goal-input-row input:focus { border-color: #4B9CD3; outline: none; }
        .goal-unit { color: #666; font-size: 0.8rem; }
        .goal-hint { color: #555; font-size: 0.65rem; margin-top: 6px; font-style: italic; }
        .goal-status {
            margin-top: 10px; font-size: 0.8rem; min-height: 1.2em;
        }
        .goal-status.ok { color: #22c55e; }
        .goal-status.err { color: #ff3333; }

        /* --- EDIT UI --- */
        .details-row-btn {
            background: transparent; border: 1px solid #555; color: #aaa;
            padding: 3px 10px; font-size: 0.7rem; cursor: pointer;
            font-family: inherit; border-radius: 3px;
        }
        .details-row-btn:hover { border-color: #4B9CD3; color: #4B9CD3; }
        .detail-row td { padding: 0 !important; background: #111; }
        .detail-row.hidden { display: none; }
        .daily-logs { padding: 10px 15px; }
        .daily-log-entry {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 0; border-bottom: 1px solid #222;
            font-size: 0.8rem;
        }
        .daily-log-entry:last-child { border-bottom: none; }
        .log-date { color: #888; width: 90px; flex-shrink: 0; }
        .log-seconds-input {
            background: #1a1a1a; border: 1px solid #444; color: #fff;
            padding: 4px 6px; width: 60px; text-align: center;
            font-family: inherit; font-size: 0.8rem; border-radius: 3px;
        }
        .log-seconds-input:focus { border-color: #4B9CD3; outline: none; }
        .log-chars { color: #666; font-size: 0.75rem; }
        .save-log-btn {
            background: #333; border: 1px solid #555; color: #aaa;
            padding: 3px 10px; font-size: 0.7rem; cursor: pointer;
            font-family: inherit; border-radius: 3px;
        }
        .save-log-btn:hover { border-color: #22c55e; color: #22c55e; }
        .recalc-btn {
            background: transparent; border: 1px solid #555; color: #aaa;
            padding: 3px 8px; font-size: 0.8rem; cursor: pointer;
            font-family: inherit; border-radius: 3px; line-height: 1;
        }
        .recalc-btn:hover { border-color: #4B9CD3; color: #4B9CD3; }
        .recalc-btn:disabled { opacity: 0.4; cursor: default; }
        .dupe-tag {
            font-size: 0.65rem; color: #ffaa00; border: 1px solid #ffaa00;
            border-radius: 3px; padding: 0 4px; margin-right: 4px; white-space: nowrap;
        }
        .delete-session-btn {
            background: transparent; border: 1px solid transparent; color: #666;
            padding: 2px 6px; font-size: 0.75rem; cursor: pointer;
            font-family: inherit; border-radius: 3px; margin-left: auto;
        }
        .delete-session-btn:hover { border-color: #ff3333; color: #ff3333; }
        .log-save-status { font-size: 0.75rem; min-width: 60px; }
        .expand-sessions { cursor: pointer; user-select: none; }
        .expand-sessions:hover { color: #4B9CD3; }
        .sessions-container { padding: 4px 0 8px 20px; }
        .sessions-container.hidden { display: none; }
        .session-entry {
            display: flex; align-items: center; gap: 12px;
            padding: 4px 8px; font-size: 0.75rem; color: #aaa;
            border-left: 2px solid #333;
        }
        .session-entry.suspicious { border-left-color: #ff6b6b; background: rgba(255,50,50,0.05); }
        .session-time { color: #888; width: 70px; flex-shrink: 0; }
        .session-stat { width: 65px; text-align: right; }
        .session-book { color: #555; font-style: italic; font-size: 0.7rem; }
        .flag-icon { font-size: 0.85rem; }
    .uid-chip { font-family: monospace; font-size: 0.68rem; opacity: 0.55; margin-left: 8px;
                cursor: pointer; border: 1px solid #444; padding: 0 4px; border-radius: 3px; }
    .uid-chip:hover { opacity: 1; }
    .sprint-list { margin: 2px 0 8px 26px; border-left: 2px solid #333; padding-left: 8px; }
    .sprint-row { display: flex; gap: 10px; align-items: center; font-size: 0.72rem;
                  color: #aaa; padding: 1px 0; }
    .sprint-row.suspicious { color: #ffb300; }
    .sprint-idx { opacity: 0.5; min-width: 18px; }
    .session-src { font-size: 0.7rem; opacity: 0.7; border: 1px solid #444; padding: 0 4px; }

    </style>
</head>
<body>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px;">
        <h1>REPORTS</h1>
        <div style="display:flex; gap:20px;">
            <a href="admin.html">Admin Panel</a>
            <a href="index.html">Library</a>
        </div>
    </div>

    <div class="status-bar" id="status">Initializing...</div>

    <div id="login-section" class="hidden">
        <p>Admin login required to view reports.</p>
        <button id="login-btn">Log In with Google</button>
    </div>

    <div id="reports-section" class="hidden">
        <!-- GOALS MANAGEMENT -->
        <div class="goals-panel">
            <h2 style="font-size:1rem; color:#4B9CD3; margin-bottom:15px; letter-spacing:1px;">STUDENT GOALS</h2>
            <div class="goals-row">
                <div class="goal-card">
                    <div class="goal-icon">🎉</div>
                    <label>Daily Goal</label>
                    <div class="goal-input-row">
                        <input type="number" id="daily-goal" min="0" max="120" step="1" value="0" />
                        <span class="goal-unit">minutes</span>
                    </div>
                    <div class="goal-hint">Confetti when reached</div>
                </div>
                <div class="goal-card">
                    <div class="goal-icon">🎆</div>
                    <label>Weekly Goal (Sat–Fri)</label>
                    <div class="goal-input-row">
                        <input type="number" id="weekly-goal" min="0" max="600" step="5" value="0" />
                        <span class="goal-unit">minutes</span>
                    </div>
                    <div class="goal-hint">Fireworks when reached</div>
                </div>
                <button id="save-goals-btn">Save Goals</button>
            </div>
            <div class="goal-status" id="goal-status"></div>
        </div>

        <!-- SCOPE -->
        <div class="controls" id="scope-controls">
            <div class="control-group">
                <label>School</label>
                <select id="scope-school"></select>
            </div>
            <div class="control-group">
                <label>Class</label>
                <select id="scope-class"></select>
            </div>
            <div class="control-group" style="align-self:flex-end">
                <span id="scope-note" style="font-size:.8em;opacity:.7"></span>
            </div>
        </div>

        <!-- REPORTS -->
        <div class="controls">
            <div class="control-group">
                <label>Start Date</label>
                <input type="date" id="date-start">
            </div>
            <div class="control-group">
                <label>End Date</label>
                <input type="date" id="date-end">
            </div>
            <button id="generate-btn">Generate</button>
            <div class="quick-btns">
                <button class="quick-btn" data-range="today">Today</button>
                <button class="quick-btn" data-range="this-week">This Week</button>
                <button class="quick-btn" data-range="last-week">Last Week</button>
            </div>
        </div>

        <div id="results-container" class="hidden">
            <div class="export-bar">
                <div class="total-line" id="total-line"></div>
                <button class="secondary" id="export-btn">Export CSV</button>
            </div>
            <div class="results-info" id="results-info"></div>
            <table>
                <thead>
                    <tr>
                        <th data-col="name">Name <span class="sort-arrow">▲</span></th>
                        <th data-col="email">Email <span class="sort-arrow">▲</span></th>
                        <th data-col="seconds">Total Time <span class="sort-arrow">▲</span></th>
                        <th data-col="chars">Characters <span class="sort-arrow">▲</span></th>
                        <th data-col="wpm">Avg WPM <span class="sort-arrow">▲</span></th>
                        <th data-col="accuracy">Accuracy <span class="sort-arrow">▲</span></th>
                        <th data-col="days">Days Active <span class="sort-arrow">▲</span></th>
                        <th style="width:50px;"></th>
                    </tr>
                </thead>
                <tbody id="report-body"></tbody>
            </table>
        </div>

        <div id="empty-msg" class="empty-msg hidden">
            No typing data found for this date range.
        </div>
    </div>
</div>

<footer id="footer-version">Reports</footer>

<script type="module">
    import { db, auth } from "./firebase-config.js";

    // ─── Version ──────────────────────────────────────────────────────────────
    // v2.25.0 — ⚠️ RECONCILE VS SESSIONS AND REBUILD-FROM-SESSIONS ARE DELETED.
    //           ~830 lines, on Jake's confirmed boundary: "As long as you agree
    //           none of it is necessary, you can make all those cuts without
    //           impacting students at all." The rebuild had written nothing
    //           since v2.19.0, so no stored data changes today.
    //
    //           KEPT: Generate, the CSV export, the per-student drill-down and
    //           its ⧉ duplicate badge, the per-day editor and its SAVE box, and
    //           ⟳ Recalculate on a SINGLE day. ⟳ is not the rebuild — it
    //           corrects one day a teacher is looking at, behind a drop guard,
    //           and it stays date-gated for the per-source cutover.
    //
    //           ⚠️ TWO THINGS THE CUT NEARLY BROKE, AND THEY ARE THE LESSON.
    //           runPool() IS USED BY Generate, not only by the reconcile, and it
    //           read RECONCILE_CONCURRENCY and reconCancel — cutting by function
    //           name would have left Generate throwing. It has its own
    //           POOL_CONCURRENCY now. And recalcDailyLog()'s `expect` option
    //           became dead the moment the bulk rebuild went, since
    //           runRebuildAll() was its only caller; it is removed with its
    //           branch rather than left as a parameter nothing passes.
    //
    //           The CSV's eight grading columns are UNCHANGED — the ten
    //           reconciliation columns only ever appeared after a sweep had run.
    //
    // v2.24.0 — ⚠️⚠️ recalcDailyLog()'s WRITE IS DATE-GATED. Unchanged, ⟳ became
    //           a DATA-LOSS BUTTON the moment the writers shipped: on a
    //           post-cutover day it deleted both per-source triples — which by
    //           then ARE the day — and wrote the total into the flat field the
    //           student pages have stopped maintaining. After the cutover it now
    //           writes the day back as the two per-source triples out of
    //           splitSessionTotals() and deletes the flat one. Before the
    //           cutover, byte-for-byte v2.23.0's behaviour.
    //           ⚠️ SHIP THIS BEFORE game.js v3.35.0 / learn.js v2.20.0, OR IN
    //           THE SAME DEPLOY. It is safe alone: the gate is false until the
    //           date, so nothing changes until then. ROADMAP item 1 step 3.
    //           The per-day editor's SAVE box is deliberately NOT gated — see
    //           its own note for why the two buttons assert different things.
    //
    // v2.13.0 — TWO THINGS, BOTH FROM DESIGN-TELEMETRY.md §2.4.
    //   (1) THE SOURCE SPLIT, READ SIDE. game.js v3.29.0 / learn.js v2.14.0 now
    //       write secondsLibrary/secondsSchool (etc.) instead of a shared
    //       seconds/chars/mistakes triple that let one mode's flush silently
    //       overwrite the other's contribution for the same day. New
    //       readLogTotals() sums both split triples when present, falling back
    //       to the legacy flat fields for documents written before this
    //       shipped. ⚠️ REQUIRES firestore.rules v2.4.0+, deployed FIRST — see
    //       either JS file's header.
    //   (2) CONNECTING THE BUTTONS. Deleting a session used to leave
    //       typing_logs telling the old story until someone remembered to
    //       click ⟳ Recalculate by hand. delete-session-btn now calls the
    //       extracted recalcDailyLog() automatically, reading which day to
    //       recalculate off the sessions-container's own data-idx/data-li/
    //       data-uid/data-date attributes (new on that element this version).
    //       recalcDailyLog() itself now writes the split fields too — computed
    //       from each remaining session's own `source` tag — so a recalculated
    //       day migrates to the new shape as a side effect. save-log-btn
    //       (the fully-manual override) clears the split fields on save, so a
    //       hand-entered number can't be silently outranked by a stale split
    //       sum the next time the doc is read.
    //
    // v2.9.0 — This page carried its version hardcoded in TWO places, the
    // <title> and the <footer>, and was the last surface still doing so. That
    // is the exact arrangement index.html was in when its title said 3.0.0 and
    // its own footer said 2.3.1 — two copies of one number, updated by hand,
    // which is a discipline problem until it becomes a lie. Both are now
    // written from this constant, which is also what versions.js reads for the
    // build panel in index.html.
    // v2.14.0 — LEGACY-FIRST READ + FLAT RECALC, following the revert of the
    //           source split in game.js v3.30.0 / learn.js v2.15.0. Summing the
    //           two shapes (v2.13.1) would double-count any day still carrying
    //           split fields from the window the split was deployed. ⟳ now
    //           rewrites a day flat and clears the splits, which makes it the
    //           one-click cleanup for those days. Everything else from this
    //           round is KEPT: the delete→recalc cascade, duplicate detection
    //           and marking, and the manual-save override.
    //
    // v2.13.2 — DUPLICATE ROLLUPS. session-log.js before v1.3.0 could write one
    //           queued sprint twice (clicking Home fires two flush handlers, and
    //           the queue is only cleared AFTER the write lands); those documents
    //           are still in the database. New sessionSignature() identifies them
    //           by their sprint instants. recalcDailyLog() now ignores duplicates
    //           when summing, so a repair can't inflate the very day it is
    //           repairing — and since the post-delete recalc is automatic, that
    //           mattered more than it looks. The drill-down MARKS them
    //           "⧉ duplicate" rather than hiding them, so they can be seen and
    //           deleted; a view that silently collapsed them would contradict the
    //           run count beside it.
    //
    // v2.13.1 — readLogTotals() SUMS the legacy `seconds` field with the split
    //           fields instead of letting a split supersede it. Jake watched a
    //           morning's School time vanish from the report the moment that
    //           afternoon's Library session wrote a split field. The two shapes
    //           cover disjoint periods, so summing loses nothing.
    //
    // v2.20.0 — ⚠️⚠️ THE `This Week` BUTTON SELECTED THE WRONG WEEK AFTER 7 PM.
    //           A LIVE DEFECT, FOUND BY TESTING THE ONE THING JAKE HAS ASKED FOR
    //           SIX TIMES: does the number the student sees equal the number the
    //           teacher pulls?
    //
    //           toDateStr() formatted through toISOString(), which is UTC.
    //           Nashville is UTC−5 in summer. From 7:00 PM local every date this
    //           function produced was TOMORROW, and every caller is a date-picker
    //           default or a quick-range button.
    //
    //           `This Week` fills the start box from getLastSaturday(). Shifted
    //           forward one day it lands on SUNDAY — so the teacher's week began
    //           a day after the student's, and SATURDAY'S TYPING WAS INSIDE THE
    //           NUMBER ON THE CHILD'S SCREEN AND OUTSIDE THE REPORT. `Today`
    //           after 7 PM queried tomorrow and returned an empty report.
    //
    //           ⚠️ THE COUNTING CODE WAS INNOCENT. Six rounds looked at
    //           statsData, the WAL, the flush order, typing_sessions — and the
    //           divergence Jake kept reporting was partly a date formatter,
    //           firing only in the evening, which is when a teacher grades.
    //           A DIVERGENCE BETWEEN TWO READERS IS NOT NECESSARILY IN EITHER
    //           READER; IT CAN BE IN WHAT YOU ASKED THEM TO READ.
    //
    //           ⚠️ daylog.js says "Never toISOString(): that is UTC" thirty
    //           lines in, and datesInRange() below says it again. Both were
    //           written by rounds that fixed it locally and never grepped.
    //           tests/week-agreement-test.mjs now holds the line across all
    //           three, at every hour of the day.
    //
    // v2.19.0 — ⚠️⚠️ THE REBUILD WRITE IS DISABLED, AND A THIRD NUMBER IS ADDED
    //           THAT DOES NOT CARE WHETHER THE RECORDS OVERLAP.
    //
    //           (1) `Rebuild from sessions` NO LONGER WRITES, IN EITHER
    //           DIRECTION. HANDOFF §0.0.C. typing_sessions was found on
    //           2026-08-19 to contain rollups whose sprint windows OVERLAP in
    //           wall-clock time — one stretch of typing recorded twice by two
    //           writers, with different chunk boundaries, so sessionSignature()
    //           sees two distinct documents and counts both in full. Every
    //           argument for the up-move default rested on "sessions cannot
    //           invent time." They can, and they did. The PREVIEW is kept —
    //           it reads nothing into the database and it is evidence.
    //
    //           (2) NEW `⏱ Clock` COLUMN — THE UNION OF THE TYPING INTERVALS,
    //           NOT THE SUM OF THE RECORDS. Every sprint carries `at` (the
    //           instant it was logged) and `seconds`, so it describes the
    //           half-open wall-clock interval [at − seconds, at]. A day's real
    //           typing time is the MEASURE OF THE UNION of those intervals.
    //
    //           ⚠️ THIS IS THE WHOLE POINT: a sum double-counts an overlap and a
    //           union cannot. If one stretch of typing was recorded twice — by
    //           two tabs, by a re-sent queue, by anything — the two records
    //           cover the same minutes, and the union counts those minutes
    //           once. It is immune to the entire class of defect in §0.0, in
    //           advance, without knowing which of the three candidate causes is
    //           the real one. A child cannot type in two places at once, and
    //           this is the only column on the page that knows that.
    //
    //           ⚠️ WHAT IT CANNOT PLACE, IT REFUSES TO COUNT, AND SAYS SO. A
    //           sprint with no parseable `at`, and a pre-v2.10.0 rollup with no
    //           `sprints[]` at all, cannot be put on a timeline. Their seconds
    //           are reported SEPARATELY as `unplaced`, never folded in.
    //           Invariant 7, "absent beats approximated" — and under Jake's
    //           ruling that inflation is a lie told to a child, an unplaceable
    //           record silently added to a union is exactly that lie.
    //           ⚠️ A STUDENT WITH A LARGE `unplaced` HAS NOT BEEN MEASURED BY
    //           THIS COLUMN. Do not grade them from it. Read Total Time.
    //
    //           NOTHING HERE WRITES. This whole version is read-only.
    //
    // v2.18.0 — ⚠️ TWO CORRECTIONS TO v2.17.0, BOTH FROM JAKE'S LIVE PREVIEW.
    //
    //           (1) SCHOOL_SESSIONS_FROM WAS OFF BY ONE DAY. It was 2026-08-18,
    //           the day learn.js v2.7.0 was DEPLOYED — part-way through. School
    //           coverage on 08-18 therefore starts at whatever hour the file went
    //           up, and every School run before that hour exists only in the
    //           daily log, exactly like 08-17. Jake's preview showed a full screen
    //           of 08-18 down-moves, the largest 33m 12s → 17m 17s. Those were
    //           mornings, not corruption. ⚠️ A DEPLOY DATE IS NOT A COVERAGE DATE;
    //           coverage starts the next midnight. Now 2026-08-19.
    //
    //           (2) THE WRITE IS UP-MOVES-ONLY BY DEFAULT. An UP move means the
    //           sessions hold more than the log, and sessions cannot invent time
    //           — so it is recovering work the log lost to the cross-mode
    //           overwrite, and it can only move a student toward the truth. A
    //           DOWN move has two possible causes and this tool cannot tell them
    //           apart. Under Jake's ruling that inflation is a lie told to a
    //           child, a wrong DOWN move is the same lie pointed the other way:
    //           it deletes work they actually did. Down is now an explicit
    //           per-run opt-in with the count in front of him.
    //
    // v2.17.0 — ⚠️⚠️ TWO REFUSALS ADDED TO THE REBUILD, AND ONE OF THEM STOPPED A
    //           DATA-DESTROYING BULK WRITE JAKE WAS ONE CLICK FROM MAKING.
    //
    //           On 2026-08-19 the preview offered to move a student from 26m 24s
    //           down to 1m 51s on 2026-08-17. That was not a corrupt log being
    //           repaired: learn.js only began writing session records on
    //           2026-08-18 (HANDOFF §6 item 2), so on 08-17 a student's sessions
    //           cover their Library time and NONE of their School time. The
    //           rebuild would have written over the only surviving copy of
    //           twenty-four minutes of real graded work, in bulk, behind a
    //           preview that looked authoritative.
    //
    //           §0.8.3's "never zero a day" refusal did not catch it because the
    //           day was not empty — it had 1m 51s of Library sessions. ⚠️ A
    //           PARTIAL RECORD IS MORE DANGEROUS THAN NO RECORD, because it
    //           defeats an emptiness check. That is the lesson; the two new
    //           refusals are SCHOOL_SESSIONS_FROM and MAX_DROP_FRACTION.
    //
    //           ⚠️ BOTH ONLY AFFECT DOWNWARD MOVES. A rebuild that RAISES a
    //           student's time is recovering work the daily log lost to the
    //           cross-mode overwrite (§3.1) and is left exactly as it was.
    //
    // v2.16.0 — ⚠️⚠️ ONE NUMBER. THE WEEK-COUNTER AUDIT AND REPAIR ARE DELETED,
    //           and so are the two mirror writes into
    //           users/{uid}/stats/time_tracking. That document no longer exists:
    //           game.js v3.31.0 and learn.js v2.16.0 read the student's day and
    //           week out of typing_logs — THESE documents — through the shared
    //           daylog.js. The student's screen and this report are now reading
    //           the same seven documents per week, which is the only arrangement
    //           in which they cannot disagree. HANDOFF.md §0.0.
    //
    //           ⚠️ REQUIRES firestore.rules v2.5.0 (owner-read on typing_logs).
    //           ⚠️ DEPLOY THIS FILE BEFORE game.js/learn.js, not after — §1's
    //           "ship the consumer first" rule. This version works perfectly
    //           against the OLD page controllers (it just stops offering an audit
    //           of a document they still write); the old version against the NEW
    //           controllers would offer Jake a repair button for a document
    //           nothing reads.
    //
    //           What SURVIVES, and is now the only checking tool on this page:
    //           Reconcile vs Sessions. That compares the graded document against
    //           the append-only session record — a projection against its SOURCE,
    //           which is a real check. The audit compared two rival copies of one
    //           number, which never was.
    //
    // v2.15.0 — RECONCILIATION VIEW + REBUILD-ALL. Read-only observation first,
    //           then a bulk repair that uses the read-only view as its preview.
    //           NOTHING IN game.js OR learn.js MOVED. This version does not
    //           change how a single counter is written; it changes what Jake
    //           can SEE about the counters that were already written, and lets
    //           him apply the ⟳ button he already had to a whole report at once.
    //
    //           THE PREMISE, and it is the only reason this is safe:
    //           `typing_sessions` is the record and `typing_logs` is a cache of
    //           it. Verified 2026-08-19 by console dump — ten documents, each
    //           one's stored seconds/chars matching the sum of its own sprints[]
    //           exactly, correct source tags, no internal inconsistency. Every
    //           defect of Round 16 was in typing_logs: a live counter held in
    //           browser memory, shared by two page controllers, dependent on a
    //           tab surviving and on a write landing at page-death. So the
    //           sessions are what we compare the logs AGAINST, and the sessions
    //           are what a repair rebuilds FROM.
    //
    //           (1) RECONCILE (read-only; issues no writes of any kind).
    //               Sweeps typing_sessions for every (student, date) pair the
    //               current report covers, dedupes by sessionSignature(), and
    //               puts THREE NEW TOP-LEVEL COLUMNS on the main table:
    //               Sessions, Δ, and ⧉ (duplicate count). Sortable, so "sort by
    //               Δ" and "sort by ⧉" are the whole workflow. Jake asked for
    //               this specifically: he should not have to expand each child
    //               to find a duplicate. Expanding is now for confirming what
    //               the top-level number already told him, not for discovering
    //               it.
    //
    //           (2) REBUILD ALL. What ⟳ does for one day, for every day in the
    //               report, in one click — with a PREVIEW FIRST that separates
    //               the rows that go DOWN from the rows that go UP, because a
    //               correct rebuild can legitimately lower a child's number and
    //               Jake has to be the one who decides that is acceptable
    //               before anything is written.
    //
    //           ⚠️ THE DELTA IS NOT AUTOMATICALLY A DEFECT, and the UI says so
    //           in three places. Sessions began at v2.4.0, carry a 120-day TTL,
    //           and are written at run/unit boundaries — so a student who is
    //           mid-chapter RIGHT NOW has real time in the log that is not in
    //           sessions yet. Reconciling during a period shows a positive Δ
    //           for every child currently typing, and rebuilding during a
    //           period would truncate them to their last completed unit. That
    //           is why today's rows are EXCLUDED FROM THE REBUILD BY DEFAULT
    //           (checkbox to include), and why the preview warns during school
    //           hours. Rebuild at end of period or end of week.
    //
    //           ⚠️ THE REBUILD NEVER ZEROES A DAY. A pair with zero session
    //           documents is skipped and listed as skipped, never written — the
    //           same refusal the manual ⟳ button has always made (allowZero is
    //           NOT passed here), because a day with no sessions is usually a
    //           day that predates session logging, where the log total is real
    //           and is the only copy left.
    //
    //           ⚠️ RE-VERIFIED AT WRITE TIME. Each pair's write re-reads its
    //           sessions and compares against what the preview promised; a pair
    //           that moved in between is SKIPPED and reported, not silently
    //           written with a different number than the one Jake approved.
    //           See recalcDailyLog()'s new `expect` option.
    //
    //           KNOWN BLIND SPOT, stated rather than papered over: a student
    //           with no typing_logs document at all in the range never appears
    //           in this report, so reconciliation cannot see them either. The
    //           sweep covers every student in the report across every date in
    //           the range — including dates where they have no log — so a
    //           MISSING DAY is caught. A missing STUDENT is not. Closing that
    //           needs the class roster as the iteration source instead of the
    //           report, which is a larger change than this round.
    //
    const REPORTS_VERSION = "2.25.0";

    // ═════════════════════════════════════════════════════════════════════════
    // THE PER-SOURCE CUTOVER  (v2.22.0; hoisted to this scope in v2.24.0)
    // ═════════════════════════════════════════════════════════════════════════
    //
    // ⚠️ THIS CONSTANT IS A SECOND COPY OF daylog.js's SOURCE_SPLIT_CUTOVER, as
    // readLogTotals() is a second copy of its totalsOf(). That is a Rule 9 smell
    // and it is accepted for exactly one reason: reports.html is a standalone
    // page that imports no modules, so it cannot share the student's copy.
    // tests/daylog-cutover-test.mjs Part F LIFTS THAT FUNCTION OUT OF THIS FILE
    // and drives it against daylog.js's on identical inputs, so the two cannot
    // drift silently.
    //
    // ⚠️ IF YOU CHANGE ONE, CHANGE BOTH, IN THE SAME DEPLOY. A teacher and a
    // student reading the same document and getting different numbers is the
    // entire defect this project exists to have ended.
    //
    // ⚠️ IT LIVES AT THE TOP OF THE SCRIPT, NOT INSIDE generateReport(). Two
    // functions need it now — readLogTotals() on the read path and
    // recalcDailyLog() on the write path — and they are in different scopes.
    // ⚠️ ONE DECLARATION ONLY. daylog-cutover-test.mjs finds it by pattern; a
    // second `const SOURCE_SPLIT_CUTOVER` anywhere in this file would let the
    // read path and the write path disagree about the date with nothing to
    // notice.
    const SOURCE_SPLIT_CUTOVER = "2026-08-22";

    document.title = `TypeThatBook Reports v${REPORTS_VERSION}`;
    const _rfv = document.getElementById('footer-version');
    if (_rfv) _rfv.textContent = `Reports v${REPORTS_VERSION}`;

    import { collection, getDocs, query, where, doc, getDoc, setDoc, updateDoc, deleteDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // v2.5.0 — Multi-school support.
    //
    // Access now comes from Auth CUSTOM CLAIMS (role + schoolIds), set by the
    // setStaffRole Cloud Function and enforced by firestore.rules. The hardcoded
    // ADMIN_EMAILS list below is kept ONLY as a bootstrap fallback so nobody is
    // locked out before claims are assigned. Delete it once staff records exist.
    const BOOTSTRAP_EMAILS = [
        "jacob.wilson@sumnerk12.net",
        "jacob.v.wilson@gmail.com",
    ];

    const statusEl = document.getElementById('status');
    let reportData = [];
    let sortCol = 'seconds';
    let sortAsc = false;

    // Who's looking, and what are they allowed to see?
    let me = { uid: null, email: '', role: null, schoolIds: [], classIds: [], readScope: 'own_classes' };
    let schoolsById = {};     // schoolId -> { name }
    let classesById = {};     // classId  -> { name, schoolId }

    const isSuper = () => me.role === 'super_admin';

    // --- AUTH ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            // v2.6.0: the role comes from staff/{uid}, NOT Auth custom claims.
            // Claims need the Admin SDK → a Cloud Functions deploy → a command
            // line. A document read needs none of that, and a role change takes
            // effect immediately rather than on the next sign-in.
            me.uid = user.uid;
            me.email = user.email || '';

            // Claim a role pre-authorised by email, in case they came straight here
            // rather than via admin.html. Deliberately NOT done in game.js/learn.js:
            // that would add a read per student per session for something only staff
            // ever need.
            try {
                const lower = me.email.toLowerCase();
                if (lower) {
                    const pendSnap = await getDoc(doc(db, 'pendingStaffRoles', lower));
                    if (pendSnap.exists()) {
                        const p = pendSnap.data();
                        await setDoc(doc(db, 'staff', user.uid), {
                            email: lower, displayName: user.displayName || '',
                            role: p.role, schoolIds: p.schoolIds,
                            readScope: p.readScope, active: true,
                        }, { merge: true });
                        await deleteDoc(doc(db, 'pendingStaffRoles', lower));
                    }
                }
            } catch (e) { console.warn('Could not claim a pre-authorised role:', e); }

            try {
                const staffSnap = await getDoc(doc(db, 'staff', user.uid));
                if (staffSnap.exists() && staffSnap.data().active !== false) {
                    const sd = staffSnap.data();
                    me.role = sd.role || null;
                    me.schoolIds = Array.isArray(sd.schoolIds) ? sd.schoolIds : [];
                    me.readScope = sd.readScope || 'own_classes';
                }
            } catch (e) { console.warn('Could not read staff record:', e); }

            // Bootstrap: before any staff document exists.
            if (!me.role && BOOTSTRAP_EMAILS.includes(me.email)) {
                me.role = 'super_admin';
                me.readScope = 'building';
                statusEl.innerText = "Logged in as: " + me.email +
                    " — BOOTSTRAP MODE (no staff document yet; see SETUP-NO-CLI.md)";
                statusEl.style.borderColor = "#ffaa00";
            }

            if (!me.role) {
                statusEl.innerText = "Access Denied — this account has no staff role. " +
                    "Open the admin page to request access.";
                statusEl.style.borderColor = "#ff3333";
                document.getElementById('login-section').classList.remove('hidden');
                return;
            }

            // Which classes do they teach? Read from the classes themselves, so
            // there's no per-teacher list to keep in sync anywhere.
            try {
                const clsSnap = await getDocs(query(collection(db, 'classes'),
                    where('teacherUids', 'array-contains', user.uid)));
                me.classIds = clsSnap.docs.map(d => d.id);
            } catch (e) { console.warn('Could not read own classes:', e); }

            if (statusEl.style.borderColor !== "rgb(255, 170, 0)") {
                statusEl.innerText = `Logged in as: ${me.email} (${me.role})`;
                statusEl.style.borderColor = "#00ff41";
            }
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('reports-section').classList.remove('hidden');
            setDefaultDates();
            await loadScopeOptions();
            await loadGoals();
        } else {
            statusEl.innerText = "Not logged in.";
            statusEl.style.borderColor = "#ff3333";
            document.getElementById('login-section').classList.remove('hidden');
        }
    });

    document.getElementById('login-btn').onclick = async () => {
        try { await signInWithPopup(auth, new GoogleAuthProvider()); }
        catch (e) { alert(e.message); }
    };

    // --- SCOPE ---
    // Populate the school and class pickers from what this staff member is
    // allowed to see. A super_admin gets every school plus "All schools"; a
    // teacher gets only their own building(s), enforced again by firestore.rules.
    async function loadScopeOptions() {
        const schoolSel = document.getElementById('scope-school');
        const classSel  = document.getElementById('scope-class');
        try {
            const schoolSnap = await getDocs(collection(db, 'schools'));
            schoolSnap.forEach(d => { schoolsById[d.id] = d.data(); });

            const seesBuilding = isSuper() || me.role === 'building_admin' ||
                                 me.readScope === 'building';
            const visible = isSuper()
                ? Object.keys(schoolsById)
                : Object.keys(schoolsById).filter(id => me.schoolIds.includes(id));

            schoolSel.innerHTML = '';
            if (isSuper()) {
                schoolSel.innerHTML += '<option value="__all__">All schools</option>';
            }
            visible.forEach(id => {
                schoolSel.innerHTML += `<option value="${id}">${escapeHtml(schoolsById[id].name || id)}</option>`;
            });
            if (!visible.length && !isSuper()) {
                schoolSel.innerHTML = '<option value="">— no school assigned —</option>';
            }
            // Default a teacher to their first building rather than "all".
            if (!isSuper() && visible.length) schoolSel.value = visible[0];

            await loadClassOptions();
            schoolSel.addEventListener('change', loadClassOptions);
        } catch (e) {
            console.warn('Scope load failed:', e);
            document.getElementById('scope-note').textContent = 'Could not load schools.';
        }
    }

    async function loadClassOptions() {
        const schoolId = document.getElementById('scope-school').value;
        const classSel = document.getElementById('scope-class');
        classSel.innerHTML = '';
        try {
            const snap = await getDocs(collection(db, 'classes'));
            classesById = {};
            snap.forEach(d => { classesById[d.id] = d.data(); });

            // Classes in the selected building that this person may see.
            let ids = Object.keys(classesById).filter(id => {
                const c = classesById[id];
                if (schoolId !== '__all__' && (c.schoolId || '') !== schoolId) return false;
                if (isSuper()) return true;
                return me.schoolIds.includes(c.schoolId || '');
            });

            // Jake's requirement: default to MY classes, but able to widen.
            const mine = ids.filter(id => me.classIds.includes(id));
            if (mine.length) classSel.innerHTML += '<option value="__mine__">My classes</option>';
            // Only offer the building-wide option to people the rules will
            // actually allow it for — otherwise the query just errors.
            const seesBuilding = isSuper() || me.role === 'building_admin' ||
                                 me.readScope === 'building';
            if (seesBuilding) {
                classSel.innerHTML += '<option value="__all__">All classes in this school</option>';
            }
            if (!seesBuilding) ids = ids.filter(id => me.classIds.includes(id));
            ids.sort((a, b) => (classesById[a].period || 0) - (classesById[b].period || 0));
            ids.forEach(id => {
                const label = classesById[id].name || id;
                const tag = me.classIds.includes(id) ? ' ★' : '';
                classSel.innerHTML += `<option value="${id}">${escapeHtml(label)}${tag}</option>`;
            });
            classSel.value = mine.length ? '__mine__'
                           : (seesBuilding ? '__all__' : (ids[0] || ''));
            document.getElementById('scope-note').textContent =
                mine.length ? '★ = your class' : '';
        } catch (e) {
            console.warn('Class load failed:', e);
            classSel.innerHTML = '<option value="__all__">All classes</option>';
        }
    }

    // Build the tightest query the selected scope allows. This is the read-cost
    // fix as much as the permissions one: the old version queried typing_logs by
    // date range with no other filter, which at full enrollment is ~47,000
    // documents per report view.
    //
    // Needs two composite indexes on typing_logs:
    //   classId  ASC + date ASC
    //   schoolId ASC + date ASC
    // Firestore logs a one-click create link the first time each runs.
    function buildScopedQuery(logsRef, startDate, endDate) {
        const schoolId = document.getElementById('scope-school').value;
        const classId  = document.getElementById('scope-class').value;
        const dateRange = [where("date", ">=", startDate), where("date", "<=", endDate)];

        // A single named class is the cheapest possible query — one class-worth
        // of documents instead of a whole building's.
        if (classId && classId !== '__all__' && classId !== '__mine__') {
            return { queries: [query(logsRef, where("classId", "==", classId), ...dateRange)],
                     clientFilter: null,
                     label: `class “${classesById[classId]?.name || classId}”` };
        }

        // ⚠️ "My classes" USED TO BE BROKEN FOR THE DEFAULT TEACHER, and the
        // reason is worth understanding before anyone "simplifies" this back.
        //
        // It used to query the whole BUILDING on schoolId and narrow on the
        // client. That is fine for cost and completely wrong for security rules.
        // canReadActivity() in firestore.rules short-circuits to
        // teachesClass(d.classId) for anyone whose readScope isn't 'building' —
        // and rules are evaluated against every document the query returns, not
        // against the subset the client intends to keep. So a teacher with the
        // DEFAULT readScope of 'own_classes' got permission-denied on the one
        // scope option the UI defaults them to. Separately it would have blown
        // Firestore's ceiling of 20 get()/exists() calls per query.
        //
        // Rules are not filters. If the client intends to read only its own
        // classes, the QUERY has to say so. One equality query per class is a
        // handful of round-trips, hits the existing classId+date index, reads
        // strictly fewer documents than the building-wide version did, and every
        // document it returns is one the rules already agree the caller may see.
        //
        // Returns an ARRAY of queries; generateReport() unions the results and
        // de-duplicates by document id.
        if (classId === '__mine__') {
            const mine = (me.classIds || []).slice(0, 30);
            if (!mine.length) {
                return { queries: [], clientFilter: null,
                         label: 'your classes (none assigned)' };
            }
            return {
                queries: mine.map(cid =>
                    query(logsRef, where("classId", "==", cid), ...dateRange)),
                clientFilter: null,
                label: `your classes (${mine.length})`
            };
        }

        // Whole building.
        if (schoolId && schoolId !== '__all__') {
            return { queries: [query(logsRef, where("schoolId", "==", schoolId), ...dateRange)],
                     clientFilter: null,
                     label: `${schoolsById[schoolId]?.name || schoolId} (all classes)` };
        }

        // Every school. super_admin only, and the expensive one — this is the
        // query the whole scoping effort exists to avoid running by accident.
        return { queries: [query(logsRef, ...dateRange)], clientFilter: null, label: 'ALL SCHOOLS' };
    }

    // --- GOALS MANAGEMENT ---
    async function loadGoals() {
        try {
            const goalsSnap = await getDoc(doc(db, "settings", "goals"));
            if (goalsSnap.exists()) {
                const data = goalsSnap.data();
                document.getElementById('daily-goal').value = Math.round((data.dailySeconds || 0) / 60);
                document.getElementById('weekly-goal').value = Math.round((data.weeklySeconds || 0) / 60);
            }
        } catch (e) { console.warn("Goals load error:", e); }
    }

    document.getElementById('save-goals-btn').onclick = async () => {
        const dailyMins = parseInt(document.getElementById('daily-goal').value) || 0;
        const weeklyMins = parseInt(document.getElementById('weekly-goal').value) || 0;
        const statusDiv = document.getElementById('goal-status');
        try {
            await setDoc(doc(db, "settings", "goals"), {
                dailySeconds: dailyMins * 60,
                weeklySeconds: weeklyMins * 60,
                updatedAt: new Date()
            });
            statusDiv.textContent = `Saved: ${dailyMins}m daily / ${weeklyMins}m weekly`;
            statusDiv.className = 'goal-status ok';
        } catch (e) {
            statusDiv.textContent = "Save failed: " + e.message;
            statusDiv.className = 'goal-status err';
        }
    };

    // --- DATE HELPERS ---
    function getLastSaturday(from = new Date()) {
        const d = new Date(from);
        const day = d.getDay(); // 0=Sun
        const diff = (day + 1) % 7; // days since Saturday
        d.setDate(d.getDate() - diff);
        return d;
    }

    function getNextFriday(from = new Date()) {
        const sat = getLastSaturday(from);
        const fri = new Date(sat);
        fri.setDate(fri.getDate() + 6);
        return fri;
    }

    // ⚠️ LOCAL, NOT UTC. (v2.20.0 — this was a live defect, not a tidy-up.)
    //
    // This used to be `d.toISOString().split('T')[0]`. toISOString() converts to
    // UTC, and Nashville is UTC−5 in summer, so from 7:00 PM local onward every
    // date this produced was TOMORROW. Every caller is a date-picker default or
    // a quick-range button, so the whole effect was: **grade in the evening and
    // the range you get is shifted a day forward.**
    //
    // ⚠️ WHY IT MATTERED MORE THAN ONE DAY'S DRIFT. `This Week` fills the start
    // box from getLastSaturday(). Shifted forward, it lands on SUNDAY — so the
    // teacher's week silently began a day after the student's, and every
    // Saturday of typing fell outside the report while still being inside the
    // number on the child's screen. That is the exact divergence §0.0.1 exists
    // to prevent, and it was not in the counting code at all; it was in a date
    // formatter. HANDOFF §0.-2.
    //
    // ⚠️ THE SAME MISTAKE IS ALREADY DOCUMENTED THIRTY LINES INTO daylog.js
    // ("Never toISOString(): that is UTC") and again above datesInRange() in
    // this file. Both were written by rounds that fixed it in their own
    // function and did not grep for the other callers. Grep.
    function toDateStr(d) {
        return d.getFullYear() + '-' +
               String(d.getMonth() + 1).padStart(2, '0') + '-' +
               String(d.getDate()).padStart(2, '0');
    }

    function setDefaultDates() {
        const sat = getLastSaturday();
        const fri = getNextFriday();
        document.getElementById('date-start').value = toDateStr(sat);
        document.getElementById('date-end').value = toDateStr(fri);
    }

    // --- QUICK DATE BUTTONS ---
    document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.onclick = () => {
            const range = btn.dataset.range;
            const today = new Date();
            if (range === 'today') {
                document.getElementById('date-start').value = toDateStr(today);
                document.getElementById('date-end').value = toDateStr(today);
            } else if (range === 'this-week') {
                document.getElementById('date-start').value = toDateStr(getLastSaturday());
                document.getElementById('date-end').value = toDateStr(getNextFriday());
            } else if (range === 'last-week') {
                const lastSat = getLastSaturday();
                lastSat.setDate(lastSat.getDate() - 7);
                const lastFri = new Date(lastSat);
                lastFri.setDate(lastFri.getDate() + 6);
                document.getElementById('date-start').value = toDateStr(lastSat);
                document.getElementById('date-end').value = toDateStr(lastFri);
            }
            generateReport();
        };
    });

    // --- GENERATE ---
    document.getElementById('generate-btn').onclick = generateReport;

    // ═════════════════════════════════════════════════════════════════════════
    // THE ROSTER SWEEP  (v2.21.0)  —  READ WHAT THE STUDENT READS
    // ═════════════════════════════════════════════════════════════════════════
    //
    // ⚠️ THIS EXISTS BECAUSE THE TWO SIDES WERE ASKING DIFFERENT QUESTIONS.
    //
    // The student's screen calls daylog.js readWeek(), which fetches
    // `typing_logs/{uid}_{date}` BY DOCUMENT ID. No filter of any kind. Whatever
    // is in that document is what the child sees.
    //
    // This page queried `where("classId","==",cid)`. A daily-log document is
    // stamped with whatever `ttbClassId` held in the browser that wrote it — and
    // game.js's own comment above applyPendingClassAssignment() says exactly
    // when that is blank: a roster-imported student with no Firebase account yet
    // lands in `pendingClassAssignments/{email}`, and if they type a chapter
    // before ever opening the Lessons page, `ttbClassId` stays '' and every log
    // that session writes is stamped `classId: ''`. It self-heals days later.
    //
    // ⚠️ SO THE DOCUMENT EXISTS, THE CHILD SEES IT, AND NO CLASS QUERY ON THIS
    // PAGE COULD EVER RETURN IT. That is the sacred rule broken by a WHERE
    // clause, and it fires hardest on DAY ONE OF A ROTATION OR A NEW SCHOOL,
    // when every student is new at once.
    //
    // The fix is to stop asking a different question. The roster — `users` where
    // `classId == cid` — is the iteration source, and every (uid, date) is read
    // BY ID. Round 18 named this ("needs the class roster as the iteration
    // source instead of the report") and deferred it.
    //
    // ⚠️ THE CLASS QUERY IS KEPT, AND NOT AS A BELT-AND-BRACES. It finds
    // students the roster does NOT: a child whose `users` document is missing or
    // carries a stale classId still leaves stamped logs. The two sources are
    // UNIONED for discovery and then every uid is read the same way. Neither
    // alone is complete; the union is the closest this page can get to "every
    // child who typed."
    //
    // COST: (students × days) reads by id. 90 students over a school week is
    // ~630 — small, and each is a point read, the cheapest thing Firestore does.
    const MAX_ROSTER_PAIRS = 4000;

    async function readRosterUids(startDate, endDate) {
        const schoolId = document.getElementById('scope-school').value;
        const classId  = document.getElementById('scope-class').value;
        const usersRef = collection(db, 'users');
        const out = new Map();   // uid -> { classId, name, email }
        const queries = [];

        if (classId && classId !== '__all__' && classId !== '__mine__') {
            queries.push(query(usersRef, where('classId', '==', classId)));
        } else if (classId === '__mine__') {
            (me.classIds || []).slice(0, 30).forEach(cid =>
                queries.push(query(usersRef, where('classId', '==', cid))));
        } else if (schoolId && schoolId !== '__all__') {
            queries.push(query(usersRef, where('schoolId', '==', schoolId)));
        } else if (isSuper()) {
            queries.push(query(usersRef));
        }

        for (const q of queries) {
            const snap = await getDocs(q);
            snap.forEach(d => {
                const u = d.data() || {};
                out.set(d.id, { classId: u.classId || '', name: u.displayName || '', email: u.email || '' });
            });
        }
        return out;
    }

    // Read one student-day BY ID — byte-for-byte the read daylog.js performs.
    // ⚠️ A FAILED READ RETURNS null, NEVER ZERO. A day we could not read is not
    // a day with no typing, and a report that cannot tell those apart shows a
    // child a zero they did not earn. Callers count nulls and say so.
    async function readLogById(uid, date) {
        try {
            const snap = await getDoc(doc(db, 'typing_logs', `${uid}_${date}`));
            if (!snap.exists()) return { missing: true };
            return { missing: false, data: snap.data() };
        } catch (e) {
            console.warn('[roster] read failed', uid, date, e && e.message);
            return { error: e.message || String(e) };
        }
    }

    async function generateReport() {
        const startDate = document.getElementById('date-start').value;
        const endDate = document.getElementById('date-end').value;
        if (!startDate || !endDate) return alert("Pick both dates.");

        statusEl.innerText = "Querying...";
        document.getElementById('results-container').classList.add('hidden');
        document.getElementById('empty-msg').classList.add('hidden');

        try {
            const logsRef = collection(db, "typing_logs");
            const scoped = buildScopedQuery(logsRef, startDate, endDate);
            statusEl.innerText = `Querying ${scoped.label}...`;

            if (!scoped.queries.length) {
                statusEl.innerText = "No classes assigned to you yet — ask your " +
                    "building admin to add you to a class, or pick a different scope.";
                statusEl.style.borderColor = "#ffaa00";
                return;
            }

            // ⚠️ READ CEILING. Every query on this page used to be unbounded. A
            // building admin asking for a whole semester is roughly
            // 1,400 students x 90 days = ~126,000 document reads ON ONE CLICK —
            // two and a half times the entire daily free tier, out of Jake's
            // pocket, for a table no human can read anyway. And the browser
            // would sit frozen while it happened.
            //
            // The cap is deliberately a REFUSAL, not a truncation. A silently
            // truncated report is worse than no report: a teacher grades from
            // it and never learns it was incomplete. So we stop, say what
            // happened, and tell them how to narrow it.
            const MAX_REPORT_DOCS = 20000;

            let docs = [];
            const seen = new Set();
            try {
                // Sequential, not Promise.all: if the ceiling is going to be hit
                // we want to stop issuing reads, not fire them all and then
                // discover the total. Costing less on the failure path matters
                // more here than shaving a second off the success path.
                for (const q of scoped.queries) {
                    const snap = await getDocs(q);
                    snap.forEach(d => {
                        // De-duplicate: the "my classes" path issues one query
                        // per class, and while a typing_logs doc belongs to
                        // exactly one class today, a student reassigned
                        // mid-range could legitimately appear under two.
                        if (seen.has(d.id)) return;
                        seen.add(d.id);
                        docs.push(d);
                    });
                    if (docs.length > MAX_REPORT_DOCS) break;
                }
            } catch (e) {
                // Almost always a missing composite index while it builds.
                statusEl.innerText = "Query failed — see console. If this mentions " +
                    "an index, click the link it logs and try again once it's built.";
                statusEl.style.borderColor = "#ff3333";
                console.error("Scoped report query failed:", e);
                return;
            }

            if (docs.length > MAX_REPORT_DOCS) {
                statusEl.innerText =
                    `Too much data — ${scoped.label} over ${startDate} to ${endDate} ` +
                    `is more than ${MAX_REPORT_DOCS.toLocaleString()} daily records. ` +
                    `Narrow the date range or pick a single class. ` +
                    `(Stopping here on purpose: a partial report you can't tell is ` +
                    `partial is worse than none.)`;
                statusEl.style.borderColor = "#ffaa00";
                return;
            }

            // ⚠️ v2.13.0 — READ-SIDE OF THE SOURCE SPLIT. game.js v3.29.0 /
            // learn.js v2.14.0 write secondsLibrary/secondsSchool (etc.)
            // instead of a shared seconds/chars/mistakes triple — see either
            // file's header for the incident this closes. A document that has
            // EITHER split field present is read as the sum of both (0 for
            // whichever side never wrote); a document that has NEITHER
            // — everything from before this shipped, or a day cleared back to
            // the legacy shape by a manual Save (see save-log-btn below) —
            // falls back to the flat fields. This is the only place that needs
            // to know both shapes exist; everything downstream (this
            // function's own aggregation, the reconcile sweep, the daily
            // log editor) keeps reading plain `seconds`/`chars`/`mistakes` off
            // whatever this returns.
            // ⚠️ v2.13.1 — SUMS THE LEGACY FIELD IN, RATHER THAN LETTING A SPLIT
            // FIELD SUPERSEDE IT. v2.13.0 returned the split sum alone whenever
            // either split field existed, and Jake caught the consequence in
            // live testing: on the day the split shipped, his morning's School
            // time had been recorded by the OLD code as flat `seconds`, and the
            // moment the new Library code wrote a split field that morning
            // simply vanished from the report.
            //
            // Summing is correct because the two shapes describe DISJOINT
            // periods. `seconds` can only have been written by pre-split code;
            // the split fields only ever carry what post-split code counted
            // itself (see game.js v3.29.1's per-page counters — they start at
            // zero on page load and never include anything the old code already
            // recorded). Nothing is double-counted and nothing is dropped.
            // Both repair paths keep this true: recalcDailyLog() deletes the
            // legacy fields when it writes splits, and save-log-btn deletes the
            // splits when it writes a manual flat total.
            // ⚠️ v2.14.0 — LEGACY-FIRST, because game.js v3.30.0 / learn.js
            // v2.15.0 REVERTED the source split and write the flat triple
            // again. Summing (v2.13.1) would now DOUBLE-COUNT any day that
            // still carries split fields written during the brief window the
            // split was deployed: the flat number is the full combined day
            // total from the shared counter, so the splits beside it are the
            // same time counted a second time.
            //
            // Legacy-first is correct in the reverted world: `seconds` is
            // always authoritative when present, and the split fields are
            // read ONLY for a day that has no flat number at all — i.e. the
            // handful of documents written while the split was live, which
            // would otherwise read as zero and lose a real day of typing.
            // Those days heal themselves: the next flat write from either
            // page supersedes them, and ⟳ rewrites them flat outright.
            // ═════════════════════════════════════════════════════════════════
            // v2.22.0 — THE PER-SOURCE CUTOVER. ROADMAP Phase B, step B2.
            // ═════════════════════════════════════════════════════════════════
            //
            // ⚠️ THIS CONSTANT AND THIS FUNCTION ARE A SECOND COPY OF daylog.js's
            // SOURCE_SPLIT_CUTOVER AND totalsOf(). That is a Rule 9 smell and it
            // is accepted for exactly one reason: reports.html is a standalone
            // page that imports no modules, so it cannot share the student's
            // copy. tests/daylog-cutover-test.mjs Part G LIFTS THIS FUNCTION OUT
            // OF THIS FILE and drives it against daylog.js's on the same inputs,
            // so the two cannot drift silently.
            //
            // ⚠️ IF YOU CHANGE ONE, CHANGE BOTH, IN THE SAME DEPLOY. A teacher
            // and a student reading the same document and getting different
            // numbers is the entire defect this project exists to have ended.
            // ⚠️ v2.24.0 — THE DECLARATION MOVED TO THE TOP OF THIS SCRIPT and is
            // no longer here. It was scoped inside generateReport(), which was
            // invisible until recalcDailyLog() — a sibling function, outside that
            // scope — needed it and got a ReferenceError on the ⟳ button that
            // nothing on screen would have explained. Found by
            // undefined-calls-test.mjs, which is exactly the class of defect that
            // harness exists for. Search REPORTS_VERSION to find it.

            // Days on or after the cutover read `seconds` PLUS both split
            // triples; days before it read legacy-first, exactly as v2.21.0 did.
            // After the writers change, the flat field is FROZEN — never written
            // again — so on a post-cutover document it is the pre-cutover
            // remainder, not a duplicate of the splits beside it.
            //
            // ⚠️ A MISSING dateStr TAKES THE OLD PATH ON PURPOSE: a caller that
            // forgets the date must fail toward "nothing changed" rather than
            // start summing historical documents. YYYY-MM-DD sorts
            // lexicographically, so the string compare is exact.
            function readLogTotals(data, dateStr) {
                const flat = {
                    seconds:  data.seconds  || 0,
                    chars:    data.chars    || 0,
                    mistakes: data.mistakes || 0,
                };
                const split = {
                    seconds:  (data.secondsLibrary  || 0) + (data.secondsSchool  || 0),
                    chars:    (data.charsLibrary    || 0) + (data.charsSchool    || 0),
                    mistakes: (data.mistakesLibrary || 0) + (data.mistakesSchool || 0),
                };
                if (dateStr && dateStr >= SOURCE_SPLIT_CUTOVER) {
                    return {
                        seconds:  flat.seconds  + split.seconds,
                        chars:    flat.chars    + split.chars,
                        mistakes: flat.mistakes + split.mistakes,
                    };
                }
                if ('seconds' in data || 'chars' in data || 'mistakes' in data) return flat;
                return split;
            }

            // ═════════════════════════════════════════════════════════════════
            // v2.21.0 — DISCOVER BY QUERY, THEN READ BY ID.
            // ═════════════════════════════════════════════════════════════════
            //
            // The class query above is now a DISCOVERY pass only. Its results
            // are never summed. Every number below comes from a point read of
            // `typing_logs/{uid}_{date}` — the identical read daylog.js makes
            // for the student. That is not a style preference: it is the only
            // arrangement in which the teacher's number and the child's number
            // cannot answer different questions. See readRosterUids().
            const uids = new Map();     // uid -> { name, email }
            docs.forEach(d => {
                const data = d.data();
                if (scoped.clientFilter && !scoped.clientFilter(data)) return;
                if (!data.uid) return;
                uids.set(data.uid, { name: data.displayName || 'Unknown', email: data.email || '' });
            });
            const discoveredByLogs = new Set(uids.keys());

            // ⚠️ A ROSTER FAILURE MUST NOT SILENTLY DEGRADE TO THE OLD BEHAVIOUR.
            // Falling back to the class query alone would produce a report that
            // looks exactly like a correct one and is short by every student
            // with a blank classId — which is the defect this whole section
            // exists to end. Say it on screen instead.
            let rosterOk = true, rosterAdded = 0;
            try {
                const roster = await readRosterUids(startDate, endDate);
                roster.forEach((info, uid) => {
                    if (!uids.has(uid)) {
                        uids.set(uid, { name: info.name || 'Unknown', email: info.email || '' });
                        rosterAdded++;
                    } else if (info.name && uids.get(uid).name === 'Unknown') {
                        uids.get(uid).name = info.name;
                    }
                });
            } catch (e) {
                rosterOk = false;
                console.warn('[roster] roster read failed:', e);
            }

            const dateList = datesInRange(startDate, endDate);
            if (uids.size * dateList.length > MAX_ROSTER_PAIRS) {
                statusEl.innerText =
                    `Too much data — ${uids.size} students × ${dateList.length} days is over ` +
                    `${MAX_ROSTER_PAIRS.toLocaleString()} reads. Narrow the range or pick one class. ` +
                    `(Stopping on purpose: a partial report you cannot tell is partial is worse than none.)`;
                statusEl.style.borderColor = "#ffaa00";
                return;
            }

            statusEl.innerText = `Reading ${uids.size} students × ${dateList.length} days by id…`;

            const userMap = {};
            let unreadable = 0, hiddenFromQuery = 0;
            const pairs = [];
            uids.forEach((info, uid) => dateList.forEach(date => pairs.push({ uid, date, info })));

            await runPool(pairs, async (p) => {
                const res = await readLogById(p.uid, p.date);
                if (res.error) { unreadable++; return; }
                if (res.missing) return;
                const data = res.data;
                // ⚠️ p.date, NOT data.date. The pair drives the point read, so
                // it is the date this document was FETCHED under; data.date is
                // whatever the writer stamped inside it and has been wrong
                // before. The gate must key off the id, like the read did.
                const t = readLogTotals(data, p.date);
                if (!userMap[p.uid]) {
                    userMap[p.uid] = {
                        uid: p.uid,
                        name: data.displayName || p.info.name || 'Unknown',
                        email: data.email || p.info.email || '',
                        seconds: 0, chars: 0, mistakes: 0,
                        days: new Set(), dailyLogs: [],
                    };
                }
                // ⚠️ A DOCUMENT THE CLASS QUERY COULD NOT SEE. Counted so the
                // divergence is a number on screen rather than a silent
                // correction — Jake needs to know his roster stamping is
                // drifting, not just get a quietly better total.
                if (!discoveredByLogs.has(p.uid) || (data.classId || '') === '') hiddenFromQuery++;
                const u = userMap[p.uid];
                u.seconds += t.seconds; u.chars += t.chars; u.mistakes += t.mistakes;
                u.days.add(p.date);
                u.dailyLogs.push({ docId: `${p.uid}_${p.date}`, date: p.date,
                                   seconds: t.seconds, chars: t.chars, mistakes: t.mistakes });
                if (data.displayName) u.name = data.displayName;
                if (data.email) u.email = data.email;
            }, (done, total) => {
                statusEl.innerText = `Read ${done.toLocaleString()} of ${total.toLocaleString()} student-days…`;
            });

            // v2.21.0 — the class query no longer contributes totals, so nothing is
            // "skipped" by a client filter any more. Kept as a binding so the
            // CSV/status code below reads unchanged.
            const skipped = 0;
            window._ttbRosterNote = { rosterOk, rosterAdded, unreadable, hiddenFromQuery,
                                      studentsRead: uids.size, days: dateList.length };

            reportData = Object.values(userMap).map(u => ({
                uid: u.uid,
                name: u.name,
                email: u.email,
                seconds: u.seconds,
                chars: u.chars,
                mistakes: u.mistakes,
                days: u.days.size,
                dailyLogs: u.dailyLogs.sort((a, b) => a.date.localeCompare(b.date)),
                wpm: u.seconds > 0 ? Math.round((u.chars / 5) / (u.seconds / 60)) : 0,
                accuracy: (u.chars + u.mistakes) > 0 ? Math.round((u.chars / (u.chars + u.mistakes)) * 100) : 100,
            }));

            if (reportData.length === 0) {
                document.getElementById('empty-msg').classList.remove('hidden');
                statusEl.innerText = "No data found.";
                return;
            }

            sortCol = 'seconds';
            sortAsc = false;
            renderTable();
            
            const totalSecs = reportData.reduce((s, r) => s + r.seconds, 0);
            document.getElementById('total-line').innerHTML = 
                `<strong>${reportData.length}</strong> students — <strong>${formatTime(totalSecs)}</strong> total typing time`;
            const _n = window._ttbRosterNote || {};
            document.getElementById('results-info').innerHTML =
                `${escapeHtml(scoped.label)} · ${startDate} through ${endDate} — ` +
                `read <strong>by document id</strong>, the same read the student's own screen makes ` +
                `(${_n.studentsRead || 0} students \u00d7 ${_n.days || 0} days)` +
                (_n.rosterAdded ? ` \u00b7 <strong>${_n.rosterAdded}</strong> student(s) found on the roster ` +
                                  `with no class-stamped log` : '') +
                (_n.hiddenFromQuery ? ` \u00b7 <strong style="color:#ffaa00;">${_n.hiddenFromQuery} day(s) ` +
                                      `the old class query could not see</strong>` : '') +
                (_n.unreadable ? ` \u00b7 <span style="color:#ff8888;">${_n.unreadable} unreadable</span>` : '') +
                (_n.rosterOk === false
                    ? `<br><span style="color:#ff8888;">\u26a0\ufe0f THE ROSTER READ FAILED, so this report covers only ` +
                      `students who left a class-stamped log. Any student whose logs carry a blank classId is ` +
                      `MISSING from it entirely. Check the console \u2014 this is not a clean report.</span>`
                    : '');

            document.getElementById('results-container').classList.remove('hidden');
            statusEl.innerText = `Found ${reportData.length} students.`;
            statusEl.style.borderColor = "#00ff41";

        } catch (e) {
            console.error(e);
            statusEl.innerText = "Error: " + e.message;
            statusEl.style.borderColor = "#ff3333";
        }
    }


    // ═════════════════════════════════════════════════════════════════════════
    // ⚠️ THE WEEK-COUNTER AUDIT AND ITS REPAIR ARE DELETED (v2.16.0)
    // ═════════════════════════════════════════════════════════════════════════
    //
    // Roughly 240 lines lived here: auditWeekCounters(), renderAuditPanel(),
    // repairWeekCounter(), bucket(), WEEK_TOLERANCE, weekStartOf(), addDays().
    // All of it existed for ONE purpose — dragging a SECOND copy of each
    // student's week total (`users/{uid}/stats/time_tracking`) back into line
    // with the first (`typing_logs`). HANDOFF §0.0.
    //
    // ⚠️ THERE IS NO SECOND COPY ANY MORE, SO THERE IS NOTHING TO AUDIT.
    // game.js v3.31.0 and learn.js v2.16.0 read the student's day and week out
    // of `typing_logs/{uid}_{date}` — these documents, the ones this page
    // grades from. The week total is the SUM of seven of them, recomputed on
    // every page load and stored nowhere. A derived quantity has no stored
    // value to be wrong, no merge to double it, and no repair path.
    //
    // Jake, 2026-08-19: "I can't run an audit every time." He was right, and a
    // faster audit was never the answer.
    //
    // ⚠️ WHAT WENT WITH IT, ON PURPOSE:
    //   * `repairedAt`. It existed so a live tab could tell "the number went
    //     down because someone corrected it" from "the number went down because
    //     it was lost". Nothing corrects a week total now. checkForWeekRepair()
    //     is deleted from both page controllers to match.

    //     race required a repair to race against.
    //
    // ⚠️ IF A FUTURE ROUND WANTS THIS BACK, IT WANTS THE SECOND COPY BACK, and
    // that is the thing to argue about first. What remains — and what is
    // actually needed — is `Reconcile vs Sessions` below: it compares the graded
    // document against the append-only session record, which is a comparison
    // between a projection and its SOURCE, not between two rival copies.

    document.addEventListener('click', (e) => {
        if (e.target.classList && e.target.classList.contains('uid-chip')) {
            const uid = e.target.dataset.uid || '';
            if (uid && navigator.clipboard) navigator.clipboard.writeText(uid).catch(() => {});
        }
