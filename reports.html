    // ═════════════════════════════════════════════════════════════════════════
    // ⚠️ RECONCILE VS SESSIONS AND REBUILD-FROM-SESSIONS ARE DELETED (v2.25.0)
    // ═════════════════════════════════════════════════════════════════════════
    //
    // Roughly 830 lines lived here: runReconcile(), renderReconPanel(),
    // reconCellsHtml(), readPairSessions(), unionSprintSeconds(), uidIndexMap(),
    // buildRebuildPlan(), renderRebuildPreview(), runRebuildAll(), localToday(),
    // and the Sessions / Δ / ⧉ / ⏱ Clock columns and their notes panels.
    //
    // Jake, 2026-08-20: "Torch it. Torch the reconcile." Confirmed with him a
    // second time in Round 23, boundary and all, because the tool shared this
    // file with three things he USES and that were never implicated.
    //
    // ⚠️ WHAT STAYED, AND THE LINE BETWEEN THEM IS THE WHOLE POINT:
    //   * Generate, and the CSV export.
    //   * The per-student DRILL-DOWN, including its ⧉ duplicate badge.
    //   * The per-day editor, its SAVE box, and ⟳ Recalculate on a single day.
    //     ⟳ is not the rebuild. It corrects ONE day that a teacher is looking
    //     at, behind a drop guard, and it is date-gated for the per-source
    //     cutover. The thing that was dangerous was applying it across a whole
    //     report from a preview nobody could check row by row.
    //
    // ⚠️ THE REBUILD HAD ALREADY BEEN DISABLED SINCE v2.19.0 and wrote nothing,
    // so nothing about the database changes today. What goes is the machinery
    // behind a button that did nothing and four columns that only ever filled in
    // after a sweep. tests/reconcile-test.mjs and tests/union-clock-test.mjs
    // covered this code and are deleted in the same commit — the registration
    // audit in run-all-tests.mjs catches it if only one half of that happens.
    //
    // ⚠️ THE REAL SESSION DOCUMENTS union-clock-test.mjs HELD ARE NOT LOST. They
    // were lifted first, into tests/real-sessions-fixture.mjs, because ROADMAP
    // item 1 needs them and Jake's rule 10 will not accept synthetic records for
    // a defect that lives BETWEEN records. That file is the reason this deletion
    // was safe to make.
    //
    // ⚠️ IF A FUTURE ROUND WANTS A COMPARISON BACK, WHAT IT PROBABLY WANTS IS
    // ROADMAP item 3 — a read-only implausibility FLAG that says "go and look"
    // and leaves the judgement with the teacher. Not a screen that computes a
    // Δ nobody can act on, and not a button that writes across a roster.


    // Every date in [start, end], as YYYY-MM-DD, built by string arithmetic on
    // a local-noon Date so a timezone offset can never shift a day. (toDateStr
    // above used to go through toISOString and be UTC — v2.20.0 fixed it, and
    // tests/week-agreement-test.mjs Part D now holds both to the local rule.
    // This function was always correct; it was written by a round that fixed
    // the problem here and did not grep for the other formatter thirty lines
    // up. That is how the same defect survived in one file twice.)
    function datesInRange(startStr, endStr) {
        const out = [];
        const d = new Date(startStr + 'T12:00:00');
        const end = new Date(endStr + 'T12:00:00');
        if (isNaN(d) || isNaN(end) || d > end) return out;
        let guard = 0;
        while (d <= end && guard++ < 400) {
            out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
            d.setDate(d.getDate() + 1);
        }
        return out;
    }

    // A tiny worker pool. Sequential would take a minute on a week of ninety
    // students and Jake would reasonably assume it had hung; firing all of them
    // at once is how you get a browser to drop connections.
    //
    // ⚠️ v2.25.0 — IT USED TO READ `RECONCILE_CONCURRENCY` AND `reconCancel`,
    // both of which went with the reconcile. It has its own constant now and no
    // cancel: its one remaining caller is generateReport()'s point-read sweep,
    // which is already bounded by MAX_ROSTER_PAIRS and has never had a cancel
    // button to honour. Do not re-add one here without adding the button too —
    // a flag nothing can set is a branch nothing can test.
    const POOL_CONCURRENCY = 6;   // polite to Firestore, ~10x faster than serial

    async function runPool(items, worker, onProgress) {
        let next = 0, done = 0;
        const runners = new Array(Math.min(POOL_CONCURRENCY, items.length))
            .fill(0).map(async () => {
                while (true) {
                    const i = next++;
                    if (i >= items.length) return;
                    await worker(items[i], i);
                    done++;
                    if (onProgress && (done % 10 === 0 || done === items.length)) {
                        onProgress(done, items.length);
                    }
                }
            });
        await Promise.all(runners);
        return done;
    }

    // --- TABLE RENDERING ---
    function renderTable() {
        reportData.sort((a, b) => {
            let va = a[sortCol], vb = b[sortCol];
            // ⚠️ THE NULL HANDLING STAYS THOUGH THE COLUMNS THAT NEEDED IT ARE
            // GONE (v2.25.0). Every remaining column is always a number or a
            // string — but sortCol comes from a `data-col` attribute in the
            // markup, so a future column that is sometimes absent would sort as
            // 0 and make "unknown" look like "fine". That was the v2.15.0
            // lesson and it cost nothing to keep. Un-measured rows sink.
            if (va === null || va === undefined || vb === null || vb === undefined) {
                if (va === vb) return 0;
                if (va === null || va === undefined) return 1;
                return -1;
            }
            if (typeof va === 'string') va = va.toLowerCase();
            if (typeof vb === 'string') vb = vb.toLowerCase();
            if (va < vb) return sortAsc ? -1 : 1;
            if (va > vb) return sortAsc ? 1 : -1;
            return 0;
        });

        const tbody = document.getElementById('report-body');
        tbody.innerHTML = reportData.map((r, idx) => `
            <tr class="summary-row" data-idx="${idx}">
                <td>${escapeHtml(r.name)}<span class="uid-chip" title="Student ID: ${r.uid} (click to copy)" data-uid="${r.uid}">${String(r.uid).slice(0,8)}</span></td>
                <td>${escapeHtml(r.email)}</td>
                <td class="time-cell">${formatTime(r.seconds)}</td>
                <td>${r.chars.toLocaleString()}</td>
                <td class="wpm-cell">${r.wpm}</td>
                <td>${r.accuracy}%</td>
                <td>${r.days}</td>
                <td><button class="details-row-btn" data-idx="${idx}">Details</button></td>
            </tr>
            <tr class="detail-row hidden" id="detail-${idx}">
                <td colspan="8">
                    <div class="daily-logs">
                        ${r.dailyLogs.map((log, li) => {
                            const mins = Math.floor(log.seconds / 60);
                            const secs = log.seconds % 60;
                            return `
                            <div class="daily-log-entry" data-idx="${idx}" data-li="${li}">
                                <span class="log-date expand-sessions" data-uid="${r.uid}" data-date="${log.date}" title="Click to view sessions">▶ ${log.date}</span>
                                <input type="number" class="log-min-input" value="${mins}" min="0" step="1" title="Minutes" style="width:45px;" />
                                <span class="goal-unit">m</span>
                                <input type="number" class="log-sec-input" value="${secs}" min="0" max="59" step="1" title="Seconds" style="width:45px;" />
                                <span class="goal-unit">s</span>
                                <span class="log-chars">${log.chars.toLocaleString()} chars</span>
                                <button class="save-log-btn" data-idx="${idx}" data-li="${li}">Save</button>
                                <button class="recalc-btn" data-idx="${idx}" data-li="${li}" data-uid="${r.uid}" data-date="${log.date}" title="Recalculate from sessions">⟳</button>
                                <span class="log-save-status" id="log-status-${idx}-${li}"></span>
                            </div>
                            <div class="sessions-container hidden" id="sessions-${r.uid}-${log.date}" data-idx="${idx}" data-li="${li}" data-uid="${r.uid}" data-date="${log.date}"></div>
                        `}).join('')}
                    </div>
                </td>
            </tr>
        `).join('');

        // Update sort indicators
        document.querySelectorAll('th').forEach(th => {
            th.classList.remove('sorted');
            const arrow = th.querySelector('.sort-arrow');
            if (arrow) arrow.textContent = '▲';
        });
        const activeTh = document.querySelector(`th[data-col="${sortCol}"]`);
        if (activeTh) {
            activeTh.classList.add('sorted');
            activeTh.querySelector('.sort-arrow').textContent = sortAsc ? '▲' : '▼';
        }
    }

    // Column header sort
    document.querySelectorAll('th[data-col]').forEach(th => {
        th.onclick = () => {
            const col = th.dataset.col;
            if (sortCol === col) sortAsc = !sortAsc;
            else { sortCol = col; sortAsc = (col === 'name' || col === 'email'); }
            renderTable();
        };
    });

    // Edit/Save delegation on table
    document.getElementById('report-body').addEventListener('click', async (e) => {
        // Toggle detail row
        if (e.target.classList.contains('details-row-btn')) {
            const idx = e.target.dataset.idx;
            const detailRow = document.getElementById(`detail-${idx}`);
            if (detailRow) {
                detailRow.classList.toggle('hidden');
                e.target.textContent = detailRow.classList.contains('hidden') ? 'Details' : '▾';
            }
            return;
        }

        // Expand sessions for a day
        if (e.target.classList.contains('expand-sessions')) {
            const uid = e.target.dataset.uid;
            const date = e.target.dataset.date;
            const container = document.getElementById(`sessions-${uid}-${date}`);
            if (!container) return;
            
            if (!container.classList.contains('hidden')) {
                container.classList.add('hidden');
                e.target.textContent = `▶ ${date}`;
                return;
            }
            
            e.target.textContent = `▼ ${date}`;
            container.classList.remove('hidden');
            container.innerHTML = '<div style="padding:8px; color:#888; font-size:0.75rem;">Loading sessions...</div>';
            
            try {
                const sessionsRef = collection(db, "typing_sessions");
                const q = query(sessionsRef, 
                    where("uid", "==", uid), 
                    where("date", "==", date)
                );
                const snap = await getDocs(q);
                
                if (snap.empty) {
                    container.innerHTML = '<div style="padding:8px; color:#666; font-size:0.75rem; font-style:italic;">No session data (sessions logged from v2.4.0+)</div>';
                    return;
                }
                
                // Collect and sort by timestamp
                const sessions = [];
                snap.forEach(d => sessions.push({ id: d.id, ...d.data() }));
                sessions.sort((a, b) => {
                    const ta = a.timestamp?.toDate ? a.timestamp.toDate().getTime() : 0;
                    const tb = b.timestamp?.toDate ? b.timestamp.toDate().getTime() : 0;
                    return ta - tb;
                });
                
                let totalWPM = 0, totalAcc = 0;
                sessions.forEach(s => { totalWPM += s.wpm || 0; totalAcc += s.accuracy || 0; });
                const avgWPM = Math.round(totalWPM / sessions.length);
                const avgAcc = Math.round(totalAcc / sessions.length);
                
                // ⚠️ THE PER-SPRINT DETAIL WAS ALWAYS HERE AND WAS NEVER SHOWN.
                //
                // Every rollup carries a `sprints[]` array — one entry per sprint
                // or per lesson run, each with its own seconds, chars, mistakes,
                // WPM, accuracy and an ISO timestamp. Until v2.10.0 this view
                // rendered only the rollup's TOTALS, which is the one thing that
                // cannot show a sudden jump in speed: averaging a cheated run in
                // with nine honest ones is exactly how it disappears. The data
                // cost nothing extra to store and costs nothing extra to read —
                // it is inside a document already being fetched.
                //
                // Per-sprint outlier detection uses the mean of the OTHER sprints
                // in the same rollup, not the mean including the sprint being
                // judged, so one very fast run cannot raise the bar it is being
                // measured against and hide itself.
                // ⚠️ MARK DUPLICATE ROLLUPS RATHER THAN HIDING THEM. (v2.13.2)
                // recalcDailyLog() ignores duplicates arithmetically, but this
                // view stays honest: Jake needs to SEE the extra document to
                // delete it, and a drill-down that silently collapsed them
                // would contradict the row count above it. See
                // sessionSignature() for what counts as a duplicate and
                // session-log.js v1.3.0 for the race that created them.
                const _seenSig = new Set();
                const _isDupe = new Map();
                sessions.forEach(s => {
                    const sig = sessionSignature(s, s.id);
                    _isDupe.set(s.id, _seenSig.has(sig));
                    _seenSig.add(sig);
                });

                const allSprints = [];
                sessions.forEach(s => (s.sprints || []).forEach(sp => allSprints.push(sp)));
                const spWPMs = allSprints.map(sp => sp.wpm || 0);
                const spMean = spWPMs.length ? spWPMs.reduce((a, b) => a + b, 0) / spWPMs.length : 0;

                container.innerHTML = sessions.map(s => {
                    const time = s.timestamp?.toDate ? s.timestamp.toDate() : new Date(s.timestamp);
                    const timeStr = time.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
                    const suspicious = (s.wpm > avgWPM * 1.5 && avgWPM > 10) || (s.accuracy > avgAcc + 15 && avgAcc < 90);
                    const flag = suspicious ? '<span class="flag-icon" title="Unusual stats">🚩</span>' : '';
                    const src = s.source === 'school' ? 'School'
                              : s.source === 'library' ? 'Library' : '';
                    const sprints = Array.isArray(s.sprints) ? s.sprints : [];
                    const sprintRows = sprints.map((sp, i) => {
                        const spTime = sp.at ? new Date(sp.at) : null;
                        const spTimeStr = (spTime && !isNaN(spTime))
                            ? spTime.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
                            : '\u2014';
                        // Mean of the others, so a fast run can't inflate its own bar.
                        const others = spWPMs.length > 1
                            ? (spWPMs.reduce((a, b) => a + b, 0) - (sp.wpm || 0)) / (spWPMs.length - 1)
                            : spMean;
                        const spOdd = others > 10 && (sp.wpm || 0) > others * 1.6;
                        return `
                            <div class="sprint-row${spOdd ? ' suspicious' : ''}">
                                <span class="sprint-idx">${i + 1}</span>
                                <span class="session-time">${spTimeStr}</span>
                                <span class="session-stat">${formatTime(sp.seconds || 0)}</span>
                                <span class="session-stat">${sp.wpm || 0} WPM</span>
                                <span class="session-stat">${sp.accuracy != null ? sp.accuracy : '\u2014'}%</span>
                                <span class="session-stat">${(sp.chars || 0).toLocaleString()} ch</span>
                                <span class="session-book">${escapeHtml(sp.detail || '')}</span>
                                ${spOdd ? '<span class="flag-icon" title="Much faster than this student\u2019s other runs today">\uD83D\uDEA9</span>' : ''}
                            </div>`;
                    }).join('');
                    return `
                        <div class="session-entry${suspicious ? ' suspicious' : ''}" data-session-id="${s.id}">
                            <span class="session-time">${timeStr}</span>
                            <span class="session-stat">${formatTime(s.seconds)}</span>
                            <span class="session-stat">${s.wpm} WPM</span>
                            <span class="session-stat">${s.accuracy}%</span>
                            <span class="session-stat">${s.sprintCount || sprints.length} runs</span>
                            ${src ? `<span class="session-src">${src}</span>` : ''}
                            <span class="session-book">${escapeHtml((s.bookId || '').replace(/_/g, ' '))}</span>
                            ${flag}
                            ${_isDupe.get(s.id) ? '<span class="dupe-tag" title="Identical to an earlier rollup today — almost certainly written twice by the pre-v1.3.0 flush race. Not counted by the &#8635; recalculate button. Safe to delete.">\u29c9 duplicate</span>' : ''}
                            <button class="delete-session-btn" data-session-id="${s.id}" title="Delete session">✕</button>
                        </div>
                        ${sprintRows ? `<div class="sprint-list">${sprintRows}</div>` : ''}
                    `;
                }).join('');
                
            } catch (err) {
                console.error("Sessions load error:", err);
                container.innerHTML = `<div style="padding:8px; color:#ff3333; font-size:0.75rem;">Error: ${err.message}</div>`;
            }
            return;
        }

        // Delete a session
        if (e.target.classList.contains('delete-session-btn')) {
            const sessionId = e.target.dataset.sessionId;
            if (!confirm("Delete this typing session?")) return;
            try {
                e.target.disabled = true;
                await deleteDoc(doc(db, "typing_sessions", sessionId));
                const row = e.target.closest('.session-entry');
                if (row) row.remove();

                // ⚠️ v2.13.0 — CONNECTING THE BUTTONS. Deleting the evidence used
                // to leave typing_logs telling the old, inflated story until
                // someone remembered to click ⟳ Recalculate by hand — Jake
                // flagged this exact gap. The day this session belonged to is
                // read straight off its own sessions-container's own data
                // attributes, so the recalc targets the right day automatically.
                // allowZero: true because we know for certain sessions existed
                // here a moment ago — an empty result now IS the corrected truth
                // for the day, not a lookup failure. See recalcDailyLog()'s own
                // comment for why the manual ⟳ button can't make that same
                // assumption.
                const container = e.target.closest('.sessions-container');
                if (container) {
                    const idx = parseInt(container.dataset.idx, 10);
                    const li  = parseInt(container.dataset.li, 10);
                    // expectDrop: true — a deletion is SUPPOSED to shrink the
                    // day, so the v2.23.0 drop guard would be asking the teacher
                    // to confirm the thing they just did.
                    await recalcDailyLog(idx, li, container.dataset.uid, container.dataset.date,
                                          { allowZero: true, expectDrop: true });
                }
            } catch (err) {
                console.error("Delete session error:", err);
                alert("Delete failed: " + err.message);
                e.target.disabled = false;
            }
            return;
        }

        // Save individual daily log (min + sec inputs)
        if (e.target.classList.contains('save-log-btn')) {
            const idx = parseInt(e.target.dataset.idx);
            const li = parseInt(e.target.dataset.li);
            const r = reportData[idx];
            const log = r.dailyLogs[li];
            const entry = e.target.closest('.daily-log-entry');
            const minInput = entry.querySelector('.log-min-input');
            const secInput = entry.querySelector('.log-sec-input');
            const newMins = parseInt(minInput.value) || 0;
            const newSecs = Math.min(59, Math.max(0, parseInt(secInput.value) || 0));
            const newSeconds = (newMins * 60) + newSecs;
            const statusEl2 = document.getElementById(`log-status-${idx}-${li}`);

            try {
                e.target.disabled = true;
                statusEl2.textContent = 'Saving...';
                statusEl2.style.color = '#888';

                // ⚠️ v2.13.0 — A MANUAL SAVE COLLAPSES THE DOC BACK TO THE LEGACY
                // FLAT SHAPE. Jake is asserting one definitive number for the
                // whole day; a split (secondsLibrary + secondsSchool) that still
                // added up to the OLD total would silently outrank this edit the
                // next time anyone reads the doc. chars/mistakes carry forward
                // unchanged (only seconds is the thing being overridden), so
                // nothing is lost.
                //
                // ⚠️ v2.24.0 — THIS PATH IS DELIBERATELY *NOT* DATE-GATED, unlike
                // recalcDailyLog() below, and the difference is worth stating
                // because it looks like an omission.
                //
                // ⟳ asserts "this day equals its sessions", which is a statement
                // about where the time CAME FROM, so it has to be filed per
                // source. This box asserts "this day was N minutes, because I
                // was in the room" — a statement about the TOTAL, with no claim
                // about which mode produced it. Writing N into the flat field
                // and clearing the splits says exactly that: after the cutover
                // readLogTotals() computes flat + splits, so the day reads as N,
                // and a student who types more later adds their own field on top
                // of the teacher's figure rather than replacing it.
                //
                // ⚠️ KNOWN AND ACCEPTED: a student tab left OPEN across this edit
                // still holds its own counter in memory and will flush it, so the
                // day becomes N plus that tab's total. That hazard predates the
                // cutover — the same open tab used to overwrite the correction
                // outright — and no client-side change removes it. Corrections
                // are made after the fact in practice.
                await updateDoc(doc(db, "typing_logs", log.docId), {
                    seconds: newSeconds,
                    chars: log.chars,
                    mistakes: log.mistakes,
                    secondsLibrary: deleteField(), charsLibrary: deleteField(), mistakesLibrary: deleteField(),
                    secondsSchool: deleteField(), charsSchool: deleteField(), mistakesSchool: deleteField(),
                    lastUpdated: new Date()
                });

                // ⚠️ v2.16.0 — NO MIRROR WRITE. This used to also poke
                // users/{uid}/stats/time_tracking so the student's HUD would
                // agree with the correction. The HUD reads THIS document now, so
                // the correction reaches the student by being written, full stop.
                // That is what one number buys.

                const oldSeconds = log.seconds;
                log.seconds = newSeconds;
                r.seconds = r.seconds - oldSeconds + newSeconds;
                r.wpm = r.seconds > 0 ? Math.round((r.chars / 5) / (r.seconds / 60)) : 0;
                updateSummaryRow(idx, r);

                statusEl2.textContent = '✓ Saved';
                statusEl2.style.color = '#22c55e';
                setTimeout(() => { statusEl2.textContent = ''; }, 2000);
            } catch (err) {
                console.error("Save error:", err);
                statusEl2.textContent = '✗ ' + err.message;
                statusEl2.style.color = '#ff3333';
            } finally {
                e.target.disabled = false;
            }
            return;
        }

        // Recalculate daily total from sessions
        if (e.target.classList.contains('recalc-btn')) {
            const idx = parseInt(e.target.dataset.idx);
            const li = parseInt(e.target.dataset.li);
            const uid = e.target.dataset.uid;
            const date = e.target.dataset.date;
            e.target.disabled = true;
            await recalcDailyLog(idx, li, uid, date);
            e.target.disabled = false;
            return;
        }
    });

    // ─────────────────────────────────────────────────────────────────────────
    // recalcDailyLog() — recompute one day's log from its remaining session
    // records. Shared by the manual ⟳ button and, as of v2.13.0, by session
    // deletion — see the delete-session-btn handler above for why that
    // connection exists.
    //
    // Writes the SOURCE-SPLIT fields (same shape as game.js/learn.js's live
    // flush — see readLogTotals() above), computed from each session record's
    // own `source` tag, and clears whichever legacy flat fields the document
    // still carries — this is also how an old, pre-split document gets
    // migrated to the new shape the first time anyone recalculates it.
    //
    // `allowZero`: the manual button's long-standing behavior is to refuse and
    // report "No sessions found" when a day has none — usually because the day
    // predates session logging (v2.4.0), where the day's total time is real,
    // just never broken into session records, and zeroing it would silently
    // destroy legitimate old data. The delete-cascade case is the opposite:
    // sessions definitely existed a moment ago — the one just deleted was one
    // of them — so an empty result now IS the corrected truth for that day,
    // not a failed lookup. Callers pass allowZero to accept that.
    // Split a day's session records by their own `source` tag. Pure — no
    // reads, no writes, no DOM — which is what makes it the one piece of
    // recalcDailyLog() a harness can test directly (source-split-test.mjs).
    // Anything not explicitly tagged 'school' folds into Library, the
    // original, untagged mode; every session game.js/learn.js write today
    // carries a tag (session-log.js requires it).
    function splitSessionTotals(sessions) {
        let schoolSec = 0, schoolChars = 0, schoolMist = 0;
        let librarySec = 0, libraryChars = 0, libraryMist = 0;
        sessions.forEach(s => {
            if (s.source === 'school') {
                schoolSec += s.seconds || 0; schoolChars += s.chars || 0; schoolMist += s.mistakes || 0;
            } else {
                librarySec += s.seconds || 0; libraryChars += s.chars || 0; libraryMist += s.mistakes || 0;
            }
        });
        return { schoolSec, schoolChars, schoolMist, librarySec, libraryChars, libraryMist };
    }

    // ⚠️ DUPLICATE ROLLUPS EXIST IN THE DATABASE AND THIS FUNCTION MUST NOT
    // TRUST A RAW COUNT. (v2.13.2) session-log.js before v1.3.0 could write the
    // same queued sprint twice when a navigation fired two flushes at once —
    // Jake hit it on 2026-08-19 and got two identical Pinocchio sessions.
    // v1.3.0 stops NEW duplicates; the ones already written are still sitting
    // in typing_sessions, and this function is what the ⟳ button and the
    // automatic post-delete recalc both grade from. A duplicate here silently
    // inflates a day Jake is trying to CORRECT, which is the worst possible
    // place for it.
    //
    // The signature is the sprint timestamps, not the totals: two genuine
    // sessions can coincidentally share seconds and characters, but two
    // documents whose sprints carry the identical ISO instants are the same
    // recorded work written twice. Falls back to the document's own timestamp
    // when a rollup has no sprints array (pre-v2.10.0 records), and to the
    // document id — never dedupable, but never wrongly merged either.
    function sessionSignature(s, id) {
        const sprints = Array.isArray(s.sprints) ? s.sprints : [];
        const stamps = sprints.map(sp => sp && sp.at).filter(Boolean);
        if (!stamps.length) {
            const t = s.timestamp && s.timestamp.toDate ? s.timestamp.toDate().getTime() : null;
            return t === null ? 'id\u0000' + id : `t\u0000${s.source || ''}\u0000${s.bookId || ''}\u0000${t}`;
        }
        return `s\u0000${s.source || ''}\u0000${s.bookId || ''}\u0000${stamps.join(',')}`;
    }

    // ⚠️ v2.25.0 — THE `expect` OPTION IS GONE WITH THE BULK REBUILD. It held
    // the totals a preview had shown Jake, and refused to write anything else,
    // because the point of a preview is that the write is the thing previewed.
    // Its only caller was runRebuildAll(). Both surviving callers — the ⟳
    // button and the post-delete recalc — are a teacher acting on ONE day they
    // are looking at, with no preview to be stale against. Keeping a parameter
    // nothing passes means keeping a branch nothing exercises.
    //
    //   RETURN VALUE is an object, `{ ok, reason, ... }`, instead of a
    //     bare boolean. Both pre-existing callers (the ⟳ button and the
    //     post-delete cascade) ignore the return entirely, and an object is
    //     truthy, so nothing that read it as a boolean changes meaning.
    // ⚠️ v2.23.0 — THE DROP GUARD. A big down-move now has to be confirmed.
    //
    // This function rewrites a day's log to whatever the session records sum to,
    // and until v2.23.0 there was NO limit on how far down that could move it.
    // `allowZero` only ever blocked the EMPTY case. That is fine when the
    // sessions are complete and destructive when they are not — and they are
    // demonstrably not always complete: a real 2026-08-19 Library day reads
    // 12m 4s / 1,890 chars in the log against a single 3m 47s / 521-char
    // session rollup, and the log is the one that matches the student's actual
    // work. One click there would have written 3m 47s over eight minutes of
    // real typing, and the child's own screen would have changed with it,
    // because the HUD reads this same document.
    //
    // ⚠️ THE SESSION RECORD IS NOT A SUPERSET OF THE DAY COUNTER AND MUST NOT BE
    // TREATED AS ONE. Sprints below the 5-second floor never arrive, a sprint
    // that never closes is never pushed, and a failed upload leaves the counter
    // ahead of the record. `⟳` is only safe where the sessions happen to be
    // complete, and nothing in this page can tell you whether they are.
    //
    // A small correction — the 6-second, sub-1% kind — still applies silently.
    // Below DROP_GUARD_RATIO of the stored figure, the teacher is shown both
    // numbers and has to say yes.
    const DROP_GUARD_RATIO = 0.9;

    async function recalcDailyLog(idx, li, uid, date,
                                  { allowZero = false, expectDrop = false } = {}) {
        const r = reportData[idx];
        const log = r.dailyLogs[li];
        const statusEl2 = document.getElementById(`log-status-${idx}-${li}`);
        const entry = document.querySelector(`.daily-log-entry[data-idx="${idx}"][data-li="${li}"]`);

        if (statusEl2) { statusEl2.textContent = 'Recalculating...'; statusEl2.style.color = '#888'; }

        try {
            const q = query(collection(db, "typing_sessions"), where("uid", "==", uid), where("date", "==", date));
            const snap = await getDocs(q);

            if (snap.empty && !allowZero) {
                if (statusEl2) { statusEl2.textContent = 'No sessions found'; statusEl2.style.color = '#ff6b6b'; }
                return { ok: false, reason: 'no-sessions' };
            }

            const sessions = [];
            const seenSigs = new Set();
            let dupes = 0;
            snap.forEach(d => {
                const data = d.data();
                const sig = sessionSignature(data, d.id);
                if (seenSigs.has(sig)) { dupes++; return; }
                seenSigs.add(sig);
                sessions.push(data);
            });
            if (dupes) {
                console.warn(`[recalc] ignored ${dupes} duplicate session rollup(s) for ${uid} on ${date}` +
                             ` — see session-log.js v1.3.0. Delete them from the drill-down to tidy up.`);
            }
            const { schoolSec, schoolChars, schoolMist, librarySec, libraryChars, libraryMist } =
                splitSessionTotals(sessions);
            const totalSec = schoolSec + librarySec;
            const totalChars = schoolChars + libraryChars;
            const totalMistakes = schoolMist + libraryMist;

            // ⚠️ v2.23.0 — THE DROP GUARD. See the note above the function.
            //
            // `expectDrop` is passed by the delete-session path, where a
            // down-move is the WHOLE POINT: a rollup was just removed, so the
            // day is supposed to shrink. Every other caller gets the guard.
            const currentSec = log.seconds || 0;
            if (!expectDrop && currentSec > 0 && totalSec < currentSec * DROP_GUARD_RATIO) {
                const lost = currentSec - totalSec;
                const pct  = Math.round((1 - totalSec / currentSec) * 100);
                const okToDrop = confirm(
                    `This would REDUCE the stored day by ${pct}%.\n\n` +
                    `  stored now : ${formatTime(currentSec)}  (${log.chars || 0} chars)\n` +
                    `  sessions   : ${formatTime(totalSec)}  (${totalChars} chars)\n` +
                    `  difference : ${formatTime(lost)}\n\n` +
                    `The session records are not always complete — sprints under ` +
                    `five seconds are never written, a sprint that never closes ` +
                    `is never pushed, and a failed upload leaves the day counter ` +
                    `ahead of the record. If this student really did type ` +
                    `${formatTime(currentSec)}, the stored figure is the correct ` +
                    `one and this rewrite would destroy the difference.\n\n` +
                    `The student sees this same number on their own screen.\n\n` +
                    `Overwrite it anyway?`
                );
                if (!okToDrop) {
                    if (statusEl2) { statusEl2.textContent = 'kept the stored figure'; statusEl2.style.color = '#888'; }
                    return { ok: false, reason: 'drop-declined',
                             got: { seconds: totalSec, chars: totalChars, mistakes: totalMistakes } };
                }
                console.warn(`[recalc] ${uid} ${date} overwritten DOWN by ${lost}s ` +
                             `(${currentSec}s → ${totalSec}s) with confirmation.`);
            }

            // ═════════════════════════════════════════════════════════════════
            // ⚠️⚠️ v2.24.0 — THE WRITE IS DATE-GATED. WITHOUT THIS, ⟳ IS A
            // DATA-LOSS BUTTON ON EVERY DAY AFTER THE CUTOVER.
            // ═════════════════════════════════════════════════════════════════
            //
            // v2.14.0 wrote the flat triple and deleteField()'d the six split
            // fields, and that was right in a world where the split was reverted
            // and nothing wrote those fields: clearing them made ⟳ the reliable
            // cleanup for any day touched while the split was briefly live.
            //
            // ⚠️ THAT IS NOW BACKWARDS. On and after SOURCE_SPLIT_CUTOVER the
            // split fields are THE DAY — game.js v3.35.0 and learn.js v2.20.0
            // write nothing else — and readLogTotals() reads flat PLUS splits.
            // Unchanged, one click of ⟳ on a post-cutover day deletes both
            // per-source triples, writes the whole day into a field the student
            // pages have stopped maintaining, and leaves the document in a shape
            // the writers will then seed from as though it were empty.
            //
            // So: BEFORE the cutover, byte-for-byte what v2.23.0 did. AFTER it,
            // the day comes back as the two per-source triples, from
            // splitSessionTotals() — which already separates the sessions by
            // source, so this is the same arithmetic filed correctly instead of
            // flattened.
            //
            // ⚠️ AND THE FLAT TRIPLE IS DELETED ON THAT PATH, WHICH IS NOT AN
            // OVERSIGHT. ⟳ asserts "this day equals its session records", and
            // the session records cover the WHOLE day including any morning
            // written flat by a page that had not picked up the new build. A
            // frozen flat remainder left beside the new splits would be that
            // morning counted twice. Deleting it also makes the result correct
            // under BOTH branches of readLogTotals(), so a day rewritten here
            // reads the same even if the cutover date is ever misconfigured.
            //
            // ⚠️ THIS SHIPS IN THE SAME DEPLOY AS THE WRITERS, OR EARLIER. It is
            // safe standing alone — before the cutover the gate is false and
            // this function behaves exactly as it does today.
            const recalcPayload = (date >= SOURCE_SPLIT_CUTOVER)
                ? {
                    secondsLibrary: librarySec, charsLibrary: libraryChars, mistakesLibrary: libraryMist,
                    secondsSchool:  schoolSec,  charsSchool:  schoolChars,  mistakesSchool:  schoolMist,
                    seconds: deleteField(), chars: deleteField(), mistakes: deleteField(),
                  }
                : {
                    seconds: totalSec, chars: totalChars, mistakes: totalMistakes,
                    secondsLibrary: deleteField(), charsLibrary: deleteField(), mistakesLibrary: deleteField(),
                    secondsSchool: deleteField(), charsSchool: deleteField(), mistakesSchool: deleteField(),
                  };
            await updateDoc(doc(db, "typing_logs", log.docId), {
                ...recalcPayload,
                lastUpdated: new Date()
            });

            // ⚠️ v2.16.0 — NO MIRROR WRITE, same as the manual save above. A
            // rebuild lands on the document the student's HUD reads.

            const oldSeconds = log.seconds;
            log.seconds = totalSec;
            log.chars = totalChars;
            log.mistakes = totalMistakes;
            r.seconds = r.seconds - oldSeconds + totalSec;
            r.chars = r.dailyLogs.reduce((s, l) => s + l.chars, 0);
            r.mistakes = r.dailyLogs.reduce((s, l) => s + l.mistakes, 0);
            r.wpm = r.seconds > 0 ? Math.round((r.chars / 5) / (r.seconds / 60)) : 0;
            r.accuracy = (r.chars + r.mistakes) > 0 ? Math.round((r.chars / (r.chars + r.mistakes)) * 100) : 100;

            if (entry) {
                entry.querySelector('.log-min-input').value = Math.floor(totalSec / 60);
                entry.querySelector('.log-sec-input').value = totalSec % 60;
                entry.querySelector('.log-chars').textContent = totalChars.toLocaleString() + ' chars';
            }
            updateSummaryRow(idx, r);

            if (statusEl2) {
                statusEl2.textContent = snap.size
                    ? `✓ ${formatTime(totalSec)} from ${snap.size} session${snap.size === 1 ? '' : 's'}`
                    : '✓ 0:00 — no sessions remain for this day';
                statusEl2.style.color = '#22c55e';
                setTimeout(() => { statusEl2.textContent = ''; }, 3000);
            }
            return { ok: true, reason: 'written',
                     seconds: totalSec, chars: totalChars, mistakes: totalMistakes,
                     was: oldSeconds, sessionDocs: snap.size };
        } catch (err) {
            console.error("Recalc error:", err);
            if (statusEl2) { statusEl2.textContent = '✗ ' + err.message; statusEl2.style.color = '#ff3333'; }
            return { ok: false, reason: 'error', message: err.message };
        }
    }

    function updateSummaryRow(idx, r) {
        const summaryRow = document.querySelector(`.summary-row[data-idx="${idx}"]`);
        if (summaryRow) {
            const cells = summaryRow.querySelectorAll('td');
            cells[2].textContent = formatTime(r.seconds);
            cells[4].textContent = r.wpm;
            cells[5].textContent = r.accuracy + '%';
            // ⚠️ v2.15.0's Δ INVALIDATION LIVED HERE AND WENT WITH THE COLUMNS
            // (v2.25.0). The principle it stood on is still true and is worth
            // keeping in view: any path reaching this function has just moved
            // cells[2], so ANY cell computed against the old value is a lie
            // until it is re-measured. If a future column is derived from
            // `seconds` rather than read from the document, blank it here —
            // do not recompute it, which is arithmetic dressed up as
            // observation. Nothing on this row is derived today.
        }
        const totalSecs = reportData.reduce((s, rr) => s + rr.seconds, 0);
        document.getElementById('total-line').innerHTML = 
            `<strong>${reportData.length}</strong> students — <strong>${formatTime(totalSecs)}</strong> total typing time`;
    }

    // --- CSV EXPORT ---
    document.getElementById('export-btn').onclick = () => {
        if (reportData.length === 0) return;
        const startDate = document.getElementById('date-start').value;
        const endDate = document.getElementById('date-end').value;
        
        // ⚠️ v2.25.0 — THE EIGHT GRADING COLUMNS ARE UNCHANGED. The ten
        // reconciliation columns that used to be appended here only ever
        // appeared after a sweep had run, so a CSV exported without one came
        // out exactly like this. Nothing about an existing export moves.
        const headers = ['Name', 'Email', 'Total Seconds', 'Total Time', 'Characters', 'Avg WPM', 'Accuracy %', 'Days Active'];
        const rows = reportData.map(r => [
            r.name,
            r.email,
            r.seconds,
            formatTime(r.seconds),
            r.chars,
            r.wpm,
            r.accuracy,
            r.days
        ]);

        let csv = headers.join(',') + '\n';
        rows.forEach(row => {
            csv += row.map(cell => {
                const str = String(cell);
                return str.includes(',') || str.includes('"') ? `"${str.replace(/"/g, '""')}"` : str;
            }).join(',') + '\n';
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `typethatbook_${startDate}_to_${endDate}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    };

    // --- UTILS ---
    function formatTime(secs) {
        if (!secs) return "0m 0s";
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        if (h > 0) return `${h}h ${m}m`;
        return `${m}m ${s}s`;
    }

    function escapeHtml(str) {
        const d = document.createElement('div');
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
    }
</script>
</body>
</html>
