<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <title>TypeThatBook Reports</title>  <!-- version appended at runtime from REPORTS_VERSION -->
    <style>
        /* ═══════════════════════════════════════════════════════════════════
           ROADMAP 37 + 38 — THE STAFF PAGES JOIN THE DESIGN SYSTEM
           ═══════════════════════════════════════════════════════════════════

           Jake: *"It and admin look so much rougher than the student facing
           side."* Measured before it was changed: 33 distinct hex colours in
           323 style lines, five near-identical greys doing overlapping jobs,
           and four unrelated warning tones with no rule about which meant what.

           ⚠️⚠️ THIS FILE IS DARK AND style.css IS LIGHT, AND THAT IS DELIBERATE
           AND STAYS. A teacher scanning a dense table at a desk and a child
           reading one sentence of a book are different jobs. What was wrong was
           not the theme, it was that the staff pages had NO system at all —
           every value was picked at the point of use.

           ⚠️⚠️ SO THESE TOKENS ARE NAMED FOR THEIR ROLE, NOT COPIED FROM
           style.css'S VALUES. ROADMAP 37 says this explicitly: --ink-spent over
           there is tuned so typed text stops competing with what comes next,
           which is reasoning about reading a book and does not transfer to a
           table. Adopt the NAMING DISCIPLINE, not the numbers. The one value
           that IS shared is --accent (#4B9CD3, Carolina blue), because it is
           the product's identity colour and must not drift between surfaces.

           ⚠️ THE FONT IS THE OTHER HALF AND IT IS SHARED. Courier Prime is what
           index.html and learn.html load; this page was on plain 'Courier New'.

           ── THE SEVERITY VOCABULARY (ROADMAP 38) ────────────────────────────

           ⚠️⚠️ THIS PART IS A CORRECTNESS FIX, NOT A COSMETIC ONE, AND IT IS THE
           REASON 38 WAS NOT SORTED WITH THE POLISH ITEMS. Amber meant "watch
           this error rate" on a day row, "suspicious" on a sprint row, and
           something else again in admin. A teacher cannot learn what a colour
           means if it means three things, and the whole value of item 36's
           at-a-glance surface rests on a mark meaning ONE thing reliably.

           THREE SEVERITIES. Every warning-ish colour in this file now resolves
           to exactly one of them:

             --notice  something to look at, no judgement implied
             --warn    something probably wrong, worth opening
             --bad     something wrong, or a destructive control

           ⚠️ ROUND 55 CAUSED PART OF THIS AND THE ROUND OWNS IT: the item 36
           work introduced #d9a441 and #8a7860 without checking the existing
           palette — two more colours added by the round that was improving
           legibility. Both are retired here.

           ⚠️ ADDING A COLOUR MEANS ADDING A TOKEN OR REUSING ONE. If a new
           state does not fit notice/warn/bad, that is worth a conversation
           rather than a fourth hex value.  */
        :root {
            /* surfaces, darkest to lightest */
            --surface:      #111111;
            --surface-1:    #191919;
            --surface-2:    #222222;
            --rule:         #333333;
            --rule-strong:  #444444;

            /* text, brightest to faintest */
            --ink:          #eeeeee;
            --ink-bright:   #ffffff;
            --ink-dim:      #aaaaaa;
            --ink-dimmer:   #888888;
            --ink-faint:    #666666;
            --ink-ghost:    #555555;

            /* identity — SHARED WITH style.css --carolina-blue, do not drift */
            --accent:       #4B9CD3;

            /* ⚠️ THE THREE SEVERITIES. One meaning each, everywhere. */
            --notice:       #d9a441;
            --warn:         #ff9800;
            --bad:          #ff5555;
            --good:         #22c55e;

            /* ⚠️ ROADMAP 39 (Round 73). The modal's destructive tier and the
               banner surfaces are STATES, so they are tokens like every other
               state on this page. staff-tokens-test.mjs C1 exists because a raw
               hex in the style block is a colour nobody can restyle or reuse —
               and it caught these the moment they appeared.
               ⚠️ `--danger-*` mirrors admin.html's commit tier deliberately: the
               same treatment means the same thing on both staff pages. */
            --danger-fill:  #550000;
            --danger-edge:  #880000;
            --danger-ink:   #ffcccc;
            --info-fill:    #16202a;
            --bad-fill:     #241618;

            /* grade pips — a scale, not severities, and deliberately separate:
               a C is not a warning and must not be coloured like one */
            --grade-fire:   #ff6600;
            --grade-a:      #22c55e;
            --grade-b:      #4B9CD3;
            --grade-c:      #888888;
            --grade-d:      #ff6666;
        }

        body { background: var(--surface); color: var(--ink); font-family: 'Courier Prime', 'Courier New', monospace; padding: 20px; margin: 0; }
        .container { max-width: 960px; margin: 0 auto; padding-bottom: 40px; }

        a { color: var(--ink-dimmer); text-decoration: none; border-bottom: 1px dotted var(--ink-dimmer); }
        a:hover { color: var(--ink-bright); }

        .status-bar { padding: 15px; margin-bottom: 20px; background: var(--surface-2); border-left: 4px solid var(--ink-ghost); font-size: 0.9rem; }

        .hidden { display: none !important; }

        /* ── ROADMAP 40 — KEYBOARD USABILITY ────────────────────────────────
           This page had TWO :focus rules in 3,700 lines and SIX <label>
           elements with ZERO for= attributes.

           ⚠️⚠️ ON A TYPING APP. The staff pages were the least keyboard-usable
           surface in a product whose entire purpose is teaching children to use
           a keyboard without reaching for a mouse. That is worth fixing on its
           own terms and not only for the teachers.

           ⚠️ :focus-visible, NOT :focus. A ring that appears on every mouse
           click is noise, and noise is what gets a focus style deleted six
           months later by someone who thinks it is a bug. focus-visible shows
           it to keyboard users and stays out of the way of everyone else.

           ⚠️ outline WITH AN offset, NOT a border or a box-shadow. A border
           changes layout and would shift the row it lands in; an outline does
           not participate in layout at all. The offset is what keeps it legible
           against the dark surfaces — a 0-offset outline on #191919 reads as a
           thicker edge rather than a ring.

           ⚠️ THE :focus-visible RULE MUST STAY AHEAD OF ANY LATER :hover RULE
           for the same element, or hover silently wins on a focused control the
           mouse happens to be resting on. */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        [tabindex]:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ⚠️ The uid chip is a click-to-copy control built as a <span>, so it
           is not reachable by keyboard at all until it is told to be. Given a
           tabindex in the markup; this is the style half. */
        .uid-chip:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* --- DATE CONTROLS --- */
        .controls {
            background: var(--surface-1);
            border: 1px solid var(--rule);
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label {
            color: var(--ink-dimmer); font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .control-group input[type="date"] {
            background: var(--surface-2); border: 1px solid var(--rule-strong); color: var(--ink-bright);
            padding: 10px 12px; font-family: inherit; font-size: 0.9rem;
        }
        .control-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
        }

        button {
            padding: 10px 20px; background: var(--accent); color: white;
            border: none; font-family: inherit; font-weight: bold;
            text-transform: uppercase; font-size: 0.8rem;
            cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: var(--accent); }
        button:disabled { background: var(--ink-ghost); cursor: not-allowed; }

        button.secondary { background: var(--rule); border: 1px solid var(--ink-ghost); }
        button.secondary:hover { background: var(--ink-ghost); }

        .quick-btns { display: flex; gap: 8px; align-items: flex-end; }
        .quick-btn {
            padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--rule-strong);
            color: var(--ink-dim); font-size: 0.75rem;
        }
        .quick-btn:hover { background: var(--rule); color: var(--ink-bright); border-color: var(--accent); }

        /* --- TABLE --- */
        .results-info {
            color: var(--ink-faint); font-size: 0.8rem; margin-bottom: 10px;
        }

        table {
            width: 100%; border-collapse: collapse;
            background: var(--surface-1); margin-bottom: 20px;
        }
        th {
            background: var(--surface-2); color: var(--accent);
            padding: 12px 15px; text-align: left;
            font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 1px; border-bottom: 2px solid var(--rule);
            cursor: pointer; user-select: none;
        }
        th:hover { color: var(--ink-bright); }
        th .sort-arrow { font-size: 0.6rem; margin-left: 4px; opacity: 0.5; }
        th.sorted .sort-arrow { opacity: 1; }

        td {
            padding: 10px 15px; border-bottom: 1px solid var(--surface-2);
            font-size: 0.85rem;
        }
        tr:hover td { background: var(--surface-2); }

        .time-cell { font-weight: bold; color: var(--accent); }
        .wpm-cell { color: var(--ink-dim); }

        .empty-msg {
            text-align: center; color: var(--ink-ghost); padding: 40px;
            font-size: 0.9rem;
        }

        /* --- EXPORT --- */
        .export-bar {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .total-line { color: var(--ink-dimmer); font-size: 0.85rem; }
        .total-line strong { color: var(--accent); }

        /* --- LOGIN --- */
        #login-section { text-align: center; padding: 60px 0; }
        #login-section p { color: var(--ink-dimmer); margin-bottom: 15px; }

        footer {
            position: fixed; bottom: 5px; right: 10px;
            font-size: 0.7em; color: var(--ink-faint);
            background: rgba(255,255,255,0.8);
            padding: 2px 5px; border-radius: 3px; z-index: 101;
        }

        /* --- GOALS PANEL --- */
        .goals-panel {
            background: var(--surface-1); border: 1px solid var(--rule);
            padding: 20px; margin-bottom: 20px;
        }
        .goals-row {
            display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;
        }
        .goal-card {
            background: var(--surface-2); border: 1px solid var(--rule); border-radius: 6px;
            padding: 15px 20px; flex: 1; min-width: 180px;
        }
        .goal-card label {
            color: var(--ink-dimmer); font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 1px; display: block; margin-bottom: 8px;
        }
        .goal-icon { font-size: 1.5rem; margin-bottom: 6px; }
        .goal-input-row { display: flex; align-items: center; gap: 8px; }
        .goal-input-row input[type="number"] {
            background: var(--surface); border: 1px solid var(--rule-strong); color: var(--ink-bright);
            padding: 8px 10px; font-family: inherit; font-size: 1.1rem;
            width: 80px; text-align: center; border-radius: 4px;
        }
        .goal-input-row input:focus { border-color: var(--accent); outline: none; }
        .goal-unit { color: var(--ink-faint); font-size: 0.8rem; }
        .goal-hint { color: var(--ink-ghost); font-size: 0.65rem; margin-top: 6px; font-style: italic; }
        .goal-status {
            margin-top: 10px; font-size: 0.8rem; min-height: 1.2em;
        }
        .goal-status.ok { color: var(--good); }
        .goal-status.err { color: var(--bad); }

        /* --- EDIT UI --- */
        .details-row-btn {
            background: transparent; border: 1px solid var(--ink-ghost); color: var(--ink-dim);
            padding: 3px 10px; font-size: 0.7rem; cursor: pointer;
            font-family: inherit; border-radius: 3px;
        }
        .details-row-btn:hover { border-color: var(--accent); color: var(--accent); }
        .detail-row td { padding: 0 !important; background: var(--surface); }
        .detail-row.hidden { display: none; }
        .daily-logs { padding: 10px 15px; }
        .daily-log-entry {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 0; border-bottom: 1px solid var(--surface-2);
            font-size: 0.8rem;
        }
        .daily-log-entry:last-child { border-bottom: none; }
        .log-date { color: var(--ink-dimmer); width: 90px; flex-shrink: 0; }
        .log-seconds-input {
            background: var(--surface-1); border: 1px solid var(--rule-strong); color: var(--ink-bright);
            padding: 4px 6px; width: 60px; text-align: center;
            font-family: inherit; font-size: 0.8rem; border-radius: 3px;
        }
        .log-seconds-input:focus { border-color: var(--accent); outline: none; }
        .log-chars { color: var(--ink-faint); font-size: 0.75rem; }
        .save-log-btn {
            background: var(--rule); border: 1px solid var(--ink-ghost); color: var(--ink-dim);
            padding: 3px 10px; font-size: 0.7rem; cursor: pointer;
            font-family: inherit; border-radius: 3px;
        }
        .save-log-btn:hover { border-color: var(--good); color: var(--good); }
        .recalc-btn {
            background: transparent; border: 1px solid var(--ink-ghost); color: var(--ink-dim);
            padding: 3px 8px; font-size: 0.8rem; cursor: pointer;
            font-family: inherit; border-radius: 3px; line-height: 1;
        }
        .recalc-btn:hover { border-color: var(--accent); color: var(--accent); }
        .recalc-btn:disabled { opacity: 0.4; cursor: default; }
        /* ROADMAP 15 — the grade reconstruction. Same shape as ⟳ on purpose:
           both are staff-only repair tools that read typing_sessions and write
           back, and a teacher should not have to learn two idioms. */
        .regrade-btn {
            background: none; border: 1px solid var(--rule-strong); color: var(--ink-dimmer);
            cursor: pointer; font-size: 0.75rem; padding: 1px 5px;
            margin-left: 3px; border-radius: 3px;
        }
        .regrade-btn:hover { border-color: var(--warn); color: var(--warn); }
        .regrade-btn:disabled { opacity: 0.4; cursor: default; }
        .grades-btn {
            background: none; border: 1px solid var(--rule-strong); color: var(--ink-dimmer); cursor: pointer;
            font-size: 0.7rem; padding: 0 5px; margin-left: 5px; border-radius: 3px;
        }
        .grades-btn:hover { border-color: var(--good); color: var(--good); }
        .grades-btn:disabled { opacity: 0.4; cursor: default; }
        .grades-panel { margin-top: 8px; font-size: 0.75rem; }
        .mastery-lock { color: var(--notice); font-size: 0.72rem; cursor: help; }
        .clear-mastery-btn {
            background: none; border: 1px solid var(--rule-strong); color: var(--notice);
            cursor: pointer; font-size: 0.72rem; padding: 0 5px; line-height: 1.4;
        }
        .clear-mastery-btn:hover:not(:disabled) { color: var(--notice); border-color: var(--notice); }
        .clear-mastery-btn:disabled { opacity: 0.4; cursor: default; }
        .grades-panel table { border-collapse: collapse; }
        .grades-panel td, .grades-panel th { padding: 2px 8px 2px 0; text-align: left; white-space: nowrap; }
        .grade-pip { display:inline-block; min-width:1.6em; text-align:center; margin-right:2px; border-radius:3px; padding:0 2px; }
        .grade-recon { opacity: 0.75; border-bottom: 1px dotted var(--ink-dimmer); }
        .grade-cont { opacity: 0.55; }
        .dupe-tag {
            font-size: 0.65rem; color: var(--warn); border: 1px solid var(--warn);
            border-radius: 3px; padding: 0 4px; margin-right: 4px; white-space: nowrap;
        }
        .delete-session-btn {
            background: transparent; border: 1px solid transparent; color: var(--ink-faint);
            padding: 2px 6px; font-size: 0.75rem; cursor: pointer;
            font-family: inherit; border-radius: 3px; margin-left: auto;
        }
        .delete-session-btn:hover { border-color: var(--bad); color: var(--bad); }
        .log-save-status { font-size: 0.75rem; min-width: 60px; }
        .expand-sessions { cursor: pointer; user-select: none; }

        /* ── ROADMAP 36 — the at-a-glance marks ─────────────────────────────
           ⚠️ THE ERROR RATE IS A COLUMN AND THE SCAN FLAGS ARE ICONS, and the
           difference is not cosmetic: the rate is always there (it is free), the
           flags are not there until the scan is paid for. A column cannot say
           "unknown" gracefully; an icon can, and does — see .scan-unknown. */
        .err-rate {
            display: inline-block; min-width: 46px; text-align: right;
            font-size: 0.72rem; font-variant-numeric: tabular-nums;
            padding: 1px 5px; border-radius: 3px; cursor: help;
        }
        .err-ok    { color: var(--ink-faint); }
        .err-watch { color: var(--notice); background: rgba(217,164,65,0.10); }
        .err-high  { color: var(--warn); background: rgba(255,138,92,0.14); font-weight: bold; }
        /* ⚠️ A DASH, NOT A ZERO. 0/0 and a pre-cutover day are "no answer", and
           rendering either as a clean green 0% is the report lying by omission. */
        .err-none  { color: var(--rule-strong); }

        .scan-mark, .flag-mark {
            display: inline-block; min-width: 14px; text-align: center;
            font-size: 0.8rem; cursor: help; margin-left: 1px;
        }
        /* ⚠️ NOT-SCANNED MUST NOT LOOK LIKE CLEAN. A faint dot reads as "no
           information"; the tick reads as "looked, found nothing". If these two
           ever converge visually the whole surface becomes untrustworthy. */
        .scan-unknown { color: var(--rule); }
        .scan-clean   { color: var(--good); }
        .fl-fail  { color: var(--bad); }
        .fl-fast  { color: var(--notice); }
        .fl-dupe  { color: var(--accent); }
        .fl-short { color: var(--notice); }

        .delete-run-btn {
            background: none; border: none; color: var(--bad); cursor: pointer;
            font-size: 0.7rem; padding: 0 4px; line-height: 1;
        }
        .delete-run-btn:hover:not(:disabled) { color: var(--bad); }
        .delete-run-btn:disabled { opacity: 0.4; cursor: default; }

        #scan-status { font-size: 0.75rem; margin-left: 10px; }

        /* ── THE FLOATING LEGEND ────────────────────────────────────────────
           Jake: "ideally one that stays on the screen as you scroll. Lots of
           horizontal space that's unused columns right now where it could float."
           .container is max-width 960px and centred, so on a wide screen there is
           dead margin either side. The legend lives in the right-hand margin,
           position:fixed so it survives scrolling.

           ⚠️ IT MUST NOT OVERLAP THE TABLE ON A NARROW SCREEN. Below the width
           where the margin exists, it stops floating and becomes an ordinary
           block above the results — a legend sitting on top of the data is worse
           than a legend you have to scroll to. The breakpoint is the container
           width plus twice the panel width plus gutters, not a round number
           picked by eye. */
        #flag-legend {
            position: fixed; top: 90px; right: 16px; width: 190px;
            background: var(--surface-1); border: 1px solid var(--rule); border-left: 3px solid var(--accent);
            padding: 10px 12px; font-size: 0.68rem; line-height: 1.5;
            z-index: 40; max-height: calc(100vh - 120px); overflow-y: auto;
        }
        #flag-legend h4 {
            margin: 0 0 6px; font-size: 0.7rem; color: var(--accent);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        #flag-legend .lg-row { display: flex; gap: 7px; margin-bottom: 3px; align-items: baseline; }
        #flag-legend .lg-key { flex: 0 0 16px; text-align: center; }
        #flag-legend .lg-txt { color: var(--ink-dim); }
        #flag-legend .lg-sep { border-top: 1px solid var(--rule); margin: 8px 0 6px; }
        #flag-legend .lg-note { color: var(--ink-faint); font-style: italic; margin-top: 7px; }
        #flag-legend .lg-collapse {
            position: absolute; top: 6px; right: 8px; background: none; border: none;
            color: var(--ink-faint); cursor: pointer; font-size: 0.75rem; padding: 0;
        }
        #flag-legend .lg-collapse:hover { color: var(--ink-bright); }
        #flag-legend.collapsed .lg-body { display: none; }
        #flag-legend.collapsed { width: auto; }
        @media (max-width: 1360px) {
            #flag-legend {
                position: static; width: auto; max-height: none;
                margin: 0 0 16px; max-width: 960px;
            }
            #flag-legend .lg-collapse { display: none; }
        }
        .expand-sessions:hover { color: var(--accent); }
        .sessions-container { padding: 4px 0 8px 20px; }
        .sessions-container.hidden { display: none; }
        .session-entry {
            display: flex; align-items: center; gap: 12px;
            padding: 4px 8px; font-size: 0.75rem; color: var(--ink-dim);
            border-left: 2px solid var(--rule);
        }
        .session-entry.suspicious { border-left-color: var(--bad); background: rgba(255,50,50,0.05); }
        .session-time { color: var(--ink-dimmer); width: 70px; flex-shrink: 0; }
        .session-stat { width: 65px; text-align: right; }
        .session-book { color: var(--ink-ghost); font-style: italic; font-size: 0.7rem; }
        .flag-icon { font-size: 0.85rem; }
    .uid-chip { font-family: monospace; font-size: 0.68rem; opacity: 0.55; margin-left: 8px;
                cursor: pointer; border: 1px solid var(--rule-strong); padding: 0 4px; border-radius: 3px; }
    .uid-chip:hover { opacity: 1; }
    .sprint-list { margin: 2px 0 8px 26px; border-left: 2px solid var(--rule); padding-left: 8px; }

        /* ── ⚠️⚠️ ROADMAP 39 — ONE DIALOG PATTERN FOR THE WHOLE PAGE (v1.9.0) ──
           22 `alert()`/`confirm()` calls lived here. Browser dialogs cannot be
           styled, cannot show structure, and read as scaffolding — and the
           destructive confirmations that most need structure were the ones least
           able to have it.

           ⚠️⚠️ WHOLE PAGES, NEVER A CALL AT A TIME. `if (!confirm(x)) return;` is
           SYNCHRONOUS and a modal is not, so a half-converted page is worse than
           an unconverted one: a destructive action whose confirmation became
           non-blocking fires WITHOUT WAITING FOR THE ANSWER. All 22 went together.

           ⭐ IT IS A NATIVE <dialog> ON PURPOSE. showModal() gives the focus trap,
           the inert background and Escape-to-close for free — three things a
           hand-rolled overlay gets wrong quietly, and the last of which a teacher
           will reach for by reflex. ⚠️ ESCAPE MUST RESOLVE FALSE; a dismissed
           destructive confirmation that resolves TRUE is the worst bug this
           pattern can have. */
        dialog.ttb-modal {
            border: 1px solid var(--rule); border-radius: 6px;
            background: var(--surface-1); color: var(--ink);
            padding: 0; max-width: 34rem; width: calc(100% - 2rem);
            font-family: inherit;
        }
        dialog.ttb-modal::backdrop { background: rgba(0,0,0,.62); }
        .ttb-modal-head {
            padding: 14px 18px; border-bottom: 1px solid var(--rule);
            font-weight: 700; font-size: .95em;
        }
        .ttb-modal-body {
            padding: 16px 18px; font-size: .85em; line-height: 1.6;
            white-space: pre-wrap;            /* the messages carry their own breaks */
            max-height: 55vh; overflow-y: auto;
        }
        .ttb-modal-foot {
            padding: 12px 18px; border-top: 1px solid var(--rule);
            display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
        }
        .ttb-modal-foot button { width: auto; margin: 0; }
        /* ⚠️ The destructive choice is styled by the CALLER passing danger:true,
           never by guessing from the label — "Delete" and "Remove" are not the
           only words for it, and a heuristic that is right most of the time is
           worse here than one that is never asked to guess. */
        .ttb-modal-danger { background: var(--danger-fill); border: 1px solid var(--danger-edge); color: var(--danger-ink); }
        .ttb-modal-danger:hover { background: var(--danger-edge); }

        /* ⚠️ INFORMATION DOES NOT GET A MODAL. An `alert()` that only reports
           something becomes an inline banner: it does not steal focus, it does not
           need dismissing, and it can sit next to the thing it is about. */
        .ttb-banner {
            margin: 12px 0; padding: 10px 14px; border-left: 3px solid var(--accent);
            background: var(--info-fill); font-size: .82em; line-height: 1.55;
            white-space: pre-wrap;
        }
        .ttb-banner.is-bad { border-left-color: var(--bad); background: var(--bad-fill); }
    </style>

<div class="container">

                        <span class="goal-unit">minutes</span>
                    </div>
                    <div class="goal-hint">Fireworks when reached</div>
                </div>
                <button id="save-goals-btn">Save Goals</button>
            </div>
            <div class="goal-status" id="goal-status"></div>
        </div>

            <div class="control-group">
                <label for="date-end">End Date</label>

            </div>

                <button class="quick-btn" data-range="this-week">This Week</button>
                <button class="quick-btn" data-range="last-week">Last Week</button>
            </div>
        </div>

        <!-- ⚠️ ROADMAP 39 (v1.9.0). THE BANNER HOST SITS WHERE THE TEACHER IS
             LOOKING. Its first home was the end of <body>, which is a message
             nobody reads — an information banner below the fold is an alert()
             with the shouting removed and none of the benefit.

             anything that belongs to the page as a whole. -->
        <div id="ttb-banner-host"></div>
        <div id="results-container" class="hidden">
            <div class="export-bar">
                <div class="total-line" id="total-line"></div>

    // Build the tightest query the selected scope allows. This is the read-cost
    // fix as much as the permissions one: the old version queried typing_logs by
    // date range with no other filter, which at full enrollment is ~47,000
    // documents per report view.
    //
    // Needs two composite indexes on typing_logs:
    //   classId  ASC + date ASC
    //   schoolId ASC + date ASC
    // Firestore logs a one-click create link the first time each runs.
    function buildScopedQuery(logsRef, startDate, endDate) {
        const schoolId = document.getElementById('scope-school').value;
        const classId  = document.getElementById('scope-class').value;
        const dateRange = [where("date", ">=", startDate), where("date", "<=", endDate)];

        // A single named class is the cheapest possible query — one class-worth
        // of documents instead of a whole building's.
        if (classId && classId !== '__all__' && classId !== '__mine__') {
            return { queries: [query(logsRef, where("classId", "==", classId), ...dateRange)],
                     clientFilter: null,
                     label: `class “${classesById[classId]?.name || classId}”` };
        }

        // ⚠️ "My classes" USED TO BE BROKEN FOR THE DEFAULT TEACHER, and the
        // reason is worth understanding before anyone "simplifies" this back.
        //
        // It used to query the whole BUILDING on schoolId and narrow on the
        // client. That is fine for cost and completely wrong for security rules.
        // canReadActivity() in firestore.rules short-circuits to
        // teachesClass(d.classId) for anyone whose readScope isn't 'building' —
        // and rules are evaluated against every document the query returns, not
        // against the subset the client intends to keep. So a teacher with the
        // DEFAULT readScope of 'own_classes' got permission-denied on the one
        // scope option the UI defaults them to. Separately it would have blown
        // Firestore's ceiling of 20 get()/exists() calls per query.
        //
        // Rules are not filters. If the client intends to read only its own
        // classes, the QUERY has to say so. One equality query per class is a
        // handful of round-trips, hits the existing classId+date index, reads
        // strictly fewer documents than the building-wide version did, and every
        // document it returns is one the rules already agree the caller may see.
        //
        // Returns an ARRAY of queries; generateReport() unions the results and
        // de-duplicates by document id.
        if (classId === '__mine__') {
            const mine = (me.classIds || []).slice(0, 30);
            if (!mine.length) {
                return { queries: [], clientFilter: null,
                         label: 'your classes (none assigned)' };
            }
            return {
                queries: mine.map(cid =>
                    query(logsRef, where("classId", "==", cid), ...dateRange)),
                clientFilter: null,
                label: `your classes (${mine.length})`
            };
        }

        // Whole building.
        if (schoolId && schoolId !== '__all__') {
            return { queries: [query(logsRef, where("schoolId", "==", schoolId), ...dateRange)],
                     clientFilter: null,
                     label: `${schoolsById[schoolId]?.name || schoolId} (all classes)` };
        }

        // Every school. super_admin only, and the expensive one — this is the
        // query the whole scoping effort exists to avoid running by accident.
        return { queries: [query(logsRef, ...dateRange)], clientFilter: null, label: 'ALL SCHOOLS' };
    }

     * @returns {Promise<*>}  the chosen value, or null if dismissed
     *
     * ⚠️⚠️ DISMISSAL RESOLVES null, AND THAT IS THE MOST IMPORTANT LINE HERE.
     * Escape, the backdrop and the close button all mean "I did not choose". A
     * dismissed destructive confirmation that resolved TRUE is the worst bug this
     * pattern can have, and native <dialog> closes on Escape whether you plan for
     * it or not.
     */
    function ttbChoose(title, message, options) {
        const dlg  = document.getElementById('ttb-modal');
        const foot = document.getElementById('ttb-modal-foot');
        document.getElementById('ttb-modal-title').textContent = title;
        document.getElementById('ttb-modal-body').textContent  = message;
        foot.innerHTML = '';
        return new Promise(resolve => {
            let settled = false;
            const finish = (v) => {
                if (settled) return;          // Escape can race a click
                settled = true;
                dlg.removeEventListener('close', onClose);
                if (dlg.open) dlg.close();
                resolve(v);
            };
            // ⚠️ `close` fires for Escape AND for our own .close(). The `settled`
            // guard is what stops the escape path overwriting a real choice.
            const onClose = () => finish(null);
            dlg.addEventListener('close', onClose);
            for (const o of options) {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = o.label;
                if (o.danger) b.className = 'ttb-modal-danger';
                b.onclick = () => finish(o.value);
                foot.appendChild(b);
            }
            dlg.showModal();
            // ⚠️ FOCUS THE SAFE CHOICE, NEVER THE DESTRUCTIVE ONE. A teacher who
            // presses Enter out of habit must not delete a session by reflex.
            const safe = foot.querySelector('button:not(.ttb-modal-danger)');
            (safe || foot.firstChild)?.focus();
        });
    }

    /** Two-way confirmation. ⚠️ Resolves FALSE on dismissal, always. */
    function ttbConfirm(message, { title = 'Confirm', ok = 'OK', danger = false } = {}) {
        return ttbChoose(title, message, [
            { label: 'Cancel', value: false },
            { label: ok,      value: true, danger, primary: true },
        ]).then(v => v === true);
    }

    /**
     * ⚠️ WHERE A ROW-SCOPED MESSAGE BELONGS. A banner at the top of a
     * forty-student report, about a run 800px further down, is a message the
     * teacher has to go looking for — which is the failure `alert()` at least did
     * not have. This finds the row the click came from so the answer appears
     * beside the thing that was clicked.
     * ⚠️ RETURNS null WHEN IT CANNOT FIND ONE, and ttbNotice() falls back to the
     * page host. A message in the wrong place still beats no message.
     */
    function rowHost(e) {
        const el = e && e.target;
        if (!el || !el.closest) return null;
        return el.closest('td, li, .day-detail, tr') || null;
    }

    /**
     * Information. ⚠️ NOT A MODAL — an alert() that only reports something does
     * not deserve to steal focus or demand a dismissal. It becomes a banner beside
     * the thing it is about.
     * @param {HTMLElement} [host]  where it belongs; falls back to the page host
     */
    function ttbNotice(message, { bad = false, host = null } = {}) {
        const where = host || document.getElementById('ttb-banner-host');
        if (!where) return;
        // One banner per host: a stack of three stale messages is how a page
        // stops being read at all.
        where.querySelectorAll(':scope > .ttb-banner').forEach(n => n.remove());
        const div = document.createElement('div');
        div.className = 'ttb-banner' + (bad ? ' is-bad' : '');
        div.textContent = message;
        where.prepend(div);
        div.scrollIntoView({ block: 'nearest' });
    }

    function getLastSaturday(from = new Date()) {
        return new Date(weekStartOf(toDateStr(new Date(from))) + 'T12:00:00');
    }

    function getNextFriday(from = new Date()) {
        const sat = getLastSaturday(from);
        const fri = new Date(sat);
        fri.setDate(fri.getDate() + 6);
        return fri;
    }

    // ⚠️ LOCAL, NOT UTC. (v2.20.0 — this was a live defect, not a tidy-up.)
    //
    // This used to be `d.toISOString().split('T')[0]`. toISOString() converts to
    // UTC, and Nashville is UTC−5 in summer, so from 7:00 PM local onward every
    // date this produced was TOMORROW. Every caller is a date-picker default or
    // a quick-range button, so the whole effect was: **grade in the evening and
    // the range you get is shifted a day forward.**
    //
    // ⚠️ WHY IT MATTERED MORE THAN ONE DAY'S DRIFT. `This Week` fills the start
    // box from getLastSaturday(). Shifted forward, it lands on SUNDAY — so the
    // teacher's week silently began a day after the student's, and every
    // Saturday of typing fell outside the report while still being inside the
    // number on the child's screen. That is the exact divergence §0.0.1 exists
    // to prevent, and it was not in the counting code at all; it was in a date
    // formatter. HANDOFF §0.-2.
    //
    // ⚠️ THE SAME MISTAKE IS ALREADY DOCUMENTED THIRTY LINES INTO daylog.js
    // ("Never toISOString(): that is UTC") and again above datesInRange() in
    // this file. Both were written by rounds that fixed it in their own
    // function and did not grep for the other callers. Grep.
    function toDateStr(d) {
        return d.getFullYear() + '-' +
               String(d.getMonth() + 1).padStart(2, '0') + '-' +
               String(d.getDate()).padStart(2, '0');
    }

    function setDefaultDates() {
        const sat = getLastSaturday();
        const fri = getNextFriday();
        document.getElementById('date-start').value = toDateStr(sat);
        document.getElementById('date-end').value = toDateStr(fri);
    }

    // --- QUICK DATE BUTTONS ---
    document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.onclick = () => {
            const range = btn.dataset.range;
            const today = new Date();
            if (range === 'today') {
                document.getElementById('date-start').value = toDateStr(today);
                document.getElementById('date-end').value = toDateStr(today);
            } else if (range === 'this-week') {
                document.getElementById('date-start').value = toDateStr(getLastSaturday());
                document.getElementById('date-end').value = toDateStr(getNextFriday());
            } else if (range === 'last-week') {
                const lastSat = getLastSaturday();
                lastSat.setDate(lastSat.getDate() - 7);
                const lastFri = new Date(lastSat);
                lastFri.setDate(lastFri.getDate() + 6);
                document.getElementById('date-start').value = toDateStr(lastSat);
                document.getElementById('date-end').value = toDateStr(lastFri);
            }
            generateReport();
        };
    });

    // --- GENERATE ---
    // ═════════════════════════════════════════════════════════════════════════
    // ROADMAP 41 — A SLOW CONTROL MUST LOOK BUSY
    // ═════════════════════════════════════════════════════════════════════════
    //
    // This page had TWO loading indicators in 3,700 lines. Generate, the ⛑
    // regrade and the ⊘ clear-mastery all run for seconds against the network
    // with nothing moving on screen; only "Scan for flags" reported progress,
    // because item 36 added it.
    //
    // ⚠️⚠️ THE CONSEQUENCE IS NOT AESTHETIC. A teacher who thinks a button did
    // nothing clicks it again, and three of these four WRITE. A second ⛑ while
    // the first is still resolving reconstructs the same day twice; a second
    // ⊘ re-reads the whole subcollection to re-derive a clock that is already
    // being re-derived. **The disable is the correctness half and the label is
    // the kindness half**, and they ship together because a disabled button with
    // no explanation reads as a broken one.
    //
    // ⚠️ RESTORE IN finally, ALWAYS. `recalc-btn` disabled itself and
    // re-enabled on the line after the await, with nothing in between to catch a
    // throw — so any failure left that button dead until the teacher reloaded
    // the page, with no hint that reloading was what it needed. That is the
    // failure this helper exists to make unrepresentable.
    //
    // ⚠️ THE ORIGINAL LABEL IS READ AT CALL TIME, not stored globally. These
    // rows are re-rendered constantly; a cached label would be reapplied to a
    // button that has since become a different one.
    //
    // ⚠️ IT DOES NOT SWALLOW. The error propagates after the button is
    // restored — every caller here already has its own reporting, and a helper
    // that ate exceptions would hide exactly the failures the disable is meant
    // to survive.
    async function withBusy(btn, busyLabel, fn) {
        if (!btn) return fn();
        const wasHTML = btn.innerHTML;
        const wasDisabled = btn.disabled;
        btn.disabled = true;
        // ⚠️ aria-busy so the state is announced, not only drawn. ROADMAP 40
        // made these reachable by keyboard; a keyboard user who cannot see the
        // greyed-out pixels needs to be told the control is working.
        btn.setAttribute('aria-busy', 'true');
        if (busyLabel) btn.innerHTML = busyLabel;
        try {
            return await fn();
        } finally {
            btn.disabled = wasDisabled;
            btn.removeAttribute('aria-busy');
            btn.innerHTML = wasHTML;
        }
    }

    document.getElementById('generate-btn').onclick = (e) =>
        withBusy(e.currentTarget, 'Working\u2026', generateReport);

    // ═════════════════════════════════════════════════════════════════════════
    // THE ROSTER SWEEP  (v2.21.0)  —  READ WHAT THE STUDENT READS
    // ═════════════════════════════════════════════════════════════════════════
    //
    // ⚠️ THIS EXISTS BECAUSE THE TWO SIDES WERE ASKING DIFFERENT QUESTIONS.
    //
    // The student's screen calls daylog.js readWeek(), which fetches
    // `typing_logs/{uid}_{date}` BY DOCUMENT ID. No filter of any kind. Whatever
    // is in that document is what the child sees.
    //
    // This page queried `where("classId","==",cid)`. A daily-log document is
    // stamped with whatever `ttbClassId` held in the browser that wrote it — and
    // game.js's own comment above applyPendingClassAssignment() says exactly
    // when that is blank: a roster-imported student with no Firebase account yet
    // lands in `pendingClassAssignments/{email}`, and if they type a chapter
    // before ever opening the Lessons page, `ttbClassId` stays '' and every log
    // that session writes is stamped `classId: ''`. It self-heals days later.
    //
    // ⚠️ SO THE DOCUMENT EXISTS, THE CHILD SEES IT, AND NO CLASS QUERY ON THIS
    // PAGE COULD EVER RETURN IT. That is the sacred rule broken by a WHERE
    // clause, and it fires hardest on DAY ONE OF A ROTATION OR A NEW SCHOOL,
    // when every student is new at once.
    //
    // The fix is to stop asking a different question. The roster — `users` where
    // `classId == cid` — is the iteration source, and every (uid, date) is read
    // BY ID. Round 18 named this ("needs the class roster as the iteration
    // source instead of the report") and deferred it.
    //
    // ⚠️ THE CLASS QUERY IS KEPT, AND NOT AS A BELT-AND-BRACES. It finds
    // students the roster does NOT: a child whose `users` document is missing or
    // carries a stale classId still leaves stamped logs. The two sources are
    // UNIONED for discovery and then every uid is read the same way. Neither
    // alone is complete; the union is the closest this page can get to "every
    // child who typed."
    //
    // COST: (students × days) reads by id. 90 students over a school week is
    // ~630 — small, and each is a point read, the cheapest thing Firestore does.
    const MAX_ROSTER_PAIRS = 4000;

    async function readRosterUids(startDate, endDate) {
        const schoolId = document.getElementById('scope-school').value;
        const classId  = document.getElementById('scope-class').value;
        const usersRef = collection(db, 'users');
        const out = new Map();   // uid -> { classId, name, email }
        const queries = [];

        if (classId && classId !== '__all__' && classId !== '__mine__') {
            queries.push(query(usersRef, where('classId', '==', classId)));
        } else if (classId === '__mine__') {
            (me.classIds || []).slice(0, 30).forEach(cid =>
                queries.push(query(usersRef, where('classId', '==', cid))));
        } else if (schoolId && schoolId !== '__all__') {
            queries.push(query(usersRef, where('schoolId', '==', schoolId)));
        } else if (isSuper()) {
            queries.push(query(usersRef));
        }

        for (const q of queries) {
            const snap = await getDocs(q);
            snap.forEach(d => {
                const u = d.data() || {};
                // ⚠️ THE LEDGER RIDES ALONG FOR FREE. This query already fetches
                // the whole user document; carrying ttbLogDays out of it costs
                // nothing and saves the sweep below (roster × days) point reads.
                out.set(d.id, { classId: u.classId || '', name: u.displayName || '',
                                email: u.email || '', ledger: ledgerFrom(u, d.id) });
            });
        }
        return out;
    }

    // Read one student-day BY ID — byte-for-byte the read daylog.js performs.
    // ⚠️ A FAILED READ RETURNS null, NEVER ZERO. A day we could not read is not
    // a day with no typing, and a report that cannot tell those apart shows a
    // child a zero they did not earn. Callers count nulls and say so.
    async function readLogById(uid, date) {
        try {
            const snap = await getDoc(doc(db, 'typing_logs', `${uid}_${date}`));
            if (!snap.exists()) return { missing: true };
            return { missing: false, data: snap.data() };
        } catch (e) {
            console.warn('[roster] read failed', uid, date, e && e.message);
            return { error: e.message || String(e) };
        }
    }

    async function generateReport() {
        const startDate = document.getElementById('date-start').value;
        const endDate = document.getElementById('date-end').value;
        if (!startDate || !endDate) return ttbNotice("Pick both dates.", { bad: true });

        statusEl.innerText = "Querying...";
        document.getElementById('results-container').classList.add('hidden');
        document.getElementById('empty-msg').classList.add('hidden');

        // ⚠️ PER-REPORT COST, MEASURED RATHER THAN ESTIMATED. The meter counts
        // for the whole page load, so a single report is the DELTA across this
        // function. Without this the only cost figure on screen was
        // students × days — which is what the sweep WOULD have read before the
        // ledger pruned it, not what it actually did.
        const _m0 = (() => { try { return ttbMeter.totals(); } catch (_) { return null; } })();
        const _t0 = Date.now();

        try {
            const logsRef = collection(db, "typing_logs");
            const scoped = buildScopedQuery(logsRef, startDate, endDate);
            statusEl.innerText = `Querying ${scoped.label}...`;

            if (!scoped.queries.length) {
                statusEl.innerText = "No classes assigned to you yet — ask your " +
                    "building admin to add you to a class, or pick a different scope.";
                statusEl.style.borderColor = "var(--notice)";
                return;
            }

            // ⚠️ READ CEILING. Every query on this page used to be unbounded. A
            // building admin asking for a whole semester is roughly
            // 1,400 students x 90 days = ~126,000 document reads ON ONE CLICK —
            // two and a half times the entire daily free tier, out of Jake's
            // pocket, for a table no human can read anyway. And the browser
            // would sit frozen while it happened.
            //
            // The cap is deliberately a REFUSAL, not a truncation. A silently
            // truncated report is worse than no report: a teacher grades from
            // it and never learns it was incomplete. So we stop, say what
            // happened, and tell them how to narrow it.
            const MAX_REPORT_DOCS = 20000;

            let docs = [];
            const seen = new Set();
            try {
                // Sequential, not Promise.all: if the ceiling is going to be hit
                // we want to stop issuing reads, not fire them all and then
                // discover the total. Costing less on the failure path matters
                // more here than shaving a second off the success path.
                for (const q of scoped.queries) {
                    const snap = await getDocs(q);
                    snap.forEach(d => {
                        // De-duplicate: the "my classes" path issues one query
                        // per class, and while a typing_logs doc belongs to
                        // exactly one class today, a student reassigned
                        // mid-range could legitimately appear under two.
                        if (seen.has(d.id)) return;
                        seen.add(d.id);
                        docs.push(d);
                    });
                    if (docs.length > MAX_REPORT_DOCS) break;
                }
            } catch (e) {
                // Almost always a missing composite index while it builds.
                statusEl.innerText = "Query failed — see console. If this mentions " +
                    "an index, click the link it logs and try again once it's built.";
                statusEl.style.borderColor = "var(--bad)";
                console.error("Scoped report query failed:", e);
                return;
            }

            if (docs.length > MAX_REPORT_DOCS) {
                statusEl.innerText =
                    `Too much data — ${scoped.label} over ${startDate} to ${endDate} ` +
                    `is more than ${MAX_REPORT_DOCS.toLocaleString()} daily records. ` +
                    `Narrow the date range or pick a single class. ` +
                    `(Stopping here on purpose: a partial report you can't tell is ` +
                    `partial is worse than none.)`;
                statusEl.style.borderColor = "var(--notice)";
                return;
            }

            // ⚠️ v2.13.0 — READ-SIDE OF THE SOURCE SPLIT. game.js v3.29.0 /
            // learn.js v2.14.0 write secondsLibrary/secondsSchool (etc.)
            // instead of a shared seconds/chars/mistakes triple — see either
            // file's header for the incident this closes. A document that has
            // EITHER split field present is read as the sum of both (0 for
            // whichever side never wrote); a document that has NEITHER
            // — everything from before this shipped, or a day cleared back to
            // the legacy shape by a manual Save (see save-log-btn below) —
            // falls back to the flat fields. This is the only place that needs
            // to know both shapes exist; everything downstream (this
            // function's own aggregation, the reconcile sweep, the daily
            // log editor) keeps reading plain `seconds`/`chars`/`mistakes` off
            // whatever this returns.
            // ⚠️ v2.13.1 — SUMS THE LEGACY FIELD IN, RATHER THAN LETTING A SPLIT
            // FIELD SUPERSEDE IT. v2.13.0 returned the split sum alone whenever
            // either split field existed, and Jake caught the consequence in
            // live testing: on the day the split shipped, his morning's School
            // time had been recorded by the OLD code as flat `seconds`, and the
            // moment the new Library code wrote a split field that morning
            // simply vanished from the report.
            //
            // Summing is correct because the two shapes describe DISJOINT
            // periods. `seconds` can only have been written by pre-split code;
            // the split fields only ever carry what post-split code counted
            // itself (see game.js v3.29.1's per-page counters — they start at
            // zero on page load and never include anything the old code already
            // recorded). Nothing is double-counted and nothing is dropped.
            // Both repair paths keep this true: recalcDailyLog() deletes the
            // legacy fields when it writes splits, and save-log-btn deletes the
            // splits when it writes a manual flat total.
            // ⚠️ v2.14.0 — LEGACY-FIRST, because game.js v3.30.0 / learn.js
            // v2.15.0 REVERTED the source split and write the flat triple
            // again. Summing (v2.13.1) would now DOUBLE-COUNT any day that
            // still carries split fields written during the brief window the
            // split was deployed: the flat number is the full combined day
            // total from the shared counter, so the splits beside it are the
            // same time counted a second time.
            //
            // Legacy-first is correct in the reverted world: `seconds` is
            // always authoritative when present, and the split fields are
            // read ONLY for a day that has no flat number at all — i.e. the
            // handful of documents written while the split was live, which
            // would otherwise read as zero and lose a real day of typing.
            // Those days heal themselves: the next flat write from either
            // page supersedes them, and ⟳ rewrites them flat outright.
            // ═════════════════════════════════════════════════════════════════
            // v2.22.0 — THE PER-SOURCE CUTOVER. ROADMAP Phase B, step B2.
            // ═════════════════════════════════════════════════════════════════
            //
            // ⚠️ THIS CONSTANT AND THIS FUNCTION ARE A SECOND COPY OF daylog.js's
            // SOURCE_SPLIT_CUTOVER AND totalsOf(). That is a Rule 9 smell and it
            // is accepted for exactly one reason: reports.html is a standalone
            // page that imports no modules, so it cannot share the student's
            // copy. tests/daylog-cutover-test.mjs Part G LIFTS THIS FUNCTION OUT
            // OF THIS FILE and drives it against daylog.js's on the same inputs,
            // so the two cannot drift silently.
            //
            // ⚠️ IF YOU CHANGE ONE, CHANGE BOTH, IN THE SAME DEPLOY. A teacher
            // and a student reading the same document and getting different
            // numbers is the entire defect this project exists to have ended.
            // ⚠️ v2.24.0 — THE DECLARATION MOVED TO THE TOP OF THIS SCRIPT and is
            // no longer here. It was scoped inside generateReport(), which was
            // invisible until recalcDailyLog() — a sibling function, outside that
            // scope — needed it and got a ReferenceError on the ⟳ button that
            // nothing on screen would have explained. Found by
            // undefined-calls-test.mjs, which is exactly the class of defect that
            // harness exists for. Search REPORTS_VERSION to find it.

            // Days on or after the cutover read `seconds` PLUS both split
            // triples; days before it read legacy-first, exactly as v2.21.0 did.
            // After the writers change, the flat field is FROZEN — never written
            // again — so on a post-cutover document it is the pre-cutover
            // remainder, not a duplicate of the splits beside it.
            //
            // ⚠️ A MISSING dateStr TAKES THE OLD PATH ON PURPOSE: a caller that
            // forgets the date must fail toward "nothing changed" rather than
            // start summing historical documents. YYYY-MM-DD sorts
            // lexicographically, so the string compare is exact.
            function readLogTotals(data, dateStr) {
                const flat = {
                    seconds:  data.seconds  || 0,
                    chars:    data.chars    || 0,
                    mistakes: data.mistakes || 0,
                };
                const split = {
                    seconds:  (data.secondsLibrary  || 0) + (data.secondsSchool  || 0),
                    chars:    (data.charsLibrary    || 0) + (data.charsSchool    || 0),
                    mistakes: (data.mistakesLibrary || 0) + (data.mistakesSchool || 0),
                };
                if (dateStr && dateStr >= SOURCE_SPLIT_CUTOVER) {
                    return {
                        seconds:  flat.seconds  + split.seconds,
                        chars:    flat.chars    + split.chars,
                        mistakes: flat.mistakes + split.mistakes,
                    };
                }
                if ('seconds' in data || 'chars' in data || 'mistakes' in data) return flat;
                return split;
            }

            // ═════════════════════════════════════════════════════════════════
            // v2.33.0 — ROADMAP 36. THE SCHOOL-ONLY TRIPLE, FOR THE ERROR COLUMN.
            // ═════════════════════════════════════════════════════════════════
            //
            // ⚠️ WHY A SEPARATE READER RATHER THAN A FLAG ON readLogTotals():
            // that function answers "what did this child do today", is summed
            // into every total on the page, and is LIFTED OUT OF THIS FILE by
            // daylog-cutover-test.mjs Part G and driven against daylog.js's
            // totalsOf() on identical inputs. Adding a parameter to it would
            // change the shape that harness pins. This one answers a different
            // question and is summed into nothing.
            //
            // ⚠️⚠️ AND IT MUST BE ABLE TO SAY "I DON'T KNOW", WHICH IS WHY IT
            // RETURNS null RATHER THAN ZEROS. A day before the cutover has no
            // split fields at all — not zero School characters, NO ANSWER — and
            // a column that renders that as 0% would be inventing a clean day
            // out of an absent one. ROADMAP 36 says this in words; this is the
            // line that makes it true.
            //
            // ⚠️ MIRRORS daylog.js sourceTotalsOf() FIELD-FOR-FIELD. If the
            // SOURCE_FIELDS names ever change there, they change here. Same
            // Rule 9 acceptance as readLogTotals above, and the same obligation.
            function readSchoolTotals(data, dateStr) {
                if (!dateStr || dateStr < SOURCE_SPLIT_CUTOVER) return null;
                const has = ('charsSchool' in data) || ('mistakesSchool' in data)
                         || ('charsLibrary' in data) || ('mistakesLibrary' in data);
                if (!has) return null;
                return {
                    seconds:  data.secondsSchool  || 0,
                    chars:    data.charsSchool    || 0,
                    mistakes: data.mistakesSchool || 0,
                };
            }

            // ═════════════════════════════════════════════════════════════════
            // v2.21.0 — DISCOVER BY QUERY, THEN READ BY ID.
            // ═════════════════════════════════════════════════════════════════
            //
            // The class query above is now a DISCOVERY pass only. Its results
            // are never summed. Every number below comes from a point read of
            // `typing_logs/{uid}_{date}` — the identical read daylog.js makes
            // for the student. That is not a style preference: it is the only
            // arrangement in which the teacher's number and the child's number
            // cannot answer different questions. See readRosterUids().
            const uids = new Map();     // uid -> { name, email }
            docs.forEach(d => {
                const data = d.data();
                if (scoped.clientFilter && !scoped.clientFilter(data)) return;
                if (!data.uid) return;
                uids.set(data.uid, { name: data.displayName || 'Unknown', email: data.email || '' });
            });
            const discoveredByLogs = new Set(uids.keys());

            // ⚠️ A ROSTER FAILURE MUST NOT SILENTLY DEGRADE TO THE OLD BEHAVIOUR.
            // Falling back to the class query alone would produce a report that
            // looks exactly like a correct one and is short by every student
            // with a blank classId — which is the defect this whole section
            // exists to end. Say it on screen instead.

            // every date BEFORE that student's `since` regardless. So:

            // that. A second mechanism doing the same job means two places to
            // check when a number looks wrong, and only one of them is tested.
            const sweepDates = dateList;

            await runPool(pairs, async (p) => {

            const _n = window._ttbRosterNote || {};

    // Every date in [start, end], as YYYY-MM-DD, built by string arithmetic on
    // a local-noon Date so a timezone offset can never shift a day. (toDateStr
    // above used to go through toISOString and be UTC — v2.20.0 fixed it, and
    // tests/week-agreement-test.mjs Part D now holds both to the local rule.
    // This function was always correct; it was written by a round that fixed
    // the problem here and did not grep for the other formatter thirty lines
    // up. That is how the same defect survived in one file twice.)
    function datesInRange(startStr, endStr) {
        const out = [];
        const d = new Date(startStr + 'T12:00:00');
        const end = new Date(endStr + 'T12:00:00');
        if (isNaN(d) || isNaN(end) || d > end) return out;
        let guard = 0;
        while (d <= end && guard++ < 400) {
            out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
            d.setDate(d.getDate() + 1);
        }
        return out;
    }

    // A tiny worker pool. Sequential would take a minute on a week of ninety
    // students and Jake would reasonably assume it had hung; firing all of them
    // at once is how you get a browser to drop connections.
    //
    // ⚠️ v2.25.0 — IT USED TO READ `RECONCILE_CONCURRENCY` AND `reconCancel`,
    // both of which went with the reconcile. It has its own constant now and no
    // cancel: its one remaining caller is generateReport()'s point-read sweep,
    // which is already bounded by MAX_ROSTER_PAIRS and has never had a cancel
    // button to honour. Do not re-add one here without adding the button too —
    // a flag nothing can set is a branch nothing can test.
    // ⚠️ RAISED 6 → 24 (v2.27.0). "Polite to Firestore" was costing Jake two
    // minutes at a desk: 1,269 point reads six at a time is ~210 sequential
    // round trips, and every one of them is a separate HTTPS request over a
    // school network. Firestore's own client fans out far wider than this;
    // 24 is still well inside what a single browser tab will open.
    //
    // ⚠️ THIS IS A TEACHER-FACING PAGE ONLY. Do not copy the number to anything
    // students run — 101 students each opening 24 parallel reads is a different
    // conversation. reports.html is one person at a desk.
    const POOL_CONCURRENCY = 24;

    async function runPool(items, worker, onProgress) {
        let next = 0, done = 0;
        const runners = new Array(Math.min(POOL_CONCURRENCY, items.length))
            .fill(0).map(async () => {
                while (true) {
                    const i = next++;
                    if (i >= items.length) return;
                    await worker(items[i], i);
                    done++;
                    if (onProgress && (done % 10 === 0 || done === items.length)) {
                        onProgress(done, items.length);
                    }
                }
            });
        await Promise.all(runners);
        return done;
    }

    // ═════════════════════════════════════════════════════════════════════════
    // ROADMAP 36 — WHAT THE DAY ROW SAYS WITHOUT BEING EXPANDED
    // ═════════════════════════════════════════════════════════════════════════
    //
    // Jake: *"Something that tells me at a glance what the kids did without
    // having to expand each day to find out."*
    //
    // ✅ THE ERROR RATE IS FREE AND THAT IS WHY IT IS A COLUMN. A typing_logs
    // document carries `mistakes` beside `chars`, this page already fetches that
    // document for every day row it draws, and `log.chars` is already rendered.
    // The rate costs ZERO additional reads.
    //
    // ⚠️⚠️ EVERYTHING ELSE COSTS A READ PER STUDENT PER DAY, so everything else
    // is behind the scan button and appears as an ICON, never a column. The
    // distinction is not cosmetic: a column is a promise that the answer is
    // always there, and for the scanned flags it is not until you have paid.
    //
    // ⚠️ THE THRESHOLDS ARE PROVISIONAL AND ARE MARKED AS SUCH ON SCREEN.
    // §0.-33.A is a threshold picked with no data that fired on every row. These
    // exist so Jake can WATCH the number for a week and then set them; the column
    // shows the RATE, not just an icon, for exactly that reason. Do not treat
    // these numbers as settled and do not build anything that blocks on them.
    const ERR_WATCH = 0.30;    // provisional — worth a look
    const ERR_HIGH  = 0.50;    // provisional — a masher's coin-flip floor

    // ⚠️ RETURNS null FOR "NO ANSWER", AND THE THREE null CASES ARE DIFFERENT
    // FROM EACH OTHER AND ALL DIFFERENT FROM ZERO:
    //   * a pre-cutover day (no split fields ever written)
    //   * a day with a log and no typing (0 chars, 0 mistakes — 0/0)
    //   * School-only asked for on a document that has no School triple
    // A clean green 0% for any of them is the report lying by omission.
    function errorRateOf(triple) {
        if (!triple) return null;
        const denom = (triple.chars || 0) + (triple.mistakes || 0);
        if (denom <= 0) return null;
        return (triple.mistakes || 0) / denom;
    }

    // Which triple the column is showing, and whether it is the School-only one.
    // ⚠️ LABELLED ON SCREEN EITHER WAY. A combined rate dilutes a bad lesson
    // with a clean book and a School rate does not, so a column that switched
    // silently between them would mean two different things in two rows.
    function dayErrorCell(log) {
        const school   = log.school || null;
        const combined = { chars: log.chars, mistakes: log.mistakes };
        const useSchool = school !== null && errorRateOf(school) !== null;
        const rate = useSchool ? errorRateOf(school) : errorRateOf(combined);
        if (rate === null) {
            return `<span class="err-rate err-none" title="No typing recorded for this day, or a pre-cutover day with no School/Library split. This is NOT a 0% day — there is no answer to show.">—</span>`;
        }
        const pct = Math.round(rate * 100);
        const cls = rate >= ERR_HIGH ? 'err-high' : rate >= ERR_WATCH ? 'err-watch' : 'err-ok';
        const scope = useSchool ? 'School only' : 'Library + School combined (pre-cutover day — no split stored)';
        const denom = useSchool ? (school.chars + school.mistakes) : (log.chars + log.mistakes);
        return `<span class="err-rate ${cls}" title="${pct}% of keystrokes were mistakes — ${scope}. ` +
               `${denom.toLocaleString()} keystrokes judged. Thresholds are PROVISIONAL (watch ≥${Math.round(ERR_WATCH*100)}%, high ≥${Math.round(ERR_HIGH*100)}%) ` +
               `and are here to be watched for a week before anything is built on them.">${pct}%${useSchool ? '' : '*'}</span>`;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // THE SCANNED FLAGS. Populated only by the scan button; empty until then.
    // ⚠️ KEYED `uid|date`. Absent means NOT SCANNED, and the row renders a
    // different mark for that than for "scanned, nothing found" — see the
    // legend. An icon whose absence is ambiguous is worse than no icon.
    let scanFlags = new Map();
    let scanRange = null;      // {from, to} of the last scan, for the legend

    const FLAG_DEFS = [
        { key: 'fail',  icon: '\u25cf', cls: 'fl-fail',
          label: 'Repeated F',   desc: 'Three or more failing runs in a row on this day' },
        { key: 'fast',  icon: '\u25b2', cls: 'fl-fast',
          label: 'Speed jump',   desc: 'A run far faster than this student\u2019s others that day' },
        { key: 'dupe',  icon: '\u29c9', cls: 'fl-dupe',
          label: 'Duplicate',    desc: 'The same rollup filed twice — safe to delete' },
        { key: 'short', icon: '\u25cb', cls: 'fl-short',
          label: 'Tiny runs',    desc: 'Several runs under the 5-second floor' },
    ];

    function scanCell(uid, date) {
        const key = uid + '|' + date;
        if (!scanFlags.has(key)) {
            return `<span class="scan-mark scan-unknown" title="Not scanned. Press &quot;Scan for flags&quot; above to check this day — that costs reads, so it is never automatic.">·</span>`;
        }
        const found = scanFlags.get(key);
        if (!found || found.size === 0) {
            return `<span class="scan-mark scan-clean" title="Scanned — nothing flagged on this day.">✓</span>`;
        }
        return FLAG_DEFS.filter(f => found.has(f.key)).map(f =>
            `<span class="flag-mark ${f.cls}" title="${f.label}: ${f.desc}">${f.icon}</span>`
        ).join('');
    }


    function renderTable() {
        reportData.sort((a, b) => {
            let va = a[sortCol], vb = b[sortCol];
            // ⚠️ THE NULL HANDLING STAYS THOUGH THE COLUMNS THAT NEEDED IT ARE
            // GONE (v2.25.0). Every remaining column is always a number or a
            // string — but sortCol comes from a `data-col` attribute in the
            // markup, so a future column that is sometimes absent would sort as
            // 0 and make "unknown" look like "fine". That was the v2.15.0
            // lesson and it cost nothing to keep. Un-measured rows sink.
            if (va === null || va === undefined || vb === null || vb === undefined) {
                if (va === vb) return 0;
                if (va === null || va === undefined) return 1;
                return -1;
            }
            if (typeof va === 'string') va = va.toLowerCase();
            if (typeof vb === 'string') vb = vb.toLowerCase();
            if (va < vb) return sortAsc ? -1 : 1;
            if (va > vb) return sortAsc ? 1 : -1;
            return 0;
        });


        renderLegend();
        const tbody = document.getElementById('report-body');
        tbody.innerHTML = reportData.map((r, idx) => `
            <tr class="summary-row" data-idx="${idx}">
                <td>${escapeHtml(r.name)}<span class="uid-chip" role="button" tabindex="0" title="Student ID: ${r.uid} (click to copy)" data-uid="${r.uid}">${String(r.uid).slice(0,8)}</span><button class="grades-btn" data-uid="${r.uid}" data-name="${escapeHtml(r.name)}" title="Show this student's lesson grades, run by run">◈</button><div class="grades-panel hidden" id="grades-${r.uid}"></div></td>
                <td>${escapeHtml(r.email)}</td>
                <td class="time-cell">${formatTime(r.seconds)}</td>
                <td>${r.chars.toLocaleString()}</td>
                <td class="wpm-cell">${r.wpm}</td>
                <td>${r.accuracy}%</td>
                <td>${r.days}</td>
                <td><button class="details-row-btn" data-idx="${idx}">Details</button></td>
            </tr>
            <tr class="detail-row hidden" id="detail-${idx}">
                <td colspan="8">
                    <div class="daily-logs">
                        ${r.dailyLogs.map((log, li) => {
                            const mins = Math.floor(log.seconds / 60);
                            const secs = log.seconds % 60;
                            return `
                            <div class="daily-log-entry" data-idx="${idx}" data-li="${li}">
                                <span class="log-date expand-sessions" role="button" tabindex="0" data-uid="${r.uid}" data-date="${log.date}" title="Click to view sessions">▶ ${log.date}</span>
                                <input type="number" class="log-min-input" value="${mins}" min="0" step="1" title="Minutes" style="width:45px;" />
                                <span class="goal-unit">m</span>
                                <input type="number" class="log-sec-input" value="${secs}" min="0" max="59" step="1" title="Seconds" style="width:45px;" />
                                <span class="goal-unit">s</span>
                                <span class="log-chars">${log.chars.toLocaleString()} chars</span>
                                ${dayErrorCell(log)}
                                <span class="scan-cell" data-uid="${r.uid}" data-date="${log.date}">${scanCell(r.uid, log.date)}</span>
                                <button class="save-log-btn" data-idx="${idx}" data-li="${li}">Save</button>
                                <button class="recalc-btn" data-idx="${idx}" data-li="${li}" data-uid="${r.uid}" data-date="${log.date}" title="Recalculate from sessions">⟳</button>
                                <button class="regrade-btn" data-uid="${r.uid}" data-date="${log.date}" data-name="${escapeHtml(r.name)}" title="Reconstruct lesson grades for this day from the session records (ROADMAP 15)">⚑</button>
                                <span class="log-save-status" id="log-status-${idx}-${li}"></span>
                            </div>
                            <div class="sessions-container hidden" id="sessions-${r.uid}-${log.date}" data-idx="${idx}" data-li="${li}" data-uid="${r.uid}" data-date="${log.date}"></div>
                        `}).join('')}
                    </div>
                </td>
            </tr>
        `).join('');

        // Update sort indicators
        document.querySelectorAll('th').forEach(th => {
            th.classList.remove('sorted');
            const arrow = th.querySelector('.sort-arrow');
            if (arrow) arrow.textContent = '▲';
        });
        const activeTh = document.querySelector(`th[data-col="${sortCol}"]`);
        if (activeTh) {
            activeTh.classList.add('sorted');
            activeTh.querySelector('.sort-arrow').textContent = sortAsc ? '▲' : '▼';
        }
    }

    // Column header sort
    document.querySelectorAll('th[data-col]').forEach(th => {
        th.onclick = () => {
            const col = th.dataset.col;
            if (sortCol === col) sortAsc = !sortAsc;
            else { sortCol = col; sortAsc = (col === 'name' || col === 'email'); }
            renderTable();
        };
    });

    // Edit/Save delegation on table

    // ═════════════════════════════════════════════════════════════════════════
    // ROADMAP 36 — THE SCAN. PAID ONCE, ON DEMAND, NEVER ON LOAD.
    // ═════════════════════════════════════════════════════════════════════════
    //
    // ⚠️⚠️ THIS IS THE READ-EXPENSIVE HALF AND IT IS BEHIND A BUTTON FOR THAT
    // REASON ALONE. The error-rate column beside it is free — it reads a field
    // already on screen. Everything here needs typing_sessions, which this page
    // otherwise touches only when a day is expanded, on click.
    //
    // COST: ONE query per student across the WHOLE date range, not one per
    // student-day. That is the shape that makes the button affordable: a class of
    // 25 over a week is 25 queries returning perhaps 250 documents, versus 175
    // separate day queries. ⚠️ Firestore bills per DOCUMENT returned, so the
    // saving is in round-trips and latency rather than in reads — do not describe
    // it to Jake as cheaper than it is. The honest claim is: it is the same
    // documents he would read by expanding every day by hand, fetched once,
    // deliberately, with a number shown before and after.
    //
    // ⚠️ IT NEVER RUNS ON LOAD, ON GENERATE, OR ON A TIMER. Same discipline as
    // the stuck scan and the grades panel. A convenience that reads the whole
    // class every time the page opens is exactly the explosion this file has
    // spent ten rounds avoiding.
    //
    // ⚠️ THE THRESHOLDS HERE ARE PROVISIONAL, LIKE THE COLUMN'S. They exist to
    // be watched for a week. §0.-33.A.
    const SCAN_FAIL_STREAK = 3;     // consecutive failing runs — Jake's "three strikes"
    const SCAN_SHORT_RUNS  = 3;     // runs under the floor before it is worth saying
    const SCAN_SHORT_SECS  = 5;     // the 5-second floor, ROADMAP 7

    async function scanForFlags() {
        if (!reportData || !reportData.length) { ttbNotice('Generate a report first.', { bad: true }); return; }
        const btn = document.getElementById('scan-btn');
        const status = document.getElementById('scan-status');
        const setStatus = (m, c) => { if (status) { status.textContent = m; status.style.color = c || 'var(--ink-dimmer)'; } };

        // ⚠️ TELL HIM WHAT IT WILL COST BEFORE HE SPENDS IT, and let him say no.
        // The count is students, and the document count is unknown until it
        // returns — say both, and do not pretend to know the second.
        const nStudents = reportData.length;
        const nDays = reportData.reduce((a, r) => a + r.dailyLogs.length, 0);
        if (!await ttbConfirm(
            `Scan ${nStudents} student${nStudents === 1 ? '' : 's'} across ${nDays} recorded day` +
            `${nDays === 1 ? '' : 's'}?\n\n` +
            `This reads the session records — the same ones you would see by expanding ` +
            `every day by hand, fetched once instead of one day at a time. It costs reads, ` +
            `which is why it is not automatic.`,
            { title: 'Scan for flags', ok: 'Scan' })) return;

        if (btn) btn.disabled = true;
        scanFlags = new Map();
        let done = 0, docs = 0, failed = 0;

        for (const r of reportData) {
            const dates = r.dailyLogs.map(l => l.date);
            if (!dates.length) { done++; continue; }
            try {
                // One query per student over the range. `date` is a YYYY-MM-DD
                // string, so a range compare is exact and needs no index beyond
                // the uid+date one the drill-down already uses.
                const snap = await getDocs(query(
                    collection(db, "typing_sessions"),
                    where("uid", "==", r.uid),
                    where("date", ">=", dates[0]),
                    where("date", "<=", dates[dates.length - 1])
                ));
                docs += snap.size;

                // Bucket by day, then judge each day on its own.
                const byDay = new Map();
                snap.forEach(d => {
                    const v = { id: d.id, ...d.data() };
                    if (!byDay.has(v.date)) byDay.set(v.date, []);
                    byDay.get(v.date).push(v);
                });

                for (const date of dates) {
                    const sessions = byDay.get(date) || [];
                    const found = new Set();

                    // — duplicates: the same signature filed twice. Reuses the
                    //   drill-down's own sessionSignature() so the two views
                    //   cannot disagree about what a duplicate is.
                    const seen = new Set();
                    sessions.forEach(x => {
                        const sig = sessionSignature(x, x.id);
                        if (seen.has(sig)) found.add('dupe');
                        seen.add(sig);
                    });

                    // — sprint-level checks, in time order across the whole day.
                    const sprints = [];
                    sessions.forEach(x => (x.sprints || []).forEach(sp => sprints.push(sp)));
                    sprints.sort((a, b) => String(a.at || '').localeCompare(String(b.at || '')));
